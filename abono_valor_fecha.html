<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abono a Fechas Anteriores – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #111827; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    .container { max-width: 580px; margin: 2.2rem auto 0 auto; background: #232a37; border-radius: 17px; box-shadow: 0 2px 24px #0008; padding: 2.4rem 1.8rem 1.7rem 1.8rem;}
    .titulo { font-size: 1.38rem; font-weight: bold; margin-bottom: 10px;}
    .info-msg { background: #334155; border-radius: 13px; padding: 16px; font-size: 1.01rem; color: #ffd579; margin-bottom: 18px;}
    .input-main, .input-select, .input-motivo { width: 100%; background: #19212b; color: #fff; border: 1.5px solid #475569; border-radius: 9px; font-size: 1.11rem; padding: 11px 13px; margin-bottom: 0.95em;}
    .input-motivo { min-height: 45px; resize: vertical;}
    .btn-main, .btn-date { background: #fb923c; color: #181818; border: none; border-radius: 10px; font-size: 1.11rem; font-weight: 600; padding: 13px 0; cursor: pointer; margin-top: 1.1em; width: 100%; transition: background .18s;}
    .btn-main:hover, .btn-date:hover { background: #e07514;}
    .error { color: #f87171; font-size: 1.05rem; margin-bottom: 10px;}
    .ok-msg { color: #38bdf8; text-align: center; font-weight: bold; margin-bottom: 18px; font-size: 1.09rem;}
    .sim-block { background: #0f172a; color: #fcd34d; border-radius: 11px; margin: 14px 0 16px 0; padding: 15px 18px; font-size: 1.09rem;}
    .list-group { max-height: 180px; overflow-y: auto; margin-bottom: 18px;}
    .list-group-item { background: #181e2b; color: #fff; border-radius: 8px; padding: 8px 14px; margin-bottom: 7px; cursor: pointer; }
    .list-group-item.selected, .list-group-item:hover { background: #fb923c; color: #181818; font-weight: bold;}
    .label { color: #fb923c; font-weight: 600; margin-bottom: 4px; display: block;}
    @media (max-width:640px){.container{padding:1.15rem .6rem;}}
  </style>
</head>
<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-history"></i> Abono a Fechas Anteriores</div>
    <div class="info-msg">
      Esta opción permite registrar un abono en una fecha anterior a la actual. <br>
      <b>Solo personal autorizado puede hacer esta operación.</b> Por seguridad, deberás ingresar el motivo y el PIN de gerente.
    </div>
    <!-- Buscar Cliente -->
    <label class="label" for="busqueda">Buscar cliente por nombre o DUI</label>
    <input id="busqueda" class="input-main" type="text" placeholder="Escribe el nombre o DUI..." autocomplete="off"/>
    <!-- Lista de créditos filtrados -->
    <div id="lista-creditos" class="list-group"></div>
    <!-- Selección de fecha -->
    <div id="seleccion-fecha" style="display:none;">
      <label class="label" for="fecha-abono">Selecciona la fecha del abono</label>
      <input id="fecha-abono" type="date" class="input-main"/>
    </div>
    <!-- Simulación histórica -->
    <div id="simulacion-block" class="sim-block" style="display:none;"></div>
    <!-- Formulario de abono -->
    <form id="form-abono" style="display:none;">
      <label class="label" for="monto">Monto del abono ($)</label>
      <input id="monto" class="input-main" type="number" min="0.01" step="0.01" placeholder="0.00" required/>
      <label class="label" for="motivo">Motivo del abono (obligatorio)</label>
      <textarea id="motivo" class="input-motivo" placeholder="Motivo del abono..." required></textarea>
      <button type="submit" class="btn-main">Registrar Abono a Valor Fecha</button>
      <div id="ok-msg" class="ok-msg" style="display:none;"></div>
    </form>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, where, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let usuarioActual = "Usuario desconocido";
    let userId = null;
    let userAgencia = "";
    let creditosAgencia = [];
    let creditoSeleccionado = null;
    let fechaSeleccionada = null;
    let historico = null;

    // --- PIN gerente modal ---
    async function solicitarPinGerente() {
      return new Promise((resolve) => {
        let pin = prompt("Ingresa el PIN del gerente para autorizar:");
        if (!pin) return resolve(false);
        // Hash SHA256:
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin)).then(hashBuffer => {
          const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
          getDocs(query(collection(db, "users"), where("rol", "==", "gerente"))).then(snap => {
            if (snap.empty) return resolve(false);
            const gerente = snap.docs[0].data();
            if (gerente.internalPassword === hashHex) resolve(true);
            else resolve(false);
          });
        });
      });
    }

    // --- Carga de usuario y créditos ---
    onAuthStateChanged(auth, async user => {
      if (!user) return location.href = "login.html";
      usuarioActual = user.displayName || user.email || "Usuario desconocido";
      userId = user.uid;
      // Obtener agencia
      const docUser = await getDoc(doc(db, "users", user.uid));
      userAgencia = docUser.exists() && docUser.data().department ? docUser.data().department : "";
      // Cargar créditos agencia
      const q = query(collection(db, "creditos"), where("agenciaAsignada", "==", userAgencia));
      const snap = await getDocs(q);
      creditosAgencia = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    });

    // --- Búsqueda de cliente ---
    document.getElementById("busqueda").addEventListener("input", () => {
      const queryTxt = document.getElementById("busqueda").value.toLowerCase();
      const listaDiv = document.getElementById("lista-creditos");
      listaDiv.innerHTML = "";
      if (!queryTxt) return;
      const filtrados = creditosAgencia.filter(c =>
        (c.nombre && c.nombre.toLowerCase().includes(queryTxt)) ||
        (c.numeroDui && c.numeroDui.includes(queryTxt))
      );
      filtrados.forEach(credito => {
        const div = document.createElement("div");
        div.className = "list-group-item";
        div.textContent = `${credito.nombre} — DUI: ${credito.numeroDui} — Saldo: $${Number(credito.saldoActual || 0).toFixed(2)}`;
        div.onclick = () => seleccionarCredito(credito);
        listaDiv.appendChild(div);
      });
    });

    function seleccionarCredito(credito) {
      creditoSeleccionado = credito;
      Array.from(document.getElementsByClassName("list-group-item")).forEach(div => div.classList.remove("selected"));
      event.target.classList.add("selected");
      document.getElementById("seleccion-fecha").style.display = "block";
      document.getElementById("form-abono").style.display = "none";
      document.getElementById("simulacion-block").style.display = "none";
    }

    // --- Selección de fecha y simulación ---
    document.getElementById("fecha-abono").addEventListener("change", () => {
      fechaSeleccionada = document.getElementById("fecha-abono").value;
      if (!fechaSeleccionada || !creditoSeleccionado) return;
      mostrarSimulacionHistorica();
    });

    // --- Simula el estado del crédito a la fecha seleccionada ---
    function mostrarSimulacionHistorica() {
      // Parámetros base
      const fechaInicio = new Date(creditoSeleccionado.fechaInicio);
      const fechaAbono = new Date(fechaSeleccionada + "T00:00:00");
      const amortizacion = JSON.parse(JSON.stringify(creditoSeleccionado.amortizacion || []));
      let saldo = Number(creditoSeleccionado.saldoInicial || creditoSeleccionado.saldoActual || 0);
      let interesPendiente = 0;
      let capitalAtrasado = 0;
      let cuotasAtrasadas = 0;
      let multasAcumuladas = Number(creditoSeleccionado.multasAcumuladas || 0);

      // Se recorre la tabla de amortización y se simula pagos previos hasta la fecha seleccionada
      for (let cuota of amortizacion) {
        const fechaCuota = new Date(cuota.fecha);
        if (fechaCuota < fechaAbono) {
          interesPendiente += Number(cuota.interes || 0);
          capitalAtrasado += Number(cuota.capital || 0);
          cuotasAtrasadas++;
        }
      }

      // Ajustar para el estado actual
      historico = {
        saldoActual: saldo,
        interesPendiente,
        multasAcumuladas,
        cuotasAtrasadas,
        capitalAtrasado,
        fechaAbono: fechaAbono,
        amortizacion: amortizacion
      };

      // Visualiza
      let html = `<b>Saldo actual ese día:</b> $${saldo.toFixed(2)}<br>
        <b>Interés pendiente:</b> $${interesPendiente.toFixed(2)}<br>
        <b>Multas acumuladas:</b> $${multasAcumuladas.toFixed(2)}<br>
        <b>Cuotas atrasadas:</b> ${cuotasAtrasadas}<br>
        <b>Capital atrasado:</b> $${capitalAtrasado.toFixed(2)}`;
      document.getElementById("simulacion-block").style.display = "block";
      document.getElementById("simulacion-block").innerHTML = html;
      document.getElementById("form-abono").style.display = "block";
    }

    // --- Registrar el abono retroactivo, actualizando cuotas y saldos ---
    document.getElementById("form-abono").onsubmit = async function(e) {
      e.preventDefault();
      if (!creditoSeleccionado || !fechaSeleccionada) return alert("Selecciona cliente y fecha.");
      const monto = Number(document.getElementById("monto").value);
      const motivo = document.getElementById("motivo").value.trim();
      if (!monto || !motivo) return alert("Completa todos los campos.");

      // Autorizar con PIN
      const autorizado = await solicitarPinGerente();
      if (!autorizado) return alert("PIN incorrecto o autorización cancelada.");

      // 1. Estado antes del abono
      const fechaAbono = new Date(fechaSeleccionada + "T00:00:00");
      let amortizacion = JSON.parse(JSON.stringify(creditoSeleccionado.amortizacion || []));
      let saldo = Number(creditoSeleccionado.saldoInicial || creditoSeleccionado.saldoActual || 0);

      // 2. Distribuir el abono en orden: multas, interés pendiente, capital
      let restante = monto;
      let pagoMultas = 0, pagoInteres = 0, pagoCapital = 0;
      let interesPendiente = 0;

      // Calcular interés pendiente acumulado a la fecha seleccionada
      for (let cuota of amortizacion) {
        const fechaCuota = new Date(cuota.fecha);
        if (fechaCuota < fechaAbono && (!cuota.estado || cuota.estado !== "Pagada")) {
          interesPendiente += Number(cuota.interes || 0);
        }
      }

      // Primero multas (si tu lógica incluye esto)
      let multasAcumuladas = Number(creditoSeleccionado.multasAcumuladas || 0);
      if (restante >= multasAcumuladas) {
        pagoMultas = multasAcumuladas;
        restante -= multasAcumuladas;
        multasAcumuladas = 0;
      } else {
        pagoMultas = restante;
        multasAcumuladas -= restante;
        restante = 0;
      }

      // Luego intereses
      if (restante > 0) {
        if (restante >= interesPendiente) {
          pagoInteres = interesPendiente;
          restante -= interesPendiente;
          interesPendiente = 0;
        } else {
          pagoInteres = restante;
          interesPendiente -= restante;
          restante = 0;
        }
      }

      // Finalmente capital
      if (restante > 0) {
        pagoCapital = restante;
        saldo -= restante;
        restante = 0;
      }

      // 3. Actualizar tabla de amortización
      for (let cuota of amortizacion) {
        const fechaCuota = new Date(cuota.fecha);
        if (fechaCuota < fechaAbono && (!cuota.estado || cuota.estado !== "Pagada")) {
          let totalCuota = Number(cuota.cuota || 0);
          let pagadoAntes = Number(cuota.montoPagado || 0);
          let porPagar = totalCuota - pagadoAntes;
          if (pagoCapital + pagoInteres >= porPagar) {
            cuota.montoPagado = totalCuota;
            cuota.estado = "Pagada";
            cuota.fechaPagoReal = fechaAbono.toISOString();
            pagoCapital -= Number(cuota.capital || 0);
            pagoInteres -= Number(cuota.interes || 0);
            if (pagoCapital < 0) pagoCapital = 0;
            if (pagoInteres < 0) pagoInteres = 0;
          } else if (pagoCapital + pagoInteres > 0) {
            cuota.montoPagado = pagadoAntes + pagoCapital + pagoInteres;
            cuota.estado = "Parcial";
            cuota.fechaPagoReal = fechaAbono.toISOString();
            pagoCapital = 0;
            pagoInteres = 0;
          }
        }
      }

      // 4. Guarda el pago retroactivo en Firestore
      const correlativo = Math.floor(Math.random() * 90000) + 10000;
      const correlativoStr = correlativo.toString().padStart(5, '0');
      await addDoc(collection(db, "pagos"), {
        clienteID: creditoSeleccionado.clienteID,
        creditoID: creditoSeleccionado.id,
        nombres: creditoSeleccionado.nombre,
        montoPagado: monto,
        fechaPago: fechaAbono.toISOString(),
        pagoMultas: pagoMultas.toFixed(2),
        pagoInteres: pagoInteres.toFixed(2),
        pagoCapital: pagoCapital.toFixed(2),
        saldoRestante: saldo.toFixed(2),
        cajeroID: userId,
        cajeroNombre: usuarioActual,
        sucursal: userAgencia,
        correlativo: correlativoStr,
        timestamp: new Date(),
        retroactivo: true,
        motivoRetroactivo: motivo
      });

      // 5. Actualiza el crédito y la tabla de amortización real
      await updateDoc(doc(db, "creditos", creditoSeleccionado.id), {
        saldoActual: saldo.toFixed(2),
        multasAcumuladas: multasAcumuladas.toFixed(2),
        amortizacion: amortizacion
      });

      document.getElementById("ok-msg").textContent = "Abono retroactivo registrado correctamente.";
      document.getElementById("ok-msg").style.display = "block";
      setTimeout(() => {
        document.getElementById("ok-msg").style.display = "none";
        document.getElementById("form-abono").reset();
        document.getElementById("busqueda").value = "";
        document.getElementById("lista-creditos").innerHTML = "";
        document.getElementById("seleccion-fecha").style.display = "none";
        document.getElementById("simulacion-block").style.display = "none";
        document.getElementById("form-abono").style.display = "none";
      }, 2100);
    };
  </script>
</body>
</html>
