<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abono a Fechas Anteriores – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #111827; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    .container { max-width: 580px; margin: 2.2rem auto 0 auto; background: #232a37; border-radius: 17px; box-shadow: 0 2px 24px #0008; padding: 2.4rem 1.8rem 1.7rem 1.8rem;}
    .titulo { font-size: 1.38rem; font-weight: bold; margin-bottom: 10px;}
    .info-msg { background: #334155; border-radius: 13px; padding: 16px; font-size: 1.01rem; color: #ffd579; margin-bottom: 18px;}
    .input-main, .input-select, .input-motivo { width: 100%; background: #19212b; color: #fff; border: 1.5px solid #475569; border-radius: 9px; font-size: 1.11rem; padding: 11px 13px; margin-bottom: 0.95em;}
    .input-motivo { min-height: 45px; resize: vertical;}
    .btn-main, .btn-date { background: #fb923c; color: #181818; border: none; border-radius: 10px; font-size: 1.11rem; font-weight: 600; padding: 13px 0; cursor: pointer; margin-top: 1.1em; width: 100%; transition: background .18s;}
    .btn-main:hover, .btn-date:hover { background: #e07514;}
    .error { color: #f87171; font-size: 1.05rem; margin-bottom: 10px;}
    .ok-msg { color: #38bdf8; text-align: center; font-weight: bold; margin-bottom: 18px; font-size: 1.09rem;}
    .sim-block { background: #0f172a; color: #fcd34d; border-radius: 11px; margin: 14px 0 16px 0; padding: 15px 18px; font-size: 1.09rem;}
    .list-group { max-height: 180px; overflow-y: auto; margin-bottom: 18px;}
    .list-group-item { background: #181e2b; color: #fff; border-radius: 8px; padding: 8px 14px; margin-bottom: 7px; cursor: pointer; }
    .list-group-item.selected, .list-group-item:hover { background: #fb923c; color: #181818; font-weight: bold;}
    .label { color: #fb923c; font-weight: 600; margin-bottom: 4px; display: block;}
    .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #181e21cc; z-index: 9998; display: flex; align-items: center; justify-content: center;}
    .modal { background: #fff; color: #222; border-radius: 15px; box-shadow: 0 6px 38px #0008; padding: 26px 23px 20px 23px; max-width: 340px; width: 95%; z-index: 9999; position: relative; text-align: left; font-size: 1rem; animation: showmodal .18s;}
    @keyframes showmodal { from { transform: scale(.93); opacity:.6;} to {transform:none;opacity:1;} }
    .modal label {font-weight: bold;}
    .modal input { width: 100%; background: #f5f8fb; border: 1.2px solid #dadada; color: #111; font-size: 1.12rem; padding: 11px 10px; margin-bottom: 12px; border-radius: 8px; outline: none; box-sizing: border-box;}
    .modal-btns { display: flex; gap: 13px; margin-top: 8px; justify-content: flex-end;}
    .modal-btn-cancel { background: #e74c3c; color: #fff; border: none; padding: 9px 16px; border-radius: 7px; cursor: pointer; font-weight: bold; transition: background .17s;}
    .modal-btn-cancel:hover { background: #bb2c1a; }
    .modal-btn-ok { background: #F8AF40; color: #1a1813; border: none; padding: 9px 18px; border-radius: 7px; cursor: pointer; font-weight: bold; transition: background .17s;}
    .modal-error { color: #d30013; font-size: 0.99rem; margin-bottom: 9px; font-weight: 500;}
    .recibo-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #181e21cc; z-index: 9999; display: flex; align-items: center; justify-content: center;}
    .recibo { background: #fff; color: #232a37; border-radius: 14px; box-shadow: 0 2px 32px #0007; padding: 27px 23px 18px 23px; max-width: 350px; width: 96%; font-size: 1.03rem; }
    .recibo-titulo { font-weight: bold; font-size: 1.2rem; margin-bottom: 12px; color: #fb923c; }
    .recibo-row { margin-bottom: 7px; }
    .recibo-close { background: #e74c3c; color: #fff; border: none; padding: 7px 15px; border-radius: 7px; cursor: pointer; font-weight: bold; float: right; margin-top: 9px;}
    .recibo-close:hover { background: #bb2c1a; }
    @media (max-width:640px){.container{padding:1.15rem .6rem;}}
  </style>
</head>
<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-history"></i> Abono a Fechas Anteriores</div>
    <div class="info-msg">
      Esta opción permite registrar un abono en una fecha anterior a la actual. <br>
      <b>Solo personal autorizado puede hacer esta operación.</b> Por seguridad, deberás ingresar el motivo y el PIN de gerente.
    </div>
    <label class="label" for="busqueda">Buscar cliente por nombre o DUI</label>
    <input id="busqueda" class="input-main" type="text" placeholder="Escribe el nombre o DUI..." autocomplete="off"/>
    <div id="lista-creditos" class="list-group"></div>
    <div id="seleccion-fecha" style="display:none;">
      <label class="label" for="fecha-abono">Selecciona la fecha del abono</label>
      <input id="fecha-abono" type="date" class="input-main"/>
    </div>
    <div id="simulacion-block" class="sim-block" style="display:none;"></div>
    <form id="form-abono" style="display:none;">
      <label class="label" for="monto">Monto del abono ($)</label>
      <input id="monto" class="input-main" type="number" min="0.01" step="0.01" placeholder="0.00" required/>
      <label class="label" for="motivo">Motivo del abono (obligatorio)</label>
      <textarea id="motivo" class="input-motivo" placeholder="Motivo del abono..." required></textarea>
      <button type="submit" class="btn-main">Registrar Abono a Valor Fecha</button>
      <div id="ok-msg" class="ok-msg" style="display:none;"></div>
    </form>
  </div>
  <div id="modal-root"></div>
  <div id="recibo-root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // =========================
    // Utils blindados (TZ ES)
    // =========================
    const TZ_OFFSET = "-06:00"; // El Salvador

    function toLocalEndISO(ymd){ return `${ymd}T23:59:59${TZ_OFFSET}`; }
    function toLocalStartISO(ymd){ return `${ymd}T00:00:00${TZ_OFFSET}`; }
    function atLocalMidnight(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
    function daysMedioAbiertoDates(d1,d2){
      const a = atLocalMidnight(d1).getTime();
      const b = atLocalMidnight(d2).getTime();
      const MS=86400000;
      return Math.max(0, Math.floor((b-a)/MS));
    }
    function parseLocalYMD(ymd){
      if(!ymd) return null;
      const [y,m,d] = ymd.split('-').map(n=>parseInt(n,10));
      return new Date(y, m-1, d, 0,0,0,0);
    }
    function diasEntreFechasSinHora(f1YMD, f2DateObj){
      const d1 = parseLocalYMD(f1YMD);
      const d2 = new Date(f2DateObj);
      d2.setHours(0,0,0,0);
      const MS=86400000;
      return Math.max(0, Math.floor((d2 - d1)/MS));
    }
    function num(n, def=0){
      const x = (typeof n === 'string') ? n.replace(',', '.').trim() : n;
      const v = Number(x);
      return Number.isFinite(v) ? v : def;
    }
    function round2(v){ return Math.round((v + Number.EPSILON)*100)/100; }

    // ✅ saldo actual desde amortización en centavos (para exactitud)
    function saldoDesdeAmortizacion(amortizacion){
      let totalCents = 0;
      for (const c of (amortizacion || [])) {
        const capC = Math.round(num(c.capital, 0) * 100);
        const pagC = Math.round(num(c.montoPagado, 0) * 100);
        const pendC = Math.max(0, capC - pagC);
        totalCents += pendC;
      }
      return totalCents / 100;
    }

    function normalizeDailyRate(credito){
      let td = num(credito.tasaDiariaCredito, 0);
      if (td <= 0 || td >= 0.02){
        if (td > 1 && td <= 100) td = td/100; // venía en %
      }
      if (td <= 0 || td >= 0.02){
        const ta = num(credito.tasaAnualCredito, 0); // % anual
        if (ta > 0) td = ta/100/365;
      }
      if (!(td > 0 && td < 0.02)) td = 0.005; // fallback ~0.5%/día
      return td;
    }

    // =========================
    // Firebase / estado
    // =========================
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let usuarioActual = "Usuario desconocido";
    let userId = null;
    let userAgencia = "";
    let creditosAgencia = [];
    let creditoSeleccionado = null;
    let fechaSeleccionada = null;

    async function obtenerCorrelativoUnicoPagos(db){
      const pagosSnap = await getDocs(collection(db, "pagos"));
      const usados = new Set();
      pagosSnap.forEach(docu=>{
        let c = docu.data().correlativo;
        if (typeof c === "string" && !isNaN(c)) c = Number(c);
        if (typeof c === "number" && c > 0) usados.add(c);
      });
      let correlativo = 1;
      while (usados.has(correlativo)) correlativo++;
      return correlativo;
    }

    function showGerentePinDialog(){
      return new Promise((resolve)=>{
        let modalRoot = document.getElementById("modal-root");
        let errorMsg = "";
        async function onOk(){
          try{
            const pinValue = document.getElementById("gerente-pin-input").value.trim();
            if(!pinValue){ errorMsg="Debes ingresar el PIN del gerente."; render(); return; }
            const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pinValue));
            const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
            const qy = query(collection(db,"users"), where("rol","==","gerente"), where("department","==", userAgencia));
            const snap = await getDocs(qy);
            if (snap.empty){ errorMsg="No hay gerente configurado para esta agencia."; render(); return; }
            let pinValido=false;
            snap.docs.forEach(docG=>{
              const data = docG.data();
              const gerenteHash = typeof data.internalPassword === 'string' ? data.internalPassword.trim() : '';
              if (String(gerenteHash).trim() === String(hashHex).trim()) pinValido=true;
            });
            if (pinValido){ close(); resolve(true); } else { errorMsg="PIN incorrecto"; render(); }
          }catch(e){ errorMsg="Error técnico: " + e; render(); }
        }
        function close(){ modalRoot.innerHTML=""; }
        function render(){
          modalRoot.innerHTML = `
            <div class="modal-bg">
              <div class="modal">
                <label>PIN del gerente</label>
                <input type="password" id="gerente-pin-input" maxlength="10" autocomplete="off" placeholder="PIN" style="font-size:1.18rem;"/>
                ${errorMsg ? `<div class="modal-error">${errorMsg}</div>` : ""}
                <div class="modal-btns">
                  <button class="modal-btn-cancel" id="cancelar-pin">Cancelar</button>
                  <button class="modal-btn-ok" id="autorizar-pin">Autorizar</button>
                </div>
              </div>
            </div>`;
          document.getElementById("cancelar-pin").onclick = ()=>{ close(); resolve(false); };
          document.getElementById("autorizar-pin").onclick = onOk;
          document.getElementById("gerente-pin-input").onkeydown = e=>{ if(e.key==="Enter") onOk(); };
          setTimeout(()=> document.getElementById("gerente-pin-input").focus(), 30);
        }
        render();
      });
    }

    // =========================
    // Carga de créditos (para búsqueda)
    // =========================
    onAuthStateChanged(auth, async user=>{
      if(!user) return location.href="login.html";
      usuarioActual = user.displayName || user.email || "Usuario desconocido";
      userId = user.uid;
      const docUser = await getDoc(doc(db,"users", user.uid));
      userAgencia = docUser.exists() && docUser.data().department ? docUser.data().department : "";

      // Evitamos '!='; filtramos Revertido en cliente
      const qy = query(collection(db,"creditos"), where("agenciaAsignada","==", userAgencia));
      const snap = await getDocs(qy);
      creditosAgencia = snap.docs
        .map(d=>({ id:d.id, ...d.data() }))
        .filter(c => (c.estadoCredito || "").toString().trim().toLowerCase() !== "revertido");
    });

    // =========================
    // Búsqueda por nombre o DUI (robusta)
    // =========================
    document.getElementById("busqueda").addEventListener("input", ()=>{
      const raw = document.getElementById("busqueda").value || "";
      const queryTxt = raw.toLowerCase().trim();
      const queryDui = raw.replace(/[^0-9]/g,""); // solo dígitos

      const listaDiv = document.getElementById("lista-creditos");
      listaDiv.innerHTML = "";
      if (!queryTxt && !queryDui) return;

      const filtrados = creditosAgencia.filter(credito => {
        const nombre = (credito.nombre || credito.nombres || credito.clienteNombre || "").toString().toLowerCase();
        const duiDoc = (credito.numeroDui || "").toString();
        const duiClean = duiDoc.replace(/[^0-9]/g,"");

        const matchNombre = queryTxt ? nombre.includes(queryTxt) : false;
        const matchDui    = queryDui ? duiClean.includes(queryDui) : false;
        return matchNombre || matchDui;
      });

      filtrados.forEach(credito=>{
        const nombre = (credito.nombre || credito.nombres || credito.clienteNombre || "—");
        const dui = (credito.numeroDui || "").toString();
        const saldo = Number(credito.saldoActual || 0).toFixed(2);

        const div = document.createElement("div");
        div.className = "list-group-item";
        div.textContent = `${nombre} — DUI: ${dui} — Saldo: $${saldo}`;
        div.onclick = (event)=> seleccionarCredito(credito, event);
        listaDiv.appendChild(div);
      });
    });

    function seleccionarCredito(credito, event){
      creditoSeleccionado = credito;
      Array.from(document.getElementsByClassName("list-group-item")).forEach(div=>div.classList.remove("selected"));
      event.target.classList.add("selected");
      document.getElementById("seleccion-fecha").style.display = "block";
      document.getElementById("form-abono").style.display = "none";
      document.getElementById("simulacion-block").style.display = "none";
    }

    function mostrarRecibo(datos){
      let reciboDiv = document.getElementById("recibo-root");
      let fechaFmt = new Date(datos.fechaPago).toLocaleDateString('es-SV');
      let hoyFmt = new Date().toLocaleDateString('es-SV');
      reciboDiv.innerHTML = `
        <div class="recibo-bg">
          <div class="recibo">
            <div class="recibo-titulo">Recibo de Pago Retroactivo</div>
            <div class="recibo-row"><b>No. Correlativo:</b> ${datos.correlativo || '-'}</div>
            <div class="recibo-row"><b>Cliente:</b> ${datos.nombres}</div>
            <div class="recibo-row"><b>DUI:</b> ${datos.numeroDui || ''}</div>
            <div class="recibo-row"><b>Monto pagado:</b> $${Number(datos.montoPagado).toFixed(2)}</div>
            <div class="recibo-row"><b>Pago a valor fecha:</b> ${fechaFmt}</div>
            <div class="recibo-row"><b>Sucursal:</b> ${datos.sucursal}</div>
            <div class="recibo-row"><b>Pago capital:</b> $${Number(datos.pagoCapital).toFixed(2)}</div>
            <div class="recibo-row"><b>Pago interés:</b> $${Number(datos.pagoInteres).toFixed(2)}</div>
            <div class="recibo-row"><b>Pago multa:</b> $${Number(datos.pagoMulta || 0).toFixed(2)}</div>
            <div class="recibo-row"><b>Saldo restante:</b> $${Number(datos.saldoRestante).toFixed(2)}</div>
            <div class="recibo-row"><b>Registrado el:</b> ${hoyFmt}</div>
            <div class="recibo-row"><b>Motivo:</b> ${datos.motivo || ''}</div>
            <button class="recibo-close" onclick="document.getElementById('recibo-root').innerHTML=''">Cerrar</button>
          </div>
        </div>`;
    }

    // =========================
    // Recalculo de intereses
    // =========================
    async function getPagosHastaFecha(db, creditoID, fechaYMD){
      const corte = new Date(toLocalEndISO(fechaYMD)); // 23:59:59 -06:00
      const snap = await getDocs(collection(db, "pagos"));
      const pagos = [];
      snap.forEach(d=>{
        const p = d.data();
        if (p.creditoID !== creditoID || p.anulado === true || !p.fechaPago) return;
        const fPago = new Date(p.fechaPago);
        if (!(fPago <= corte)) return;
        pagos.push({
          fechaPago: fPago,
          pagoInteres: num(p.pagoInteres, 0),
          pagoCapital: num(p.pagoCapital, 0),
          pagoMulta: num(p.pagoMulta, 0),
          saldoRestante: (p.saldoRestante != null ? num(p.saldoRestante, NaN) : NaN)
        });
      });
      pagos.sort((a,b)=> a.fechaPago - b.fechaPago);
      return pagos;
    }

    async function interesPendienteAFecha(db, credito, fechaAbonoYMD){
      const tasa = normalizeDailyRate(credito);
      if (!tasa) return { interesPendiente: 0, principalAlCorte: 0, diasSumados: 0 };

      const inicioRaw = credito.fechaInicio || credito.fechaDesembolso || credito.fechaColocacion;
      const inicio = inicioRaw ? new Date(inicioRaw) : new Date(toLocalStartISO(fechaAbonoYMD));

      let principal = num(credito.saldoInicial, NaN);
      if (!Number.isFinite(principal) || principal <= 0) principal = num(credito.montoAprobado, NaN);
      if (!Number.isFinite(principal) || principal <= 0) principal = num(credito.saldoActual, 0);
      if (principal < 0) principal = 0;

      const pagos = await getPagosHastaFecha(db, credito.id, fechaAbonoYMD);
      let interesPendiente = 0;
      let cursor = new Date(inicio);
      let diasAcum = 0;

      for (const p of pagos){
        const dias = daysMedioAbiertoDates(cursor, p.fechaPago);
        if (dias > 0 && principal > 0){
          interesPendiente += principal * tasa * dias;
          diasAcum += dias;
        }
        // aplicar pago
        let pagoInt = p.pagoInteres;
        const cubreInt = Math.min(interesPendiente, pagoInt);
        interesPendiente -= cubreInt;
        pagoInt -= cubreInt;

        let pagoCap = p.pagoCapital + Math.max(0, pagoInt);
        principal = Math.max(0, principal - pagoCap);

        if (Number.isFinite(p.saldoRestante)){
          principal = Math.max(0, p.saldoRestante);
        }
        cursor = new Date(p.fechaPago);
      }

      const cierreCorte = new Date(toLocalEndISO(fechaAbonoYMD));
      const diasFinal = daysMedioAbiertoDates(cursor, cierreCorte);
      if (diasFinal > 0 && principal > 0){
        interesPendiente += principal * tasa * diasFinal;
        diasAcum += diasFinal;
      }

      interesPendiente = round2(Math.max(0, interesPendiente));
      principal = round2(Math.max(0, principal));

      // guardrail: 4 meses
      const limiteRazonable = round2(principal * tasa * 122);
      if (interesPendiente > limiteRazonable) interesPendiente = limiteRazonable;

      // fallback si 0 "sospechoso" y hubo pagos + días
      if (interesPendiente < 0.01){
        if (pagos.length > 0){
          const u = pagos[pagos.length-1];
          const dias = daysMedioAbiertoDates(u.fechaPago, cierreCorte);
          const base = Number.isFinite(u.saldoRestante) ? u.saldoRestante : principal;
          const interesSoloTramo = round2(Math.max(0, base * tasa * dias));
          if (interesSoloTramo > interesPendiente) interesPendiente = interesSoloTramo;
        }
      }

      return { interesPendiente, principalAlCorte: principal, diasSumados: diasAcum };
    }

    // =========================
    // Prioridad de aplicación
    // =========================
    function ordenarAmortizacionPorFecha(amortizacion){
      amortizacion.sort((a,b)=> new Date(a.fecha) - new Date(b.fecha));
    }

    function cubrirInteresVencidasPrimero(amortizacion, fechaAbonoYMD, refAbono, refPagoInteres){
      const fechaCorte = new Date(toLocalEndISO(fechaAbonoYMD));
      for (let i=0; i<amortizacion.length && refAbono.value>0; i++){
        const c = amortizacion[i];
        const f = new Date(c.fecha);
        if (f <= fechaCorte){
          const interesCuota = num(c.interes, 0);
          const pagadoInt = num(c.montoPagadoInteres, 0);
          const pendienteInt = round2(Math.max(0, interesCuota - pagadoInt));
          if (pendienteInt > 0){
            const apli = Math.min(pendienteInt, refAbono.value);
            c.montoPagadoInteres = round2(pagadoInt + apli);
            refPagoInteres.value = round2(refPagoInteres.value + apli);
            refAbono.value = round2(refAbono.value - apli);
          }
        }
      }
    }

    function existeInteresVencido(amortizacion, fechaAbonoYMD){
      const fechaCorte = new Date(toLocalEndISO(fechaAbonoYMD));
      return amortizacion.some(c=>{
        const f = new Date(c.fecha);
        if (f <= fechaCorte){
          const interesCuota = num(c.interes, 0);
          const pagadoInt = num(c.montoPagadoInteres, 0);
          return round2(interesCuota - pagadoInt) > 0.009;
        }
        return false;
      });
    }

    // =========================
    // SUBMIT
    // =========================
    document.getElementById("form-abono").onsubmit = async function(e){
      e.preventDefault();
      if (!creditoSeleccionado || !fechaSeleccionada) return alert("Selecciona cliente y fecha.");
      const monto = num(document.getElementById("monto").value, 0);
      const motivo = document.getElementById("motivo").value.trim();
      if (!monto || !motivo) return alert("Completa todos los campos.");

      const autorizado = await showGerentePinDialog();
      if (!autorizado) return alert("PIN de gerente incorrecto o cancelado.");

      let abonoRestante = monto;
      let pagoInteres = 0, pagoCapital = 0, pagoMulta = 0;

      const tasaDiaria = normalizeDailyRate(creditoSeleccionado);
      let historialMultas = Array.isArray(creditoSeleccionado.historialMultas) ? JSON.parse(JSON.stringify(creditoSeleccionado.historialMultas)) : [];
      let amortizacion = Array.isArray(creditoSeleccionado.amortizacion) ? JSON.parse(JSON.stringify(creditoSeleccionado.amortizacion)) : [];
      const fechaAbonoYMD = fechaSeleccionada;
      const fechaAbono = new Date(toLocalEndISO(fechaAbonoYMD));

      ordenarAmortizacionPorFecha(amortizacion);

      // 0) Recalculo de intereses al corte
      const { interesPendiente, principalAlCorte } = await interesPendienteAFecha(db, creditoSeleccionado, fechaAbonoYMD);

      // 1) MULTAS: no procede si están después del abono; pagar exigibles
      let historialMultasActualizado = historialMultas.map(m=>{
        if (m.estadoCuota === "Pagada" || m.estadoCuota === "No Procede") return m;
        let multaFecha = atLocalMidnight(new Date(m.fecha));
        let abono0h = new Date(toLocalStartISO(fechaAbonoYMD));
        if (abono0h < multaFecha) return { ...m, estadoCuota: "No Procede" };
        return m;
      });

      for (let i=0; i<historialMultasActualizado.length && abonoRestante>0; i++){
        const m = historialMultasActualizado[i];
        if (m.estadoCuota !== "No Pagada") continue;
        const multaFecha = atLocalMidnight(new Date(m.fecha));
        const abono0h = new Date(toLocalStartISO(fechaAbonoYMD));
        if (abono0h >= multaFecha){
          const pagar = Math.min(abonoRestante, num(m.monto, 0));
          abonoRestante = round2(abonoRestante - pagar);
          pagoMulta = round2(pagoMulta + pagar);
          const nuevo = num(m.monto, 0) - pagar;
          m.monto = round2(Math.max(0,nuevo)).toFixed(2);
          if (nuevo <= 0.01){ m.estadoCuota = "Pagada"; m.monto = "0.00"; }
        }
      }

      // 2) INTERÉS: pagar primero (vencido) y reflejarlo
      let interesAPagar = Math.min(abonoRestante, interesPendiente);
      if (interesAPagar > 0){
        let restanteInt = interesAPagar;

        // a) vencidas (<= abono)
        for (let i=0; i<amortizacion.length && restanteInt>0; i++){
          const c = amortizacion[i];
          const f = new Date(c.fecha);
          if (f <= fechaAbono){
            c.montoPagadoInteres = num(c.montoPagadoInteres, 0);
            const interesCuota = num(c.interes, 0);
            const pendiente = Math.max(0, interesCuota - c.montoPagadoInteres);
            if (pendiente > 0){
              const apli = Math.min(pendiente, restanteInt);
              c.montoPagadoInteres = round2(c.montoPagadoInteres + apli);
              restanteInt = round2(restanteInt - apli);
            }
          }
        }
        // b) futuras si no queda vencido
        if (restanteInt > 0 && !existeInteresVencido(amortizacion, fechaAbonoYMD)){
          for (let i=0; i<amortizacion.length && restanteInt>0; i++){
            const c = amortizacion[i];
            const f = new Date(c.fecha);
            if (f > fechaAbono){
              c.montoPagadoInteres = num(c.montoPagadoInteres, 0);
              const interesCuota = num(c.interes, 0);
              const pendiente = Math.max(0, interesCuota - c.montoPagadoInteres);
              if (pendiente > 0){
                const apli = Math.min(pendiente, restanteInt);
                c.montoPagadoInteres = round2(c.montoPagadoInteres + apli);
                restanteInt = round2(restanteInt - apli);
              }
            }
          }
        }

        const aplicadoInteres = round2(interesAPagar - Math.max(0, restanteInt));
        pagoInteres = round2(pagoInteres + aplicadoInteres);
        abonoRestante = round2(abonoRestante - aplicadoInteres);
      }

      // Candado adicional: NO exceder el interés realmente acumulado.
      // Solo permitir "barredora" si aún queda interés real por cubrir.
      {
        const extraIntBudget = round2(Math.max(0, interesPendiente - pagoInteres));
        if (extraIntBudget > 0) {
          const refAbono = { value: Math.min(abonoRestante, extraIntBudget) }; // tope: interés real restante
          const refInt   = { value: 0 };
          cubrirInteresVencidasPrimero(amortizacion, fechaAbonoYMD, refAbono, refInt);
          pagoInteres   = round2(pagoInteres + refInt.value);
          abonoRestante = round2(abonoRestante - refInt.value);
        }
        // Si extraIntBudget == 0, todo lo restante va a CAPITAL
      }

      // 3) CAPITAL: solo después de dejar interés vencido en 0 (real)
      // VENCIDAS
      for (let i=0; i<amortizacion.length && abonoRestante>0; i++){
        let cuota = amortizacion[i];
        let fechaCuota = new Date(cuota.fecha);
        if (fechaCuota <= fechaAbono && cuota.estado !== "Pagada"){
          cuota.montoPagado = num(cuota.montoPagado, 0);
          cuota.montoPagadoInteres = num(cuota.montoPagadoInteres, 0);

          // garantizar interés cero en esta vencida
          const interesCuota = num(cuota.interes, 0);
          const pagInt = num(cuota.montoPagadoInteres, 0);
          const intPend = round2(Math.max(0, interesCuota - pagInt));
          if (intPend > 0 && abonoRestante > 0){
            const apli = Math.min(intPend, abonoRestante);
            cuota.montoPagadoInteres = round2(pagInt + apli);
            pagoInteres = round2(pagoInteres + apli);
            abonoRestante = round2(abonoRestante - apli);
          }

          let capitalCuota = num(cuota.capital, 0);
          let pendienteCapital = Math.max(0, capitalCuota - cuota.montoPagado);
          if (pendienteCapital > 0 && abonoRestante > 0){
            const apli = Math.min(pendienteCapital, abonoRestante);
            cuota.montoPagado = round2(cuota.montoPagado + apli);
            pagoCapital = round2(pagoCapital + apli);
            abonoRestante = round2(abonoRestante - apli);
          }

          const EPS=0.01;
          const capitalOk = Math.abs(round2(cuota.montoPagado) - round2(capitalCuota)) < EPS;
          const interesOk = Math.abs(round2(cuota.montoPagadoInteres) - round2(interesCuota)) < EPS;
          if (capitalOk && interesOk){
            cuota.estado = "Pagada";
            cuota.fechaPagoReal = fechaAbonoYMD;
          } else if ((cuota.montoPagado > 0 || cuota.montoPagadoInteres > 0)){
            const hoy = atLocalMidnight(new Date());
            cuota.estado = (fechaCuota < hoy ? "Atrasada" : "Parcial");
            cuota.fechaPagoReal = null;
          }
        }
      }

      // FUTURAS (si ya no queda interés vencido)
      if (abonoRestante > 0 && !existeInteresVencido(amortizacion, fechaAbonoYMD)){
        for (let j=0; j<amortizacion.length && abonoRestante>0; j++){
          let cuotaSig = amortizacion[j];
          let fechaCuota = new Date(cuotaSig.fecha);
          if (fechaCuota > fechaAbono && cuotaSig.estado !== "Pagada"){
            cuotaSig.montoPagado = num(cuotaSig.montoPagado, 0);
            cuotaSig.montoPagadoInteres = num(cuotaSig.montoPagadoInteres, 0);

            let capitalCuota = num(cuotaSig.capital, 0);
            let pendienteCapital = Math.max(0, capitalCuota - cuotaSig.montoPagado);
            if (pendienteCapital > 0){
              const apli = Math.min(pendienteCapital, abonoRestante);
              cuotaSig.montoPagado = round2(cuotaSig.montoPagado + apli);
              pagoCapital = round2(pagoCapital + apli);
              abonoRestante = round2(abonoRestante - apli);
              const EPS=0.01;
              const capitalOk = Math.abs(round2(cuotaSig.montoPagado) - round2(capitalCuota)) < EPS;
              const interesOk = Math.abs(round2(cuotaSig.montoPagadoInteres) - round2(num(cuotaSig.interes,0))) < EPS;
              if (capitalOk && interesOk){
                cuotaSig.estado = "Pagada";
                cuotaSig.fechaPagoReal = fechaAbonoYMD;
              } else if (cuotaSig.montoPagado > 0){
                cuotaSig.estado = "Parcial";
                cuotaSig.fechaPagoReal = fechaAbonoYMD;
              }
            }
          }
        }
      }

      // 4) TOTALES + interesActual blindado
      // saldoActual exclusivamente desde la amortización (centavos) para evitar desfases
      let saldoPendiente = round2(saldoDesdeAmortizacion(amortizacion));

      let multasAcumuladasFinal = round2(
        (historialMultasActualizado || [])
          .filter(m=> m.estadoCuota === "No Pagada" && num(m.monto,0) > 0.01)
          .reduce((acc,m)=> acc + num(m.monto,0), 0)
      );

      let cuotasAtrasadasFinal = amortizacion.filter(c=>{
        const f = new Date(c.fecha);
        const hoy = atLocalMidnight(new Date());
        return f < hoy && c.estado !== "Pagada";
      }).length;

      let capitalAtrasado = round2(
        amortizacion.filter(c=>{
          const f = new Date(c.fecha);
          const hoy = atLocalMidnight(new Date());
          return f < hoy && c.estado !== "Pagada";
        }).reduce((acc,c)=>{
          const cap = num(c.capital,0);
          const pag = num(c.montoPagado,0);
          return acc + Math.max(0, cap - pag);
        },0)
      );

      const interesPendientePost = round2(Math.max(0, interesPendiente - pagoInteres));

      const fechaHoy = atLocalMidnight(new Date());
      const diasPost = diasEntreFechasSinHora(fechaAbonoYMD, fechaHoy);
      const tasaDiaria2 = normalizeDailyRate(creditoSeleccionado);
      const interesDesdeAbonoAHoy = round2(saldoPendiente * tasaDiaria2 * diasPost);

      let interesActual = round2(interesPendientePost + interesDesdeAbonoAHoy);
      const limiteHoy = round2(saldoPendiente * tasaDiaria2 * 122); // ~4 meses
      if (interesActual > limiteHoy) interesActual = limiteHoy;

      const paraPonerseAlDiaFinal = round2(capitalAtrasado + multasAcumuladasFinal + interesActual);
      const nuevoEstadoCredito = (cuotasAtrasadasFinal === 0 && multasAcumuladasFinal === 0) ? "Activo" : "Mora Temprana";

      // correlativo
      let correlativo = await obtenerCorrelativoUnicoPagos(db);

      // Registrar pago
      let pagoObj = {
        creditoID: creditoSeleccionado.id,
        clienteID: creditoSeleccionado.clienteID || "",
        montoPagado: round2(monto),
        pagoInteres: round2(pagoInteres),
        pagoCapital: round2(pagoCapital),
        pagoMulta: round2(pagoMulta),
        saldoRestante: round2(saldoPendiente),
        fechaPago: new Date(toLocalStartISO(fechaAbonoYMD)).toISOString(), // guardamos con inicio local del día
        nombres: creditoSeleccionado.nombre,
        numeroDui: creditoSeleccionado.numeroDui || "",
        sucursal: userAgencia,
        usuarioID: userId,
        motivo: motivo,
        retroactivo: true,
        anulado: false,
        fechaRegistro: new Date().toISOString(),
        correlativo: correlativo
      };
      await addDoc(collection(db, "pagos"), pagoObj);

      await addDoc(collection(db, "movimientos_caja"), {
        tipoMovimiento: 'Ingreso',
        monto: round2(monto),
        fecha: new Date().toISOString(),
        referencia: 'Abono retroactivo',
        usuarioID: userId,
        clienteID: creditoSeleccionado.clienteID || "",
        creditoID: creditoSeleccionado.id
      });

      await updateDoc(doc(db, "creditos", creditoSeleccionado.id), {
        amortizacion: amortizacion,
        saldoActual: round2(saldoPendiente),
        interesActual: round2(interesActual),
        paraPonerseAlDia: round2(paraPonerseAlDiaFinal),
        historialMultas: historialMultasActualizado,
        multasAcumuladas: round2(multasAcumuladasFinal),
        estadoCredito: nuevoEstadoCredito,
        cuotasAtrasadas: cuotasAtrasadasFinal,
        capitalAtrasado: round2(capitalAtrasado),
        fechaUltimoCalculoIntereses: new Date(),
        ultimaActualizacion: new Date()
      });

      mostrarRecibo(pagoObj);

      document.getElementById("ok-msg").textContent = "Abono retroactivo registrado correctamente.";
      document.getElementById("ok-msg").style.display = "block";
      setTimeout(()=>{
        document.getElementById("ok-msg").style.display = "none";
        document.getElementById("form-abono").reset();
        document.getElementById("busqueda").value = "";
        document.getElementById("lista-creditos").innerHTML = "";
        document.getElementById("seleccion-fecha").style.display = "none";
        document.getElementById("simulacion-block").style.display = "none";
        document.getElementById("form-abono").style.display = "none";
      }, 2100);
    };

    document.getElementById("fecha-abono").addEventListener("change", function(){
      fechaSeleccionada = document.getElementById("fecha-abono").value;
      document.getElementById("form-abono").style.display = fechaSeleccionada && creditoSeleccionado ? "block" : "none";
    });
  </script>
</body>
</html>
