<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plan de Pagos</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Función para leer el parámetro id de la URL
    function getIdParam() {
      const url = new URL(window.location.href);
      return url.searchParams.get("id");
    }

    // Formato de dinero
    function money(n) {
      return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits:2 });
    }

    // Tarjeta de cada cuota
    function cuotaCard(cuota) {
      return `
        <div class="cuota-card">
          <div class="cuota-avatar">${cuota.numeroCuota ?? "-"}</div>
          <div class="cuota-main">
            <div class="cuota-fecha"><b>Fecha:</b> ${cuota.fecha ?? "-"}</div>
            <div class="cuota-info">
              <span>Cuota: <b>${money(cuota.cuota)}</b></span>
              <span>Capital: <b>${money(cuota.capital)}</b></span>
              <span>Interés: <b>${money(cuota.interes)}</b></span>
              <span>Saldo: <b>${money(cuota.saldo)}</b></span>
            </div>
            <div class="cuota-estado">
              <span class="${cuota.estado === 'Pagada' ? 'estado-pagada' : cuota.estado === 'Parcial' ? 'estado-parcial' : 'estado-pendiente'}">
                ${cuota.estado || '-'}
              </span>
            </div>
          </div>
        </div>
      `;
    }

    async function cargarAmortizacion() {
      const creditoId = getIdParam();
      if (!creditoId) {
        document.getElementById("main-amortizacion").innerHTML = `<div class="notfound">Crédito no encontrado</div>`;
        return;
      }
      document.getElementById("main-amortizacion").innerHTML = `<div class="loader"></div>`;

      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        try {
          const ref = doc(db, "creditos", creditoId);
          const snap = await getDoc(ref);

          if (!snap.exists()) {
            document.getElementById("main-amortizacion").innerHTML = `<div class="notfound">Crédito no encontrado</div>`;
            return;
          }
          const c = snap.data();
          const amortizacion = c.amortizacion || [];

          if (!amortizacion.length) {
            document.getElementById("main-amortizacion").innerHTML = `<div class="notfound">No se encontró información de la amortización.</div>`;
            return;
          }

          // Resumen de plan
          const cuotasTotales = amortizacion.length;
          const primeraCuota = amortizacion[0]?.fecha || "-";
          const ultimaCuota = amortizacion[cuotasTotales - 1]?.fecha || "-";

          // Render cards
          let cuotasHtml = "";
          amortizacion.forEach(cuota => {
            cuotasHtml += cuotaCard(cuota);
          });

          document.getElementById("main-amortizacion").innerHTML = `
            <div class="resumen-plan">
              <div class="resumen-titulo">Resumen del Plan</div>
              <div>Cuotas totales: <b>${cuotasTotales}</b></div>
              <div>Primera cuota: <b>${primeraCuota}</b></div>
              <div>Última cuota: <b>${ultimaCuota}</b></div>
            </div>
            <div class="cuotas-list">
              ${cuotasHtml}
            </div>
          `;
        } catch (err) {
          document.getElementById("main-amortizacion").innerHTML = `<div class="notfound">No tienes permisos para ver este crédito.</div>`;
        }
      });
    }

    window.addEventListener("DOMContentLoaded", cargarAmortizacion);
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { background: #101012; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    .main { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem 1rem; }
    .resumen-plan {
      background: #ffb30012; border-radius: 13px; margin-bottom: 18px; padding: 15px 18px 10px 18px;
    }
    .resumen-titulo {
      color: #ffb300; font-size: 1.18rem; font-weight: bold; margin-bottom: 4px;
    }
    .cuotas-list {
      margin-top: 8px;
    }
    .cuota-card {
      display: flex; background: #191927; border-radius: 10px;
      margin-bottom: 13px; padding: 12px 16px; gap: 16px; align-items: flex-start; box-shadow: 0 2px 9px #0002;
    }
    .cuota-avatar {
      background: #ff9800; color: #fff; min-width: 36px; min-height: 36px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.09rem; margin-top: 3px; flex-shrink: 0;
      box-shadow: 0 2px 7px #0002;
    }
    .cuota-main { flex: 1 1 0; }
    .cuota-fecha { color: #fff5; font-size: 1rem; font-weight: 600; margin-bottom: 5px;}
    .cuota-info { display: flex; flex-wrap: wrap; gap: 17px 19px; color: #ffe6c8; font-size: .98rem; margin-bottom: 6px; }
    .cuota-estado { margin-top: 3px; }
    .estado-pagada { color: #39ea8e; font-weight: bold; }
    .estado-parcial { color: #ffd000; font-weight: bold; }
    .estado-pendiente { color: #ff4c40; font-weight: bold; }
    .loader {
      width: 44px; height: 44px; margin: 60px auto 70px auto; border-radius: 50%;
      border: 4.5px solid #ffb300; border-top: 4.5px solid #eee0; animation: spin 1s linear infinite;
      display: block;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .notfound { color: #fff9; font-size: 1.22rem; text-align: center; margin: 70px 0;}
    @media (max-width: 570px) {
      .main { max-width: 99vw; padding: 1rem .4rem 2rem .4rem;}
      .cuota-card { font-size: .98rem; }
    }
  </style>
</head>
<body>
  <div class="main">
    <div id="main-amortizacion"></div>
  </div>
</body>
</html>
