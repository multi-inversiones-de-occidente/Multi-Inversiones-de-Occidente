<!-- apertura_credito_page.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apertura de Crédito – Multi Inversiones</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, doc, getDoc, addDoc, limit, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let solicitudData = null;
    let asignacionData = null;
    let amortizacion = [];
    let guardando = false;
    let solicitudID = null;
    let asignacionAperturada = false;

    // Refinanciamiento
    let esRefinanciamiento = false;
    let desembolsoNeto = null;
    let creditoAnteriorInfo = null;

    // Parámetro GET
    function getQueryParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function setLoading(msg = "Cargando...") {
      document.getElementById('main-content').innerHTML = `<div style="color:#fff;text-align:center;padding:70px 0;">${msg}</div>`;
    }

    function recalcularAmortizacion() {
      if (!asignacionData) return [];

      const monto = Number(asignacionData.montoAprobado);
      const tasaAnual = Number(asignacionData.tasaAnual);
      const frecuencia = asignacionData.frecuenciaPago;
      const numCuotas = Number(asignacionData.numeroCuotas);
      const cuota = Number(asignacionData.cuota);

      const specs = {
        "Semanal": { periodos: 52, dias: 7 },
        "Catorcenal": { periodos: 26, dias: 14 },
        "Quincenal": { periodos: 24, dias: 15 },
        "Mensual": { periodos: 12, dias: 30 },
      };
      const perAno = specs[frecuencia]?.periodos ?? 52;
      const diasPeriodo = specs[frecuencia]?.dias ?? 7;
      const tasa = tasaAnual / perAno / 100;

      let fechaBase = new Date();
      fechaBase.setHours(0,0,0,0);

      let saldo = monto;
      let lista = [];
      for (let k = 1; k <= numCuotas; k++) {
        const interes = saldo * tasa;
        const capital = cuota - interes;
        saldo -= capital;
        if (k === numCuotas) saldo = 0;
        const fechaCuota = new Date(fechaBase);
        fechaCuota.setDate(fechaBase.getDate() + (k * diasPeriodo));
        lista.push({
          numeroCuota: k,
          fecha: fechaCuota.toISOString().split("T")[0],
          cuota: cuota.toFixed(2),
          interes: interes.toFixed(2),
          capital: capital.toFixed(2),
          saldo: saldo.toFixed(2),
          estado: "Pendiente",
          montoPagado: 0.00,
          fechaPagoReal: null
        });
      }
      return lista;
    }

    // Crédito anterior ACTIVO para refinanciamiento
    async function buscarCreditoAnterior(clienteID) {
      const creditosRef = collection(db, "creditos");
      const q = query(
        creditosRef,
        where("clienteID", "==", clienteID),
        where("estadoCredito", "==", "Activo")
      );
      const creditosSnap = await getDocs(q);
      if (creditosSnap.empty) return null;
      const creditoAnteriorDoc = creditosSnap.docs[0];
      const d = creditoAnteriorDoc.data();
      return {
        id: creditoAnteriorDoc.id,
        saldoActual: Number(d.saldoActual || 0),
        interesActual: Number(d.interesActual || 0),
        montoAprobado: Number(d.montoAprobado || 0)
      };
    }

    // Render de la página
    function renderMain() {
      if (!solicitudData) {
        setLoading("Solicitud no encontrada");
        return;
      }

      let html = `
        <div class="field">
          <label>Línea de Crédito</label>
          <input type="text" value="${solicitudData.creditLine ?? ''}" disabled class="input"/>
        </div>

        <div class="info-row">Nombre: ${solicitudData.nombre ?? ''}</div>
        <div class="info-row">Apellido: ${solicitudData.apellido ?? ''}</div>
        <div class="info-row">Monto Solicitado: $${(solicitudData.montoAprobado ?? '').toString()}</div>
      `;

      if (!asignacionData) {
        html += `<div style="margin-top:30px;color:#aaa;">Asignación: No disponible</div>`;
      } else {
        html += `
          <div class="info-row">Frecuencia de Pago: ${asignacionData.frecuenciaPago ?? ''}</div>
          <div class="info-row">Número de Cuotas: ${asignacionData.numeroCuotas ?? ''}</div>
          <div class="info-row">Cuota Aprobada: $${asignacionData.cuota ?? ''}</div>
        `;
      }

      // Bloque desembolso neto (refinanciamiento)
      if (asignacionData && esRefinanciamiento && creditoAnteriorInfo) {
        html += `
          <div class="neto-box">
            Efectivo a entregar al cliente: $${desembolsoNeto.toFixed(2)}<br>
            <span class="neto-sub">
              (Nuevo aprobado: $${Number(asignacionData.montoAprobado).toFixed(2)}<br>
              Menos saldo anterior: $${creditoAnteriorInfo.saldoActual.toFixed(2)}<br>
              Menos intereses pendientes: $${creditoAnteriorInfo.interesActual.toFixed(2)})
            </span>
          </div>
        `;
      }

      // Tabla amortización
      if (asignacionData) {
        amortizacion = recalcularAmortizacion();
        html += `
          <div class="amort-title">Tabla de Amortización (al día de hoy):</div>
          <div class="table-wrap">
            <table class="tabla">
              <thead>
                <tr>
                  <th>N°</th>
                  <th>Fecha</th>
                  <th>Cuota</th>
                  <th>Interés</th>
                  <th>Capital</th>
                  <th>Saldo</th>
                </tr>
              </thead>
              <tbody>
                ${
                  amortizacion.map(row => `
                    <tr>
                      <td>${row.numeroCuota ?? ''}</td>
                      <td>${row.fecha}</td>
                      <td>$${row.cuota}</td>
                      <td>$${row.interes}</td>
                      <td>$${row.capital}</td>
                      <td>$${row.saldo}</td>
                    </tr>
                  `).join('')
                }
              </tbody>
            </table>
          </div>

          <div class="nota-importante">
            <b>IMPORTANTE:</b> Esta tabla de amortización está calculada <b>al día de la apertura del crédito</b>.
            <ul>
              <li>La PRIMERA cuota se agenda N días después de hoy (hoy + período).</li>
              <li>Si la apertura es posterior a la asignación, las fechas y valores reflejan el día exacto de apertura.</li>
            </ul>
          </div>
        `;
      } else {
        html += `<div style="margin-top:18px;color:#aaa;">No hay amortización disponible.</div>`;
      }

      html += `
        <div style="margin:30px 0 15px 0;">
          <button id="guardar-credito-btn" ${guardando || !asignacionData || asignacionAperturada ? "disabled" : ""} class="btn-guardar">
            ${guardando ? "Guardando..." : (asignacionAperturada ? "Ya aperturado" : "Guardar Crédito")}
          </button>
        </div>
      `;

      if (asignacionAperturada) {
        html += `<div class="msg-aperturado">Este crédito ya fue aperturado y no puede ser guardado nuevamente.</div>`;
      }

      document.getElementById('main-content').innerHTML = html;

      // Guardar crédito
      const btn = document.getElementById("guardar-credito-btn");
      if (btn && !asignacionAperturada) {
        btn.addEventListener("click", async () => {
          if (guardando) return;
          guardando = true;
          renderMain();
          await guardarCredito();
          guardando = false;
          renderMain();
        });
      }
    }

    async function fetchSolicitudYAsignacion() {
      setLoading();
      try {
        solicitudID = getQueryParam('solicitudID');
        if (!solicitudID) {
          setLoading("No se especificó una solicitud.");
          return;
        }
        // Solicitud
        const solRef = doc(db, "Archivo Solicitudes", solicitudID);
        const solSnap = await getDoc(solRef);
        if (!solSnap.exists()) throw new Error("Solicitud no encontrada");
        solicitudData = solSnap.data();

        // Asignación (una)
        const asignSnap = await getDocs(
          query(
            collection(db, "asignacion_de_cuota"),
            where("solicitudID", "==", solicitudID),
            limit(1)
          )
        );
        if (!asignSnap.empty) {
          asignacionData = asignSnap.docs[0].data();
          asignacionData._docId = asignSnap.docs[0].id;
          asignacionAperturada = !!asignacionData.creditoAperturado;
        } else {
          asignacionData = null;
          asignacionAperturada = false;
        }

        // Refinanciamiento
        esRefinanciamiento = (solicitudData.creditLine || "").toLowerCase().includes("refinanciamiento");
        if (asignacionData && esRefinanciamiento && solicitudData.clienteID) {
          creditoAnteriorInfo = await buscarCreditoAnterior(solicitudData.clienteID);
          if (creditoAnteriorInfo) {
            desembolsoNeto = Number(asignacionData.montoAprobado) - creditoAnteriorInfo.saldoActual - creditoAnteriorInfo.interesActual;
            if (desembolsoNeto < 0) desembolsoNeto = 0;
          } else {
            desembolsoNeto = Number(asignacionData.montoAprobado);
            creditoAnteriorInfo = {saldoActual: 0, interesActual: 0};
          }
        }

        renderMain();
      } catch (e) {
        setLoading("Error cargando datos: " + (e.message || e));
      }
    }

    // Guardar crédito (incluye refinanciamiento)
    async function guardarCredito() {
      if (asignacionAperturada) {
        alert("Este crédito ya fue aperturado. No puede volver a guardarse.");
        return;
      }
      if (!solicitudData || !asignacionData || amortizacion.length === 0) {
        alert("No hay datos completos para guardar el crédito.");
        return;
      }

      const montoAprobado = Number(asignacionData.montoAprobado) || 0;
      const frecuenciaPago = asignacionData.frecuenciaPago || "";
      const numeroCuotas = Number(asignacionData.numeroCuotas) || 0;
      const cuotaAprobada = Number(asignacionData.cuota) || 0;
      const asignadoNombre = asignacionData.asignadoA || "";
      const agenciaAsignada = asignacionData.agenciaAsignada || "";
      const numeroDui = solicitudData.numeroDui || '';
      const direccion = solicitudData.direccion || '';
      const telefono = solicitudData.telefono || '';
      const papeleriaDescontada = 5.0;
      const saldoInicial = montoAprobado;
      const saldoActual = montoAprobado;
      const clienteID = solicitudData.clienteID || "";
      const fechaInicio = new Date().toISOString();
      const fechaUltimoCalculoIntereses = fechaInicio;

      // id de crédito anterior si aplica
      let creditoAnteriorID = null;
      if (esRefinanciamiento && creditoAnteriorInfo && creditoAnteriorInfo.id) {
        creditoAnteriorID = creditoAnteriorInfo.id;
      }

      try {
        await addDoc(collection(db, "creditos"), {
          clienteID: clienteID,
          nombre: solicitudData.nombre || "",
          apellido: solicitudData.apellido || "",
          numeroDui: numeroDui,
          direccion: direccion,
          telefono: telefono,
          papeleriaDescontada: papeleriaDescontada,
          montoAprobado: montoAprobado,
          saldoInicial: saldoInicial.toFixed(2),
          saldoActual: saldoActual.toFixed(2),
          interesActual: 0.0,
          capitalAtrasado: 0.0,
          multasAcumuladas: 0.0,
          paraPonerseAlDia: 0.0,
          cuotasAtrasadas: 0,
          lineaDeCredito: solicitudData.creditLine || "Credicash",
          frecuenciaPago: frecuenciaPago,
          numeroCuotas: numeroCuotas,
          cuotaAprobada: cuotaAprobada,
          estadoCredito: "Activo",
          fechaInicio: fechaInicio,
          ultimaActualizacion: fechaInicio,
          asignadoA: asignadoNombre,
          agenciaAsignada: agenciaAsignada,
          fechaUltimoCalculoIntereses: fechaUltimoCalculoIntereses,
          amortizacion: amortizacion
        });

        // Marca asignación como aperturada
        if (asignacionData._docId) {
          await updateDoc(doc(db, "asignacion_de_cuota", asignacionData._docId), {
            creditoAperturado: true,
            fechaApertura: new Date().toISOString()
          });
        }

        // Refinanciamiento: cierra crédito anterior
        if (esRefinanciamiento && creditoAnteriorID) {
          await updateDoc(doc(db, "creditos", creditoAnteriorID), {
            estadoCredito: "Pagado",
            ultimaActualizacion: new Date().toISOString()
          });
        }

        alert("Crédito guardado correctamente.");
        window.location.href = "detalle_aprobaciones_page.html?id=" + asignacionData._docId;
      } catch (e) {
        alert("Error guardando crédito: " + (e.message || e));
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, user => {
        if (!user) {
          setLoading("No autenticado. Redirigiendo...");
          setTimeout(() => window.location.href = "login.html", 1200);
          return;
        }
        fetchSolicitudYAsignacion();
      });
    });
  </script>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ======= Estilo gráfico consistente (oscuro) ======= */
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
    }
    header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #67C8F1;
    }
    .container {
      max-width: 720px;
      margin: 2.2rem auto 0 auto;
      background: #181818;
      border-radius: 18px;
      box-shadow: 0 2px 25px #0005;
      padding: 2.5rem 2.3rem;
      min-height: 320px;
    }
    h1 {
      margin: 0 0 1.2rem 0;
      font-size: 2rem;
      color: #F8AF40;
      font-weight: bold;
      text-align: center;
    }

    /* Campos */
    .field { margin-bottom: 22px; }
    .field label {
      color: #aaa; font-size: 14px; display:block; margin-bottom: 6px;
    }
    .input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      background: #191919; color: #fff; border: 1px solid #222; font-size: 16px;
      outline: none;
    }

    .info-row { margin-bottom: 10px; color: #eaeaea; font-size: 16px; }

    /* Nota importante (no se desborda) */
    .nota-importante{
      margin-top:14px;
      padding:12px 14px;
      background:#213d4b;
      color:#F8AF40;
      border-radius:10px;
      font-size:.95rem;
      line-height:1.5;
      overflow:hidden;
      word-break: break-word;
      overflow-wrap:anywhere;
      hyphens:auto;
    }
    .nota-importante b{
      display:inline-block;
      color:#F8AF40;
      font-weight:900;
      font-size:.92rem;
      background:rgba(248,175,64,.15);
      padding:3px 8px;
      border-radius:6px;
      margin-bottom:6px;
    }
    .nota-importante ul{
      margin:8px 0 0 19px; padding-left:0; color:#fff;
    }
    .nota-importante li{ margin:4px 0; }

    /* Bloque de desembolso neto */
    .neto-box{
      padding:18px;
      background:#ffd840;
      border-radius:12px;
      color:#2d2d2d;
      font-size:1.15em;
      font-weight:bold;
      margin:22px 0 10px 0;
    }
    .neto-sub{ font-size:.86em; color:#df9900 }

    /* Tabla */
    .table-wrap { overflow-x:auto; }
    .tabla {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      background: #191919;
      min-width: 700px;
    }
    .tabla th, .tabla td {
      padding: 0.7rem .7rem;
      border-bottom: 1px solid #222;
      text-align: left;
      font-size: 1rem;
    }
    .tabla th {
      background: #222a2c;
      color: #67C8F1;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .tabla tr:hover { background: #232c31; }
    .amort-title{
      margin: 35px 0 7px 0;
      font-weight: bold;
      font-size: 18px;
      color: #fff;
    }

    /* Botón Guardar (estilo marca) */
    .btn-guardar{
      background:#13b66b;
      border:none;
      color:#fff;
      font-weight:bold;
      padding:15px 0;
      width:100%;
      font-size:17px;
      border-radius:12px;
      cursor:pointer;
      box-shadow: 0 6px 18px rgba(19,182,107,.25);
      transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn-guardar:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(19,182,107,.35);
      background:#10a061;
    }
    .btn-guardar:disabled{
      opacity:.6; cursor:not-allowed; transform:none; box-shadow:none;
    }

    .msg-aperturado{
      color:#f55;
      text-align:center;
      font-weight:bold;
      font-size:1.05em;
    }

    @media (max-width:750px) {
      .container { padding: 1.3rem 0.9rem; }
      h1 { font-size: 1.35rem; }
      .info-row { font-size: 15px;}
      .nota-importante{ font-size:.9rem; }
    }
  </style>
</head>
<body>
  <header>Apertura de Crédito</header>

  <div class="container">
    <h1><i class="fas fa-unlock"></i> Apertura de Crédito</h1>
    <div id="main-content" style="min-height:240px;">Cargando...</div>
  </div>
</body>
</html>
