<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apertura de Crédito – Multi Inversiones</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, doc, getDoc, addDoc, limit, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let solicitudData = null;
    let asignacionData = null;
    let amortizacion = [];
    let guardando = false;
    let solicitudID = null;
    let asignacionAperturada = false;

    // Refinanciamiento
    let esRefinanciamiento = false;
    let desembolsoNeto = null;
    let creditoAnteriorInfo = null;

    // Parámetro GET
    function getQueryParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function setLoading(msg = "Cargando...") {
      document.getElementById('main-content').innerHTML =
        `<div style="color:var(--text);text-align:center;padding:70px 0;">${msg}</div>`;
    }

    function recalcularAmortizacion() {
      if (!asignacionData) return [];

      const monto = Number(asignacionData.montoAprobado);
      const tasaAnual = Number(asignacionData.tasaAnual);
      const frecuencia = asignacionData.frecuenciaPago;
      const numCuotas = Number(asignacionData.numeroCuotas);
      const cuota = Number(asignacionData.cuota);

      const specs = {
        "Semanal": { periodos: 52, dias: 7 },
        "Catorcenal": { periodos: 26, dias: 14 },
        "Quincenal": { periodos: 24, dias: 15 },
        "Mensual": { periodos: 12, dias: 30 },
      };
      const perAno = specs[frecuencia]?.periodos ?? 52;
      const diasPeriodo = specs[frecuencia]?.dias ?? 7;
      const tasa = tasaAnual / perAno / 100;

      let fechaBase = new Date();
      fechaBase.setHours(0,0,0,0);

      let saldo = monto;
      let lista = [];
      for (let k = 1; k <= numCuotas; k++) {
        const interes = saldo * tasa;
        const capital = cuota - interes;
        saldo -= capital;
        if (k === numCuotas) saldo = 0;
        const fechaCuota = new Date(fechaBase);
        fechaCuota.setDate(fechaBase.getDate() + (k * diasPeriodo));
        lista.push({
          numeroCuota: k,
          fecha: fechaCuota.toISOString().split("T")[0],
          cuota: cuota.toFixed(2),
          interes: interes.toFixed(2),
          capital: capital.toFixed(2),
          saldo: saldo.toFixed(2),
          estado: "Pendiente",
          montoPagado: 0.00,
          fechaPagoReal: null
        });
      }
      return lista;
    }

    // Crédito anterior ACTIVO para refinanciamiento
    async function buscarCreditoAnterior(clienteID) {
      const creditosRef = collection(db, "creditos");
      const q = query(
        creditosRef,
        where("clienteID", "==", clienteID),
        where("estadoCredito", "==", "Activo")
      );
      const creditosSnap = await getDocs(q);
      if (creditosSnap.empty) return null;
      const creditoAnteriorDoc = creditosSnap.docs[0];
      const d = creditoAnteriorDoc.data();
      return {
        id: creditoAnteriorDoc.id,
        saldoActual: Number(d.saldoActual || 0),
        interesActual: Number(d.interesActual || 0),
        montoAprobado: Number(d.montoAprobado || 0)
      };
    }

    // Render de la página
    function renderMain() {
      if (!solicitudData) {
        setLoading("Solicitud no encontrada");
        return;
      }

      let html = `
        <div class="fields">
          <div class="field">
            <label>Línea de Crédito</label>
            <input type="text" value="\${solicitudData.creditLine ?? ''}" disabled class="input"/>
          </div>

          <div class="info-grid">
            <div class="info-row"><span>Nombre:</span> \${solicitudData.nombre ?? ''}</div>
            <div class="info-row"><span>Apellido:</span> \${solicitudData.apellido ?? ''}</div>
            <div class="info-row"><span>Monto Solicitado:</span> $\${(solicitudData.montoAprobado ?? '').toString()}</div>
          </div>
        </div>
      `;

      if (!asignacionData) {
        html += `<div class="muted" style="margin-top:10px;">Asignación: No disponible</div>`;
      } else {
        html += `
          <div class="info-grid">
            <div class="info-row"><span>Frecuencia de Pago:</span> \${asignacionData.frecuenciaPago ?? ''}</div>
            <div class="info-row"><span>Número de Cuotas:</span> \${asignacionData.numeroCuotas ?? ''}</div>
            <div class="info-row"><span>Cuota Aprobada:</span> $\${asignacionData.cuota ?? ''}</div>
          </div>
        `;
      }

      // Bloque desembolso neto (refinanciamiento)
      if (asignacionData && esRefinanciamiento && creditoAnteriorInfo) {
        html += `
          <div class="neto-box">
            <div class="neto-title"><i class="fa-solid fa-sack-dollar"></i> Efectivo a entregar al cliente</div>
            <div class="neto-value">$\${desembolsoNeto.toFixed(2)}</div>
            <div class="neto-sub">
              (Nuevo aprobado: $\${Number(asignacionData.montoAprobado).toFixed(2)} ·
              Menos saldo anterior: $\${creditoAnteriorInfo.saldoActual.toFixed(2)} ·
              Menos intereses pendientes: $\${creditoAnteriorInfo.interesActual.toFixed(2)})
            </div>
          </div>
        `;
      }

      // Tabla amortización
      if (asignacionData) {
        amortizacion = recalcularAmortizacion();
        html += `
          <div class="section-title"><i class="fa-regular fa-calendar-check"></i> Tabla de Amortización (al día de hoy)</div>
          <div class="table-wrap">
            <table class="tabla">
              <thead>
                <tr>
                  <th>N°</th>
                  <th>Fecha</th>
                  <th>Cuota</th>
                  <th>Interés</th>
                  <th>Capital</th>
                  <th>Saldo</th>
                </tr>
              </thead>
              <tbody>
                ${
                  amortizacion.map(row => `
                    <tr>
                      <td>\${row.numeroCuota ?? ''}</td>
                      <td>\${row.fecha}</td>
                      <td>$\${row.cuota}</td>
                      <td>$\${row.interes}</td>
                      <td>$\${row.capital}</td>
                      <td>$\${row.saldo}</td>
                    </tr>
                  `).join('')
                }
              </tbody>
            </table>
          </div>

          <div class="nota-importante">
            <b>IMPORTANTE</b>
            <ul>
              <li>La tabla está calculada <b>al día de la apertura del crédito</b>.</li>
              <li>La PRIMERA cuota se agenda N días después de hoy (hoy + período).</li>
              <li>Si la apertura es posterior a la asignación, las fechas y valores reflejan el día exacto de apertura.</li>
            </ul>
          </div>
        `;
      } else {
        html += `<div class="muted" style="margin-top:8px;">No hay amortización disponible.</div>`;
      }

      html += `
        <div style="margin:20px 0 10px 0;">
          <button id="guardar-credito-btn" \${guardando || !asignacionData || asignacionAperturada ? "disabled" : ""} class="btn-guardar">
            \${guardando ? "Guardando..." : (asignacionAperturada ? "Ya aperturado" : "Guardar Crédito")}
          </button>
        </div>
      `;

      if (asignacionAperturada) {
        html += `<div class="msg-aperturado">Este crédito ya fue aperturado y no puede ser guardado nuevamente.</div>`;
      }

      document.getElementById('main-content').innerHTML = html;

      // Guardar crédito
      const btn = document.getElementById("guardar-credito-btn");
      if (btn && !asignacionAperturada) {
        btn.addEventListener("click", async () => {
          if (guardando) return;
          guardando = true;
          renderMain();
          await guardarCredito();
          guardando = false;
          renderMain();
        });
      }
    }

    async function fetchSolicitudYAsignacion() {
      setLoading();
      try {
        solicitudID = getQueryParam('solicitudID');
        if (!solicitudID) {
          setLoading("No se especificó una solicitud.");
          return;
        }
        // Solicitud
        const solRef = doc(db, "Archivo Solicitudes", solicitudID);
        const solSnap = await getDoc(solRef);
        if (!solSnap.exists()) throw new Error("Solicitud no encontrada");
        solicitudData = solSnap.data();

        // Asignación (una) — EXCLUYENDO Rechazado
        const asignSnap = await getDocs(
          query(
            collection(db, "asignacion_de_cuota"),
            where("solicitudID", "==", solicitudID),
            where("respuestaCliente", "!=", "Rechazado"),
            limit(1)
          )
        );
        if (!asignSnap.empty) {
          asignacionData = asignSnap.docs[0].data();
          asignacionData._docId = asignSnap.docs[0].id;
          asignacionAperturada = !!asignacionData.creditoAperturado;
        } else {
          asignacionData = null;
          asignacionAperturada = false;
        }

        // Refinanciamiento
        esRefinanciamiento = (solicitudData.creditLine || "").toLowerCase().includes("refinanciamiento");
        if (asignacionData && esRefinanciamiento && solicitudData.clienteID) {
          creditoAnteriorInfo = await buscarCreditoAnterior(solicitudData.clienteID);
          if (creditoAnteriorInfo) {
            desembolsoNeto = Number(asignacionData.montoAprobado) - creditoAnteriorInfo.saldoActual - creditoAnteriorInfo.interesActual;
            if (desembolsoNeto < 0) desembolsoNeto = 0;
          } else {
            desembolsoNeto = Number(asignacionData.montoAprobado);
            creditoAnteriorInfo = {saldoActual: 0, interesActual: 0};
          }
        }

        renderMain();
      } catch (e) {
        setLoading("Error cargando datos: " + (e.message || e));
      }
    }

    // Guardar crédito (incluye refinanciamiento)
    async function guardarCredito() {
      if (asignacionAperturada) {
        alert("Este crédito ya fue aperturado. No puede volver a guardarse.");
        return;
      }
      if (!solicitudData || !asignacionData || amortizacion.length === 0) {
        alert("No hay datos completos para guardar el crédito.");
        return;
      }

      const montoAprobado = Number(asignacionData.montoAprobado) || 0;
      const frecuenciaPago = asignacionData.frecuenciaPago || "";
      const numeroCuotas = Number(asignacionData.numeroCuotas) || 0;
      const cuotaAprobada = Number(asignacionData.cuota) || 0;
      const asignadoNombre = asignacionData.asignadoA || "";
      const agenciaAsignada = asignacionData.agenciaAsignada || "";
      const numeroDui = solicitudData.numeroDui || '';
      const direccion = solicitudData.direccion || '';
      const telefono = solicitudData.telefono || '';
      const papeleriaDescontada = 5.0;
      const saldoInicial = montoAprobado;
      const saldoActual = montoAprobado;
      const clienteID = solicitudData.clienteID || "";
      const fechaInicio = new Date().toISOString();
      const fechaUltimoCalculoIntereses = fechaInicio;

      // id de crédito anterior si aplica
      let creditoAnteriorID = null;
      if (esRefinanciamiento && creditoAnteriorInfo && creditoAnteriorInfo.id) {
        creditoAnteriorID = creditoAnteriorInfo.id;
      }

      try {
        await addDoc(collection(db, "creditos"), {
          clienteID: clienteID,
          nombre: solicitudData.nombre || "",
          apellido: solicitudData.apellido || "",
          numeroDui: numeroDui,
          direccion: direccion,
          telefono: telefono,
          papeleriaDescontada: papeleriaDescontada,
          montoAprobado: montoAprobado,
          saldoInicial: saldoInicial.toFixed(2),
          saldoActual: saldoActual.toFixed(2),
          interesActual: 0.0,
          capitalAtrasado: 0.0,
          multasAcumuladas: 0.0,
          paraPonerseAlDia: 0.0,
          cuotasAtrasadas: 0,
          lineaDeCredito: solicitudData.creditLine || "Credicash",
          frecuenciaPago: frecuenciaPago,
          numeroCuotas: numeroCuotas,
          cuotaAprobada: cuotaAprobada,
          estadoCredito: "Activo",
          fechaInicio: fechaInicio,
          ultimaActualizacion: fechaInicio,
          asignadoA: asignadoNombre,
          agenciaAsignada: agenciaAsignada,
          fechaUltimoCalculoIntereses: fechaUltimoCalculoIntereses,
          amortizacion: amortizacion
        });

        // Marca asignación como aperturada
        if (asignacionData._docId) {
          await updateDoc(doc(db, "asignacion_de_cuota", asignacionData._docId), {
            creditoAperturado: true,
            fechaApertura: new Date().toISOString()
          });
        }

        // Refinanciamiento: cierra crédito anterior
        if (esRefinanciamiento && creditoAnteriorID) {
          await updateDoc(doc(db, "creditos", creditoAnteriorID), {
            estadoCredito: "Pagado",
            ultimaActualizacion: new Date().toISOString()
          });
        }

        alert("Crédito guardado correctamente.");
        window.location.href = "detalle_aprobaciones_page.html?id=" + asignacionData._docId;
      } catch (e) {
        alert("Error guardando crédito: " + (e.message || e));
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, user => {
        if (!user) {
          setLoading("No autenticado. Redirigiendo...");
          setTimeout(() => window.location.href = "login.html", 1200);
          return;
        }
        fetchSolicitudYAsignacion();
      });
    });
  </script>

  <style>
    /* ======= Estilo gráfico CLARO / GLASS, consistente con el Panel de Gerente ======= */
    :root{
      --bg:#f7f9fc; --bg-2:#eef2f7; --text:#0d1b2a; --white:#ffffff; --muted:#5b6776;
      --brand-blue:#243b86; --brand-cel:#67C8F1; --brand-green:#13b66b; --brand-gold:#F8AF40;
      --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(10,20,40,.08); --glass-shadow:0 20px 60px rgba(12,20,40,.12);
      --radius-2xl:22px; --radius-xl:16px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0c0f14; --bg-2:#0f141b; --text:#dfe6ef; --muted:#9aa6b6;
        --glass-bg:rgba(255,255,255,.12); --glass-brd:rgba(255,255,255,.18); --glass-shadow:0 24px 60px rgba(0,0,0,.45);
      }
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(36,59,134,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(248,175,64,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }
    .pattern{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(1px 1px at 25px 25px, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(1px 1px at 75px 75px, rgba(255,255,255,.06), transparent 40%);
      background-size:100px 100px; mix-blend-mode:soft-light; opacity:.5;
    }

    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
      border-bottom:1px solid var(--glass-brd);
    }
    @media (prefers-color-scheme: dark){
      header{ background:linear-gradient(180deg, rgba(15,20,30,.75), rgba(15,20,30,.35)); }
    }
    .topbar{
      max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:.8rem 16px;
    }
    .logo-plate{
      display:inline-flex; align-items:center; gap:10px; background:var(--glass-bg);
      border:1px solid var(--glass-brd); padding:8px 14px; border-radius:16px;
      box-shadow:var(--glass-shadow); position:relative; overflow:hidden; isolation:isolate;
    }
    .logo-plate::after{
      content:""; position:absolute; inset:-1px;
      background:linear-gradient(120deg, transparent 0 35%, rgba(255,255,255,.55) 45%, transparent 55% 100%);
      transform:translateX(-120%); animation:plateSheen 6s linear infinite; pointer-events:none;
    }
    .logo-plate img{ height:28px; width:auto; display:block }
    .brand-name{ font-weight:800; letter-spacing:.2px; color:var(--brand-blue); }

    .container{
      position:relative; z-index:1;
      max-width:900px; margin:2rem auto; padding:1.4rem;
      background:var(--glass-bg); border:1px solid var(--glass-brd);
      border-radius:var(--radius-2xl); box-shadow:var(--glass-shadow);
    }

    h1{
      margin:.2rem 0 1rem; font-size:clamp(1.4rem, 1.6vw + 1rem, 2rem);
      font-weight:800; color:var(--brand-blue); letter-spacing:.2px; text-align:center;
    }
    h1 i{ font-size:1.1em; color:var(--brand-cel); vertical-align:-2px; margin-right:.35rem; }

    .muted{ color:var(--muted); }

    /* Campos */
    .fields{ margin-bottom:.6rem; }
    .field { margin-bottom: 18px; }
    .field label {
      color: var(--muted); font-size: .92rem; display:block; margin-bottom: 6px; font-weight:700;
    }
    .input {
      width: 100%; padding: 10px 12px; border-radius: 12px;
      background: var(--white); color: var(--text); border: 1px solid var(--glass-brd);
      font-size: 16px; outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 18px rgba(10,20,40,.06);
    }

    /* Info en grid responsivo */
    .info-grid{
      display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:10px 18px;
    }
    @media (max-width:700px){ .info-grid{ grid-template-columns:1fr; } }

    .info-row{
      background:var(--white); border:1px solid var(--glass-brd); border-radius:12px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 6px 18px rgba(10,20,40,.06);
      padding:10px 12px; font-size:1rem;
    }
    .info-row span{ font-weight:800; color:var(--brand-blue); margin-right:6px; }

    /* Bloque de desembolso neto */
    .neto-box{
      margin:16px 0 8px; padding:16px; border-radius:16px;
      background:linear-gradient(180deg, #fff6cf, #ffe99b); border:1px solid rgba(248,175,64,.35);
      box-shadow:0 10px 26px rgba(248,175,64,.18), inset 0 1px 0 rgba(255,255,255,.7);
      color:#2d2d2d;
    }
    .neto-title{ font-weight:900; color:#8a5a00; letter-spacing:.2px; margin-bottom:6px; }
    .neto-value{ font-size:1.6rem; font-weight:900; color:#512d00; }
    .neto-sub{ margin-top:6px; font-size:.94rem; color:#7a4b00; }

    /* Título sección */
    .section-title{
      margin:18px 0 8px; font-weight:900; color:var(--brand-blue);
      display:flex; align-items:center; gap:.5rem;
    }
    .section-title i{ color:var(--brand-cel); }

    /* Tabla */
    .table-wrap { overflow-x:auto; }
    .tabla {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      min-width: 700px;
      border:1px solid var(--glass-brd);
      box-shadow: 0 8px 22px rgba(10,20,40,.08), inset 0 1px 0 rgba(255,255,255,.7);
      border-radius:12px; overflow:hidden;
    }
    .tabla th, .tabla td {
      padding: .75rem .7rem;
      border-bottom: 1px solid rgba(10,20,40,.08);
      text-align: left; font-size: .98rem; color:var(--text);
    }
    .tabla th {
      background: linear-gradient(180deg, rgba(103,200,241,.18), rgba(103,200,241,.08));
      color: var(--brand-blue);
      font-weight: 800;
    }
    .tabla tr:hover { background: rgba(103,200,241,.05); }

    /* Nota importante (NO se desborda) */
    .nota-importante{
      margin-top:12px;
      padding:12px 14px;
      background:linear-gradient(180deg, rgba(36,59,134,.08), rgba(103,200,241,.08));
      color:var(--text);
      border:1px solid rgba(36,59,134,.15);
      border-radius:12px;
      font-size:.95rem;
      line-height:1.5;
      overflow:hidden;
      word-break: break-word;
      overflow-wrap:anywhere;
      hyphens:auto;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .nota-importante b{
      display:inline-block;
      color:var(--brand-gold);
      font-weight:900;
      background:rgba(248,175,64,.15);
      padding:3px 8px;
      border-radius:6px;
      margin:0 6px 6px 0;
    }
    .nota-importante ul{
      margin:8px 0 0 18px; padding-left:0;
    }
    .nota-importante li{ margin:4px 0; }

    /* Botón Guardar (verde marca) */
    .btn-guardar{
      background:linear-gradient(90deg, var(--brand-green), #10a164);
      border:none; color:#fff; font-weight:800; letter-spacing:.2px;
      padding:15px 0; width:100%; font-size:1.05rem; border-radius:16px; cursor:pointer;
      box-shadow: 0 14px 30px rgba(16,161,100,.22);
      transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
    }
    .btn-guardar:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(16,161,100,.28);
      filter:saturate(1.05);
    }
    .btn-guardar:disabled{
      opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; filter:none;
    }

    .msg-aperturado{
      color:#c62828; text-align:center; font-weight:900; font-size:1.02rem;
    }
  </style>
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>

  <header>
