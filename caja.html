<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Caja – Multi Inversiones</title>

  <style>
    body {
      margin:0;
      font-family:Arial,sans-serif;
      background: radial-gradient(circle,#000,#111);
      color:#fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    header {
      position: absolute;
      top: 0;
      width: 100%;
      background:#000;
      padding:1rem;
      text-align:center;
      font-size:1.5rem;
      letter-spacing:1px;
    }
    .mensaje {
      font-size:1.4rem;
      font-weight:700;
      color:#F8AF40;
      max-width: 600px;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <header>Panel de Caja</header>

  <div class="mensaje">
    ⚠️ Las funciones no están disponibles.<br>
    Revise su cuenta de <strong>Google Cloud</strong> para seguir utilizando las Funciones.
  </div>
</body>
</html>
