<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cierre de Caja – Panel Gerente</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc, orderBy, limit, Timestamp
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // ===== Firebase =====
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ===== Estado =====
    let agenciaActual = "";
    let gerenteNombre = "";
    let gerenteId = "";
    let diasPendientes = [];
    let movimientosDelDia = [];
    let fechaSeleccionada = null;
    let saldoInicial = 0;

    // ===== Utilidades =====
    function toDateString(date) { return date.toISOString().slice(0,10); } // YYYY-MM-DD
    function yyyymmdd(d) {
      const x = new Date(d);
      const y = x.getUTCFullYear();
      const m = String(x.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(x.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }
    function formatMoney(n) {
      return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function getDiaSVRange(fechaLocal /* "YYYY-MM-DD" */) {
      // Rango del día en SV (UTC-06) convertido a ISO UTC
      const dateStart = new Date(`${fechaLocal}T00:00:00-06:00`);
      const dateEnd   = new Date(`${fechaLocal}T23:59:59.999-06:00`);
      return [dateStart.toISOString(), dateEnd.toISOString()];
    }
    function getPrevOperacionDate(fechaOperacion) {
      const d = new Date(`${fechaOperacion}T00:00:00-06:00`);
      d.setDate(d.getDate() - 1);
      return yyyymmdd(d);
    }
    function toDateAny(x) {
      if (!x) return null;
      if (x instanceof Date) return x;
      if (x?.toDate) return x.toDate();        // Firestore Timestamp
      if (typeof x === "string") return new Date(x);
      return null;
    }
    function isoFromAny(x) {
      const d = toDateAny(x);
      return d ? d.toISOString() : "";
    }
    function formatFechaHoraCompact(iso) {
      if (!iso) return "";
      return iso.replace('T',' ').replace('.000Z','').slice(0,16);
    }
    function normTipo(t) {
      const v = (t || "").toString().toLowerCase();
      if (v === "egreso") return "Egreso";
      return "Ingreso";
    }

    // ===== SALDO INICIAL (desde cierre previo, retrocompatible) =====
    async function obtenerSaldoInicial(agencia, fechaOperacion /* "YYYY-MM-DD" */) {
      const cierresRef = collection(db, "cierres_caja");
      const fechaAnterior = getPrevOperacionDate(fechaOperacion);

      // 1) Exacto del día anterior
      {
        const qExact = query(
          cierresRef,
          where("agencia", "==", agencia),
          where("fecha", "==", fechaAnterior),
          limit(1)
        );
        const snapExact = await getDocs(qExact);
        if (!snapExact.empty) {
          const data = snapExact.docs[0].data();
          return Number((data.saldo_siguiente ?? data.saldo_caja) || 0);
        }
      }

      // 2) Últimos 20 cierres, tomar el más reciente < fechaOperacion
      {
        const qLast = query(
          cierresRef,
          where("agencia", "==", agencia),
          orderBy("fecha", "desc"),
          limit(20)
        );
        const snapLast = await getDocs(qLast);
        let mejor = null;
        snapLast.forEach(docu => {
          const d = docu.data();
          const f = (typeof d.fecha === 'string' && d.fecha.length >= 10)
            ? d.fecha.slice(0,10)
            : yyyymmdd(d.fecha);
          if (f && f < fechaOperacion) {
            if (!mejor || f > mejor.fecha) mejor = { fecha: f, data: d };
          }
        });
        if (mejor) {
          const d = mejor.data;
          return Number((d.saldo_siguiente ?? d.saldo_caja) || 0);
        }
      }
      return 0;
    }

    // ===== NUEVO: si ya existe cierre para la fecha seleccionada, leer su saldo_siguiente =====
    async function obtenerSaldoCierreDelDia(agencia, fechaOperacion /* "YYYY-MM-DD" */) {
      const q = query(
        collection(db, "cierres_caja"),
        where("agencia", "==", agencia),
        where("fecha", "==", fechaOperacion),
        limit(1)
      );
      const snap = await getDocs(q);
      if (!snap.empty) {
        const d = snap.docs[0].data();
        return Number((d.saldo_siguiente ?? d.saldo_caja) || 0);
      }
      return null;
    }

    // ===== Cargar gerente y fechas con pendientes (ambas colecciones/fechas) =====
    async function cargarGerenteYFechas() {
      document.getElementById("select-fecha").innerHTML = `<option>Cargando...</option>`;
      document.getElementById("tabla-movs").innerHTML = "";
      document.getElementById("totales").innerHTML = "";

      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        gerenteId = user.uid;

        const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
        if (snap.empty) {
          document.getElementById("select-fecha").innerHTML = `<option>No se encontró gerente</option>`;
          return;
        }
        const gerenteData = snap.docs[0].data();
        agenciaActual = gerenteData.department;
        gerenteNombre = `${gerenteData.nombre || ""} ${gerenteData.apellido || ""}`.trim();
        document.getElementById("gerente-nombre").innerText = gerenteNombre || user.email;

        // Fechas con movimientos sin cerrar (ambas colecciones; fecha_ts/createdAt/fecha texto)
        let movDatesSet = new Set();

        for (const coll of ["movimientosCaja", "movimientos_caja"]) {
          const qMovs = query(
            collection(db, coll),
            where("agencia", "==", agenciaActual),
            where("cierre", "==", false)
          );
          const snapMovs = await getDocs(qMovs);
          for (const docMov of snapMovs.docs) {
            const m = docMov.data();
            if (m.fecha_ts?.toDate) movDatesSet.add(yyyymmdd(m.fecha_ts.toDate()));
            if (m.createdAt?.toDate) movDatesSet.add(yyyymmdd(m.createdAt.toDate()));
            if (typeof m.fecha === "string" && m.fecha.length >= 10) {
              // Si guardas ISO completo, tomamos los primeros 10
              const s = m.fecha.slice(0,10);
              if (/\d{4}-\d{2}-\d{2}/.test(s)) movDatesSet.add(s);
            }
          }
        }

        // Quitar las ya cerradas
        const cierresQ = query(collection(db, "cierres_caja"), where("agencia", "==", agenciaActual));
        const cierresSnap = await getDocs(cierresQ);
        let fechasCerradas = new Set();
        for (const docC of cierresSnap.docs) {
          let f = docC.data().fecha;
          if (f && typeof f === "string" && f.length >= 10) fechasCerradas.add(f.substring(0,10));
        }

        diasPendientes = Array.from(movDatesSet).filter(f => !fechasCerradas.has(f));
        diasPendientes.sort();

        if (diasPendientes.length === 0) {
          const hoy = toDateString(new Date());
          diasPendientes = [hoy];
        }

        document.getElementById("select-fecha").innerHTML =
          diasPendientes.map(f => `<option value="${f}">${f.split('-').reverse().join('/')}</option>`).join('');

        fechaSeleccionada = diasPendientes[0];
        await cargarMovimientosYTotales(fechaSeleccionada);

        document.getElementById("select-fecha").onchange = async e => {
          fechaSeleccionada = e.target.value;
          await cargarMovimientosYTotales(fechaSeleccionada);
        };
      });
    }

    // ===== Cargar movimientos + pagos (compatible y deduplicado) =====
    async function cargarMovimientosYTotales(fecha /* "YYYY-MM-DD" */) {
      document.getElementById("tabla-movs").innerHTML =
        `<tr><td colspan="6" style="text-align:center">Cargando movimientos...</td></tr>`;

      movimientosDelDia = [];
      let totalIngresos = 0;
      let totalEgresos = 0;

      saldoInicial = await obtenerSaldoInicial(agenciaActual, fecha);

      // Rango del día (SV) en ISO UTC y como Timestamps
      const [fechaInicioUTC, fechaFinUTC] = getDiaSVRange(fecha);
      const startTs = Timestamp.fromDate(new Date(fechaInicioUTC));
      const endTs   = Timestamp.fromDate(new Date(fechaFinUTC));

      const correlativosSumados = new Set();
      const idsVistos = new Set();

      function pushMovimiento(docMov, coll) {
        if (idsVistos.has(docMov.id)) return;
        idsVistos.add(docMov.id);

        const m = docMov.data();

        if (m.cierre === true) return;
        if ('anulado' in m && m.anulado === true) return;
        if (m.descripcion && (m.descripcion.startsWith('Reversión de pago') || m.descripcion.startsWith('Reversión correlativo'))) return;

        if (m.correlativo && correlativosSumados.has(m.correlativo)) return;
        if (m.correlativo) correlativosSumados.add(m.correlativo);

        // Fecha a mostrar (preferencia: fecha_ts -> createdAt -> fecha)
        let iso = "";
        if (m.fecha_ts) iso = isoFromAny(m.fecha_ts);
        else if (m.createdAt) iso = isoFromAny(m.createdAt);
        else iso = isoFromAny(m.fecha);

        const tipo  = normTipo(m.tipo);
        the monto = Number(m.monto || 0);
        movimientosDelDia.push({
          id: docMov.id,
          coll,
          tipo,
          descripcion: m.descripcion || "",
          monto,
          usuario: m.usuario || "",
          fecha: iso,
          cierre: false,
          origen: "movimiento"
        });

        if (tipo === "Ingreso") totalIngresos += monto;
        if (tipo === "Egreso")  totalEgresos  += monto;
      }

      // 1) Movimientos de caja – ambas colecciones y tres campos de fecha
      for (const coll of ["movimientosCaja", "movimientos_caja"]) {
        // a) por 'fecha_ts' (Timestamp)
        const qTs = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("fecha_ts", ">=", startTs),
          where("fecha_ts", "<=", endTs)
        );
        const snapTs = await getDocs(qTs);
        snapTs.forEach(docMov => pushMovimiento(docMov, coll));

        // b) por 'createdAt' (Timestamp)
        const qCreated = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("createdAt", ">=", startTs),
          where("createdAt", "<=", endTs)
        );
        const snapCreated = await getDocs(qCreated);
        snapCreated.forEach(docMov => pushMovimiento(docMov, coll));

        // c) por 'fecha' (string ISO, si alguna vez la guardas así)
        const qStr = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("fecha", ">=", fechaInicioUTC),
          where("fecha", "<=", fechaFinUTC)
        );
        const snapStr = await getDocs(qStr);
        snapStr.forEach(docMov => pushMovimiento(docMov, coll));
      }

      // 2) Pagos (ingresos)
      const pagosSnap = await getDocs(
        query(
          collection(db, "pagos"),
          where("sucursal", "==", agenciaActual),
          where("fechaPago", ">=", fechaInicioUTC),
          where("fechaPago", "<=", fechaFinUTC)
        )
      );
      const pagosRetroSnap = await getDocs(
        query(
          collection(db, "pagos"),
          where("sucursal", "==", agenciaActual),
          where("retroactivo", "==", true),
          where("fechaRegistro", ">=", fechaInicioUTC),
          where("fechaRegistro", "<=", fechaFinUTC)
        )
      );

      const pagosUnidos = [];
      const pagosIds = new Set();

      for (const docPago of pagosSnap.docs) {
        const d = docPago.data();
        if (!("anulado" in d) || !d.anulado) {
          const cierrePago = d.hasOwnProperty("cierre") ? d.cierre : false;
          if (cierrePago === false || cierrePago === null) {
            pagosUnidos.push({ ...d, id: docPago.id });
            pagosIds.add(docPago.id);
          }
        }
      }
      for (const docPago of pagosRetroSnap.docs) {
        if (pagosIds.has(docPago.id)) continue;
        const d = docPago.data();
        if (!("anulado" in d) || !d.anulado) {
          const cierrePago = d.hasOwnProperty("cierre") ? d.cierre : false;
          if (cierrePago === false || cierrePago === null) {
            pagosUnidos.push({ ...d, id: docPago.id });
            pagosIds.add(docPago.id);
          }
        }
      }

      for (const d of pagosUnidos) {
        const monto = Number(d.montoPagado) || 0;
        const fechaIso = d.fechaRegistro || d.fechaPago || "";
        movimientosDelDia.push({
          id: d.id,
          coll: "pagos",
          tipo: "Ingreso",
          descripcion: d.retroactivo ? "Pago retroactivo" : "Pago de cliente",
          monto,
          usuario: d.cajeroNombre || "",
          fecha: fechaIso,
          cierre: d.cierre || false,
          origen: "pago"
        });
        totalIngresos += monto;
      }

      // Orden cronológico
      movimientosDelDia.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

      // Render
      if (movimientosDelDia.length === 0) {
        document.getElementById("tabla-movs").innerHTML =
          `<tr><td colspan="6" style="text-align:center;color:#fff6">No hay movimientos para este día.</td></tr>`;
      } else {
        document.getElementById("tabla-movs").innerHTML =
          movimientosDelDia.map(m =>
            `<tr>
              <td>${m.tipo || ""}</td>
              <td>${m.descripcion || ""}</td>
              <td>${formatMoney(m.monto || 0)}</td>
              <td>${m.usuario || ""}</td>
              <td>${formatFechaHoraCompact(m.fecha)}</td>
            </tr>`
          ).join('');
      }

      const saldoFinal = saldoInicial + totalIngresos - totalEgresos;

      // >>> ÚNICO CAMBIO: si ya existe cierre para esta fecha, usamos su saldo_siguiente, si no usamos el proyectado
      const saldoCierreDia = await obtenerSaldoCierreDelDia(agenciaActual, fecha);
      const saldoParaMostrar = (saldoCierreDia !== null) ? saldoCierreDia : saldoFinal;

      document.getElementById("totales").innerHTML =
        `<div style="margin-top:18px;text-align:right">
          <b style="color:#55e2c1">Saldo Inicial: ${formatMoney(saldoInicial)}</b><br>
          <b style="color:#2EF37A">Total Ingresos: ${formatMoney(totalIngresos)}</b><br>
          <b style="color:#F8AF40">Total Egresos: ${formatMoney(totalEgresos)}</b><br>
          <b style="color:#FFD600">Saldo de Caja (al cierre): ${formatMoney(saldoParaMostrar)}</b>
        </div>`;
    }

    // ===== PIN hashing =====
    async function sha256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ===== Cerrar caja =====
    async function cerrarCajaDelDia() {
      if (!fechaSeleccionada) return alert("Selecciona un día válido");
      if (movimientosDelDia.length === 0) return alert("No hay movimientos para este día.");

      const pin = prompt("Por seguridad, ingresa tu PIN de gerente:");
      if (!pin) return;

      const pinHash = await sha256(pin);
      const gerenteSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
      const gerenteData = gerenteSnap.docs[0]?.data();
      if (!gerenteData || gerenteData.internalPassword !== pinHash) {
        alert("PIN incorrecto");
        return;
      }

      let totalIngresos = 0, totalEgresos = 0;
      movimientosDelDia.forEach(m => {
        if (m.tipo === "Ingreso") totalIngresos += Number(m.monto || 0);
        if (m.tipo === "Egreso")  totalEgresos  += Number(m.monto || 0);
      });

      const saldoFinal = saldoInicial + totalIngresos - totalEgresos;

      await addDoc(collection(db, "cierres_caja"), {
        agencia: agenciaActual,
        fecha: fechaSeleccionada,  // YYYY-MM-DD operativo
        total_ingresos: totalIngresos,
        total_egresos: totalEgresos,
        saldo_inicial: saldoInicial,
        saldo_caja: saldoFinal,
        saldo_siguiente: saldoFinal,
        movimientos: movimientosDelDia.map(m => ({
          tipo: m.tipo,
          descripcion: m.descripcion,
          monto: m.monto,
          usuario: m.usuario,
          fecha: m.fecha,
          id_movimiento: m.id,
          origen: m.origen || ""
        })),
        fecha_cierre: (new Date()).toISOString(),
        gerente_id: gerenteId,
        gerente_nombre: gerenteNombre
      });

      // Marcar cierre:true en fuentes
      for (const m of movimientosDelDia) {
        try {
          if (m.origen === "movimiento") {
            await updateDoc(doc(db, m.coll, m.id), { cierre: true });
          } else if (m.origen === "pago") {
            await updateDoc(doc(db, "pagos", m.id), { cierre: true });
          }
        } catch (e) {
          console.warn("No se pudo marcar cierre en", m.origen, m.id, e);
        }
      }

      alert("¡Cierre realizado y registrado exitosamente!");
      await cargarGerenteYFechas();
    }

    // ===== Init =====
    window.addEventListener("DOMContentLoaded", cargarGerenteYFechas);
    window.cerrarCajaDelDia = cerrarCajaDelDia;
  </script>

  <style>
    body { margin:0; font-family: Arial,sans-serif; background:#11102a; color:#fff; min-height:100vh;}
    header { width:100%; background:#221a3a; padding:1.2rem 0 1.1rem; text-align:center; font-size:1.44rem; font-weight:700; letter-spacing:.5px; color:#fff; margin-bottom:1.2rem;}
    .main-card { margin:54px auto 0; background:#1a1a26; border-radius:19px; max-width:540px; padding:2.2rem 2.2rem 2.8rem; box-shadow:0 8px 38px #0a013377; display:flex; flex-direction:column;}
    label{margin-bottom:5px; font-weight:500;}
    select,option,input{font-size:1.08rem; background:#191834; color:#fff; border-radius:6px; border:1px solid #4e3b71; padding:.59rem .7rem; margin-bottom:10px;}
    button{width:100%; background:#a787f4; color:#fff; font-weight:700; border:none; border-radius:8px; padding:1rem 0; margin-top:20px; font-size:1.1rem; cursor:pointer; transition:background .15s;}
    button:hover{background:#5e38a3;}
    .scroll-table-wrap{width:100%; overflow-x:auto; margin-top:1.3rem; border-radius:10px; background:#181828; box-shadow:0 3px 13px #0002;}
    .table-movs{width:100%; min-width:580px; border-collapse:collapse; font-size:.99rem; background:#181828;}
    .table-movs th,.table-movs td{padding:.62em .8em; white-space:nowrap; text-align:left;}
    .table-movs th{background:#2c234a; color:#fff; font-weight:700; position:sticky; top:0; z-index:2;}
    .table-movs td{border-bottom:1px solid #212146; color:#fff;}
    .table-movs tr:last-child td{border-bottom:none;}
    #totales{margin-top:10px; text-align:right;}
    @media (max-width:630px){ .main-card{padding:1rem .3rem 2rem; max-width:99vw;} .table-movs{font-size:.95rem;} .scroll-table-wrap{min-width:0;} }
  </style>
</head>
<body>
  <header>Cierre de Caja – Panel Gerente</header>
  <div class="main-card">
    <div><b>Gerente:</b> <span id="gerente-nombre">Cargando...</span></div>
    <div style="margin-top:20px;margin-bottom:8px;">
      <label>Selecciona un día pendiente de cierre:</label><br>
      <select id="select-fecha"></select>
    </div>
    <div>
      <b style="color:#fff">Movimientos del día</b>
      <div class="scroll-table-wrap">
        <table class="table-movs">
          <thead>
            <tr>
              <th>Tipo</th><th>Descripción</th><th>Monto</th><th>Usuario</th><th>Fecha</th>
            </tr>
          </thead>
          <tbody id="tabla-movs"></tbody>
        </table>
      </div>
      <div id="totales"></div>
      <button onclick="cerrarCajaDelDia()">Cerrar Caja del Día Seleccionado</button>
    </div>
  </div>
</body>
</html>
