<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cierre de Caja – Panel Gerente</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc, orderBy, limit, Timestamp
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // ===== Firebase =====
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ===== Estado =====
    let agenciaActual = "";
    let gerenteNombre = "";
    let gerenteId = "";
    let diasPendientes = [];
    let movimientosDelDia = [];
    let fechaSeleccionada = null;
    let saldoInicial = 0;

    // ===== Utilidades =====
    function toDateString(date) { return date.toISOString().slice(0,10); } // YYYY-MM-DD
    function yyyymmdd(d) {
      const x = new Date(d);
      const y = x.getUTCFullYear();
      const m = String(x.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(x.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }
    function formatMoney(n) {
      return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function getDiaSVRange(fechaLocal /* "YYYY-MM-DD" */) {
      // Rango del día en SV (UTC-06) convertido a ISO UTC
      const dateStart = new Date(`${fechaLocal}T00:00:00-06:00`);
      const dateEnd   = new Date(`${fechaLocal}T23:59:59.999-06:00`);
      return [dateStart.toISOString(), dateEnd.toISOString()];
    }
    function getPrevOperacionDate(fechaOperacion) {
      const d = new Date(`${fechaOperacion}T00:00:00-06:00`);
      d.setDate(d.getDate() - 1);
      return yyyymmdd(d);
    }
    function toDateAny(x) {
      if (!x) return null;
      if (x instanceof Date) return x;
      if (x?.toDate) return x.toDate();        // Firestore Timestamp
      if (typeof x === "string") return new Date(x);
      return null;
    }
    function isoFromAny(x) {
      const d = toDateAny(x);
      return d ? d.toISOString() : "";
    }
    function formatFechaHoraCompact(iso) {
      if (!iso) return "";
      return iso.replace('T',' ').replace('.000Z','').slice(0,16);
    }
    function normTipo(t) {
      const v = (t || "").toString().toLowerCase();
      if (v === "egreso") return "Egreso";
      return "Ingreso";
    }

    // ===== SALDO INICIAL (desde cierre previo, retrocompatible) =====
    async function obtenerSaldoInicial(agencia, fechaOperacion /* "YYYY-MM-DD" */) {
      const cierresRef = collection(db, "cierres_caja");
      const fechaAnterior = getPrevOperacionDate(fechaOperacion);

      // 1) Exacto del día anterior
      {
        const qExact = query(
          cierresRef,
          where("agencia", "==", agencia),
          where("fecha", "==", fechaAnterior),
          limit(1)
        );
        const snapExact = await getDocs(qExact);
        if (!snapExact.empty) {
          const data = snapExact.docs[0].data();
          return Number((data.saldo_siguiente ?? data.saldo_caja) || 0);
        }
      }

      // 2) Últimos 20 cierres, tomar el más reciente < fechaOperacion
      {
        const qLast = query(
          cierresRef,
          where("agencia", "==", agencia),
          orderBy("fecha", "desc"),
          limit(20)
        );
        const snapLast = await getDocs(qLast);
        let mejor = null;
        snapLast.forEach(docu => {
          const d = docu.data();
          const f = (typeof d.fecha === 'string' && d.fecha.length >= 10)
            ? d.fecha.slice(0,10)
            : yyyymmdd(d.fecha);
          if (f && f < fechaOperacion) {
            if (!mejor || f > mejor.fecha) mejor = { fecha: f, data: d };
          }
        });
        if (mejor) {
          const d = mejor.data;
          return Number((d.saldo_siguiente ?? d.saldo_caja) || 0);
        }
      }
      return 0;
    }

    // ===== NUEVO: leer saldo de un cierre existente para la misma fecha (si ya fue cerrado) =====
    async function obtenerSaldoCierreSiExiste(agencia, fechaOperacion /* "YYYY-MM-DD" */) {
      const q = query(
        collection(db, "cierres_caja"),
        where("agencia", "==", agencia),
        where("fecha", "==", fechaOperacion),
        limit(1)
      );
      const snap = await getDocs(q);
      if (!snap.empty) {
        const d = snap.docs[0].data();
        return (d.saldo_siguiente ?? d.saldo_caja ?? null);
      }
      return null;
    }

    // ===== Cargar gerente y fechas con pendientes (ambas colecciones/fechas) =====
    async function cargarGerenteYFechas() {
      document.getElementById("select-fecha").innerHTML = `<option>Cargando...</option>`;
      document.getElementById("tabla-movs").innerHTML = "";
      document.getElementById("totales").innerHTML = "";

      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        gerenteId = user.uid;

        const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
        if (snap.empty) {
          document.getElementById("select-fecha").innerHTML = `<option>No se encontró gerente</option>`;
          return;
        }
        const gerenteData = snap.docs[0].data();
        agenciaActual = gerenteData.department;
        gerenteNombre = `${gerenteData.nombre || ""} ${gerenteData.apellido || ""}`.trim();
        document.getElementById("gerente-nombre").innerText = gerenteNombre || user.email;

        // Fechas con movimientos sin cerrar (ambas colecciones; fecha_ts/createdAt/fecha texto)
        let movDatesSet = new Set();

        for (const coll of ["movimientosCaja", "movimientos_caja"]) {
          const qMovs = query(
            collection(db, coll),
            where("agencia", "==", agenciaActual),
            where("cierre", "==", false)
          );
          const snapMovs = await getDocs(qMovs);
          for (const docMov of snapMovs.docs) {
            const m = docMov.data();
            if (m.fecha_ts?.toDate) movDatesSet.add(yyyymmdd(m.fecha_ts.toDate()));
            if (m.createdAt?.toDate) movDatesSet.add(yyyymmdd(m.createdAt.toDate()));
            if (typeof m.fecha === "string" && m.fecha.length >= 10) {
              const s = m.fecha.slice(0,10);
              if (/\d{4}-\d{2}-\d{2}/.test(s)) movDatesSet.add(s);
            }
          }
        }

        // +++ NUEVO: incluir pagos (aunque no tengan 'cierre') para poblar el selector
        {
          const agenciaActualNorm = (agenciaActual || "").toLowerCase().trim();
          const pagosQ = query(
            collection(db, "pagos"),
            where("sucursal", "==", agenciaActual) // nombre tal cual
          );
          const pagosSnap = await getDocs(pagosQ);

          for (const docPago of pagosSnap.docs) {
            const d = docPago.data();

            if (d.anulado === true) continue;
            // si existe 'cierre' y es true => ya cerrado, no contarlo
            if (Object.prototype.hasOwnProperty.call(d, "cierre") && d.cierre === true) continue;

            // seguridad por mayúsculas/espacios en sucursal
            const sucNorm = (d.sucursal || "").toString().toLowerCase().trim();
            if (sucNorm !== agenciaActualNorm) continue;

            // Fecha operativa principal: fechaPago
            if (typeof d.fechaPago === "string" && d.fechaPago.length >= 10) {
              movDatesSet.add(d.fechaPago.slice(0,10));
            } else if (d.fechaPago?.toDate) {
              movDatesSet.add(yyyymmdd(d.fechaPago.toDate()));
            }

            // Si es retroactivo, también considerar fechaRegistro
            if (d.retroactivo) {
              if (typeof d.fechaRegistro === "string" && d.fechaRegistro.length >= 10) {
                movDatesSet.add(d.fechaRegistro.slice(0,10));
              } else if (d.fechaRegistro?.toDate) {
                movDatesSet.add(yyyymmdd(d.fechaRegistro.toDate()));
              }
            }
          }
        }

        // Quitar las ya cerradas
        const cierresQ = query(collection(db, "cierres_caja"), where("agencia", "==", agenciaActual));
        const cierresSnap = await getDocs(cierresQ);
        let fechasCerradas = new Set();
        for (const docC of cierresSnap.docs) {
          let f = docC.data().fecha;
          if (f && typeof f === "string" && f.length >= 10) fechasCerradas.add(f.substring(0,10));
        }

        diasPendientes = Array.from(movDatesSet).filter(f => !fechasCerradas.has(f));
        diasPendientes.sort();

        if (diasPendientes.length === 0) {
          const hoy = toDateString(new Date());
          diasPendientes = [hoy];
        }

        document.getElementById("select-fecha").innerHTML =
          diasPendientes.map(f => `<option value="${f}">${f.split('-').reverse().join('/')}</option>`).join('');

        fechaSeleccionada = diasPendientes[0];
        await cargarMovimientosYTotales(fechaSeleccionada);

        document.getElementById("select-fecha").onchange = async e => {
          fechaSeleccionada = e.target.value;
          await cargarMovimientosYTotales(fechaSeleccionada);
        };
      });
    }

    // ===== Cargar movimientos + pagos (compatible y deduplicado) =====
    async function cargarMovimientosYTotales(fecha /* "YYYY-MM-DD" */) {
      document.getElementById("tabla-movs").innerHTML =
        `<tr><td colspan="6" style="text-align:center">Cargando movimientos...</td></tr>`;

      movimientosDelDia = [];
      let totalIngresos = 0;
      let totalEgresos = 0;

      saldoInicial = await obtenerSaldoInicial(agenciaActual, fecha);

      // Rango del día (SV) en ISO UTC y como Timestamps
      const [fechaInicioUTC, fechaFinUTC] = getDiaSVRange(fecha);
      const startTs = Timestamp.fromDate(new Date(fechaInicioUTC));
      const endTs   = Timestamp.fromDate(new Date(fechaFinUTC));

      const correlativosSumados = new Set();
      const idsVistos = new Set();

      function pushMovimiento(docMov, coll) {
        if (idsVistos.has(docMov.id)) return;
        idsVistos.add(docMov.id);

        const m = docMov.data();

        if (m.cierre === true) return;
        if ('anulado' in m && m.anulado === true) return;
        if (m.descripcion && (m.descripcion.startsWith('Reversión de pago') || m.descripcion.startsWith('Reversión correlativo'))) return;

        if (m.correlativo && correlativosSumados.has(m.correlativo)) return;
        if (m.correlativo) correlativosSumados.add(m.correlativo);

        // Fecha a mostrar (preferencia: fecha_ts -> createdAt -> fecha)
        let iso = "";
        if (m.fecha_ts) iso = isoFromAny(m.fecha_ts);
        else if (m.createdAt) iso = isoFromAny(m.createdAt);
        else iso = isoFromAny(m.fecha);

        const tipo  = normTipo(m.tipo);
        const monto = Number(m.monto || 0);
        movimientosDelDia.push({
          id: docMov.id,
          coll,
          tipo,
          descripcion: m.descripcion || "",
          monto,
          usuario: m.usuario || "",
          fecha: iso,
          cierre: false,
          origen: "movimiento"
        });

        if (tipo === "Ingreso") totalIngresos += monto;
        if (tipo === "Egreso")  totalEgresos  += monto;
      }

      // 1) Movimientos de caja – ambas colecciones y tres campos de fecha
      for (const coll of ["movimientosCaja", "movimientos_caja"]) {
        // a) por 'fecha_ts' (Timestamp)
        const qTs = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("fecha_ts", ">=", startTs),
          where("fecha_ts", "<=", endTs)
        );
        const snapTs = await getDocs(qTs);
        snapTs.forEach(docMov => pushMovimiento(docMov, coll));

        // b) por 'createdAt' (Timestamp)
        const qCreated = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("createdAt", ">=", startTs),
          where("createdAt", "<=", endTs)
        );
        const snapCreated = await getDocs(qCreated);
        snapCreated.forEach(docMov => pushMovimiento(docMov, coll));

        // c) por 'fecha' (string ISO, si alguna vez la guardas así)
        const qStr = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("fecha", ">=", fechaInicioUTC),
          where("fecha", "<=", fechaFinUTC)
        );
        const snapStr = await getDocs(qStr);
        snapStr.forEach(docMov => pushMovimiento(docMov, coll));
      }

      // 2) Pagos (ingresos)
      const pagosSnap = await getDocs(
        query(
          collection(db, "pagos"),
          where("sucursal", "==", agenciaActual),
          where("fechaPago", ">=", fechaInicioUTC),
          where("fechaPago", "<=", fechaFinUTC)
        )
      );
      const pagosRetroSnap = await getDocs(
        query(
          collection(db, "pagos"),
          where("sucursal", "==", agenciaActual),
          where("retroactivo", "==", true),
          where("fechaRegistro", ">=", fechaInicioUTC),
          where("fechaRegistro", "<=", fechaFinUTC)
        )
      );

      const pagosUnidos = [];
      const pagosIds = new Set();

      for (const docPago of pagosSnap.docs) {
        const d = docPago.data();
        if (!("anulado" in d) || !d.anulado) {
          const cierrePago = d.hasOwnProperty("cierre") ? d.cierre : false;
          if (cierrePago === false || cierrePago === null) {
            pagosUnidos.push({ ...d, id: docPago.id });
            pagosIds.add(docPago.id);
          }
        }
      }
      for (const docPago of pagosRetroSnap.docs) {
        if (pagosIds.has(docPago.id)) continue;
        const d = docPago.data();
        if (!("anulado" in d) || !d.anulado) {
          const cierrePago = d.hasOwnProperty("cierre") ? d.cierre : false;
          if (cierrePago === false || cierrePago === null) {
            pagosUnidos.push({ ...d, id: docPago.id });
            pagosIds.add(docPago.id);
          }
        }
      }

      for (const d of pagosUnidos) {
        const monto = Number(d.montoPagado) || 0;
        const fechaIso = d.fechaRegistro || d.fechaPago || "";
        movimientosDelDia.push({
          id: d.id,
          coll: "pagos",
          tipo: "Ingreso",
          descripcion: d.retroactivo ? "Pago retroactivo" : "Pago de cliente",
          monto,
          usuario: d.cajeroNombre || "",
          fecha: fechaIso,
          cierre: d.cierre || false,
          origen: "pago"
        });
        totalIngresos += monto;
      }

      // Orden cronológico
      movimientosDelDia.sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

      // Render tabla
      if (movimientosDelDia.length === 0) {
        document.getElementById("tabla-movs").innerHTML =
          `<tr><td colspan="6" style="text-align:center;color:#555">No hay movimientos para este día.</td></tr>`;
      } else {
        document.getElementById("tabla-movs").innerHTML =
          movimientosDelDia.map(m =>
            `<tr>
              <td>${m.tipo || ""}</td>
              <td>${m.descripcion || ""}</td>
              <td class="num">${formatMoney(m.monto || 0)}</td>
              <td>${m.usuario || ""}</td>
              <td>${formatFechaHoraCompact(m.fecha)}</td>
            </tr>`
          ).join('');
      }

      // Saldo proyectado
      const saldoFinalProyectado = saldoInicial + totalIngresos - totalEgresos;

      // Si ya existe un cierre para esa fecha, mostrar ese saldo; de lo contrario, el proyectado
      const saldoCierreExistente = await obtenerSaldoCierreSiExiste(agenciaActual, fecha);
      const saldoParaMostrar = (saldoCierreExistente !== null && !isNaN(Number(saldoCierreExistente)))
        ? Number(saldoCierreExistente)
        : saldoFinalProyectado;

      document.getElementById("totales").innerHTML =
        `<div class="totals">
          <div class="pill"><span>Saldo Inicial</span><b>${formatMoney(saldoInicial)}</b></div>
          <div class="pill green"><span>Total Ingresos</span><b>${formatMoney(totalIngresos)}</b></div>
          <div class="pill gold"><span>Total Egresos</span><b>${formatMoney(totalEgresos)}</b></div>
          <div class="pill focus"><span>Saldo de Caja (al cierre)</span><b>${formatMoney(saldoParaMostrar)}</b></div>
        </div>`;
    }

    // ===== PIN hashing =====
    async function sha256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ===== Cerrar caja =====
    async function cerrarCajaDelDia() {
      if (!fechaSeleccionada) return alert("Selecciona un día válido");
      if (movimientosDelDia.length === 0) return alert("No hay movimientos para este día.");

      const pin = prompt("Por seguridad, ingresa tu PIN de gerente:");
      if (!pin) return;

      const pinHash = await sha256(pin);
      const gerenteSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
      const gerenteData = gerenteSnap.docs[0]?.data();
      if (!gerenteData || gerenteData.internalPassword !== pinHash) {
        alert("PIN incorrecto");
        return;
      }

      let totalIngresos = 0, totalEgresos = 0;
      movimientosDelDia.forEach(m => {
        if (m.tipo === "Ingreso") totalIngresos += Number(m.monto || 0);
        if (m.tipo === "Egreso")  totalEgresos  += Number(m.monto || 0);
      });

      const saldoFinal = saldoInicial + totalIngresos - totalEgresos;

      await addDoc(collection(db, "cierres_caja"), {
        agencia: agenciaActual,
        fecha: fechaSeleccionada,  // YYYY-MM-DD operativo
        total_ingresos: totalIngresos,
        total_egresos: totalEgresos,
        saldo_inicial: saldoInicial,
        saldo_caja: saldoFinal,
        saldo_siguiente: saldoFinal,
        movimientos: movimientosDelDia.map(m => ({
          tipo: m.tipo,
          descripcion: m.descripcion,
          monto: m.monto,
          usuario: m.usuario,
          fecha: m.fecha,
          id_movimiento: m.id,
          origen: m.origen || ""
        })),
        fecha_cierre: (new Date()).toISOString(),
        gerente_id: gerenteId,
        gerente_nombre: gerenteNombre
      });

      // Marcar cierre:true en fuentes
      for (const m of movimientosDelDia) {
        try {
          if (m.origen === "movimiento") {
            await updateDoc(doc(db, m.coll, m.id), { cierre: true });
          } else if (m.origen === "pago") {
            await updateDoc(doc(db, "pagos", m.id), { cierre: true });
          }
        } catch (e) {
          console.warn("No se pudo marcar cierre en", m.origen, m.id, e);
        }
      }

      alert("¡Cierre realizado y registrado exitosamente!");
      await cargarGerenteYFechas();
    }

    // ===== Init =====
    window.addEventListener("DOMContentLoaded", cargarGerenteYFechas);
    window.cerrarCajaDelDia = cerrarCajaDelDia;
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* ===== Línea gráfica clara (glass) ===== */
    :root{
      --bg:#f7f9fc; --bg-2:#eef2f7; --text:#0d1b2a; --muted:#5b6776; --white:#ffffff;
      --brand-blue:#243b86; --brand-cel:#67C8F1; --brand-green:#13b66b; --brand-gold:#F8AF40;
      --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(10,20,40,.08); --glass-shadow:0 20px 60px rgba(12,20,40,.12);
      --radius:18px; --radius-lg:22px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0c0f14; --bg-2:#0f141b; --text:#dfe6ef; --muted:#9aa6b6;
        --glass-bg:rgba(255,255,255,.12); --glass-brd:rgba(255,255,255,.18); --glass-shadow:0 24px 60px rgba(0,0,0,.45);
        --white:#11161d;
      }
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(36,59,134,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(248,175,64,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }
    .pattern{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(1px 1px at 25px 25px, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(1px 1px at 75px 75px, rgba(255,255,255,.06), transparent 40%);
      background-size:100px 100px; mix-blend-mode:soft-light; opacity:.5;
    }

    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
    }
    .topbar{
      max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:.8rem 16px;
    }
    .logo-plate{
      display:inline-flex; align-items:center; gap:10px; background:var(--glass-bg);
      border:1px solid var(--glass-brd); padding:8px 14px; border-radius:16px;
      box-shadow:var(--glass-shadow); position:relative; overflow:hidden; isolation:isolate;
    }
    .logo-plate img{ height:28px; width:auto; display:block }
    .brand-name{ font-weight:800; letter-spacing:.2px; color:var(--brand-blue); }

    /* ===== Container ===== */
    .container{
      position:relative; z-index:1;
      max-width:min(96vw, 1100px);
      margin: 2.2rem auto; padding: 1.4rem 1.2rem 1.8rem;
      background:var(--glass-bg); border:1px solid var(--glass-brd);
      border-radius:var(--radius-lg); box-shadow:var(--glass-shadow);
    }
    h1{
      margin:.2rem 0 1rem; text-align:center;
      font-size:clamp(1.2rem, .8vw + 1.2rem, 1.9rem);
      color:var(--brand-blue); font-weight:800;
    }

    .subtop{
      display:flex; gap:10px; align-items:center; justify-content:center; color:var(--muted); font-weight:700; margin-bottom:1rem;
    }
    .badge{
      display:inline-flex; align-items:center; gap:8px; padding:.35rem .7rem; border-radius:999px;
      background: linear-gradient(180deg, rgba(36,59,134,.08), rgba(103,200,241,.08));
      border:1px solid rgba(36,59,134,.15); color:var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
      font-weight:800;
    }

    .controls{
      display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; margin-bottom:1rem;
    }
    label{ font-weight:800; color:var(--brand-blue); }
    select{
      min-width:240px; font-size:1rem; padding:.7rem 1rem; border-radius:12px;
      border:1px solid rgba(36,59,134,.15);
      background: linear-gradient(180deg, #fff, #f3f7fb);
      color:var(--text); outline:none; box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }

    /* ===== Table ===== */
    .scroll-table-wrap{
      width:100%; overflow:auto; border-radius:14px;
      background:var(--white); border:1px solid var(--glass-brd); box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    table{
      width:100%; border-collapse:collapse; border-spacing:0; background:transparent;
      font-size:.98rem;
    }
    thead th{
      text-align:left; padding:.85rem .9rem; font-size:.86rem; letter-spacing:.3px;
      color:#5361c6; background:linear-gradient(180deg, #f6f8ff, #edf1ff);
      position:sticky; top:0; z-index:2; border-bottom:1px solid #dfe6ff;
    }
    tbody td{
      padding:.75rem .9rem; border-top:1px solid #edf1f6; color:var(--text); white-space:nowrap;
    }
    tbody tr:hover{ background: #f7fbff; }
    .num{ text-align:right; font-variant-numeric: tabular-nums; }

    /* ===== Totales ===== */
    .totals{
      display:grid; grid-template-columns: repeat(2, minmax(220px,1fr)); gap:10px;
      margin: 14px 0 8px;
    }
    @media (max-width:720px){ .totals{ grid-template-columns:1fr; } }
    .pill{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:var(--white); border:1px solid var(--glass-brd); border-radius:12px;
      padding:.8rem 1rem; box-shadow:var(--glass-shadow);
    }
    .pill span{ color:var(--muted); font-weight:700; }
    .pill b{ color:#0d1b2a; }
    .pill.green b{ color:#0c8a58; }
    .pill.gold b{ color:#c27b00; }
    .pill.focus{ background:linear-gradient(180deg,#fff8e8,#fff); border-color:#ffe3a6; }
    .pill.focus b{ color:#9a6d00; }

    /* ===== Botón ===== */
    .btn-main{
      width:100%; margin-top:12px; padding:1rem 0; border:none; border-radius:12px;
      background: linear-gradient(90deg, #67C8F1, #243b86);
      color:#fff; font-weight:900; font-size:1.05rem; cursor:pointer;
      box-shadow:0 14px 28px rgba(36,59,134,.25);
      transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .btn-main:hover{ transform:translateY(-1px); box-shadow:0 18px 36px rgba(36,59,134,.3); }

  </style>
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>

  <header>
    <div class="topbar">
      <div class="logo-plate">
        <img src="assets/logo_mi_bw.png" alt="Logo Multi Inversiones" width="140" height="40" />
        <strong class="brand-name">MULTI INVERSIONES</strong>
      </div>
      <div style="margin-left:auto; font-weight:700; color:var(--muted);">
        Cierre de Caja (Arqueo Diario)
      </div>
    </div>
  </header>

  <div class="container">
    <h1><i class="fa-solid fa-lock"></i> Cierre de Caja – Panel Gerente</h1>

    <div class="subtop">
      <span class="badge"><i class="fa-solid fa-user-tie"></i> Gerente: <span id="gerente-nombre" style="margin-left:6px">Cargando...</span></span>
    </div>

    <div class="controls">
      <label for="select-fecha">Selecciona un día pendiente de cierre:</label>
      <select id="select-fecha"></select>
    </div>

    <div class="scroll-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Descripción</th>
            <th class="num">Monto</th>
            <th>Usuario</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tabla-movs"></tbody>
      </table>
    </div>

    <div id="totales"></div>

    <button class="btn-main" onclick="cerrarCajaDelDia()">
      <i class="fa-solid fa-check-circle"></i> Cerrar Caja del Día Seleccionado
    </button>
  </div>
</body>
</html>
