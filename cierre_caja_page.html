<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cierre de Caja – Panel Gerente</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let agenciaActual = "";
    let gerenteNombre = "";
    let gerenteId = "";
    let diasPendientes = [];
    let movimientosDelDia = [];
    let fechaSeleccionada = null;
    let saldoInicial = 0;

    function toDateString(date) {
      return date.toISOString().slice(0,10);
    }
    function formatMoney(n) {
      return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    // Rango UTC local de El Salvador (sin desfase)
    function getDiaSVRange(fechaLocal) {
      // El Salvador UTC-6
      const dateStart = new Date(`${fechaLocal}T00:00:00-06:00`);
      const dateEnd = new Date(`${fechaLocal}T23:59:59.999-06:00`);
      return [
        dateStart.toISOString(),
        dateEnd.toISOString()
      ];
    }

    async function obtenerSaldoInicial(agencia) {
      const cierresRef = collection(db, "cierres_caja");
      const q = query(
        cierresRef,
        where("agencia", "==", agencia),
        orderBy("fecha_cierre", "desc"),
        limit(1)
      );
      const snap = await getDocs(q);
      if (!snap.empty) {
        return Number(snap.docs[0].data().saldo_caja || 0);
      }
      return 0;
    }

    async function cargarGerenteYFechas() {
      document.getElementById("select-fecha").innerHTML = `<option>Cargando...</option>`;
      document.getElementById("tabla-movs").innerHTML = "";
      document.getElementById("totales").innerHTML = "";

      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        gerenteId = user.uid;
        // Cargar info del gerente
        const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
        if (snap.empty) {
          document.getElementById("select-fecha").innerHTML = `<option>No se encontró gerente</option>`;
          return;
        }
        const gerenteData = snap.docs[0].data();
        agenciaActual = gerenteData.department;
        gerenteNombre = `${gerenteData.nombre || ""} ${gerenteData.apellido || ""}`.trim();
        document.getElementById("gerente-nombre").innerText = gerenteNombre || user.email;

        // Buscar todas las fechas de movimientos SIN cierre en las 2 colecciones
        let movDatesSet = new Set();
        for (const coll of ["movimientosCaja", "movimientos_caja"]) {
          const q = query(
            collection(db, coll),
            where("agencia", "==", agenciaActual),
            where("cierre", "==", false)
          );
          const snap = await getDocs(q);
          for (const docMov of snap.docs) {
            const movData = docMov.data();
            if (!movData.fecha) continue;
            movDatesSet.add(movData.fecha.substring(0,10));
          }
        }
        // Si NO hay campo cierre en muchos, buscamos todos los movimientos y los que no tengan campo "cierre"
        if (movDatesSet.size === 0) {
          for (const coll of ["movimientosCaja", "movimientos_caja"]) {
            const q = query(
              collection(db, coll),
              where("agencia", "==", agenciaActual)
            );
            const snap = await getDocs(q);
            for (const docMov of snap.docs) {
              const movData = docMov.data();
              if (!movData.fecha) continue;
              if (movData.cierre !== true) {
                movDatesSet.add(movData.fecha.substring(0,10));
              }
            }
          }
        }
        // Filtrar las que ya están cerradas
        const cierresQ = query(collection(db, "cierres_caja"), where("agencia", "==", agenciaActual));
        const cierresSnap = await getDocs(cierresQ);
        let fechasCerradas = new Set();
        for (const docC of cierresSnap.docs) {
          let f = docC.data().fecha;
          if (f && f.length >= 10) fechasCerradas.add(f.substring(0,10));
        }

        diasPendientes = Array.from(movDatesSet).filter(f => !fechasCerradas.has(f));
        diasPendientes.sort();

        // Si no hay pendientes, permitir hoy para cierre
        if (diasPendientes.length === 0) {
          const hoy = toDateString(new Date());
          diasPendientes = [hoy];
        }

        document.getElementById("select-fecha").innerHTML =
          diasPendientes.map(f => `<option value="${f}">${f.split('-').reverse().join('/')}</option>`).join('');

        fechaSeleccionada = diasPendientes[0];
        await cargarMovimientosYTotales(fechaSeleccionada);
        document.getElementById("select-fecha").onchange = async e => {
          fechaSeleccionada = e.target.value;
          await cargarMovimientosYTotales(fechaSeleccionada);
        };
      });
    }

    // Incluye PAGOS como ingresos (siempre muestra pagos sin campo cierre o cierre:false)
    async function cargarMovimientosYTotales(fecha) {
      document.getElementById("tabla-movs").innerHTML = `<tr><td colspan="6" style="text-align:center">Cargando movimientos...</td></tr>`;
      movimientosDelDia = [];
      let totalIngresos = 0;
      let totalEgresos = 0;

      saldoInicial = await obtenerSaldoInicial(agenciaActual);

      // ==== RANGO UTC CORRECTO El Salvador ====
      const [fechaInicioUTC, fechaFinUTC] = getDiaSVRange(fecha);

      // 1. Movimientos manuales
      for (const coll of ["movimientosCaja", "movimientos_caja"]) {
        const q = query(
          collection(db, coll),
          where("agencia", "==", agenciaActual),
          where("fecha", ">=", fechaInicioUTC),
          where("fecha", "<=", fechaFinUTC)
        );
        const snap = await getDocs(q);
        for (const docMov of snap.docs) {
          const movData = docMov.data();
          if (movData.cierre === true) continue;
          movimientosDelDia.push({ id: docMov.id, coll, ...movData, origen: "movimiento" });
          if (movData.tipo === "Ingreso") totalIngresos += Number(movData.monto || 0);
          if (movData.tipo === "Egreso") totalEgresos += Number(movData.monto || 0);
        }
      }
      // 2. PAGOS de clientes (NO anulados, NO cierre:true)
      const pagosSnap = await getDocs(
        query(
          collection(db, "pagos"),
          where("sucursal", "==", agenciaActual),
          where("fechaPago", ">=", fechaInicioUTC),
          where("fechaPago", "<=", fechaFinUTC)
        )
      );
      for (const docPago of pagosSnap.docs) {
        const data = docPago.data();
        if (!("anulado" in data) || !data.anulado) {
          // Considera cierre:false si no existe el campo
          const cierrePago = data.hasOwnProperty("cierre") ? data.cierre : false;
          if (cierrePago === false || cierrePago === null) {
            movimientosDelDia.push({
              id: docPago.id,
              coll: "pagos",
              tipo: "Ingreso",
              descripcion: "Pago de cliente",
              monto: Number(data.montoPagado) || 0,
              usuario: data.cajeroNombre || "",
              fecha: data.fechaPago,
              cierre: cierrePago,
              origen: "pago"
            });
            totalIngresos += Number(data.montoPagado) || 0;
          }
        }
      }
      // Ordena por fecha
      movimientosDelDia.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

      // Render tabla
      if (movimientosDelDia.length === 0) {
        document.getElementById("tabla-movs").innerHTML =
          `<tr><td colspan="6" style="text-align:center;color:#fff6">No hay movimientos para este día.</td></tr>`;
      } else {
        document.getElementById("tabla-movs").innerHTML =
          movimientosDelDia.map(m =>
            `<tr>
              <td>${m.tipo || ""}</td>
              <td>${m.descripcion || ""}</td>
              <td>${formatMoney(m.monto || 0)}</td>
              <td>${m.usuario || ""}</td>
              <td>${(m.fecha || "").replace('T', ' ').replace('.000Z','').slice(0,16)}</td>
            </tr>`
          ).join('');
      }

      const saldoFinal = saldoInicial + totalIngresos - totalEgresos;

      document.getElementById("totales").innerHTML =
        `<div style="margin-top:18px;text-align:right">
          <b style="color:#55e2c1">Saldo Inicial: ${formatMoney(saldoInicial)}</b><br>
          <b style="color:#2EF37A">Total Ingresos: ${formatMoney(totalIngresos)}</b><br>
          <b style="color:#F8AF40">Total Egresos: ${formatMoney(totalEgresos)}</b><br>
          <b style="color:#FFD600">Saldo de Caja (al cierre): ${formatMoney(saldoFinal)}</b>
        </div>`;
    }

    async function sha256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function cerrarCajaDelDia() {
      if (!fechaSeleccionada) return alert("Selecciona un día válido");
      if (movimientosDelDia.length === 0) return alert("No hay movimientos para este día.");

      const pin = prompt("Por seguridad, ingresa tu PIN de gerente:");
      if (!pin) return;

      const pinHash = await sha256(pin);
      const gerenteSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
      const gerenteData = gerenteSnap.docs[0]?.data();
      if (!gerenteData || gerenteData.internalPassword !== pinHash) {
        alert("PIN incorrecto");
        return;
      }

      let totalIngresos = 0, totalEgresos = 0;
      movimientosDelDia.forEach(m => {
        if (m.tipo === "Ingreso") totalIngresos += Number(m.monto || 0);
        if (m.tipo === "Egreso") totalEgresos += Number(m.monto || 0);
      });

      const saldoFinal = saldoInicial + totalIngresos - totalEgresos;

      await addDoc(collection(db, "cierres_caja"), {
        agencia: agenciaActual,
        fecha: fechaSeleccionada,
        total_ingresos: totalIngresos,
        total_egresos: totalEgresos,
        saldo_inicial: saldoInicial,
        saldo_caja: saldoFinal,
        movimientos: movimientosDelDia.map(m => ({
          tipo: m.tipo,
          descripcion: m.descripcion,
          monto: m.monto,
          usuario: m.usuario,
          fecha: m.fecha,
          id_movimiento: m.id,
          origen: m.origen || ""
        })),
        fecha_cierre: (new Date()).toISOString(),
        gerente_id: gerenteId,
        gerente_nombre: gerenteNombre
      });

      // Actualiza movimientos manuales y pagos (¡Ahora ambos!)
      for (const m of movimientosDelDia) {
        if (m.origen === "movimiento") {
          try {
            const docRefMov = doc(db, m.coll, m.id);
            await updateDoc(docRefMov, { cierre: true });
          } catch (e) {}
        } else if (m.origen === "pago") {
          try {
            const docRefPago = doc(db, "pagos", m.id);
            await updateDoc(docRefPago, { cierre: true });
          } catch (e) {}
        }
      }

      alert("¡Cierre realizado y registrado exitosamente!");
      await cargarGerenteYFechas();
    }

    window.addEventListener("DOMContentLoaded", cargarGerenteYFechas);
    window.cerrarCajaDelDia = cerrarCajaDelDia;
  </script>
  <style>
    body {
      margin: 0; font-family: Arial,sans-serif; background: #11102a;
      color: #fff; min-height: 100vh;
    }
    header {
      width:100%; background:#221a3a; padding:1.2rem 0 1.1rem 0; text-align:center;
      font-size:1.44rem; font-weight:700; letter-spacing:.5px; color:#fff;
      margin-bottom: 1.2rem;
    }
    .main-card {
      margin: 54px auto 0 auto; background: #1a1a26; border-radius: 19px;
      max-width: 540px; min-width: 0;
      padding: 2.2rem 2.2rem 2.8rem 2.2rem; box-shadow: 0 8px 38px #0a013377;
      display:flex; flex-direction:column;
    }
    label { margin-bottom: 5px; font-weight: 500;}
    select, option, input {
      font-size:1.08rem; background:#191834; color:#fff; border-radius:6px;
      border:1px solid #4e3b71; padding:.59rem .7rem; margin-bottom:10px;
    }
    button {
      width:100%; background:#a787f4; color:#fff; font-weight:700;
      border:none; border-radius:8px; padding:1rem 0; margin-top:20px;
      font-size:1.1rem; cursor:pointer; transition:background .15s;
    }
    button:hover { background:#5e38a3; }
    .scroll-table-wrap {
      width:100%; overflow-x:auto; margin-top: 1.3rem; border-radius:10px; 
      background: #181828; box-shadow: 0 3px 13px #0002;
    }
    .table-movs {
      width:100%; min-width: 580px; border-collapse:collapse; font-size:.99rem;
      background:#181828;
    }
    .table-movs th, .table-movs td { 
      padding:.62em .80em; 
      white-space: nowrap;
      text-align: left;
    }
    .table-movs th {
      background:#2c234a; color:#fff; font-weight:700; border:none;
      text-align:left;
      font-size: 1.01rem;
      position: sticky; top: 0; z-index: 2;
    }
    .table-movs td { border-bottom: 1px solid #212146; color:#fff; }
    .table-movs tr:last-child td { border-bottom: none; }
    #totales { margin-top: 10px; text-align: right;}
    @media (max-width: 630px) {
      .main-card { padding: 1rem .3rem 2rem .3rem; max-width: 99vw; }
      .table-movs { font-size: .95rem; }
      .scroll-table-wrap { min-width: 0; }
    }
  </style>
</head>
<body>
  <header>Cierre de Caja – Panel Gerente</header>
  <div class="main-card">
    <div><b>Gerente:</b> <span id="gerente-nombre">Cargando...</span></div>
    <div style="margin-top:20px;margin-bottom:8px;">
      <label>Selecciona un día pendiente de cierre:</label><br>
      <select id="select-fecha"></select>
    </div>
    <div>
      <b style="color:#fff">Movimientos del día</b>
      <div class="scroll-table-wrap">
        <table class="table-movs">
          <thead>
            <tr>
              <th>Tipo</th><th>Descripción</th><th>Monto</th><th>Usuario</th><th>Fecha</th>
            </tr>
          </thead>
          <tbody id="tabla-movs"></tbody>
        </table>
      </div>
      <div id="totales"></div>
      <button onclick="cerrarCajaDelDia()">Cerrar Caja del Día Seleccionado</button>
    </div>
  </div>
</body>
</html>
