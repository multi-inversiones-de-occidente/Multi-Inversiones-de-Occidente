<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cierre de Caja – Gerente</title>
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Helper para formatear dinero
    function money(n) { return '$' + (n ?? 0).toLocaleString('en-US', { minimumFractionDigits: 2 }); }
    function pad(n) { return n.toString().padStart(2, "0"); }
    function fechaISO(d) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    let gerenteId, gerenteNombre, gerenteDepto;

    async function obtenerInfoGerente() {
      // Busca el user actual
      const user = auth.currentUser;
      if (!user) return location.href = "login.html";
      gerenteId = user.uid;
      // Obtener departamento y nombre
      const docu = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
      if (!docu.empty) {
        const d = docu.docs[0].data();
        gerenteNombre = `${d.nombre ?? ''} ${d.apellido ?? ''}`.trim();
        gerenteDepto = d.department;
      }
      document.getElementById('nombreGerente').textContent = gerenteNombre ?? user.email;
      cargarDiasPendientes();
    }

    // Busca fechas de movimientos SIN cierre
    async function cargarDiasPendientes() {
      document.getElementById('loading').style.display = '';
      document.getElementById('diasPendientes').innerHTML = '';
      document.getElementById('tablaMovs').innerHTML = '';
      document.getElementById('totales').style.display = 'none';
      document.getElementById('cerrarBtn').style.display = 'none';

      let fechasSinCierre = new Set();
      // Ambas colecciones, campo agencia Y sucursal
      for (const col of ["movimientos_caja", "movimientosCaja"]) {
        for (const campo of ["agencia", "sucursal"]) {
          const q = query(
            collection(db, col),
            where(campo, "==", gerenteDepto),
            where("cierre", "!=", true)
          );
          const snap = await getDocs(q);
          snap.forEach(docu => {
            const fecha = (docu.data().fecha || '').substring(0,10);
            if (fecha.length === 10) fechasSinCierre.add(fecha);
          });
        }
      }
      // Ordenar fechas ascendente
      fechasSinCierre = Array.from(fechasSinCierre).sort();

      if (!fechasSinCierre.length) {
        // Solo hoy
        const hoy = fechaISO(new Date());
        fechasSinCierre.push(hoy);
      }

      // Pinta selector
      const select = document.getElementById('diasPendientes');
      select.innerHTML = fechasSinCierre.map(f =>
        `<option value="${f}">${f.split("-").reverse().join("/")}</option>`
      ).join('');
      document.getElementById('loading').style.display = 'none';
      mostrarMovimientos(select.value);
      select.onchange = e => mostrarMovimientos(e.target.value);
    }

    // Busca y pinta movimientos de la fecha
    async function mostrarMovimientos(fechaSel) {
      document.getElementById('tablaMovs').innerHTML = '';
      document.getElementById('totales').style.display = 'none';
      document.getElementById('cerrarBtn').style.display = 'none';

      let movimientos = [];
      for (const col of ["movimientos_caja", "movimientosCaja"]) {
        for (const campo of ["agencia", "sucursal"]) {
          const q = query(
            collection(db, col),
            where(campo, "==", gerenteDepto),
            where("fecha", ">=", fechaSel + "T00:00:00"),
            where("fecha", "<=", fechaSel + "T23:59:59"),
            where("cierre", "!=", true)
          );
          const snap = await getDocs(q);
          snap.forEach(docu => movimientos.push({ ...docu.data(), id: docu.id, ref: docu.ref, col }));
        }
      }
      // Si no hay movimientos, avisa
      if (!movimientos.length) {
        document.getElementById('tablaMovs').innerHTML =
          `<tr><td colspan="5" style="color:#fff9">No hay movimientos para este día.</td></tr>`;
        return;
      }
      // Pinta movimientos
      let ingresos = 0, egresos = 0;
      document.getElementById('tablaMovs').innerHTML = movimientos.map(m => {
        const esIng = m.tipo === "Ingreso";
        const color = esIng ? "#26c6da44" : "#f4433644";
        const monto = Number(m.monto ?? 0);
        if (esIng) ingresos += monto; else egresos += monto;
        return `
          <tr style="background:${color};color:#fff">
            <td>${m.tipo}</td>
            <td>${m.descripcion ?? ''}</td>
            <td>${money(monto)}</td>
            <td>${m.usuario ?? ''}</td>
            <td>${m.fecha ? m.fecha.replace("T", " ") : ''}</td>
          </tr>
        `;
      }).join('');
      document.getElementById('totIn').textContent = money(ingresos);
      document.getElementById('totEg').textContent = money(egresos);
      document.getElementById('totSd').textContent = money(ingresos - egresos);
      document.getElementById('totales').style.display = '';
      document.getElementById('cerrarBtn').style.display = '';
      // Guardar en global para el cierre
      window._movsPend = movimientos;
      window._fechaPend = fechaSel;
    }

    // Cierra caja (pide PIN, crea registro y marca movimientos)
    async function cerrarCaja() {
      const pin = prompt("Por seguridad, ingresa tu PIN interno:");
      if (!pin || pin.length < 4) return alert("PIN inválido");
      // Valida el PIN contra el hash guardado
      // Busca hash del gerente
      const userSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", gerenteId)));
      const gerente = userSnap.empty ? null : userSnap.docs[0].data();
      if (!gerente || !gerente.internalPassword) return alert("No se encontró PIN.");
      const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin));
      const pinHashHex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
      if (pinHashHex !== gerente.internalPassword) return alert("PIN incorrecto");

      document.getElementById('cerrarBtn').disabled = true;
      // 1. Crear registro de cierre
      let ingresos = 0, egresos = 0;
      window._movsPend.forEach(m => {
        const monto = Number(m.monto ?? 0);
        if (m.tipo === "Ingreso") ingresos += monto; else egresos += monto;
      });
      await addDoc(collection(db, "cierres_caja"), {
        agencia: gerenteDepto,
        fecha: window._fechaPend,
        total_ingresos: ingresos,
        total_egresos: egresos,
        saldo_caja: ingresos - egresos,
        movimientos: window._movsPend.map(m => {
          let { ref, col, id, ...rest } = m; return rest;
        }),
        fecha_cierre: new Date().toISOString(),
        gerente_id: gerenteId,
      });
      // 2. Actualizar movimientos
      for (const m of window._movsPend) {
        await updateDoc(m.ref, { cierre: true });
      }
      alert("¡Cierre realizado correctamente!");
      cargarDiasPendientes();
    }

    // INICIO
    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, user => {
        if (!user) return location.href = "login.html";
        obtenerInfoGerente();
      });
      document.getElementById('cerrarBtn').onclick = cerrarCaja;
    });
  </script>
  <style>
    body { background:#101212; color:#fff; font-family:sans-serif; margin:0; }
    header { background:#211c3c; text-align:center; padding:1rem; font-size:1.25rem; font-weight:bold; letter-spacing:1px;}
    .container { max-width:700px; margin:1.5rem auto; background:#181a23; border-radius:16px; box-shadow:0 5px 30px #0008; padding:2rem 2vw;}
    h2 { margin:0 0 .7em 0;}
    select { font-size:1.02rem; background:#111; color:#fff; border-radius:6px; padding:.4em .8em; border:1px solid #222;}
    table { width:100%; margin:1.1rem 0; border-collapse:collapse;}
    th,td { padding:.48em .4em; border-bottom:1px solid #222; text-align:left;}
    th { background:#231c4d; color:#bdf;}
    .tot { font-weight:bold; }
    #totales { margin:.7em 0 1em 0; }
    #cerrarBtn { font-size:1.15rem; background:#5236d3; color:#fff; border:none; border-radius:10px; padding:.7em 2.2em; cursor:pointer; box-shadow:0 3px 14px #3114;}
    #cerrarBtn:disabled { opacity:.7; pointer-events:none; }
    @media (max-width:600px) {.container {padding:1.1rem 1vw;}}
  </style>
</head>
<body>
  <header>Cierre de Caja – Panel Gerente</header>
  <div class="container">
    <div><b>Gerente:</b> <span id="nombreGerente"></span></div>
    <div style="margin:1em 0 .7em 0">
      <label>Selecciona un día pendiente:</label><br>
      <span id="loading" style="color:#67C8F1">Buscando días pendientes…</span>
      <select id="diasPendientes" style="min-width:160px; margin-top:.5em; margin-bottom:.4em"></select>
    </div>
    <h2>Movimientos del día</h2>
    <table>
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Usuario</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tablaMovs"></tbody>
    </table>
    <div id="totales" style="display:none;">
      <div>Ingresos: <span id="totIn"></span></div>
      <div>Egresos: <span id="totEg"></span></div>
      <div class="tot">Saldo de Caja: <span id="totSd"></span></div>
    </div>
    <button id="cerrarBtn" style="display:none;">Cerrar Caja</button>
  </div>
</body>
</html>
