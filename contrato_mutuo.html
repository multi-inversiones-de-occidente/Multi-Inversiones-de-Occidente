<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contrato Mutuo</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #222; padding: 2rem;}
    .contrato { max-width: 850px; margin: 0 auto; background: #fff; padding: 34px 34px; border-radius: 13px; box-shadow: 0 4px 24px #0002;}
    .firma { margin-top: 48px; margin-bottom: 24px;}
    .notario { margin-top: 40px; }
    .bold { font-weight: 600;}
    .center { text-align: center;}
    hr { margin: 26px 0; }
  </style>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // FUNCIÓN: Número a Letras (hasta 99999)
    function numeroALetras(num) {
      const unidades = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE"];
      const decenas = ["", "DIEZ", "VEINTE", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
      const centenas = ["", "CIEN", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];
      num = parseInt(num);
      if (isNaN(num) || num < 0) return num;
      if (num === 0) return "CERO";
      if (num < 10) return unidades[num];
      if (num < 100) return decenas[Math.floor(num/10)] + (num%10 > 0 ? " Y " + unidades[num%10] : "");
      if (num < 1000) return centenas[Math.floor(num/100)] + (num%100 > 0 ? " " + numeroALetras(num%100) : "");
      if (num < 10000) {
        if (num === 1000) return "MIL";
        return unidades[Math.floor(num/1000)] + " MIL" + (num%1000 > 0 ? " " + numeroALetras(num%1000) : "");
      }
      if (num < 100000) {
        return decenas[Math.floor(num/10000)] + " MIL" + (num%10000 > 0 ? " " + numeroALetras(num%10000) : "");
      }
      return num.toString(); // Si es más grande, lo dejas numérico
    }

    // FUNCIÓN: Calcular Edad
    function calcularEdad(dateOfBirthStr) {
      if (!dateOfBirthStr) return '';
      const nacimiento = new Date(dateOfBirthStr);
      const hoy = new Date();
      let edad = hoy.getFullYear() - nacimiento.getFullYear();
      const m = hoy.getMonth() - nacimiento.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
        edad--;
      }
      return edad;
    }

    // EXTRAE fecha en formato día/mes/año
    function parseFecha(fechaStr) {
      if (!fechaStr) return { dia: '', mes: '', anio: '' };
      const date = new Date(fechaStr);
      const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      return {
        dia: date.getDate().toString().padStart(2, '0'),
        mes: meses[date.getMonth()],
        anio: date.getFullYear()
      };
    }

    // Obtén parámetros
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadContratoMutuo() {
      const asignacionID = getParam("id");
      if (!asignacionID) {
        document.getElementById('contrato-mutuo').innerHTML = `<div class="error">ID de asignación no especificado en la URL.</div>`;
        return;
      }
      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        try {
          // 1. Obtener asignacion_de_cuota
          const asignRef = doc(db, "asignacion_de_cuota", asignacionID);
          const asignSnap = await getDoc(asignRef);
          if (!asignSnap.exists()) throw new Error("Asignación no encontrada.");
          const asignData = asignSnap.data();

          // 2. Obtener datos del cliente en Archivo Solicitudes
          const solicitudID = asignData.solicitudID;
          const solRef = doc(db, "Archivo Solicitudes", solicitudID);
          const solSnap = await getDoc(solRef);
          if (!solSnap.exists()) throw new Error("Solicitud original no encontrada.");
          const solData = solSnap.data();

          // 3. Obtener datos del usuario en la colección user para edad
          const clienteID = asignData.clienteID;
          const userRef = doc(db, "user", clienteID);
          const userSnap = await getDoc(userRef);
          const userData = userSnap.exists() ? userSnap.data() : null;

          // 4. Extraer datos de amortizacion
          const amortizacion = Array.isArray(asignData.amortizacion) ? asignData.amortizacion : [];
          const cuotaDolares = asignData.cuota || (amortizacion[0]?.cuota || '');
          const cantidadCuotas = asignData.numeroCuotas || amortizacion.length || '';
          const frecuenciaPago = asignData.frecuenciaPago || '';
          const monto = asignData.montoAprobado || '';
          const montoLetras = numeroALetras(monto);
          const tasaAnual = parseFloat(asignData.tasaAnual || 0);
          const interesMensual = tasaAnual ? Math.round(tasaAnual / 12) : '';

          // 5. Fechas
          // Fecha primera cuota
          const fechaPrimeraCuotaObj = amortizacion.length > 0 ? parseFecha(amortizacion[0].fecha) : {dia: '', mes: '', anio: ''};
          // Fecha vencimiento (última cuota)
          const fechaUltimaCuotaObj = amortizacion.length > 0 ? parseFecha(amortizacion[amortizacion.length-1].fecha) : {dia: '', mes: '', anio: ''};
          // Día de pago de la primera cuota
          const diaPago = fechaPrimeraCuotaObj.dia;

          // Fecha/hora contrato: Usamos fechaAsignacion
          let fechaContrato = asignData.fechaAsignacion?.toDate?.() || new Date();
          let fechaContratoObj = parseFecha(fechaContrato);
          let horaContrato = fechaContrato.getHours().toString().padStart(2,'0');
          let minutoContrato = fechaContrato.getMinutes().toString().padStart(2,'0');

          // Nombre y datos cliente
          const nombreCompleto = `${solData.nombre || ''} ${solData.apellido || ''}`;
          const profesion = solData.profesion || '';
          const estadoCivil = solData.estadoCivil || '';
          const dui = solData.numeroDui || '';
          const destino = solData.destinoCredito || '';
          const edad = calcularEdad(userData?.dateOfBirth);

          // NOTARIO (fijo)
          const nombreNotario = "JOSE ANTONIO MAZARIEGO CACERES";

          // Renderizar documento
          let html = `
            <div class="center"><b>CONTRATO DE MUTUO</b></div>
            <br>
            YO, <span class="bold">${nombreCompleto}</span>, de <span class="bold">${edad}</span> años de edad, profesión <span class="bold">${profesion}</span>, estado civil <span class="bold">${estadoCivil}</span>, con Documento Único de Identidad <span class="bold">${dui}</span>; en adelante denominado/a "El o la Deudor/a", por medio del presente documento OTORGO:
            <br><br>
            <b>I) MONTO:</b> Que en este acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL... la cantidad de <span class="bold">${monto} (${montoLetras}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</span> en concepto de préstamo, obligándome a utilizar dicho monto para: <span class="bold">${destino}</span>;
            <br><br>
            <b>II) INTERESES:</b> Con una tasa de interés del <span class="bold">${interesMensual}%</span> MENSUAL sobre saldos insolutos, en caso de incumplimiento de uno o más pagos parciales me obligo a pagar, a partir del siguiente día un recargo equivalente a ________ DÓLARES en concepto de recargo moratorio;
            <br><br>
            <b>III) PLAZO Y FORMA DE PAGO:</b> La suma recibida, más sus intereses correspondientes, la pagaré a la Sociedad Acreedora, dentro del plazo de <span class="bold">${cantidadCuotas} ${frecuenciaPago.toUpperCase()}</span>, siendo que el presente contrato vence el día <span class="bold">${fechaUltimaCuotaObj.dia} de ${fechaUltimaCuotaObj.mes} del año DOS MIL ${fechaUltimaCuotaObj.anio}</span>, por lo que pagaré en la siguiente forma: Por medio de <span class="bold">${cantidadCuotas}</span> cuotas, de <span class="bold">${cuotaDolares} DÓLARES</span> que comprenden intereses y capital, incluido el IVA; obligándome el deudor/a a pagar la primera cuota el día <span class="bold">${fechaPrimeraCuotaObj.dia} de ${fechaPrimeraCuotaObj.mes} del año DOS MIL ${fechaPrimeraCuotaObj.anio}</span> y así sucesivamente el día <span class="bold">${diaPago}</span> de cada periodo comprendido dentro del plazo, hasta su total cancelación.
            <br><br>
            <b>IV) LUGAR DE PAGO:</b> …<br><br>
            <b>V) DOMICILIO Y RENUNCIAS:</b> …<br><br>
            <b>VI) GASTOS Y HONORARIOS:</b> …<br><br>
            <b>VII)</b> Queda entendido que la mora…<br><br>
            En fe de todo lo anterior, firmo el presente contrato, en el distrito de ${asignData.agenciaAsignada || ''}, municipio de ${solData.municipio || ''}, departamento de ${solData.departamento || ''}, el día <span class="bold">${fechaContratoObj.dia} de ${fechaContratoObj.mes} dos mil ${fechaContratoObj.anio}</span> a las <span class="bold">${horaContrato}</span> horas con <span class="bold">${minutoContrato}</span> minutos.
            <br><br>
            <div class="firma">
              f. _______________________________________<br>
              Deudor/a
            </div>
            <hr>
            <div class="notario">
              En el distrito de ${asignData.agenciaAsignada || ''}, municipio de ${solData.municipio || ''}, departamento de ${solData.departamento || ''}, a las <span class="bold">${horaContrato}</span> horas con <span class="bold">${minutoContrato}</span> minutos del día <span class="bold">${fechaContratoObj.dia}</span> de <span class="bold">${fechaContratoObj.mes}</span> de dos mil ${fechaContratoObj.anio}.- Ante mí, ${nombreNotario}, Notario… (continuar cláusulas y cierre según formato legal).
              <br><br>
              f. _______________________________________<br>
              Deudor/a
            </div>
          `;
          document.getElementById('contrato-mutuo').innerHTML = html;
        } catch (err) {
          document.getElementById('contrato-mutuo').innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
      });
    }
    window.addEventListener("DOMContentLoaded", loadContratoMutuo);
  </script>
</head>
<body>
  <div class="contrato" id="contrato-mutuo">
    <div style="color:#888;text-align:center;padding:38px 0;">Cargando contrato...</div>
  </div>
</body>
</html>
