  <style>

  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";

    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // FRECUENCIAS Y DESTINOS
    const FRECUENCIAS = {
      semanal:    { singular: "SEMANAL",    plural: "SEMANALES"    },
      catorcenal: { singular: "CATORCENAL", plural: "CATORCENALES" },
      quincenal:  { singular: "QUINCENAL",  plural: "QUINCENALES"  },
      mensual:    { singular: "MENSUAL",    plural: "MENSUALES"    }
    };
    const DESTINOS = {
      Credicash: "Gastos personales",
      Credicel:  "Compra de teléfono celular",
      Amuebla2:  "Compra de muebles al crédito"
    };

    // NUMERO A LETRAS (para cualquier cifra de DUI, edad, etc.)
    function numeroALetras(num) {
      const UNIDADES = ['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE'];
      const DECENAS = ['','DIEZ','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
      const CENTENAS = ['','CIEN','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
      function section(n) {
        if (n === 0) return '';
        if (n < 10) return UNIDADES[n];
        if (n < 100) return DECENAS[Math.floor(n/10)] + (n%10>0 ? ' Y '+UNIDADES[n%10] : '');
        if (n < 1000) return CENTENAS[Math.floor(n/100)] + (n%100>0 ? ' '+section(n%100) : '');
        if (n < 1000000) {
          let miles = Math.floor(n/1000);
          let resto = n % 1000;
          if (miles === 1) return 'MIL' + (resto > 0 ? ' ' + section(resto) : '');
          return section(miles) + ' MIL' + (resto > 0 ? ' ' + section(resto) : '');
        }
        if (n < 1000000000) {
          let millones = Math.floor(n/1000000);
          let resto = n % 1000000;
          if (millones === 1) return 'UN MILLÓN' + (resto > 0 ? ' ' + section(resto) : '');
          return section(millones) + ' MILLONES' + (resto > 0 ? ' ' + section(resto) : '');
        }
        return n.toString();
      }
      num = parseInt(num, 10);
      if(isNaN(num) || num < 0) return '';
      if(num === 0) return 'CERO';
      return section(num);
    }

    // DUI a letras (correcto para toda la cifra izquierda)
    function duiALetras(dui) {
      if (!dui) return "";
      let partes = dui.split("-");
      if (partes.length < 2) return "";
      let izqTexto = numeroALetras(parseInt(partes[0], 10));
      let derTexto = numeroALetras(parseInt(partes[1], 10));
      return `${izqTexto} GUION ${derTexto}`;
    }

    // Decimales a letras para cuotas (ej: 11.55)
    function decimalALetras(n) {
      n = parseFloat(n);
      let ent = Math.floor(n);
      let dec = Math.round((n - ent) * 100);
      if(dec === 0) return numeroALetras(ent);
      return `${numeroALetras(ent)} PUNTO ${(dec < 10 ? "CERO " : "") + numeroALetras(dec)}`;
    }

    // Fechas y años a letras
    function fechaALetras(fecha) {
      if(!fecha) return "";
      const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      let d = new Date(fecha);
      let dia = numeroALetras(d.getDate()).toLowerCase();
      let mes = meses[d.getMonth()];
      let anio = anioALetras(d.getFullYear());
      return `${dia} de ${mes} del año ${anio}`;
    }
    function anioALetras(a) {
      const map = {
        2024: "dos mil veinticuatro",
        2025: "dos mil veinticinco",
        2026: "dos mil veintiséis",
        2027: "dos mil veintisiete",
        2028: "dos mil veintiocho",
        2029: "dos mil veintinueve",
        2030: "dos mil treinta"
      };
      return map[a] || numeroALetras(a).toLowerCase();
    }

    // Edad
    function calcularEdad(fechaNacimiento, refFecha) {
      if(!fechaNacimiento) return '';
      let n = new Date(fechaNacimiento);
      let h = refFecha ? new Date(refFecha) : new Date();
      let edad = h.getFullYear() - n.getFullYear();
      if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) edad--;
      return edad;
    }

    // Hora y minutos a letras
    function horaALetras(hora) {
      let h = parseInt(hora, 10);
      if(isNaN(h)) return "";
      return numeroALetras(h).toLowerCase();
    }
    function minutosALetras(min) {
      let m = parseInt(min, 10);
      if(isNaN(m)) return "";
      return numeroALetras(m).toLowerCase();
    }

    // Obtener ID desde la URL
    function getParam(name){
      return new URLSearchParams(window.location.search).get(name);
    }

            <br><br>
            /////I) MONTO: Que en éste acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL, mayor de edad, Soltero, Estudiante, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, portador de su Documento Único de Identidad número cero tres millones novecientos ochenta y siete mil novecientos diecisiete – siete; ya homologado, en representación de la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V, de nacionalidad salvadoreña, con Número de Identificación Tributaria cero uno cero uno - cero tres cero nueve uno nueve - uno cero uno – dos y con Número de Registro (NRC) dos ocho cuatro cero dos dos – nueve, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, la cantidad de <b>${monto} (${montoLet}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</b> en concepto de préstamo, obligándome a utilizar dicho monto para: <b>${destino}</b>;
            II) INTERESES: Con una tasa de interés del <b>${interesMes}</b> POR CIENTO MENSUAL sobre saldos insolutos, en caso de incumplimiento de los uno o más pagos parciales me obligo a pagar, a partir del siguiente día un recargo equivalente <b>TRES DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA ($3.00)</b> por cuota atrasada, y se suman <b>OCHO DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA ($8.00)</b> si en el mes la cuenta está en mora, en concepto de recargo moratorio;

            IV) LUGAR DE PAGO: Todo pago lo haré en las oficinas de la Sociedad Acreedora las cuales se encuentran en ésta población, en la misma clase de moneda que la recibida.- El plazo de la presente obligación caducará y la Sociedad acreedor podrá exigir el pago de la deuda en su totalidad como si fuere de plazo vencido en cualquiera de los siguientes casos: a) Por falta de pago tal como se ha acordado; b) Por ejecución promovida contra el deudor por terceras personas o por el acreedor por deuda distinta; c) Por ausencia temporal o definitiva o por muerte del o la deudor/a; d) Por incumplimiento en el pago del capital asimismo por la no entrega de la totalidad de la deuda; y e) Por incumplimiento de cualquiera de las estipulaciones de éste contrato;
            V) DOMICILIO Y RENUNCIAS: Para todos los efectos judiciales y extrajudiciales de ésta obligación señalo como domicilio especial el de la ciudad de Ahuachapán, departamento de Ahuachapán, a cuyos tribunales me someto expresamente, renuncio al derecho de apelar al decreto de embargo, sentencia de remate y demás diligencias alzables del Juicio Ejecutivo y sus incidentes y al de exigir fianza al depositario que se nombre de los bienes que se me embarguen el cual será de elección del acreedor;
            VI) GASTOS Y HONORARIOS: Los gastos de éste documento los de su cancelación y cuantas otras diligencias hiciere el acreedor en el cobro o con motivo de éste adeudo serán por mi cuenta, así como las llamadas Costas Procesales y Gastos Personales, aunque conforme a las reglas generales no debiera ser condenado en costas, de forma voluntaria accedo a la cancelación de los mismos.-
            VII) Queda entendido que la mora en el pago del capital en la forma estipulada anteriormente o por el acreedor por deuda distinta a la presente hará caducar el plazo y la obligación será exigible en su totalidad.-

            <div class="firma">
              <div class="firma_linea"></div><br>
              Deudor/a
            </div>
            <div class="separador"></div>
            En el distrito de Ahuachapán, municipio de Ahuachapán, departamento de Ahuachapán, a las <b>${horaALetras(horaFirma)}</b> horas con <b>${minutosALetras(minFirma)}</b> minutos del día <b>${fechaALetras(fechaFirma)}</b>.- Ante mí, <b>${notario}</b>, Notario, del domicilio del distrito de Ahuachapán, comparece <b>${nombre}</b>, de <b>${edadTexto}</b> años de edad, Profesión u Oficio <b>${profesion}</b>, a quien no conozco pero lo o la identifico por medio de su Documento Único de Identidad número <b>${dui} (${duiLetras})</b>; Y ME DICE: Que reconoce como propios los conceptos vertidos en el anterior documento, así como la firma que lo calza, otorgado en ésta ciudad el día de hoy y redactado en una hoja útil por medio del cual se desglosan las siguientes cláusulas que literalmente dicen: /////////
            <br><br>
            I) MONTO: Que en éste acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL, mayor de edad, Soltero, Estudiante, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, portador de su Documento Único de Identidad número cero tres millones novecientos ochenta y siete mil novecientos diecisiete – siete; ya homologado, en representación de la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V, de nacionalidad salvadoreña, con Número de Identificación Tributaria cero uno cero uno - cero tres cero nueve uno nueve - uno cero uno – dos y con Número de Registro (NRC) dos ocho cuatro cero dos dos – nueve, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, la cantidad de <b>${monto} (${montoLet}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</b> en concepto de préstamo, obligándome a utilizar dicho monto para: <b>${destino}</b>;

            III) PLAZO Y FORMA DE PAGO: La suma recibida, más sus intereses correspondientes, la pagaré a la Sociedad Acreedora, dentro del plazo de <b>${cuotasLet} ${freqSing}</b>, siendo que el presente contrato vencen el día <b>${fechaALetras(fechaVencimiento)}</b>, por lo que pagare en la siguiente forma: Por medio de <b>${cuotasLet}</b> cuotas, <b>${freqPlur}</b> de <b>${cuota} (${decimalALetras(cuota)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</b>, que comprenden intereses y capital, incluido el Impuesto de Impuesto a la Transferencia de Bienes Muebles y a la Prestación de Servicios; obligándome el o la deudor/a a pagar la primera cuota el día <b>${fechaALetras(f1)}</b> y así sucesivamente el día correspondiente de cada uno de los <b>${freqPlur}</b> comprendido dentro del plazo, hasta su total cancelación.-

            V) DOMICILIO Y RENUNCIAS: Para todos los efectos judiciales y extrajudiciales de ésta obligación señalo como domicilio especial el de la ciudad de Ahuachapán, departamento de Ahuachapán, a cuyos tribunales me someto expresamente, renuncio al derecho de apelar al decreto de embargo, sentencia de remate y demás diligencias alzables del Juicio Ejecutivo y sus incidentes y al de exigir fianza al depositario que se nombre de los bienes que se me embarguen el cual será de elección del acreedor;
            VI) GASTOS Y HONORARIOS: Los gastos de éste documento los de su cancelación y cuantas otras diligencias hiciere el acreedor en el cobro o con motivo de éste adeudo serán por mi cuenta, así como las llamadas Costas Procesales y Gastos Personales, aunque conforme a las reglas generales no debiera ser condenado en costas, de forma voluntaria accedo a la cancelación de los mismos.-
            VII) Queda entendido que la mora en el pago del capital en la forma estipulada anteriormente o por el acreedor por deuda distinta a la presente hará caducar el plazo y la obligación será exigible en su totalidad.-
            <br><br>
            //////////VIII) Y ME DICE EL/ LA COMPARECIENTE: Que la firma que aparece al calce del anterior documento es suya, por haber sido puesta de su puño y letra, y como tal la reconoce, ratificando todos los conceptos, y reconociendo todas las obligaciones que se consignan en el mismo.- Yo, el Notario DOY FE: a) Que la firma de la persona compareciente es auténtica, por haber sido puesta a mi presencia de su puño y letra quien también han reconocido como suyos los conceptos y obligaciones contenidos en el documento que antecede.- b) De haber tenido a la vista el Testimonio de Escritura Matriz de Sociedad Anónima celebrada en la ciudad de Ahuachapán, a las dieciséis horas con cuarenta minutos del día tres de septiembre del año, dos mil diecinueve, realizada ante los oficios notariales de la Licenciada BRENDA MARGARITA LAGUAN, de este domicilio, inscrita en el Centro Nacional de Registros, Registro de Comercio, Departamento de Documentos Mercantiles, de la ciudad de Santa Ana, a las once horas y quince minutos del día veintisiete de septiembre de dos mil diecinueve, en el registro número TREINTA Y CINCO, del Libro Número CUATRO MIL CIENTO TREINTA Y CUATRO, del Registro de Sociedades del Folio CIENTO OCHENTA, al Folio CIENTO NOVENTA Y UNO, correspondiente a la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V.- Así se expresó el o la compareciente, a quien expliqué los efectos legales de esta acta notarial que consta de dos hojas, y leído que le fue por mí íntegramente lo escrito, en un solo acto, ratifica su contenido y firmamos.- DOY FE.-
            <div class="firma">
              <div class="firma_linea"></div><br>
              Deudor/a
            </div>
          `;
          document.getElementById('contrato').innerHTML = html;
        } catch(e){
          document.getElementById('contrato').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`;
          console.error(e);
        }
      });
    }
    window.addEventListener("DOMContentLoaded", loadContrato);
  </script>
</head>
