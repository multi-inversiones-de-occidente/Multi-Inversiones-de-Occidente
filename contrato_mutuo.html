<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contrato de Mutuo</title>
  <style>
    body {
      background: #fff;
      color: #222;
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 0;
    }
    .contrato {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 60px 70px 50px 70px;
      border-radius: 10px;
      box-shadow: 0 4px 24px #0002;
      font-size: 18px;
      line-height: 1.6;
      text-align: justify;
      word-break: break-word;
    }
    .titulo {
      text-align: center;
      font-weight: bold;
      margin-bottom: 35px;
      font-size: 22px;
      letter-spacing: 2px;
    }
    .firma {
      margin: 70px 0 30px 0;
      text-align: center;
    }
    .firma_linea {
      margin-top: 35px;
      margin-bottom: 6px;
      display: inline-block;
      border-bottom: 1.2px solid #222;
      width: 380px;
      height: 28px;
    }
    .separador {
      margin: 60px 0 45px 0;
      border: none;
      border-bottom: 1px dashed #4444;
      height: 0;
      width: 100%;
    }
    @media print {
      .contrato { page-break-after: always; box-shadow: none; }
      body { background: #fff !important; }
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // CONFIG FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // FUNCIONES UTILITARIAS (NUMERO A LETRAS, FECHA, ETC.)
    const FRECUENCIAS = {
      semanal:    { singular: "SEMANAL",    plural: "SEMANALES"    },
      catorcenal: { singular: "CATORCENAL", plural: "CATORCENALES" },
      quincenal:  { singular: "QUINCENAL",  plural: "QUINCENALES"  },
      mensual:    { singular: "MENSUAL",    plural: "MENSUALES"    }
    };
    const DESTINOS = {
      Credicash: "Gastos personales",
      Credicel:  "Compra de teléfono celular",
      Amuebla2:  "Compra de muebles al crédito"
    };
    function numeroALetras(num) {
      const unidades = ["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE"];
      const decenas = ["","DIEZ","VEINTE","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
      const centenas = ["","CIEN","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
      if (typeof num === "string") num = parseInt(num, 10);
      if(isNaN(num)||num<0) return "";
      if(num===0) return "CERO";
      if(num<10) return unidades[num];
      if(num<100) return decenas[Math.floor(num/10)] + (num%10>0?" Y "+unidades[num%10]:"");
      if(num<1000) return centenas[Math.floor(num/100)] + (num%100>0?" "+numeroALetras(num%100):"");
      if(num<10000){
        if(num===1000) return "MIL";
        return unidades[Math.floor(num/1000)]+" MIL"+(num%1000>0?" "+numeroALetras(num%1000):"");
      }
      return num.toString();
    }
    function decimalALetras(n) {
      n = parseFloat(n);
      let ent = Math.floor(n);
      let dec = Math.round((n - ent) * 100);
      if(dec === 0) return numeroALetras(ent);
      return `${numeroALetras(ent)} PUNTO ${(dec < 10 ? "CERO " : "") + numeroALetras(dec)}`;
    }
    function duiALetras(dui) {
      if(!dui) return "";
      let partes = dui.replace(/[^\d-]/g,'').split('-');
      if(partes.length<2) return "";
      let izq = partes[0];
      let der = partes[1];
      let izqTexto = numeroALetras(izq);
      let derTexto = numeroALetras(der);
      return izqTexto + " GUION " + derTexto;
    }
    function fechaALetras(fecha) {
      if(!fecha) return "";
      const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      let d = new Date(fecha);
      let dia = numeroALetras(d.getDate()).toLowerCase();
      let mes = meses[d.getMonth()];
      let anio = anioALetras(d.getFullYear());
      return `${dia} de ${mes} del año ${anio}`;
    }
    function anioALetras(a) {
      const añosEspeciales = {
        2024: "dos mil veinticuatro",
        2025: "dos mil veinticinco",
        2026: "dos mil veintiséis",
        2027: "dos mil veintisiete",
        2028: "dos mil veintiocho",
        2029: "dos mil veintinueve",
        2030: "dos mil treinta"
      };
      return añosEspeciales[a] || numeroALetras(a).toLowerCase();
    }
    function calcularEdad(fechaNacimiento, fechaReferencia) {
      let nacimiento = new Date(fechaNacimiento);
      let ref = fechaReferencia ? new Date(fechaReferencia) : new Date();
      let edad = ref.getFullYear() - nacimiento.getFullYear();
      let m = ref.getMonth() - nacimiento.getMonth();
      if (m < 0 || (m === 0 && ref.getDate() < nacimiento.getDate())) edad--;
      return edad;
    }
    function edadALetras(e) {
      let n = parseInt(e, 10);
      if(isNaN(n)||n<1) return "";
      return numeroALetras(n).toLowerCase();
    }
    function horaALetras(hora) {
      let h = parseInt(hora, 10);
      if(isNaN(h)) return "";
      return numeroALetras(h).toLowerCase();
    }
    function minutosALetras(min) {
      let m = parseInt(min, 10);
      if(isNaN(m)) return "";
      return numeroALetras(m).toLowerCase();
    }
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    // FUNCION PRINCIPAL
    window.addEventListener("DOMContentLoaded", function () {
      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location = "login.html";
          return;
        }
        try {
          const asignacionID = getParam('id');
          if (!asignacionID) throw new Error("No hay ID de asignación en la URL");

          // 1. Asignacion de cuota
          const asignacionSnap = await getDoc(doc(db, "asignacion_de_cuota", asignacionID));
          if (!asignacionSnap.exists()) throw new Error("No se encontró la asignación de cuota");
          const asignacion = asignacionSnap.data();
          console.log("✔ Asignación encontrada", asignacion);

          // 2. Solicitud asociada
          const solicitudSnap = await getDoc(doc(db, "Archivo Solicitudes", asignacion.solicitudID));
          if (!solicitudSnap.exists()) throw new Error("No se encontró la solicitud");
          const solicitud = solicitudSnap.data();
          console.log("✔ Solicitud encontrada", solicitud);

          // 3. Usuario asociado
          const userSnap = await getDoc(doc(db, "user", asignacion.clienteID));
          if (!userSnap.exists()) throw new Error("No se encontró el usuario");
          const usuario = userSnap.data();
          console.log("✔ Usuario encontrado", usuario);

          // 4. Armar datos
          const amort = asignacion.amortizacion || [];
          const fechaPrimerCuota = amort[0]?.fecha || '';
          const fechaVencimiento = amort[amort.length-1]?.fecha || '';
          const fechaFirma = asignacion.fechaAsignacion?.toDate ? asignacion.fechaAsignacion.toDate() : new Date();
          const horaFirma = fechaFirma.getHours();
          const minFirma = fechaFirma.getMinutes();

          const datos = {
            nombre: (solicitud.nombre || '') + (solicitud.apellido ? (' ' + solicitud.apellido) : ''),
            fechaNacimiento: usuario.dateOfBirth || '',
            profesion: solicitud.profesion || '',
            dui: solicitud.numeroDui || '',
            monto: asignacion.montoAprobado || '',
            tasa: Math.round((asignacion.tasaAnual || 0)/12), // mensual
            frecuencia: (asignacion.frecuenciaPago || '').toLowerCase(),
            cuotas: asignacion.numeroCuotas || amort.length || '',
            cuotaValor: asignacion.cuota || (amort[0]?.cuota)||'',
            lineaDeCredito: asignacion.lineaDeCredito || '',
            fechaPrimerCuota: fechaPrimerCuota,
            fechaVencimiento: fechaVencimiento,
            recargoMoratorio: 3,
            recargoExtra: 8,
            fechaFirma: fechaFirma,
            horaFirma: horaFirma,
            minFirma: minFirma,
            notario: "JOSE ANTONIO MAZARIEGO CACERES"
          };

          console.log("Objeto datos final para renderContrato:", datos);

          // Renderiza el contrato
          renderContrato(datos);

        } catch (e) {
          document.getElementById('contrato').innerHTML =
            `<div style="color:red;">❌ Error: ${e.message}</div>`;
          console.error(e);
        }
      });

      function renderContrato(datos) {
        // --- Calculados
        let edadNum = calcularEdad(datos.fechaNacimiento, datos.fechaFirma);
        let edadTexto = edadALetras(edadNum);
        let duiLetras = duiALetras(datos.dui);
        let freqKey = datos.frecuencia.toLowerCase();
        let freqSing = FRECUENCIAS[freqKey]?.singular || "CATORCENAL";
        let freqPlur = FRECUENCIAS[freqKey]?.plural || "CATORCENALES";
        let destino = DESTINOS[datos.lineaDeCredito] || "";
        let html = `
      <div class="titulo">CONTRATO DE MUTUO</div>
      YO, <b>${datos.nombre}</b>, de <b>${edadTexto}</b> años de edad, Profesión u Oficio <b>${datos.profesion}</b>, con Documento Único de Identidad <b>${datos.dui} (${duiLetras})</b>; ya homologado; en adelante denominado /a "El o la Deudor/a", por medio del presente documento OTORGO:
      <br><br>
      /////I) MONTO: Que en éste acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL, mayor de edad, Soltero, Estudiante, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, portador de su Documento Único de Identidad número cero tres millones novecientos ochenta y siete mil novecientos diecisiete – siete; ya homologado, en representación de la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V, de nacionalidad salvadoreña, con Número de Identificación Tributaria cero uno cero uno - cero tres cero nueve uno nueve - uno cero uno – dos y con Número de Registro (NRC) dos ocho cuatro cero dos dos – nueve, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, la cantidad de <b>$${parseFloat(datos.monto).toFixed(2)} (${decimalALetras(datos.monto)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA</b> en concepto de préstamo, obligándome a utilizar dicho monto para: <b>${destino}</b>;
      II) INTERESES: Con una tasa de interés del <b>${parseFloat(datos.tasa)}</b> POR CIENTO MENSUAL sobre saldos insolutos, en caso de incumplimiento de los uno o más pagos parciales me obligo a pagar, a partir del siguiente día un recargo equivalente <b>$${parseFloat(datos.recargoMoratorio).toFixed(2)} (${decimalALetras(datos.recargoMoratorio)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA</b>, en concepto de recargo moratorio;
      III) PLAZO Y FORMA DE PAGO: La suma recibida, más sus intereses correspondientes, la pagaré a la Sociedad Acreedora, dentro del plazo de <b>${decimalALetras(datos.cuotas)}</b> <b>${freqSing}</b>, siendo que el presente contrato vencen el día <b>${fechaALetras(datos.fechaVencimiento)}</b>, por lo que pagare en la siguiente forma: Por medio de <b>${decimalALetras(datos.cuotas)}</b> cuotas, <b>${freqPlur}</b> de <b>$${parseFloat(datos.cuotaValor).toFixed(2)} (${decimalALetras(datos.cuotaValor)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</b>, que comprenden intereses y capital, incluido el Impuesto de Impuesto a la Transferencia de Bienes Muebles y a la Prestación de Servicios; obligándome el o la deudor/a a pagar la primera cuota el día <b>${fechaALetras(datos.fechaPrimerCuota)}</b> y así sucesivamente el día correspondiente de cada uno de los ${freqPlur} comprendido dentro del plazo, hasta su total cancelación.-
      IV) LUGAR DE PAGO: Todo pago lo haré en las oficinas de la Sociedad Acreedora las cuales se encuentran en ésta población, en la misma clase de moneda que la recibida.- El plazo de la presente obligación caducará y la Sociedad acreedor podrá exigir el pago de la deuda en su totalidad como si fuere de plazo vencido en cualquiera de los siguientes casos: a) Por falta de pago tal como se ha acordado; b) Por ejecución promovida contra el deudor por terceras personas o por el acreedor por deuda distinta; c) Por ausencia temporal o definitiva o por muerte del o la deudor/a; d) Por incumplimiento en el pago del capital asimismo por la no entrega de la totalidad de la deuda; y e) Por incumplimiento de cualquiera de las estipulaciones de éste contrato;
      V) DOMICILIO Y RENUNCIAS: Para todos los efectos judiciales y extrajudiciales de ésta obligación señalo como domicilio especial el de la ciudad de Ahuachapán, departamento de Ahuachapán, a cuyos tribunales me someto expresamente, renuncio al derecho de apelar al decreto de embargo, sentencia de remate y demás diligencias alzables del Juicio Ejecutivo y sus incidentes y al de exigir fianza al depositario que se nombre de los bienes que se me embarguen el cual será de elección del acreedor;
      VI) GASTOS Y HONORARIOS: Los gastos de éste documento los de su cancelación y cuantas otras diligencias hiciere el acreedor en el cobro o con motivo de éste adeudo serán por mi cuenta, así como las llamadas Costas Procesales y Gastos Personales, aunque conforme a las reglas generales no debiera ser condenado en costas, de forma voluntaria accedo a la cancelación de los mismos.-
      VII) Queda entendido que la mora en el pago del capital en la forma estipulada anteriormente o por el acreedor por deuda distinta a la presente hará caducar el plazo y la obligación será exigible en su totalidad.-
      <br><br>
      ///// En fe de todo lo anterior, firmo el presente contrato, en el distrito de Ahuachapán, municipio de Ahuachapán, departamento de Ahuachapán, el día <b>${fechaALetras(datos.fechaFirma)}</b>.
      <div class="firma">
        <div class="firma_linea"></div><br>
        Deudor/a
      </div>
      <div class="separador"></div>
      En el distrito de Ahuachapán, municipio de Ahuachapán, departamento de Ahuachapán, a las <b>${horaALetras(datos.horaFirma)}</b> horas con <b>${minutosALetras(datos.minFirma)}</b> minutos del día <b>${fechaALetras(datos.fechaFirma)}</b>.- Ante mí, <b>${datos.notario}</b>, Notario, del domicilio del distrito de Ahuachapán, comparece <b>${datos.nombre}</b>, de <b>${edadTexto}</b> años de edad, Profesión u Oficio <b>${datos.profesion}</b>, a quien no conozco pero lo o la identifico por medio de su Documento Único de Identidad número <b>${datos.dui} (${duiLetras})</b>; Y ME DICE: Que reconoce como propios los conceptos vertidos en el anterior documento, así como la firma que lo calza, otorgado en ésta ciudad el día de hoy y redactado en una hoja útil por medio del cual se desglosan las siguientes cláusulas que literalmente dicen: /////////
      <br><br>
      I) MONTO: Que en éste acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL, mayor de edad, Soltero, Estudiante, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, portador de su Documento Único de Identidad número cero tres millones novecientos ochenta y siete mil novecientos diecisiete – siete; ya homologado, en representación de la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V, de nacionalidad salvadoreña, con Número de Identificación Tributaria cero uno cero uno - cero tres cero nueve uno nueve - uno cero uno – dos y con Número de Registro (NRC) dos ocho cuatro cero dos dos – nueve, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, la cantidad de <b>$${parseFloat(datos.monto).toFixed(2)} (${decimalALetras(datos.monto)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA</b> en concepto de préstamo, obligándome a utilizar dicho monto para: <b>${destino}</b>;
      II) INTERESES: Con una tasa de interés del <b>${parseFloat(datos.tasa)}</b> POR CIENTO MENSUAL sobre saldos insolutos, en caso de incumplimiento de los uno o más pagos parciales me obligo a pagar, a partir del siguiente día un recargo equivalente <b>$${parseFloat(datos.recargoMoratorio).toFixed(2)} (${decimalALetras(datos.recargoMoratorio)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA</b>, en concepto de recargo moratorio;
      III) PLAZO Y FORMA DE PAGO: La suma recibida, más sus intereses correspondientes, la pagaré a la Sociedad Acreedora, dentro del plazo de <b>${decimalALetras(datos.cuotas)}</b> <b>${freqSing}</b>, siendo que el presente contrato vencen el día <b>${fechaALetras(datos.fechaVencimiento)}</b>, por lo que pagare en la siguiente forma: Por medio de <b>${decimalALetras(datos.cuotas)}</b> cuotas, <b>${freqPlur}</b> de <b>$${parseFloat(datos.cuotaValor).toFixed(2)} (${decimalALetras(datos.cuotaValor)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</b>, que comprenden intereses y capital, incluido el Impuesto de Impuesto a la Transferencia de Bienes Muebles y a la Prestación de Servicios; obligándome el o la deudor/a a pagar la primera cuota el día <b>${fechaALetras(datos.fechaPrimerCuota)}</b> y así sucesivamente el día correspondiente de cada uno de los ${freqPlur} comprendido dentro del plazo, hasta su total cancelación.-
      IV) LUGAR DE PAGO: Todo pago lo haré en las oficinas de la Sociedad Acreedora las cuales se encuentran en ésta población, en la misma clase de moneda que la recibida.- El plazo de la presente obligación caducará y la Sociedad acreedor podrá exigir el pago de la deuda en su totalidad como si fuere de plazo vencido en cualquiera de los siguientes casos: a) Por falta de pago tal como se ha acordado; b) Por ejecución promovida contra el deudor por terceras personas o por el acreedor por deuda distinta; c) Por ausencia temporal o definitiva o por muerte del o la deudor/a; d) Por incumplimiento en el pago del capital asimismo por la no entrega de la totalidad de la deuda; y e) Por incumplimiento de cualquiera de las estipulaciones de éste contrato;
      V) DOMICILIO Y RENUNCIAS: Para todos los efectos judiciales y extrajudiciales de ésta obligación señalo como domicilio especial el de la ciudad de Ahuachapán, departamento de Ahuachapán, a cuyos tribunales me someto expresamente, renuncio al derecho de apelar al decreto de embargo, sentencia de remate y demás diligencias alzables del Juicio Ejecutivo y sus incidentes y al de exigir fianza al depositario que se nombre de los bienes que se me embarguen el cual será de elección del acreedor;
      VI) GASTOS Y HONORARIOS: Los gastos de éste documento los de su cancelación y cuantas otras diligencias hiciere el acreedor en el cobro o con motivo de éste adeudo serán por mi cuenta, así como las llamadas Costas Procesales y Gastos Personales, aunque conforme a las reglas generales no debiera ser condenado en costas, de forma voluntaria accedo a la cancelación de los mismos.-
      VII) Queda entendido que la mora en el pago del capital en la forma estipulada anteriormente o por el acreedor por deuda distinta a la presente hará caducar el plazo y la obligación será exigible en su totalidad.-
      <br><br>
      ////////VIII) Y ME DICE EL/ LA COMPARECIENTE: Que la firma que aparece al calce del anterior documento es suya, por haber sido puesta de su puño y letra, y como tal la reconoce, ratificando todos los conceptos, y reconociendo todas las obligaciones que se consignan en el mismo.- Yo, el Notario DOY FE: a) Que la firma de la persona compareciente es auténtica, por haber sido puesta a mi presencia de su puño y letra quien también han reconocido como suyos los conceptos y obligaciones contenidos en el documento que antecede.- b) De haber tenido a la vista el Testimonio de Escritura Matriz de Sociedad Anónima celebrada en la ciudad de Ahuachapán, a las dieciséis horas con cuarenta minutos del día tres de septiembre del año, dos mil diecinueve, realizada ante los oficios notariales de la Licenciada BRENDA MARGARITA LAGUAN, de este domicilio, inscrita en el Centro Nacional de Registros, Registro de Comercio, Departamento de Documentos Mercantiles, de la ciudad de Santa Ana, a las once horas y quince minutos del día veintisiete de septiembre de dos mil diecinueve, en el registro número TREINTA Y CINCO, del Libro Número CUATRO MIL CIENTO TREINTA Y CUATRO, del Registro de Sociedades del Folio CIENTO OCHENTA, al Folio CIENTO NOVENTA Y UNO, correspondiente a la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V.- Así se expresó el o la compareciente, a quien expliqué los efectos legales de esta acta notarial que consta de dos hojas, y leído que le fue por mí íntegramente lo escrito, en un solo acto, ratifica su contenido y firmamos.- DOY FE.-
      <div class="firma">
        <div class="firma_linea"></div><br>
        Deudor/a
      </div>
      `;
        document.getElementById('contrato').innerHTML = html;
      }
    });
  </script>
</head>
