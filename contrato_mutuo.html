<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contrato Mutuo</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #222; padding: 2rem;}
    .contrato { max-width: 950px; margin: 0 auto; background: #fff; padding: 36px; border-radius: 13px; box-shadow: 0 4px 24px #0002; }
    .bold { font-weight: 600; }
    .firma { margin-top: 48px; margin-bottom: 24px; text-align: center; }
    .firma_linea { display:inline-block; margin:25px 0 0 0; border-bottom:1.2px solid #222; width:320px; height:28px; }
    .center { text-align: center; }
    hr { margin: 28px 0; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Utilidades para letras y fechas
    function numeroALetras(num) {
      num = parseInt(num);
      if(isNaN(num)||num<0) return "";
      if(num===0) return "CERO";
      const especiales = [
        "", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE", 
        "DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE", "DIECISÉIS", "DIECISIETE", 
        "DIECIOCHO", "DIECINUEVE", "VEINTE", "VEINTIUNO", "VEINTIDÓS", "VEINTITRÉS", "VEINTICUATRO", 
        "VEINTICINCO", "VEINTISÉIS", "VEINTISIETE", "VEINTIOCHO", "VEINTINUEVE"
      ];
      if (num <= 29) return especiales[num].toLowerCase();
      const decenas  = ["", "", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
      if(num<100) return decenas[Math.floor(num/10)] + (num%10>0?" y "+especiales[num%10].toLowerCase():"");
      const centenas = ["", "cien", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];
      if(num<1000) return centenas[Math.floor(num/100)] + (num%100>0?" "+numeroALetras(num%100):"");
      if(num<10000){
        if(num===1000) return "mil";
        return especiales[Math.floor(num/1000)].toLowerCase()+" mil"+(num%1000>0?" "+numeroALetras(num%1000):"");
      }
      return num.toString();
    }
    function decimalALetras(n) {
      n = parseFloat(n);
      let ent = Math.floor(n);
      let dec = Math.round((n - ent) * 100);
      if(dec === 0) return numeroALetras(ent);
      return `${numeroALetras(ent)} punto ${(dec < 10 ? "cero " : "") + numeroALetras(dec)}`;
    }
    function duiALetras(dui) {
      if(!dui) return "";
      let partes = dui.replace(/[^\d-]/g,'').split('-');
      if(partes.length<2) return "";
      let izq = partes[0].split('').map(d=>numeroALetras(d)).join(' ');
      let der = partes[1].split('').map(d=>numeroALetras(d)).join(' ');
      return izq + " guion " + der;
    }
    function fechaALetras(str) {
      if(!str) return "";
      const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
      const d = new Date(str);
      let dia = numeroALetras(d.getDate());
      let mes = meses[d.getMonth()];
      let anio = d.getFullYear();
      let anioLetras = numeroALetras(anio);
      return `${dia} de ${mes} del año ${anioLetras}`;
    }
    function calcularEdad(dateOfBirth) {
      if(!dateOfBirth) return "";
      const n = new Date(dateOfBirth), h = new Date();
      let edad = h.getFullYear() - n.getFullYear();
      const m = h.getMonth() - n.getMonth();
      if(m<0||(m===0&&h.getDate()<n.getDate())) edad--;
      return edad;
    }
    function edadALetras(dateOfBirth) {
      let edad = calcularEdad(dateOfBirth);
      if (!edad || isNaN(edad) || edad < 1) return "[EDAD]";
      return `${numeroALetras(edad)} (${edad}) años de edad`;
    }

    // Mapear frecuencia de pago (clave firestore) a formato documento
    const FRECUENCIAS = {
      semanal:    { singular: "semana", plural: "semanas", adjetivo: "semanal", adjetivoPlural: "semanales" },
      catorcenal: { singular: "catorcena", plural: "catorcenas", adjetivo: "catorcenal", adjetivoPlural: "catorcenales" },
      quincenal:  { singular: "quincena", plural: "quincenas", adjetivo: "quincenal", adjetivoPlural: "quincenales" },
      mensual:    { singular: "mes", plural: "meses", adjetivo: "mensual", adjetivoPlural: "mensuales" }
    };

    // Mapear creditLine a destino de crédito
    const DESTINOS = {
      Credicash: "Gastos Personales",
      Credicel:  "Compra de Teléfono Celular",
      Amuebla2:  "Compra de Muebles al Crédito"
    };

    function getParam(name){
      return new URLSearchParams(window.location.search).get(name);
    }

    async function loadContrato() {
      const id = getParam("id");
      if(!id){ document.getElementById('contrato').innerText="ID no especificado."; return; }
      onAuthStateChanged(auth, async user=>{
        if(!user){ window.location="login.html"; return; }
        try{
          // 1. Asignación de cuota
          const aSnap = await getDoc(doc(db,"asignacion_de_cuota",id));
          if(!aSnap.exists()) throw new Error("Asignación no encontrada.");
          const a = aSnap.data();

          // 2. Solicitud
          const sSnap = await getDoc(doc(db,"Archivo Solicitudes",a.solicitudID));
          if(!sSnap.exists()) throw new Error("Solicitud no encontrada.");
          const s = sSnap.data();

          // 3. Usuario
          const uSnap = await getDoc(doc(db,"users",a.clienteID));
          const u = uSnap.exists()?uSnap.data():{};

          // Fechas cuotas
          const am = Array.isArray(a.amortizacion)?a.amortizacion:[];
          const fechaInicio = am[0]?.fecha || "";
          const fechaVencimiento = am[am.length-1]?.fecha || "";

          // Datos variables
          const monto = a.montoAprobado || '';
          const montoLet = numeroALetras(monto);
          const cant = a.numeroCuotas || am.length || '';
          const cuota = a.cuota || (am[0]?.cuota)||'';
          const tasaAnual = parseFloat(a.tasaAnual||0);
          const interesMes = tasaAnual ? (tasaAnual / 12).toFixed(2) : '';
          const freqKey = (a.frecuenciaPago||"catorcenal").toLowerCase();
          const freq = FRECUENCIAS[freqKey] || FRECUENCIAS["catorcenal"];

          // Línea de crédito solo desde la solicitud
          let lineaDeCredito = s.creditLine || s.lineaDeCredito || '';
          const destino = DESTINOS[lineaDeCredito] || "[DESTINO]";

          // Recargo moratorio texto fijo
          const recargoTxt = "TRES DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA ($3.00) por cuota atrasada, y se suman OCHO DÓLARES DE LOS ESTADOS UNIDOS DE AMERICA ($8.00) si en el mes la cuenta está en mora";

          // Fecha/hora contrato
          let fc = a.fechaAsignacion?.toDate?.()||new Date();
          if (typeof fc === "string" || typeof fc === "number") fc = new Date(fc);
          let fechaFirma = fc;
          let horaFirma = fc.getHours();
          let minFirma = fc.getMinutes();

          // Datos deudor
          const nombre = `${s.nombre||''}${s.apellido?(' '+s.apellido):''}`.trim() || "[NOMBRE]";
          let dateOfBirth = u.dateOfBirth || u.dateofBirth || u.fechaNacimiento || '';
          let edadTexto = "[EDAD]";
          try { edadTexto = edadALetras(dateOfBirth); } catch{}

          const profesion  = s.profesion||"[PROFESIÓN]";
          const dui = s.numeroDui||"[DUI]";
          const duiTexto = duiALetras(dui);

          // Notario (fijo)
          const notario = "JOSE ANTONIO MAZARIEGO CACERES";

          // Frases corregidas
          const plazoFrase = `${numeroALetras(cant)} (${cant}) ${freq.plural}`;
          const cuotasFrase = `${numeroALetras(cant)} (${cant}) cuotas, ${freq.adjetivoPlural} de $${cuota} (${decimalALetras(cuota)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA`;

          // Renderizado exacto legal
          const html = `
          <div class="contrato">
          <div class="center"><b>CONTRATO DE MUTUO</b></div><br>
          YO, <span class="bold">${nombre}</span>, de <span class="bold">${edadTexto}</span>, Profesión u Oficio <span class="bold">${profesion}</span>, con Documento Único de Identidad <span class="bold">${dui}</span> (<span class="bold">${duiTexto}</span>); ya homologado; en adelante denominado /a "El o la Deudor/a", por medio del presente documento OTORGO:
          <br><br>
          I) MONTO: Que en éste acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL, mayor de edad, Soltero, Estudiante, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, portador de su Documento Único de Identidad número cero tres millones novecientos ochenta y siete mil novecientos diecisiete – siete; ya homologado, en representación de la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V, de nacionalidad salvadoreña, con Número de Identificación Tributaria cero uno cero uno - cero tres cero nueve uno nueve - uno cero uno – dos y con Número de Registro (NRC) dos ocho cuatro cero dos dos – nueve, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, la cantidad de <span class="bold">$${monto} (${decimalALetras(monto)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</span> en concepto de préstamo, obligándome a utilizar dicho monto para: <span class="bold">${destino}</span>;
          <br><br>
          II) INTERESES: Con una tasa de interés del <span class="bold">${interesMes}</span> POR CIENTO MENSUAL sobre saldos insolutos, en caso de incumplimiento de uno o más pagos parciales me obligo a pagar, a partir del siguiente día un recargo equivalente <span class="bold">${recargoTxt}</span>, en concepto de recargo moratorio;
          <br><br>
          III) PLAZO Y FORMA DE PAGO: La suma recibida, más sus intereses correspondientes, la pagaré a la Sociedad Acreedora, dentro del plazo de <span class="bold">${plazoFrase}</span>, siendo que el presente contrato vence el día <span class="bold">${fechaALetras(fechaVencimiento)}</span>, por lo que pagare en la siguiente forma: Por medio de <span class="bold">${cuotasFrase}</span>, que comprenden intereses y capital, incluido el Impuesto a la Transferencia de Bienes Muebles y a la Prestación de Servicios; obligándome el o la deudor/a a pagar la primera cuota el día <span class="bold">${fechaALetras(fechaInicio)}</span> y así sucesivamente el día correspondiente de cada uno de los <span class="bold">${freq.adjetivoPlural}</span> comprendido dentro del plazo, hasta su total cancelación.-
          <br><br>
          IV) LUGAR DE PAGO: Todo pago lo haré en las oficinas de la Sociedad Acreedora las cuales se encuentran en ésta población, en la misma clase de moneda que la recibida.- El plazo de la presente obligación caducará y la Sociedad acreedor podrá exigir el pago de la deuda en su totalidad como si fuere de plazo vencido en cualquiera de los siguientes casos: a) Por falta de pago tal como se ha acordado; b) Por ejecución promovida contra el deudor por terceras personas o por el acreedor por deuda distinta; c) Por ausencia temporal o definitiva o por muerte del o la deudor/a; d) Por incumplimiento en el pago del capital asimismo por la no entrega de la totalidad de la deuda; y e) Por incumplimiento de cualquiera de las estipulaciones de éste contrato;
          <br><br>
          V) DOMICILIO Y RENUNCIAS: Para todos los efectos judiciales y extrajudiciales de ésta obligación señalo como domicilio especial el de la ciudad de Ahuachapán, departamento de Ahuachapán, a cuyos tribunales me someto expresamente, renuncio al derecho de apelar al decreto de embargo, sentencia de remate y demás diligencias alzables del Juicio Ejecutivo y sus incidentes y al de exigir fianza al depositario que se nombre de los bienes que se me embarguen el cual será de elección del acreedor;
          <br><br>
          VI) GASTOS Y HONORARIOS: Los gastos de éste documento los de su cancelación y cuantas otras diligencias hiciere el acreedor en el cobro o con motivo de éste adeudo serán por mi cuenta, así como las llamadas Costas Procesales y Gastos Personales, aunque conforme a las reglas generales no debiera ser condenado en costas, de forma voluntaria accedo a la cancelación de los mismos.-
          <br><br>
          VII) Queda entendido que la mora en el pago del capital en la forma estipulada anteriormente o por el acreedor por deuda distinta a la presente hará caducar el plazo y la obligación será exigible en su totalidad.-
          <br><br>
          En fe de todo lo anterior, firmo el presente contrato, en el distrito de Ahuachapán, municipio de Ahuachapán, departamento de Ahuachapán, el día <span class="bold">${fechaALetras(fechaFirma)}</span>.
          <br>
          <div class="firma">
            <div class="firma_linea"></div><br>
            Deudor/a
          </div>
          <br><br>
          En el distrito de Ahuachapán, municipio de Ahuachapán, departamento de Ahuachapán, a las <span class="bold">${numeroALetras(horaFirma)}</span> horas con <span class="bold">${numeroALetras(minFirma)}</span> minutos del día <span class="bold">${fechaALetras(fechaFirma)}</span>.- Ante mí, <span class="bold">${notario}</span>, Notario, del domicilio del distrito de Ahuachapán, comparece <span class="bold">${nombre}</span>, de <span class="bold">${edadTexto}</span>, Profesión u Oficio <span class="bold">${profesion}</span>, a quien no conozco pero lo o la identifico por medio de su Documento Único de Identidad número <span class="bold">${dui}</span> (<span class="bold">${duiTexto}</span>); Y ME DICE: Que reconoce como propios los conceptos vertidos en el anterior documento, así como la firma que lo calza, otorgado en ésta ciudad el día de hoy y redactado en una hoja útil por medio del cual se desglosan las siguientes cláusulas que literalmente dicen: /////////
          <br><br>
          I) MONTO: Que en éste acto recibo en calidad de Mutuo de parte del señor MANUEL EDUARDO SINTIGO CAISHPAL, mayor de edad, Soltero, Estudiante, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, portador de su Documento Único de Identidad número cero tres millones novecientos ochenta y siete mil novecientos diecisiete – siete; ya homologado, en representación de la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V, de nacionalidad salvadoreña, con Número de Identificación Tributaria cero uno cero uno - cero tres cero nueve uno nueve - uno cero uno – dos y con Número de Registro (NRC) dos ocho cuatro cero dos dos – nueve, del domicilio del distrito de Ahuachapán, municipio de Ahuachapán Centro, departamento de Ahuachapán, la cantidad de <span class="bold">$${monto} (${decimalALetras(monto)}) DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA</span> en concepto de préstamo, obligándome a utilizar dicho monto para: <span class="bold">${destino}</span>;
          <br><br>
          II) INTERESES: Con una tasa de interés del <span class="bold">${interesMes}</span> POR CIENTO MENSUAL sobre saldos insolutos, en caso de incumplimiento de uno o más pagos parciales me obligo a pagar, a partir del siguiente día un recargo equivalente <span class="bold">${recargoTxt}</span>, en concepto de recargo moratorio;
          <br><br>
          III) PLAZO Y FORMA DE PAGO: La suma recibida, más sus intereses correspondientes, la pagaré a la Sociedad Acreedora, dentro del plazo de <span class="bold">${plazoFrase}</span>, siendo que el presente contrato vence el día <span class="bold">${fechaALetras(fechaVencimiento)}</span>, por lo que pagare en la siguiente forma: Por medio de <span class="bold">${cuotasFrase}</span>, que comprenden intereses y capital, incluido el Impuesto a la Transferencia de Bienes Muebles y a la Prestación de Servicios; obligándome el o la deudor/a a pagar la primera cuota el día <span class="bold">${fechaALetras(fechaInicio)}</span> y así sucesivamente el día correspondiente de cada uno de los <span class="bold">${freq.adjetivoPlural}</span> comprendido dentro del plazo, hasta su total cancelación.-
          <br><br>
          IV) LUGAR DE PAGO: Todo pago lo haré en las oficinas de la Sociedad Acreedora las cuales se encuentran en ésta población, en la misma clase de moneda que la recibida.- El plazo de la presente obligación caducará y la Sociedad acreedor podrá exigir el pago de la deuda en su totalidad como si fuere de plazo vencido en cualquiera de los siguientes casos: a) Por falta de pago tal como se ha acordado; b) Por ejecución promovida contra el deudor por terceras personas o por el acreedor por deuda distinta; c) Por ausencia temporal o definitiva o por muerte del o la deudor/a; d) Por incumplimiento en el pago del capital asimismo por la no entrega de la totalidad de la deuda; y e) Por incumplimiento de cualquiera de las estipulaciones de éste contrato;
          <br><br>
          V) DOMICILIO Y RENUNCIAS: Para todos los efectos judiciales y extrajudiciales de ésta obligación señalo como domicilio especial el de la ciudad de Ahuachapán, departamento de Ahuachapán, a cuyos tribunales me someto expresamente, renuncio al derecho de apelar al decreto de embargo, sentencia de remate y demás diligencias alzables del Juicio Ejecutivo y sus incidentes y al de exigir fianza al depositario que se nombre de los bienes que se me embarguen el cual será de elección del acreedor;
          <br><br>
          VI) GASTOS Y HONORARIOS: Los gastos de éste documento los de su cancelación y cuantas otras diligencias hiciere el acreedor en el cobro o con motivo de éste adeudo serán por mi cuenta, así como las llamadas Costas Procesales y Gastos Personales, aunque conforme a las reglas generales no debiera ser condenado en costas, de forma voluntaria accedo a la cancelación de los mismos.-
          <br><br>
          VII) Queda entendido que la mora en el pago del capital en la forma estipulada anteriormente o por el acreedor por deuda distinta a la presente hará caducar el plazo y la obligación será exigible en su totalidad.-
          <br><br>
          VIII) Y ME DICE EL/ LA COMPARECIENTE: Que la firma que aparece al calce del anterior documento es suya, por haber sido puesta de su puño y letra, y como tal la reconoce, ratificando todos los conceptos, y reconociendo todas las obligaciones que se consignan en el mismo.- Yo, el Notario DOY FE: a) Que la firma de la persona compareciente es auténtica, por haber sido puesta a mi presencia de su puño y letra quien también han reconocido como suyos los conceptos y obligaciones contenidos en el documento que antecede.- b) De haber tenido a la vista el Testimonio de Escritura Matriz de Sociedad Anónima celebrada en la ciudad de Ahuachapán, a las dieciséis horas con cuarenta minutos del día tres de septiembre del año, dos mil diecinueve, realizada ante los oficios notariales de la Licenciada BRENDA MARGARITA LAGUAN, de este domicilio, inscrita en el Centro Nacional de Registros, Registro de Comercio, Departamento de Documentos Mercantiles, de la ciudad de Santa Ana, a las once horas y quince minutos del día veintisiete de septiembre de dos mil diecinueve, en el registro número TREINTA Y CINCO, del Libro Número CUATRO MIL CIENTO TREINTA Y CUATRO, del Registro de Sociedades del Folio CIENTO OCHENTA, al Folio CIENTO NOVENTA Y UNO, correspondiente a la Sociedad MULTI INVERSIONES DE OCCIDENTE S.A DE C.V.- Así se expresó el o la compareciente, a quien expliqué los efectos legales de esta acta notarial que consta de dos hojas, y leído que le fue por mí íntegramente lo escrito, en un solo acto, ratifica su contenido y firmamos.- DOY FE.-
          <div class="firma">
            <div class="firma_linea"></div><br>
            Deudor/a
          </div>
          </div>
          `;
          document.getElementById('contrato').innerHTML = html;
        } catch(e){
          document.getElementById('contrato').innerHTML = `<div style="color:red;">Error: ${e.message}</div>`;
        }
      });
    }
    window.addEventListener("DOMContentLoaded", loadContrato);
  </script>
</head>
