<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cuotas por Vencer – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: #f5f8fa;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 2.8rem auto 0 auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 3px 18px #00538b16;
      padding: 2.5rem 2.2rem 2rem 2.2rem;
    }
    h2 {
      font-size: 2rem;
      font-weight: bold;
      color: #1371b6;
      margin-bottom: 0.9rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitulo {
      font-size: 1.45rem;
      font-weight: bold;
      color: #f8af40;
      margin-bottom: 1.7rem;
      letter-spacing: .8px;
      text-align: center;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    select {
      padding: 8px 22px;
      border-radius: 8px;
      border: 1px solid #d2e2ee;
      background: #e7f2fb;
      color: #125c9c;
      font-size: 1.04rem;
      font-weight: bold;
      outline: none;
      transition: border .16s;
    }
    select:focus { border: 1.5px solid #1371b6; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      background: #fafdff;
    }
    th, td {
      padding: 8.5px 10px;
      border-bottom: 1px solid #e3e9f2;
      text-align: left;
      font-size: 1rem;
    }
    th {
      background: #e7f2fb;
      color: #125c9c;
      font-size: 1.03rem;
      letter-spacing: .7px;
    }
    .pendiente {
      color: #dbab16;
      font-weight: bold;
    }
    .row-today { background: #fefbe7 !important; }
    .row-7d    { background: #e8fbe7 !important; }
    .row-15d   { background: #e7f3fb !important; }
    .row-30d   { background: #f4e7fb !important; }
    .loading {
      color: #888;
      text-align: center;
      padding: 35px 0 25px 0;
      font-size: 1.15rem;
    }
    .telefono {
      color: #18b368;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 1px;
    }
    .usuario-email {
      color: #2770a6;
      font-size: 1.01rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
    }
    @media (max-width: 700px) {
      .container { padding: 1.3rem .4rem; }
      table { font-size: 0.97rem; }
      th, td { padding: 7px 3px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fa-solid fa-calendar-day"></i> Cuotas por Vencer</h2>
    <div class="subtitulo">Cuotas Pendientes Próximas a Vencer</div>
    <div id="user-info" class="usuario-email"></div>
    <div class="filter-row">
      <label for="rango" style="font-weight:600; color:#126caa;">Filtrar por:</label>
      <select id="rango">
        <option value="hoy">Hoy</option>
        <option value="7">Próximos 7 días</option>
        <option value="15">Próximos 15 días</option>
        <option value="30">Próximos 30 días</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Cuota #</th>
          <th>Fecha</th>
          <th>Días</th>
          <th>Capital</th>
          <th>Interés</th>
          <th>Total</th>
          <th>Saldo Crédito</th>
          <th>Teléfono</th>
        </tr>
      </thead>
      <tbody id="cuotas-list"></tbody>
    </table>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function formateaFecha(fechaIso) {
      if(!fechaIso) return '';
      let fecha = new Date(fechaIso);
      let dia = fecha.getDate().toString().padStart(2, '0');
      let mes = (fecha.getMonth()+1).toString().padStart(2, '0');
      let anio = fecha.getFullYear();
      return `${dia}/${mes}/${anio}`;
    }
    function diasEntre(f1, f2) {
      f1.setHours(0,0,0,0);
      f2.setHours(0,0,0,0);
      return Math.floor((f1 - f2) / (1000*60*60*24));
    }

    // Filtra SOLO la próxima cuota PENDIENTE de cada crédito (por cliente)
    async function cargarCuotas(rango) {
      let hoy = new Date();
      hoy.setHours(0,0,0,0);
      let cuotas = [];
      document.getElementById("cuotas-list").innerHTML = `<tr><td colspan="9" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</td></tr>`;
      const snapshot = await getDocs(collection(db, "creditos"));
      snapshot.forEach(doc => {
        let d = doc.data();
        if (!Array.isArray(d.amortizacion)) return;
        // Buscar la PRÓXIMA cuota pendiente
        let proxima = d.amortizacion.find(cuota => cuota.estado === "Pendiente");
        if (proxima) {
          let fcuota = new Date(proxima.fecha);
          fcuota.setHours(0,0,0,0);
          let dias = diasEntre(fcuota, hoy);
          let mostrar = false, clase = "";
          if      (rango === "hoy" && dias === 0)             { mostrar = true; clase = "row-today"; }
          else if (rango === "7"  && dias > 0 && dias <= 7)   { mostrar = true; clase = "row-7d"; }
          else if (rango === "15" && dias > 0 && dias <= 15)  { mostrar = true; clase = "row-15d"; }
          else if (rango === "30" && dias > 0 && dias <= 30)  { mostrar = true; clase = "row-30d"; }
          if (mostrar) {
            cuotas.push({
              cliente: (d.nombre || "") + " " + (d.apellido || ""),
              numero: proxima.numeroCuota,
              fecha: proxima.fecha,
              dias: dias,
              capital: proxima.capital,
              interes: proxima.interes,
              total: (parseFloat(proxima.capital) + parseFloat(proxima.interes)).toFixed(2),
              saldo: d.saldoActual,
              telefono: d.telefono,
              clase: clase
            });
          }
        }
      });

      let html = cuotas.length ? cuotas.map(c => `
        <tr class="${c.clase}">
          <td>${c.cliente.trim()}</td>
          <td>${c.numero}</td>
          <td>${formateaFecha(c.fecha)}</td>
          <td>${c.dias}</td>
          <td>$${parseFloat(c.capital).toFixed(2)}</td>
          <td>$${parseFloat(c.interes).toFixed(2)}</td>
          <td style="color:#f8af40;font-weight:700;">$${c.total}</td>
          <td>$${parseFloat(c.saldo).toFixed(2)}</td>
          <td class="telefono"><i class="fa-solid fa-phone"></i> ${c.telefono}</td>
        </tr>
      `).join('') : `<tr><td colspan="9" class="loading">Sin cuotas próximas a vencer en este rango</td></tr>`;
      document.getElementById("cuotas-list").innerHTML = html;
    }

    // Autenticación obligatoria antes de mostrar página
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        document.getElementById("user-info").textContent = "Usuario: " + (user.email || user.phoneNumber);
        cargarCuotas(document.getElementById("rango").value);
      }
    });

    // Cambia el rango de búsqueda
    document.getElementById("rango").onchange = function() {
      cargarCuotas(this.value);
    };
  </script>
</body>
</html>
