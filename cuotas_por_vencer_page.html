<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cuotas por Vencer – Multi Inversiones</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const auth = getAuth(app);

    // Esconde el contenido hasta autenticar
    document.documentElement.style.visibility = "hidden";

    // Formatea fecha YYYY-MM-DD a DD/MM/YYYY
    function formatoFecha(fecha) {
      if (!fecha) return '';
      const d = new Date(fecha);
      return d.toLocaleDateString('es-SV', { year: 'numeric', month: '2-digit', day: '2-digit' });
    }

    // Devuelve diferencia de días entre hoy y fecha de cuota (sin hora)
    function diasHasta(fechaStr) {
      const hoy = new Date();
      hoy.setHours(0,0,0,0);
      const f = new Date(fechaStr);
      f.setHours(0,0,0,0);
      return Math.round((f - hoy) / (1000*60*60*24));
    }

    // Lógica principal al cargar el DOM y autenticar
    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async (user) => {
        if (!user) return location.href = "login.html";
        document.documentElement.style.visibility = "visible";
        document.getElementById("usuario-nombre").textContent = user.email;
        cargarCuotas("hoy");
        document.getElementById("filtro-cuotas").addEventListener("change", (e) => {
          cargarCuotas(e.target.value);
        });
      });
    });

    // Trae cuotas pendientes según filtro seleccionado
    async function cargarCuotas(filtro) {
      const contenedor = document.getElementById("contenedor-cuotas");
      contenedor.innerHTML = "<div class='cargando'>Cargando cuotas…</div>";
      const snapshot = await getDocs(collection(db, "creditos"));
      const cuotas = [];
      const hoy = new Date(); hoy.setHours(0,0,0,0);

      let diasMin = 0, diasMax = 0;
      if (filtro === "hoy")      { diasMin = 0;  diasMax = 0; }
      if (filtro === "7dias")    { diasMin = 0;  diasMax = 7; }
      if (filtro === "15dias")   { diasMin = 0;  diasMax = 15; }
      if (filtro === "30dias")   { diasMin = 0;  diasMax = 30; }

      snapshot.forEach(doc => {
        const c = doc.data();
        const nombreCliente = c.nombre?.trim() || "(Sin nombre)";
        const apellidoCliente = c.apellido?.trim() || "";
        const telefono = c.telefono || "";
        const idCredito = doc.id;

        if (Array.isArray(c.amortizacion)) {
          c.amortizacion.forEach((cuota, i) => {
            if (cuota.estado === "Pendiente" && cuota.fecha) {
              const dias = diasHasta(cuota.fecha);
              if (dias >= diasMin && dias <= diasMax) {
                cuotas.push({
                  nombre: nombreCliente,
                  apellido: apellidoCliente,
                  telefono,
                  idCredito,
                  numeroCuota: cuota.numeroCuota,
                  fecha: cuota.fecha,
                  dias,
                  capital: cuota.capital,
                  interes: cuota.interes,
                  cuotaTotal: cuota.cuota,
                  saldo: cuota.saldo,
                });
              }
            }
          });
        }
      });

      // Ordena por fecha de vencimiento (ascendente)
      cuotas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

      // Renderiza la tabla
      if (cuotas.length === 0) {
        contenedor.innerHTML = "<div class='sin-resultados'>No hay cuotas pendientes en este rango.</div>";
        return;
      }

      let html = `
        <table class="tabla-cuotas">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Cuota #</th>
              <th>Fecha Vence</th>
              <th>Días</th>
              <th>Capital</th>
              <th>Interés</th>
              <th>Total</th>
              <th>Saldo Crédito</th>
              <th>Teléfono</th>
            </tr>
          </thead>
          <tbody>
      `;
      cuotas.forEach(cuota => {
        html += `
          <tr>
            <td>${cuota.nombre} ${cuota.apellido}</td>
            <td style="text-align:center">${cuota.numeroCuota+1}</td>
            <td>${formatoFecha(cuota.fecha)}</td>
            <td style="text-align:center">${cuota.dias}</td>
            <td style="text-align:right">$${parseFloat(cuota.capital).toFixed(2)}</td>
            <td style="text-align:right">$${parseFloat(cuota.interes).toFixed(2)}</td>
            <td style="text-align:right"><b>$${parseFloat(cuota.cuotaTotal).toFixed(2)}</b></td>
            <td style="text-align:right">$${parseFloat(cuota.saldo).toFixed(2)}</td>
            <td><a href="tel:${cuota.telefono}" style="color:#4fcf70;text-decoration:none;"><i class="fas fa-phone"></i> ${cuota.telefono}</a></td>
          </tr>
        `;
      });
      html += "</tbody></table>";
      contenedor.innerHTML = html;
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle,#000,#101820 70%);
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; min-height: 100vh;
    }
    header {
      background: #000;
      padding: 1.2rem 0;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: .5px;
      color: #67C8F1;
    }
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 2.3rem 2vw 2rem 2vw;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.1rem;
      margin-bottom: 0.65rem;
      letter-spacing: 0.5px;
      color: #F8AF40;
      text-align:center;
      font-weight:900;
    }
    .usuario {
      font-size: 1.03rem;
      color: #A1DDFB;
      margin-bottom: 1.5rem;
      font-weight: 600;
      text-align: center;
    }
    .filtros-cuotas {
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    select {
      padding: 0.46rem 0.8rem;
      border-radius: 8px;
      border: 1px solid #88e7ad;
      font-size: 1.08rem;
      font-family: inherit;
      background: #1c2730;
      color: #fff;
      font-weight: bold;
      outline: none;
      margin-left: .3rem;
      margin-right: 1.1rem;
    }
    .tabla-cuotas {
      width: 100%;
      border-collapse: collapse;
      background: #222c33;
      box-shadow: 0 4px 24px #0005;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 0.7rem;
    }
    .tabla-cuotas th,
    .tabla-cuotas td {
      padding: 10px 6px;
      border-bottom: 1px solid #2b485b;
      font-size: 1.02rem;
    }
    .tabla-cuotas th {
      background: #212a35;
      color: #F8AF40;
      font-size: 1.08rem;
      letter-spacing: .5px;
      font-weight: 700;
      text-align: center;
    }
    .tabla-cuotas tr:last-child td {
      border-bottom: none;
    }
    .tabla-cuotas td a { color: #4fcf70; }
    .cargando, .sin-resultados {
      padding: 1.5rem;
      color: #90caf9;
      font-size: 1.15rem;
      text-align: center;
    }
    @media (max-width: 750px) {
      .container { padding: 1.2rem 0.6vw; }
      .tabla-cuotas th, .tabla-cuotas td { font-size: .91rem; padding: 7px 2px;}
    }
    @media (max-width: 530px) {
      .tabla-cuotas, .tabla-cuotas thead, .tabla-cuotas tbody, .tabla-cuotas tr, .tabla-cuotas th, .tabla-cuotas td {
        display: block;
      }
      .tabla-cuotas tr { margin-bottom: 13px; }
      .tabla-cuotas td, .tabla-cuotas th {
        padding: 7px 2vw;
        text-align: left !important;
      }
      .tabla-cuotas thead { display: none; }
      .tabla-cuotas td:before {
        content: attr(data-label);
        font-weight: bold;
        color: #f8af40;
        margin-right: 8px;
      }
    }
  </style>
</head>
<body>
  <header>Cuotas por Vencer</header>
  <div class="container">
    <h1>Cuotas Pendientes Próximas a Vencer</h1>
    <div class="usuario">Usuario: <span id="usuario-nombre"></span></div>
    <div class="filtros-cuotas">
      <label for="filtro-cuotas"><i class="fas fa-filter"></i> Mostrar:</label>
      <select id="filtro-cuotas">
        <option value="hoy">Cuotas que vencen <b>HOY</b></option>
        <option value="7dias">En los próximos 7 días</option>
        <option value="15dias">En los próximos 15 días</option>
        <option value="30dias">En los próximos 30 días</option>
      </select>
    </div>
    <div id="contenedor-cuotas"></div>
  </div>
</body>
</html>
