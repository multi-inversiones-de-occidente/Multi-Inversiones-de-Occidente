<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cuotas por Vencer – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: #f5f8fa;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .container {
      max-width: 1050px;
      margin: 2.8rem auto 0 auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 3px 18px #00538b16;
      padding: 2.5rem 2.2rem 2rem 2.2rem;
    }
    h2 {
      font-size: 2rem;
      font-weight: bold;
      color: #1371b6;
      margin-bottom: 0.9rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitulo {
      font-size: 1.45rem;
      color: #ffa726;
      font-weight: 700;
      margin-bottom: 1.7rem;
      letter-spacing: .2px;
      text-align: center;
    }
    .user-email {
      color: #1785ba;
      font-size: 1.09rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 19px;
      flex-wrap: wrap;
    }
    select {
      padding: 8px 22px;
      border-radius: 8px;
      border: 1px solid #d2e2ee;
      background: #e7f2fb;
      color: #125c9c;
      font-size: 1.04rem;
      font-weight: bold;
      outline: none;
      transition: border .16s;
    }
    select:focus {
      border: 1.5px solid #1371b6;
    }
    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      margin-top: 6px;
      background: #fafdff;
      table-layout: fixed;
    }
    th, td {
      padding: 8.5px 10px;
      border-bottom: 1px solid #e3e9f2;
      text-align: left;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      background: #e7f2fb;
      color: #125c9c;
      font-size: 1.03rem;
      letter-spacing: .7px;
    }
    .pendiente {
      color: #dbab16;
      font-weight: bold;
    }
    .tel {
      color: #14b060;
      font-weight: 600;
      white-space: nowrap;
    }
    .tel i { margin-right: 5px;}
    .total-monto {
      color: #ffa726;
      font-weight: bold;
    }
    .row-today {
      background: #fefbe7 !important;
    }
    .row-7d {
      background: #e8fbe7 !important;
    }
    .row-15d {
      background: #e7f3fb !important;
    }
    .row-30d {
      background: #f4e7fb !important;
    }
    .loading {
      color: #888;
      text-align: center;
      padding: 35px 0 25px 0;
      font-size: 1.15rem;
    }
    @media (max-width: 1200px) {
      .container { padding: 1.2rem 0.2rem; max-width: 99vw;}
      table { font-size: 0.95rem; min-width:800px;}
      th, td { padding: 7px 3px; }
    }
    @media (max-width: 700px) {
      .container { padding: 1.3rem .4rem; }
      table { font-size: 0.92rem; min-width:700px;}
      th, td { padding: 7px 3px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fa-solid fa-calendar-day"></i> Cuotas por Vencer</h2>
    <div class="subtitulo">Cuotas Pendientes Próximas a Vencer</div>
    <div class="user-email" id="usuario-email"></div>
    <div class="filter-row">
      <label for="rango" style="font-weight:600; color:#126caa;">Filtrar por:</label>
      <select id="rango">
        <option value="hoy">Hoy</option>
        <option value="7">Próximos 7 días</option>
        <option value="15">Próximos 15 días</option>
        <option value="30">Próximos 30 días</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Cuota #</th>
          <th>Fecha</th>
          <th>Días</th>
          <th>Capital</th>
          <th>Interés</th>
          <th>Total</th>
          <th>Saldo Crédito</th>
          <th>Teléfono</th>
        </tr>
      </thead>
      <tbody id="cuotas-list"></tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function formateaFechaUTC(fechaIso) {
      if(!fechaIso) return '';
      let fecha = new Date(fechaIso);
      let dia = fecha.getUTCDate().toString().padStart(2, '0');
      let mes = (fecha.getUTCMonth()+1).toString().padStart(2, '0');
      let anio = fecha.getUTCFullYear();
      return `${dia}/${mes}/${anio}`;
    }

    function diasEntreUTC(f1, f2) {
      let d1 = new Date(Date.UTC(f1.getUTCFullYear(),f1.getUTCMonth(),f1.getUTCDate()));
      let d2 = new Date(Date.UTC(f2.getUTCFullYear(),f2.getUTCMonth(),f2.getUTCDate()));
      return Math.floor((d1 - d2) / (1000*60*60*24));
    }

    let agenciaActual = "";

    onAuthStateChanged(auth, async user => {
      if (!user) return location.href = "login.html";
      document.getElementById("usuario-email").textContent = "Usuario: " + user.email;
      const usersSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
      if (!usersSnap.empty) {
        agenciaActual = usersSnap.docs[0].data().department;
      }
      cargarCuotas("hoy");
    });

    async function cargarCuotas(rango) {
      let hoy = new Date();
      let hoyUTC = new Date(Date.UTC(hoy.getUTCFullYear(), hoy.getUTCMonth(), hoy.getUTCDate()));
      let cuotas = [];
      document.getElementById("cuotas-list").innerHTML = `<tr><td colspan="9" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</td></tr>`;
      if (!agenciaActual) {
        document.getElementById("cuotas-list").innerHTML = `<tr><td colspan="9" class="loading">No se pudo determinar la agencia del usuario.</td></tr>`;
        return;
      }
      // SOLO créditos de la agencia del usuario Y que NO estén revertidos
      const snapshot = await getDocs(query(collection(db, "creditos"), where("agenciaAsignada", "==", agenciaActual)));
      snapshot.forEach(doc => {
        let d = doc.data();
        // 👉 Nuevo filtro para NO mostrar créditos revertidos
        if (d.estadoCredito && d.estadoCredito === "Revertido") return;
        if (!Array.isArray(d.amortizacion)) return;
        (d.amortizacion).forEach(cuota => {
          if (["Pendiente", "Parcial", "Atrasado"].includes(cuota.estado) && cuota.fecha) {
            let fcuota = new Date(cuota.fecha);
            let fcuotaUTC = new Date(Date.UTC(fcuota.getUTCFullYear(), fcuota.getUTCMonth(), fcuota.getUTCDate()));
            let dias = diasEntreUTC(fcuotaUTC, hoyUTC);
            let mostrar = false, clase = "";
            if      (rango === "hoy" && dias === 0)             { mostrar = true; clase = "row-today"; }
            else if (rango === "7"  && dias > 0 && dias <= 7)   { mostrar = true; clase = "row-7d"; }
            else if (rango === "15" && dias > 0 && dias <= 15)  { mostrar = true; clase = "row-15d"; }
            else if (rango === "30" && dias > 0 && dias <= 30)  { mostrar = true; clase = "row-30d"; }
            if (mostrar) {
              cuotas.push({
                cliente: (d.nombre ? d.nombre.trim() : "") + (d.apellido ? " " + d.apellido.trim() : ""),
                numero: cuota.numeroCuota,
                fecha: cuota.fecha,
                dias: dias,
                capital: cuota.capital,
                interes: cuota.interes,
                total: cuota.cuota,
                saldo: d.saldoActual,
                telefono: d.telefono,
                clase: clase
              });
            }
          }
        });
      });

      let html = cuotas.length ? cuotas.map(c => `
        <tr class="${c.clase}">
          <td title="${c.cliente}">${c.cliente}</td>
          <td>${c.numero}</td>
          <td>${formateaFechaUTC(c.fecha)}</td>
          <td>${c.dias}</td>
          <td>$${parseFloat(c.capital).toFixed(2)}</td>
          <td>$${parseFloat(c.interes).toFixed(2)}</td>
          <td class="total-monto">$${parseFloat(c.total).toFixed(2)}</td>
          <td>$${parseFloat(c.saldo).toFixed(2)}</td>
          <td class="tel"><i class="fa-solid fa-phone"></i> ${c.telefono}</td>
        </tr>
      `).join('') : `<tr><td colspan="9" class="loading">Sin cuotas por vencer en este rango</td></tr>`;
      document.getElementById("cuotas-list").innerHTML = html;
    }

    document.getElementById("rango").onchange = function() {
      cargarCuotas(this.value);
    };
  </script>
</body>
</html>
