<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalle de Aprobaciones</title>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Utilidad para extraer parámetros de la URL
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    async function loadDetalleAprobacion() {
      const asignacionID = getParam("id");
      if (!asignacionID) {
        document.getElementById('detalle-contenido').innerHTML = `<div class="error">ID de asignación no especificado en la URL.</div>`;
        return;
      }
      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        try {
          // 1) Leer la asignación
          const asignRef = doc(db, "asignacion_de_cuota", asignacionID);
          const asignSnap = await getDoc(asignRef);
          if (!asignSnap.exists()) throw new Error("Asignación no encontrada.");
          const asignData = asignSnap.data();

          // 2) Tomar solicitudID de la asignación
          const solicitudID = asignData.solicitudID;
          if (!solicitudID) throw new Error("No se encontró solicitudID en la asignación.");

          // 3) Leer la solicitud original
          const solRef = doc(db, "Archivo Solicitudes", solicitudID);
          const solSnap = await getDoc(solRef);
          if (!solSnap.exists()) throw new Error("Solicitud original no encontrada.");
          const solData = solSnap.data();

          // 4) Procesar tabla de amortización si existe
          const amortRaw = asignData.amortizacion || [];
          const amortizacion = Array.isArray(amortRaw) ? amortRaw.map(e => ({...e})) : [];

          // 5) Renderizar datos en HTML
          let html = `
            <h2>Datos del Cliente</h2>
            <div class="info-row"><span>Nombre:</span> ${solData.nombre || '—'}</div>
            <div class="info-row"><span>Apellido:</span> ${solData.apellido || '—'}</div>
            <div class="info-row"><span>DUI:</span> ${solData.numeroDui || '—'}</div>
            <div class="info-row"><span>Dirección:</span> ${solData.direccion || '—'}</div>
            <div class="info-row"><span>Fecha Solicitud:</span> ${
              solData.fechaSolicitud && solData.fechaSolicitud.toDate
                ? solData.fechaSolicitud.toDate().toLocaleDateString("es-SV")
                : (typeof solData.fechaSolicitud === 'string' ? solData.fechaSolicitud : '—')
            }</div>
            <hr>
            <h2>Datos de la Asignación</h2>
            <div class="info-row"><span>Frecuencia de Pago:</span> ${asignData.frecuenciaPago || '—'}</div>
            <div class="info-row"><span>Número de Cuotas:</span> ${asignData.numeroCuotas || '—'}</div>
            <div class="info-row"><span>Cuota Aprobada:</span> $${asignData.cuota || '—'}</div>
            <div class="info-row"><span>Asignado a:</span> ${asignData.asignadoA || '—'}</div>
            <div class="info-row"><span>Agencia:</span> ${asignData.agenciaAsignada || '—'}</div>
            <div style="height:18px"></div>
            <div class="btns-acciones">
              <a class="btn-legal" href="papeleria_legal.html?id=${asignacionID}"><i class="fas fa-file-alt"></i> Papelería Legal</a>
              <a class="btn-apertura" href="apertura_credito_page.html?solicitudID=${encodeURIComponent(solicitudID)}">Apertura de Crédito</a>
            </div>
            <div style="height:28px"></div>
          `;
          // Tabla de amortización
          if (amortizacion.length) {
            html += `
              <h2>Tabla de Amortización</h2>
              <div style="overflow-x:auto;">
                <table>
                  <thead>
                    <tr>
                      <th>N°</th>
                      <th>Fecha</th>
                      <th>Cuota</th>
                      <th>Interés</th>
                      <th>Capital</th>
                      <th>Saldo</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${
                      amortizacion.map(row => `
                        <tr>
                          <td>${row.numeroCuota ?? ''}</td>
                          <td>${(row.fecha || '').toString().split("T")[0]}</td>
                          <td>$${row.cuota ?? ''}</td>
                          <td>$${row.interes ?? ''}</td>
                          <td>$${row.capital ?? ''}</td>
                          <td>$${row.saldo ?? ''}</td>
                        </tr>
                      `).join('')
                    }
                  </tbody>
                </table>
              </div>
            `;
          }
          document.getElementById('detalle-contenido').innerHTML = html;
        } catch (err) {
          document.getElementById('detalle-contenido').innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
      });
    }
    window.addEventListener("DOMContentLoaded", loadDetalleAprobacion);
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #111; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; margin: 0; }
    header {
      background:#000; padding:1rem 0;
      text-align:center; font-size:1.5rem;
      letter-spacing:1px; font-weight:700;
      color: #67C8F1;
    }
    .container {
      max-width: 750px; margin:2.2rem auto 0 auto;
      background: #181818;
      border-radius: 18px; box-shadow: 0 2px 25px #0005;
      padding: 2.5rem 2.3rem;
    }
    h1 { color: #F8AF40; font-size:2rem; text-align:center; font-weight:bold; margin-top:0; margin-bottom:1.5rem;}
    h2 { color:#67C8F1; font-size:1.13rem; margin:1.3rem 0 0.4rem 0; letter-spacing:.5px;}
    .info-row { margin: 0.36em 0; font-size:1.06rem;}
    .info-row span { color:#F8AF40; font-weight:700; margin-right:10px;}
    .btns-acciones { display:flex; gap:14px; margin-bottom:12px; }
    .btn-legal, .btn-apertura {
      padding: 13px 18px; border-radius:10px; font-size:1rem; font-weight:600;
      border:none; cursor:pointer; outline:none; text-decoration:none; transition: background .16s;
      display: flex; align-items: center; gap: 10px;
    }
    .btn-legal { background: #253045; color:#F8AF40; opacity:1; cursor:pointer;}
    .btn-legal:hover { background: #67C8F1; color: #181818; }
    .btn-apertura { background: #13b66b; color:#fff; }
    .btn-apertura:hover { background: #0a8a5a; color:#fff;}
    table { width: 100%; border-collapse: collapse; background:#212a2c; margin-top:10px;}
    th, td { padding: .75em .6em; text-align: left; }
    th { background: #253045; color: #67C8F1; }
    tr { border-bottom: 1px solid #2b2b2b; }
    tr:last-child { border-bottom:none; }
    td { color:#fff; }
    .error { color:#f55; font-size:1.13rem; padding:24px 0; text-align:center;}
    @media (max-width:800px) {
      .container { padding: 1.4rem 0.5rem;}
      h1 { font-size: 1.17rem;}
    }
  </style>
</head>
<body>
  <header>Detalle de Aprobaciones</header>
  <div class="container">
    <h1><i class="fas fa-file-alt"></i> Detalle de Aprobaciones</h1>
    <div id="detalle-contenido">
      <div style="color:#ccc;text-align:center;padding:38px 0;">Cargando información...</div>
    </div>
  </div>
</body>
</html>
