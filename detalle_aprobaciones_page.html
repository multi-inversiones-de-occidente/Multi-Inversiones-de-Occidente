<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalle de Aprobaciones</title>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, doc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    let asignData = null;
    let solData = null;
    let nuevaAmortizacion = [];
    let asignacionID = null;

    // --- Refinanciamiento
    let esRefinanciamiento = false;
    let creditoAnteriorInfo = null;
    let desembolsoNeto = null;

    // Buscar crédito anterior ACTIVO del cliente para refinanciamiento
    async function buscarCreditoAnterior(clienteID) {
      const creditosRef = collection(db, "creditos");
      const q = query(
        creditosRef,
        where("clienteID", "==", clienteID),
        where("estadoCredito", "==", "Activo")
      );
      const creditosSnap = await getDocs(q);
      if (creditosSnap.empty) return null;
      const creditoAnteriorDoc = creditosSnap.docs[0];
      const d = creditoAnteriorDoc.data();
      return {
        id: creditoAnteriorDoc.id,
        saldoActual: Number(d.saldoActual || 0),
        interesActual: Number(d.interesActual || 0),
        montoAprobado: Number(d.montoAprobado || 0)
      };
    }

    async function loadDetalleAprobacion() {
      asignacionID = getParam("id");
      if (!asignacionID) {
        document.getElementById('detalle-contenido').innerHTML = `<div class="error">ID de asignación no especificado en la URL.</div>`;
        return;
      }
      onAuthStateChanged(auth, async user => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        try {
          const asignRef = doc(db, "asignacion_de_cuota", asignacionID);
          const asignSnap = await getDoc(asignRef);
          if (!asignSnap.exists()) throw new Error("Asignación no encontrada.");
          asignData = asignSnap.data();

          const solicitudID = asignData.solicitudID;
          const solRef = doc(db, "Archivo Solicitudes", solicitudID);
          const solSnap = await getDoc(solRef);
          if (!solSnap.exists()) throw new Error("Solicitud original no encontrada.");
          solData = solSnap.data();

          // Ignorar solicitudes rechazadas
          if (solData.respuestaCliente === "Rechazado") {
            document.getElementById('detalle-contenido').innerHTML =
              `<div class="error">Esta solicitud fue rechazada y no puede mostrarse.</div>`;
            return;
          }

          // --- LÓGICA DE REFINANCIAMIENTO ---
          esRefinanciamiento = (solData.creditLine || "").toLowerCase().includes("refinanciamiento");
          if (esRefinanciamiento && solData.clienteID) {
            creditoAnteriorInfo = await buscarCreditoAnterior(solData.clienteID);
            if (creditoAnteriorInfo) {
              desembolsoNeto = Number(asignData.montoAprobado) - creditoAnteriorInfo.saldoActual - creditoAnteriorInfo.interesActual;
              if (desembolsoNeto < 0) desembolsoNeto = 0;
            } else {
              desembolsoNeto = Number(asignData.montoAprobado);
              creditoAnteriorInfo = {saldoActual: 0, interesActual: 0};
            }
          }
          // --- Fin lógica refinanciamiento ---

          renderDetalle();
        } catch (err) {
          document.getElementById('detalle-contenido').innerHTML = `<div class="error">Error: ${err.message}</div>`;
        }
      });
    }

    function recalcularAmortizacion(fechaBaseStr = null) {
      const monto = Number(asignData.montoAprobado);
      const tasaAnual = Number(asignData.tasaAnual);
      const frecuencia = asignData.frecuenciaPago;
      const numCuotas = Number(asignData.numeroCuotas);
      const cuota = Number(asignData.cuota);

      const specs = {
        "Semanal": { periodos: 52, dias: 7 },
        "Catorcenal": { periodos: 26, dias: 14 },
        "Quincenal": { periodos: 24, dias: 15 },
        "Mensual": { periodos: 12, dias: 30 },
      };
      const perAno = specs[frecuencia]?.periodos ?? 52;
      const diasPeriodo = specs[frecuencia]?.dias ?? 7;
      const tasa = tasaAnual / perAno / 100;

      let fechaBase;
      if (fechaBaseStr) {
        fechaBase = new Date(fechaBaseStr);
      } else {
        fechaBase = new Date();
        fechaBase.setHours(0,0,0,0);
      }

      let saldo = monto;
      let lista = [];
      for (let k = 1; k <= numCuotas; k++) {
        const interes = saldo * tasa;
        const capital = cuota - interes;
        saldo -= capital;
        if (k === numCuotas) saldo = 0;
        const fechaCuota = new Date(fechaBase);
        fechaCuota.setDate(fechaBase.getDate() + (k * diasPeriodo));
        lista.push({
          numeroCuota: k,
          fecha: fechaCuota.toISOString().split("T")[0],
          cuota: cuota.toFixed(2),
          interes: interes.toFixed(2),
          capital: capital.toFixed(2),
          saldo: saldo.toFixed(2)
        });
      }
      nuevaAmortizacion = lista;
    }

    function renderDetalle() {
      let html = `
        <div class="crumbs">
          <button type="button" class="btn-ux btn-back" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </button>
          <div class="crumb-title"><i class="fas fa-file-alt"></i> Detalle de Aprobaciones</div>
        </div>

        <section class="card glass">
          <h2 class="sect-title"><i class="fa-solid fa-id-card-clip"></i> Datos del Cliente</h2>
          <div class="info-grid">
            <div class="info-row"><span>Nombre</span><b>${solData.nombre || '—'}</b></div>
            <div class="info-row"><span>Apellido</span><b>${solData.apellido || '—'}</b></div>
            <div class="info-row"><span>DUI</span><b>${solData.numeroDui || '—'}</b></div>
            <div class="info-row"><span>Dirección</span><b>${solData.direccion || '—'}</b></div>
            <div class="info-row"><span>Fecha Solicitud</span><b>${
              solData.fechaSolicitud && solData.fechaSolicitud.toDate
                ? solData.fechaSolicitud.toDate().toLocaleDateString("es-SV")
                : (typeof solData.fechaSolicitud === 'string' ? solData.fechaSolicitud : '—')
            }</b></div>
          </div>
        </section>

        <section class="card glass">
          <h2 class="sect-title"><i class="fa-solid fa-clipboard-list"></i> Datos de la Asignación</h2>
          <div class="info-grid">
            <div class="info-row"><span>Frecuencia de Pago</span><b>${asignData.frecuenciaPago || '—'}</b></div>
            <div class="info-row"><span>Número de Cuotas</span><b>${asignData.numeroCuotas || '—'}</b></div>
            <div class="info-row"><span>Cuota Aprobada</span><b>$${asignData.cuota || '—'}</b></div>
            <div class="info-row"><span>Asignado a</span><b>${asignData.asignadoA || '—'}</b></div>
            <div class="info-row"><span>Agencia</span><b>${asignData.agenciaAsignada || '—'}</b></div>
          </div>
        </section>
      `;

      // --- BLOQUE DE DESEMBOLSO NETO PARA REFINANCIAMIENTO ---
      if (esRefinanciamiento && creditoAnteriorInfo) {
        html += `
        <section class="card payout">
          <div class="payout-main">
            <i class="fa-solid fa-sack-dollar"></i>
            <div>
              <div class="payout-label">Efectivo a entregar al cliente</div>
              <div class="payout-amount">$${desembolsoNeto.toFixed(2)}</div>
            </div>
          </div>
          <div class="payout-breakdown">
            <span>Nuevo aprobado: <b>$${Number(asignData.montoAprobado).toFixed(2)}</b></span>
            <span>− Saldo anterior: <b>$${creditoAnteriorInfo.saldoActual.toFixed(2)}</b></span>
            <span>− Intereses pendientes: <b>$${creditoAnteriorInfo.interesActual.toFixed(2)}</b></span>
          </div>
        </section>
        `;
      }

      html += `
        <section class="actions card glass">
          <button class="btn-ux btn-legal" id="btn-papeleria-legal">
            <i class="fas fa-file-alt"></i> Papelería Legal
          </button>
          <a class="btn-ux btn-apertura" href="apertura_credito_page.html?solicitudID=${encodeURIComponent(asignData.solicitudID)}">
            <i class="fa-solid fa-circle-play"></i> Apertura de Crédito
          </a>
          <button id="btn-nueva-tabla" class="btn-ux btn-nueva-tabla">
            <i class="fa-solid fa-calculator"></i> Generar nueva tabla de amortización
          </button>
        </section>

        <section id="amort-table-div" class="card glass subtle"></section>

        <section class="card note">
          <b>IMPORTANTE:</b> Esta tabla se genera usando la fecha actual.
          <ul>
            <li>La PRIMERA cuota se agenda N días después de hoy (hoy + período).</li>
            <li>Si la apertura real coincide con la fecha de asignación, las fechas serán idénticas.</li>
            <li>Si han pasado días desde la asignación, las fechas de pago e intereses se ajustarán.</li>
            <li>Usa la tabla recalculada para papelería legal y control real del crédito.</li>
          </ul>
        </section>
      `;

      document.getElementById('detalle-contenido').innerHTML = html;

      // Recalcular tabla
      document.getElementById("btn-nueva-tabla").onclick = function () {
        recalcularAmortizacion();
        if (asignacionID && nuevaAmortizacion.length > 0) {
          localStorage.setItem('amortizacion_temp_' + asignacionID, JSON.stringify(nuevaAmortizacion));
        }
        let tabla = `<h2 class="sect-title"><i class="fa-solid fa-table"></i> Tabla de Amortización (RECALCULADA)</h2>
        <div style="overflow-x:auto;"><table class="table-pro"><thead>
          <tr>
            <th>N°</th>
            <th>Fecha</th>
            <th>Cuota</th>
            <th>Interés</th>
            <th>Capital</th>
            <th>Saldo</th>
          </tr></thead><tbody>
        `;
        for (const row of nuevaAmortizacion) {
          tabla += `<tr>
            <td>${row.numeroCuota}</td>
            <td>${row.fecha}</td>
            <td>$${row.cuota}</td>
            <td>$${row.interes}</td>
            <td>$${row.capital}</td>
            <td>$${row.saldo}</td>
          </tr>`;
        }
        tabla += `</tbody></table></div>`;
        document.getElementById("amort-table-div").innerHTML = tabla;
      };

      // Validación para papelería legal (bloqueo si no está aperturado)
      setTimeout(() => {
        const btnPapeleria = document.getElementById('btn-papeleria-legal');
        if (btnPapeleria) {
          btnPapeleria.onclick = async () => {
            try {
              const asignRef = doc(db, "asignacion_de_cuota", asignacionID);
              const asignSnap = await getDoc(asignRef);
              if (!asignSnap.exists()) throw new Error("No se encontró la asignación.");
              const asignDataFresh = asignSnap.data();

              if (asignDataFresh.creditoAperturado === true) {
                window.location.href = `papeleria_legal.html?id=${asignacionID}`;
              } else {
                document.getElementById('modal-bloqueo').style.display = 'flex';
              }
            } catch (err) {
              alert("Error al validar el estado del crédito: " + err.message);
            }
          };
        }
      }, 400);
    }

    window.addEventListener("DOMContentLoaded", loadDetalleAprobacion);
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --bg:#f7f9fc; --bg-2:#eef2f7; --text:#0d1b2a; --muted:#5b6776;
      --brand-blue:#243b86; --brand-cel:#67C8F1; --brand-green:#13b66b; --brand-gold:#F8AF40;
      --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(10,20,40,.08); --glass-shadow:0 20px 60px rgba(12,20,40,.12);
      --radius-2xl:28px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0c0f14; --bg-2:#0f141b; --text:#dfe6ef; --muted:#9aa6b6;
        --glass-bg:rgba(255,255,255,.12); --glass-brd:rgba(255,255,255,.18); --glass-shadow:0 24px 60px rgba(0,0,0,.45);
      }
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(36,59,134,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(248,175,64,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }
    .pattern{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(1px 1px at 25px 25px, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(1px 1px at 75px 75px, rgba(255,255,255,.06), transparent 40%);
      background-size:100px 100px; mix-blend-mode:soft-light; opacity:.5;
    }

    /* Header glass */
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
      border-bottom:1px solid var(--glass-brd);
    }
    @media (prefers-color-scheme: dark){
      header{ background:linear-gradient(180deg, rgba(15,20,30,.75), rgba(15,20,30,.35)); }
    }
    .topbar{
      max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:.8rem 16px;
    }
    .logo-plate{
      display:inline-flex; align-items:center; gap:10px; background:var(--glass-bg); border:1px solid var(--glass-brd);
      padding:8px 14px; border-radius:16px; box-shadow:var(--glass-shadow); position:relative; overflow:hidden; isolation:isolate;
    }
    .logo-plate::after{
      content:""; position:absolute; inset:-1px;
      background:linear-gradient(120deg, transparent 0 35%, rgba(255,255,255,.55) 45%, transparent 55% 100%);
      transform:translateX(-120%); animation:plateSheen 6s linear infinite; pointer-events:none;
    }
    @keyframes plateSheen{ 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
    .logo-plate img{ height:28px; width:auto; display:block }
    .brand-name{ font-weight:800; letter-spacing:.2px; color:var(--brand-blue); }

    .container{
      position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:2rem 16px 3rem;
    }

    /* Breadcrumb + título */
    .crumbs{ display:flex; align-items:center; gap:12px; margin: 8px auto 16px; max-width:900px; }
    .crumb-title{ font-weight:800; color:var(--brand-blue); letter-spacing:.2px; }
    .btn-back{
      background:radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.75), rgba(255,255,255,.35) 40%, rgba(255,255,255,.2) 100%);
      border:1px solid var(--glass-brd);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 8px 24px rgba(10,20,40,.12);
      color:var(--brand-blue);
    }
    .btn-back i{ margin-right:6px }

    /* Cards */
    .card{
      max-width:900px; margin: 0 auto 18px; border-radius:22px;
    }
    .glass{
      background:var(--glass-bg); border:1px solid var(--glass-brd); box-shadow:var(--glass-shadow); padding:18px 16px;
      position:relative; overflow:hidden; isolation:isolate;
    }
    .glass.subtle{ padding:14px 12px; }
    .payout{
      background:linear-gradient(180deg, #fff5cf, #ffeaa1);
      border:1px solid rgba(248,175,64,.45);
      color:#2b2b2b; padding:18px; box-shadow: 0 12px 28px rgba(248,175,64,.2);
    }
    .payout-main{ display:flex; align-items:center; gap:12px; }
    .payout-main i{ font-size:1.6rem; color:#bd8a0c }
    .payout-label{ font-weight:800; letter-spacing:.2px }
    .payout-amount{ font-weight:900; font-size:1.6rem; color:#1f2937 }
    .payout-breakdown{ display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; font-size:.95rem; color:#5a4b22 }

    .sect-title{
      color:var(--brand-blue); font-weight:900; letter-spacing:.2px; margin:0 0 10px 0; display:flex; align-items:center; gap:8px;
    }

    .info-grid{
      display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px 14px;
    }
    .info-row{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      background: linear-gradient(180deg, rgba(36,59,134,.06), rgba(103,200,241,.06));
      border:1px solid rgba(36,59,134,.12); border-radius:12px; padding:10px 12px;
    }
    .info-row span{ color:var(--muted); font-weight:700 }
    .info-row b{ color:var(--text) }

    /* Botones UX pro (glass + borde iónico + ripple + tilt) */
    .btn-ux{
      position:relative; display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
      min-height:44px; padding:12px 16px; border-radius:16px; font-weight:800; text-decoration:none; cursor:pointer; user-select:none;
      border:1px solid var(--glass-brd); color:var(--text); background:radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.65), rgba(255,255,255,.32) 40%, rgba(255,255,255,.18) 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(10,20,40,.12), 0 2px 6px rgba(10,20,40,.06);
      overflow:hidden; outline:none; transition:transform .14s ease, box-shadow .2s ease;
      will-change: transform;
    }
    .btn-ux::before{
      content:""; position:absolute; inset:-1.5px; border-radius:inherit; z-index:0;
      background:conic-gradient(from 140deg, rgba(103,200,241,.12), rgba(103,200,241,.25), rgba(248,175,64,.25), rgba(19,182,107,.25), rgba(103,200,241,.12) 85%);
      filter:blur(8px); opacity:.65;
      mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000); -webkit-mask-composite:xor; mask-composite:exclude; padding:1px;
    }
    .btn-ux:hover{ transform: translateY(-1px) scale(1.01); box-shadow:0 18px 45px rgba(10,20,40,.18), 0 6px 16px rgba(10,20,40,.12) }
    .btn-ux i{ color:var(--brand-blue) }

    .actions{ display:flex; flex-wrap:wrap; gap:10px }

    .btn-legal{ color:var(--brand-blue) }
    .btn-apertura{ background: linear-gradient(90deg, var(--brand-green), #11a563); color:#fff; border:none }
    .btn-apertura i{ color:#fff }
    .btn-nueva-tabla{ background: linear-gradient(90deg, var(--brand-gold), #ffd56a); border:none; color:#1f2937 }
    .btn-nueva-tabla i{ color:#1f2937 }

    /* Tabla pro */
    .table-pro{
      width:100%; border-collapse:collapse; background:rgba(255,255,255,.5); border-radius:14px; overflow:hidden;
    }
    .table-pro thead th{
      background: linear-gradient(180deg, rgba(36,59,134,.12), rgba(103,200,241,.1));
      color:var(--brand-blue); font-weight:900; padding:12px 10px; border-bottom:1px solid rgba(36,59,134,.15);
    }
    .table-pro td{ padding:10px 8px; border-bottom:1px solid rgba(36,59,134,.08); }
    .table-pro tr:hover{ background: rgba(103,200,241,.08) }

    /* Notas e indicadores */
    .note{
      background: #213d4b; color:#fff; border:1px solid rgba(103,200,241,.25);
    }
    .note b{ color: var(--brand-gold) }
    .note ul{ margin:8px 0 0 19px }

    .error { color:#f55; font-size:1.13rem; padding:24px 0; text-align:center;}

    /* Modal */
    #modal-bloqueo {
      display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(17,18,26,0.88); align-items: center; justify-content: center;
    }
    .modal-box {
      background: #222a2c; padding: 42px 28px; border-radius: 18px; max-width: 340px; text-align: center; box-shadow: 0 8px 32px #000b;
    }
    .modal-box i { font-size:2.4em;color:#f55;margin-bottom:8px;}
    .modal-box h3 { color:#F8AF40;font-weight:900;}
    .modal-box p {margin:16px 0 12px 0;color:#fff;font-size:1.08em;}
    .modal-box button {
      background:#f55;border:none;color:#fff; font-weight:700;padding:9px 30px; border-radius:10px;font-size:1.07em; cursor:pointer;
    }

    @media (max-width:900px){
      .card{ margin:0 8px 16px }
      .crumbs{ margin:8px 8px 16px }
    }
  </style>
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>

  <header>
    <div class="topbar">
      <div class="logo-plate">
        <img src="assets/logo_mi_bw.png" alt="Logo Multi Inversiones" width="140" height="40" />
        <strong class="brand-name">MULTI INVERSIONES DE OCCIDENTE</strong>
      </div>
      <div style="margin-left:auto; font-weight:800; color:var(--muted);">Detalle de Aprobaciones</div>
    </div>
  </header>

  <div class="container">
    <div id="detalle-contenido">
      <div class="card glass" style="max-width:900px; margin: 12px auto; text-align:center; color:#6b7280;">
        Cargando información...
      </div>
    </div>
  </div>

  <!-- Modal de bloqueo de papelería legal -->
  <div id="modal-bloqueo">
    <div class="modal-box">
      <i class="fas fa-ban"></i>
      <h3>¡Acceso bloqueado!</h3>
      <p>
        No puedes generar la papelería legal.<br>
        <b>Primero debes aperturar el crédito.</b>
      </p>
      <button onclick="document.getElementById('modal-bloqueo').style.display='none'">Cerrar</button>
    </div>
  </div>

  <!-- Interacciones (ripple + tilt) para .btn-ux -->
  <script>
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bindUX = (root = document) => {
      const btns = root.querySelectorAll('.btn-ux');
      btns.forEach(btn=>{
        // Ripple
        btn.addEventListener('pointerdown', e=>{
          const rect = btn.getBoundingClientRect();
          const ripple = document.createElement('span');
          const x = e.clientX - rect.left, y = e.clientY - rect.top;
          const max = Math.max(rect.width, rect.height);
          Object.assign(ripple.style, {
            position:'absolute', left:`${x}px`, top:`${y}px`,
            width:`${max*1.2}px`, height:`${max*1.2}px`,
            borderRadius:'50%', transform:'translate(-50%, -50%)',
            background:'radial-gradient(circle, rgba(255,255,255,.45), rgba(255,255,255,0) 60%)',
            pointerEvents:'none', opacity:'0.85', zIndex:'1'
          });
          ripple.animate(
            [{opacity:.85, transform:'translate(-50%, -50%) scale(0.2)'},
             {opacity:0,   transform:'translate(-50%, -50%) scale(1.1)'}],
            {duration: reduceMotion ? 200 : 550, easing:'ease-out'}
          );
          btn.appendChild(ripple);
          setTimeout(()=>ripple.remove(), reduceMotion ? 210 : 600);
        });

        // Tilt
        if (!reduceMotion){
          btn.addEventListener('pointermove', e=>{
            const r = btn.getBoundingClientRect();
            const cx = r.left + r.width/2, cy = r.top + r.height/2;
            const dx = (e.clientX - cx) / (r.width/2);
            const dy = (e.clientY - cy) / (r.height/2);
            const rotateX = (-dy * 5).toFixed(2);
            const rotateY = ( dx * 6).toFixed(2);
            btn.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-1px) scale(1.01)`;
          });
          btn.addEventListener('pointerleave', ()=>{ btn.style.transform = ''; });
        }
      });
    };
    bindUX(document);
  </script>
</body>
</html>
