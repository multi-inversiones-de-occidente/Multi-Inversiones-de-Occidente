<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Movimientos de Caja – Multi Inversiones</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, limit, getDoc, doc as docRef } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    function formatDateTime(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit' });
    }
    function formatDate(date) {
      return date.toISOString().slice(0,10);
    }
    function formatMoney(n) {
      return "$" + (typeof n === "number" ? n.toFixed(2) : parseFloat(n).toFixed(2));
    }

    let movimientos = [];
    let totalCaja = 0.0;
    let selectedDate = new Date();
    let agenciaActual = "";

    // Obtener saldo anterior desde cierres
    async function obtenerSaldoAnterior(agencia, fecha) {
      const cierresRef = collection(db, "cierres_caja");
      const fechaStr = fecha.toISOString().slice(0,10);
      const q = query(
        cierresRef,
        where("agencia", "==", agencia),
        where("fecha", "<", fechaStr),
        orderBy("fecha", "desc"),
        limit(1)
      );
      const snap = await getDocs(q);
      if (!snap.empty) {
        return Number(snap.docs[0].data().saldo_caja || 0);
      }
      return 0;
    }

    // Cargar movimientos con los mismos filtros que en usuario/cajero
    async function cargarMovimientos() {
      document.getElementById("movimientos-list").innerHTML =
        `<div class="cargando">Cargando movimientos...</div>`;
      document.getElementById("total-caja").textContent = "—";

      try {
        if (!agenciaActual) {
          document.getElementById("movimientos-list").innerHTML =
            `<div class="error">No se pudo determinar la agencia del usuario.</div>`;
          return;
        }
        const y = selectedDate.getFullYear(), m = selectedDate.getMonth(), d = selectedDate.getDate();
        const startOfDay = new Date(y, m, d, 0, 0, 0, 0);
        const endOfDay = new Date(y, m, d, 23, 59, 59, 999);
        const startIso = startOfDay.toISOString();
        const endIso = endOfDay.toISOString();

        let movimientosArr = [];
        const correlativosSumados = new Set();

        // Movimientos manuales (filtrando anulados y reversiones)
        const movSnap = await getDocs(
          query(
            collection(db, "movimientosCaja"),
            where("agencia", "==", agenciaActual),
            where("fecha", ">=", startIso),
            where("fecha", "<=", endIso)
          )
        );
        movSnap.forEach(doc => {
          const d = doc.data();
          if ('anulado' in d && d.anulado === true) return;
          if (d.descripcion && (
              d.descripcion.startsWith('Reversión de pago') ||
              d.descripcion.startsWith('Reversión correlativo')
          )) return;
          if (d.correlativo && correlativosSumados.has(d.correlativo)) return;
          if (d.correlativo) correlativosSumados.add(d.correlativo);
          movimientosArr.push({
            tipo: d.tipo,
            descripcion: d.descripcion,
            monto: Number(d.monto),
            observaciones: d.observaciones || '',
            usuario: d.usuario || '',
            fecha: d.fecha,
            clase: d.tipo === "Ingreso" ? "ingreso" : "egreso",
            cliente: ""
          });
        });

        // Pagos (NO anulados)
        const pagoSnap = await getDocs(
          query(
            collection(db, "pagos"),
            where("sucursal", "==", agenciaActual),
            where("fechaPago", ">=", startIso),
            where("fechaPago", "<=", endIso)
          )
        );
        const clienteIDSet = new Set();
        const pagosList = [];
        pagoSnap.forEach(doc => {
          const d = doc.data();
          if (!("anulado" in d) || !d.anulado) {
            pagosList.push({...d, id: doc.id});
            if (d.clienteID) clienteIDSet.add(d.clienteID);
          }
        });

        // Buscar nombre y apellido de users (en bloques de 10)
        let clientesData = {};
        const ids = Array.from(clienteIDSet).filter(Boolean);
        for (let i = 0; i < ids.length; i += 10) {
          const batch = ids.slice(i, i + 10);
          await Promise.all(batch.map(async cid => {
            try {
              const userDoc = await getDoc(docRef(db, "users", cid));
              if (userDoc.exists()) {
                const user = userDoc.data();
                clientesData[cid] = ((user.nombre || "") + " " + (user.apellido || "")).trim();
              }
            } catch (e) {}
          }));
        }

        pagosList.forEach(data => {
          let clienteNombre = "Cliente";
          if (data.clienteID && clientesData[data.clienteID]) {
            clienteNombre = clientesData[data.clienteID];
          } else if (data.nombres) {
            clienteNombre = data.nombres;
          }
          movimientosArr.push({
            tipo: "Ingreso",
            descripcion: "Pago",
            monto: Number(data.montoPagado),
            observaciones: "",
            usuario: data.cajeroNombre || '',
            fecha: data.fechaPago,
            clase: "pago",
            cliente: clienteNombre
          });
        });

        // Abonos retroactivos (NO anulados)
        const pagosRetroQ = await getDocs(
          query(
            collection(db, "pagos"),
            where("sucursal", "==", agenciaActual),
            where("retroactivo", "==", true),
            where("fechaRegistro", ">=", startIso),
            where("fechaRegistro", "<=", endIso)
          )
        );
        pagosRetroQ.forEach(doc => {
          const d = doc.data();
          const yaExiste = movimientosArr.some(mov => mov.fecha === d.fechaRegistro && mov.monto === Number(d.montoPagado));
          if (!yaExiste && (!("anulado" in d) || !d.anulado)) {
            let clienteNombre = d.nombres || "Cliente";
            movimientosArr.push({
              tipo: "Ingreso",
              descripcion: "Abono retroactivo",
              monto: Number(d.montoPagado),
              observaciones: d.motivo || '',
              usuario: d.cajeroNombre || '',
              fecha: d.fechaRegistro,
              clase: "pago",
              cliente: clienteNombre
            });
          }
        });

        movimientosArr.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        movimientos = movimientosArr;

        const saldoAnterior = await obtenerSaldoAnterior(agenciaActual, selectedDate);

        let totalIngresos = 0.0;
        let totalEgresos = 0.0;
        movimientos.forEach(mov => {
          if (mov.tipo === "Ingreso") totalIngresos += mov.monto;
          else totalEgresos += mov.monto;
        });
        totalCaja = saldoAnterior + totalIngresos - totalEgresos;

        renderMovimientos(saldoAnterior);

      } catch (e) {
        document.getElementById("movimientos-list").innerHTML =
          `<div class="error">Error al cargar movimientos: ${e.message}</div>`;
      }
    }

    // Renderiza los movimientos en la lista
    function renderMovimientos(saldoAnterior) {
      const cont = document.getElementById("movimientos-list");
      if (!movimientos.length) {
        cont.innerHTML = `<div class="no-movimientos">No hay movimientos registrados.</div>`;
      } else {
        cont.innerHTML = movimientos.map(mov => `
          <div class="card-movimiento ${mov.clase}">
            <div class="mov-header">
              <strong>${mov.tipo} - ${mov.descripcion}</strong>
            </div>
            <div class="mov-info">
              <div>Monto: <span>${formatMoney(mov.monto)}</span></div>
              ${mov.observaciones ? `<div>Obs: <span>${mov.observaciones}</span></div>` : ''}
              <div>Usuario: <span>${mov.usuario}</span></div>
              ${mov.cliente ? `<div>Cliente: <span>${mov.cliente}</span></div>` : ""}
              <div>Hora: <span>${formatDateTime(mov.fecha)}</span></div>
            </div>
          </div>
        `).join('');
      }
      document.getElementById("total-caja").innerHTML = `
        <span style="color:#2ef37a;">Saldo Anterior: ${formatMoney(saldoAnterior)}</span>
        <br><span style="color:#fff;">Total de Caja: ${formatMoney(totalCaja)}</span>
      `;
    }

    window.cambiarFecha = function(input) {
      selectedDate = new Date(input.value + "T00:00:00");
      cargarMovimientos();
      document.getElementById("fecha-txt").textContent =
        input.value.split("-").reverse().join("/");
    };

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        const userDocSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
        if (!userDocSnap.empty) {
          agenciaActual = userDocSnap.docs[0].data().department;
        }
        const today = new Date();
        selectedDate = today;
        document.getElementById("fecha-picker").value = formatDate(today);
        document.getElementById("fecha-txt").textContent =
          formatDate(today).split("-").reverse().join("/");
        cargarMovimientos();
      });
    });
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; min-height: 100vh;
    }
    header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #67C8F1;
    }
    .container {
      max-width: 650px;
      margin: 2rem auto 0 auto;
      background: #181b1f;
      border-radius: 18px;
      box-shadow: 0 4px 32px #0009;
      padding: 2rem 1.5rem 1.3rem 1.5rem;
    }
    .fecha-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.3rem;
      gap: 13px;
    }
    .fecha-row label {
      font-weight: 600;
      color: #67C8F1;
    }
    .fecha-row input[type="date"] {
      background: #23272c;
      color: #fff;
      border: 1.5px solid #3c3f43;
      border-radius: 8px;
      font-size: 1.09rem;
      padding: 8px 13px;
      outline: none;
    }
    .movimientos-list {
      min-height: 130px;
      margin-bottom: 1.5rem;
    }
    .card-movimiento {
      background: #23272c;
      border-radius: 11px;
      margin-bottom: 13px;
      padding: 16px 13px 10px 13px;
      box-shadow: 0 2px 16px #0003;
      border-left: 6px solid #13b66b;
      transition: background .12s;
    }
    .card-movimiento.egreso { border-left-color: #e74c3c; }
    .card-movimiento.ingreso { border-left-color: #13b66b; }
    .mov-header {
      font-size: 1.15rem;
      margin-bottom: 5px;
      color: #67C8F1;
    }
    .mov-info div {
      font-size: 1.03rem;
      margin-bottom: 3px;
      color: #fff;
    }
    .mov-info span { color: #ffd266; font-weight: 500;}
    .cargando, .no-movimientos, .error {
      color: #ffd266;
      text-align: center;
      padding: 20px 0;
      font-size: 1.1rem;
    }
    .total-caja {
      background: #181818;
      border-radius: 12px;
      padding: 17px 0;
      margin-top: 5px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 1.23rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 2px 14px #0006;
      letter-spacing: .8px;
    }
    @media (max-width:700px){
      .container { padding: 1.3rem 1vw; }
    }
  </style>
</head>
<body>
  <header>Ver Movimientos de Caja</header>
  <div class="container">
    <div class="fecha-row">
      <label>Fecha: <span id="fecha-txt"></span></label>
      <input type="date" id="fecha-picker" onchange="cambiarFecha(this)">
    </div>
    <div id="movimientos-list" class="movimientos-list"></div>
    <div class="total-caja">
      <span id="total-caja">—</span>
    </div>
  </div>
</body>
</html>
