<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-receipt"></i> Historial de Pagos</div>

    <div id="buscador-row" class="inputs-row">
      <div class="input-group">
        <label for="clienteID-input">Cliente ID</label>
        <input id="clienteID-input" type="text" placeholder="Ingresa el ClienteID...">
      </div>
      <button id="buscar-btn" class="btn"><i class="fas fa-search"></i> Buscar</button>
    </div>

    <div id="creditos-wrapper" class="hidden">
      <div class="input-group">
        <label for="credito-select">Crédito</label>
        <select id="credito-select"></select>
      </div>
      <div class="helper">Selecciona el crédito para ver únicamente los pagos asociados a ese <b>creditoID</b>.</div>
    </div>

    <div id="resumen-credito" class="resumen-credito hidden"></div>
    <div id="resumen-totales"></div>
    <div id="ultimo-pago"></div>

    <div class="tabla-wrap">
      <table class="tabla-historial">
        <thead>
          <tr>
            <th>Correlativo</th>
            <th>Fecha</th>
            <th>Monto</th>
            <th>Capital</th>
            <th>Interés</th>
            <th>Multas</th>
            <th>Cajero</th>
            <th>Saldo Restante</th>
          </tr>
        </thead>
        <tbody id="tabla-pagos"></tbody>
      </table>
    </div>

    <div id="empty-msg" class="empty-msg" style="display:none"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Helpers
    const getParam = (name) => new URL(window.location.href).searchParams.get(name) || "";
    const money = n => '$' + (Number(n || 0)).toFixed(2);

    const safeNum = (v, def = 0) => {
      const n = Number(v);
      return Number.isFinite(n) ? n : def;
    };

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('es-SV', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }) + ' ' +
      d.toLocaleTimeString('es-SV', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    }

    function obtenerNombreCliente(data = {}) {
      return data.nombre || data.nombres || data.primerNombre || data.name || '—';
    }

    function obtenerDuiCliente(data = {}) {
      return data.dui || data.DUI || data.numeroDui || '—';
    }

    // Estado UI
    let creditosDelCliente = [];
    let usuarioAutenticado = null;
    let datosClienteActual = null;
    let clienteIDActual = "";

    // Auth
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      usuarioAutenticado = user;

      // Auto-carga por parámetros
      const clienteID = getParam('clienteID');
      const creditoID = getParam('creditoID');

      if (clienteID) {
        document.getElementById('clienteID-input').value = clienteID;
        clienteIDActual = clienteID;
        await cargarDatosCliente(clienteID);
      }

      if (clienteID && creditoID) {
        // Modo automático: ocultar buscador y selector
        document.getElementById('buscador-row').classList.add('hidden');
        document.getElementById('creditos-wrapper').classList.add('hidden');

        // Validar que el crédito exista y pertenezca al cliente
        const credRef = doc(db, "creditos", creditoID);
        const credSnap = await getDoc(credRef);

        if (!credSnap.exists()) {
          return showEmpty("Crédito no encontrado.");
        }

        const credData = credSnap.data();

        if (credData.clienteID !== clienteID) {
          return showEmpty("El crédito no pertenece al ClienteID suministrado.");
        }

        // Excluir créditos Revertidos en modo automático
        if ((credData.estadoCredito || '') === 'Revertido') {
          return showEmpty("El crédito está en estado Revertido y no se considera en esta vista.");
        }

        renderResumenCreditoDirecto(creditoID, credData);
        await cargarPagosPorCredito(creditoID);
        return;
      }

      // Búsqueda automática al entrar
      const inputVal = document.getElementById('clienteID-input').value.trim();
      if (inputVal && !creditoID) {
        clienteIDActual = inputVal;
        await cargarDatosCliente(inputVal);
        await buscarCreditos(inputVal);
      }
    });

    // Eventos de búsqueda manual
    document.getElementById('buscar-btn').onclick = async () => {
      const clienteID = document.getElementById('clienteID-input').value.trim();
      if (!clienteID) return showEmpty("Debes ingresar el ClienteID.");
      clienteIDActual = clienteID;
      await cargarDatosCliente(clienteID);
      await buscarCreditos(clienteID);
    };

    document.getElementById('clienteID-input').onkeydown = async (e) => {
      if (e.key === "Enter") {
        const clienteID = document.getElementById('clienteID-input').value.trim();
        if (!clienteID) return showEmpty("Debes ingresar el ClienteID.");
        clienteIDActual = clienteID;
        await cargarDatosCliente(clienteID);
        await buscarCreditos(clienteID);
      }
    };

    document.getElementById('credito-select').onchange = async () => {
      const id = document.getElementById('credito-select').value;
      const c = creditosDelCliente.find(x => x.id === id);
      if (!c) return;
      renderResumenCreditoDirecto(id, c.data);
      await cargarPagosPorCredito(id);
    };

    async function cargarDatosCliente(clienteID) {
      datosClienteActual = null;

      try {
        const userRef = doc(db, "users", clienteID);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          datosClienteActual = userSnap.data();
          return;
        }

        // Respaldo por si en tu base el cliente no coincide con el docId
        const qUser = query(collection(db, "users"), where("uid", "==", clienteID));
        const qSnap = await getDocs(qUser);

        if (!qSnap.empty) {
          datosClienteActual = qSnap.docs[0].data();
        }
      } catch (e) {
        console.error("Error cargando datos del cliente:", e);
      }
    }

    // Cargar créditos por cliente
    async function buscarCreditos(clienteID) {
      resetUI();

      try {
        const qCreds = query(collection(db, "creditos"), where("clienteID", "==", clienteID));
        const snap = await getDocs(qCreds);
        creditosDelCliente = [];

        snap.forEach(d => {
          const data = d.data();
          if ((data.estadoCredito || '') !== 'Revertido') {
            creditosDelCliente.push({ id: d.id, data });
          }
        });

        if (!creditosDelCliente.length) {
          return showEmpty("No se encontraron créditos (no Revertidos) para este ClienteID.");
        }

        const sel = document.getElementById('credito-select');
        sel.innerHTML = creditosDelCliente.map(c => {
          const d = c.data;
          const linea = d.lineaDeCredito || '—';
          const estado = d.estadoCredito || '—';
          const cuota = safeNum(d.cuotaAprobada);
          const cuotas = d.numeroCuotas || '—';
          return `<option value="${c.id}">${linea} | ${estado} | ${cuotas}x${money(cuota)} | ID: ${c.id}</option>`;
        }).join('');

        document.getElementById('creditos-wrapper').classList.remove('hidden');

        // Autoselección del primero
        const id = creditosDelCliente[0].id;
        sel.value = id;
        renderResumenCreditoDirecto(id, creditosDelCliente[0].data);
        await cargarPagosPorCredito(id);

      } catch (err) {
        console.error(err);
        showEmpty("Error de permisos o conexión al cargar créditos.");
      }
    }

    function renderResumenCreditoDirecto(creditoID, d) {
      const cont = document.getElementById('resumen-credito');
      if (!d) {
        cont.classList.add('hidden');
        return;
      }

      const saldoActual = safeNum(d.saldoActual);
      const interesActual = safeNum(d.interesActual);
      const capitalAtrasado = safeNum(d.capitalAtrasado);
      const multasAcumuladas = safeNum(d.multasAcumuladas);
      const paraPonerseAlDia = safeNum(d.paraPonerseAlDia);
      const tasaAnualCredito = safeNum(d.tasaAnualCredito);
      const tasaDiariaCredito = safeNum(d.tasaDiariaCredito);

      const nombreCliente = obtenerNombreCliente(datosClienteActual || {});
      const duiCliente = obtenerDuiCliente(datosClienteActual || {});

      cont.innerHTML = `
        <div class="grid">
          <div class="item"><b>Nombre:</b> ${nombreCliente}</div>
          <div class="item"><b>DUI:</b> ${duiCliente}</div>
          <div class="item"><b>Crédito ID:</b> ${creditoID}</div>

          <div class="item"><b>Línea:</b> ${d.lineaDeCredito || '—'}</div>
          <div class="item"><b>Estado:</b> ${d.estadoCredito || '—'}</div>
          <div class="item"><b>Cuota aprobada:</b> ${money(d.cuotaAprobada)}</div>

          <div class="item"><b>Frecuencia:</b> ${d.frecuenciaPago || '—'}</div>
          <div class="item"><b>Cuotas:</b> ${d.numeroCuotas || '—'}</div>
          <div class="item"><b>Saldo actual:</b> ${money(saldoActual)}</div>

          <div class="item"><b>Interés actual:</b> ${money(interesActual)}</div>
          <div class="item"><b>PPD:</b> ${money(paraPonerseAlDia)}</div>
          <div class="item"><b>Capital vencido:</b> ${money(capitalAtrasado)}</div>

          <div class="item"><b>Multas no pagadas:</b> ${money(multasAcumuladas)}</div>
          <div class="item"><b>Tasa anual:</b> ${tasaAnualCredito || '—'}%</div>
          <div class="item"><b>Tasa diaria:</b> ${tasaDiariaCredito || '—'}</div>

          <div class="item"><b>Agencia:</b> ${d.agenciaAsignada || '—'}</div>
          <div class="item"><b>Inicio:</b> ${d.fechaInicio ? new Date(d.fechaInicio).toLocaleString('es-SV') : '—'}</div>
        </div>
      `;
      cont.classList.remove('hidden');
    }

    // Pagos por crédito
    async function cargarPagosPorCredito(creditoID) {
      const tbody = document.getElementById('tabla-pagos');
      const resumenTot = document.getElementById('resumen-totales');
      const ultimoPago = document.getElementById('ultimo-pago');
      const empty = document.getElementById('empty-msg');

      tbody.innerHTML = "";
      resumenTot.innerHTML = "";
      ultimoPago.innerHTML = "";
      empty.style.display = 'none';

      try {
        const pagosQ = query(
          collection(db, "pagos"),
          where("creditoID", "==", creditoID),
          orderBy("fechaPago", "asc")
        );

        const pagosSnap = await getDocs(pagosQ);

        let pagos = [];
        pagosSnap.forEach(docSnap => {
          const d = docSnap.data();
          if (!d.anulado) pagos.push(d);
        });

        pagos = pagos.map(p => ({
          ...p,
          correlativo: p.correlativo ?? '—',
          montoPagado: safeNum(p.montoPagado),
          pagoCapital: safeNum(p.pagoCapital),
          pagoInteres: safeNum(p.pagoInteres),
          pagoMultas: safeNum((p.pagoMultas ?? p.pagoMulta)),
          saldoRestante: safeNum(p.saldoRestante)
        }));

        if (!pagos.length) {
          return showEmpty("No se encontraron pagos para el crédito seleccionado.");
        }

        // Totales
        let totalPagado = 0, totalCapital = 0, totalInteres = 0, totalMultas = 0;
        pagos.forEach(d => {
          totalPagado += d.montoPagado;
          totalCapital += d.pagoCapital;
          totalInteres += d.pagoInteres;
          totalMultas += d.pagoMultas;
        });

        resumenTot.innerHTML = `
          <div class="resumen-totales">
            <div class="grid">
              <div class="item"><b>Total pagado:</b> ${money(totalPagado)}</div>
              <div class="item"><b>Total a capital:</b> ${money(totalCapital)}</div>
              <div class="item"><b>Total a intereses:</b> ${money(totalInteres)}</div>
              <div class="item"><b>Total a multas:</b> ${money(totalMultas)}</div>
              <div class="item"><b>Crédito ID:</b> ${creditoID}</div>
            </div>
          </div>
        `;

        const last = pagos[pagos.length - 1];
        ultimoPago.innerHTML = `
          <div class="bloque-ultimo-pago">
            <span><b>Último pago realizado</b></span><br>
            <span><b>Correlativo:</b> ${last.correlativo}</span><br>
            <span><b>Fecha:</b> ${formatDate(last.fechaPago)}</span><br>
            <span><b>Monto pagado:</b> ${money(last.montoPagado)}</span><br>
            <span><b>Cajero:</b> ${last.cajeroNombre || ''}</span><br>
            <span><b>Capital:</b> ${money(last.pagoCapital)} &nbsp; 
                  <b>Interés:</b> ${money(last.pagoInteres)} &nbsp;
                  <b>Multas:</b> ${money(last.pagoMultas)}</span><br>
            <span><b>Saldo restante después del pago:</b> ${money(last.saldoRestante)}</span>
          </div>
        `;

        tbody.innerHTML = pagos.map((d, i) => `
          <tr class="${i === pagos.length - 1 ? 'resaltado' : ''}">
            <td>${d.correlativo}</td>
            <td>${formatDate(d.fechaPago)}</td>
            <td>${money(d.montoPagado)}</td>
            <td>${money(d.pagoCapital)}</td>
            <td>${money(d.pagoInteres)}</td>
            <td>${money(d.pagoMultas)}</td>
            <td>${d.cajeroNombre || ''}</td>
            <td>${money(d.saldoRestante)}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error(err);
        showEmpty("Error de permisos o índice faltante al consultar pagos. (Si aparece este mensaje, crea el índice compuesto en Firestore para creditoID + fechaPago).");
      }
    }

    // Util UI
    function resetUI() {
      document.getElementById('tabla-pagos').innerHTML = "";
      document.getElementById('resumen-totales').innerHTML = "";
      document.getElementById('ultimo-pago').innerHTML = "";
      document.getElementById('empty-msg').style.display = 'none';
      document.getElementById('creditos-wrapper').classList.add('hidden');
      document.getElementById('resumen-credito').classList.add('hidden');
      document.getElementById('credito-select').innerHTML = "";
      creditosDelCliente = [];
    }

    function showEmpty(msg) {
      document.getElementById('tabla-pagos').innerHTML = "";
      document.getElementById('resumen-totales').innerHTML = "";
      document.getElementById('ultimo-pago').innerHTML = "";
      const e = document.getElementById('empty-msg');
      e.textContent = msg;
      e.style.display = '';
    }
  </script>
</body>
</html>
