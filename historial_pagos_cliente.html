<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historial de Pagos por Cliente / Crédito</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --primary:#16b0bb;
      --primary-dark:#158196;
      --accent:#3586ea;
      --green:#19bb5b;
      --text:#22293d;
      --muted:#6b82a7;
      --bg:#f7fafd;
      --card:#ffffff;
      --card-brd:#e8eff5;
      --ring:#16d0bb33;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    /* ⬇️ Contenedor más ancho */
    .container {
      max-width: 1200px;
      margin: 2.2rem auto 0 auto;
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 6px 26px #3ad6d888, 0 1.5px 18px #0001;
      padding: 2.2rem 2rem 2.3rem 2rem;
    }
    .titulo {
      font-size: 1.75rem;
      color: var(--primary);
      font-weight: 800;
      margin-bottom: 1.1em;
      text-align: center;
      letter-spacing: .3px;
      display:flex; align-items:center; justify-content:center; gap:.5rem;
    }
    .titulo i{ opacity:.9 }

    /* Cinta informativa del filtro por crédito */
    .credit-banner{
      background: linear-gradient(100deg, #16d0ba19 0, #ffc34e1b 100%);
      border-left: 6px solid var(--primary);
      border-radius: 14px;
      padding: 14px 16px;
      margin: -4px 0 16px 0;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .credit-banner .info{
      color:#213;
      font-weight:600;
    }
    .credit-banner .actions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .btn{
      padding: 8px 16px; border-radius: 10px; border: none;
      color:#fff; font-weight:700; cursor:pointer;
      display:inline-flex; align-items:center; gap:8px;
      box-shadow: 0 2px 10px var(--ring);
      transition: background .14s, transform .1s;
    }
    .btn:hover{ transform: translateY(-1px) scale(1.02); }
    .btn-blue{ background: var(--accent); }
    .btn-green{ background: var(--green); }
    .btn-gray{ background: #748497; }

    .grid-head{
      display:grid; grid-template-columns: 1fr auto; gap:14px; align-items:center;
      margin-bottom: .8rem;
    }

    .input-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-group label {
      color: var(--muted);
      font-size: 1.03rem;
      font-weight: 600;
      margin-right: 6px;
    }
    .input-group input {
      width: 360px;
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.2px solid #c8eaf7;
      font-size: 1.04rem;
      transition: border-color 0.15s, box-shadow .15s;
      outline: none;
      background: #f5faff;
      color: #234;
      font-weight: 600;
    }
    .input-group input:focus {
      border-color: var(--primary);
      background: #e7fafd;
      box-shadow: 0 0 0 3px #16b0bb22;
    }
    .input-group button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg,var(--primary) 40%,var(--accent) 100%);
      color: #fff;
      font-weight: 700;
      font-size: 1.03rem;
      cursor: pointer;
      box-shadow: 0 2px 10px #16d0bb22;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.13s, transform .11s;
    }
    .input-group button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .resumen-totales {
      background: #effafd;
      border-radius: 14px;
      margin: 10px 0 21px 0;
      padding: 15px 20px 12px 20px;
      box-shadow: 0 1.5px 7px #16d0bb13;
      font-size: 1.03rem;
      display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px 18px;
    }
    .resumen-totales .item b{ color:#0b8b64 }

    .bloque-ultimo-pago {
      background: linear-gradient(100deg, #16d0ba19 0, #ffc34e1b 100%);
      border-left: 6px solid #19bb5b;
      border-radius: 13px;
      margin: 0 0 18px 0;
      padding: 14px 18px 12px 14px;
      box-shadow: 0 1px 8px #16d0bb10;
      color: #21222b;
    }
    .bloque-ultimo-pago b { color: var(--primary); }

    .tabla-wrapper{
      overflow:auto; border-radius: 14px; box-shadow: 0 1.5px 7px #16d0bb08;
      border:1px solid var(--card-brd);
    }
    .tabla-historial {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.98rem;
      background: #fff;
      table-layout: fixed;
      word-break: break-word;
    }
    .tabla-historial th, .tabla-historial td {
      padding: 11px 13px;
      border-bottom: 1px solid var(--card-brd);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tabla-historial th {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 1.02rem;
      border: none;
      position: sticky; top:0; z-index:1;
    }
    .tabla-historial tr:last-child td { border-bottom: none; }
    .resaltado {
      background: #e3fce9 !important;
      color: #0b8b64 !important;
      font-weight: bold;
    }
    .empty-msg {
      text-align: center;
      color: #babec8;
      padding: 24px 0 8px 0;
      font-size: 1.1rem;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      background:#f1f7ff; border:1px solid #dbe8ff; color:#23559c;
      padding:6px 10px; border-radius:999px; font-weight:700;
    }

    @media (max-width: 980px){
      .container { max-width: 99vw; padding:1.4rem .8rem 1.6rem .8rem;}
      .resumen-totales{ grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .tabla-historial th, .tabla-historial td { padding: 8px 10px; font-size: 0.95rem;}
    }
    @media (max-width: 600px){
      .grid-head{ grid-template-columns: 1fr; }
      .input-group input { width: 100%; }
      .container { padding:1.1rem .5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-receipt"></i> Historial de Pagos</div>

    <div id="credit-banner" class="credit-banner" style="display:none;">
      <div class="info">
        <div><b>Filtrando por crédito:</b> <span id="cb-credito" class="pill"></span></div>
        <div style="margin-top:6px; color:#4b5a6a;">
          <span><b>Cliente:</b> <span id="cb-cliente"></span></span> ·
          <span><b>Línea:</b> <span id="cb-linea"></span></span> ·
          <span><b>Cuota aprobada:</b> <span id="cb-cuota"></span></span> ·
          <span><b>Saldo actual:</b> <span id="cb-saldo"></span></span>
        </div>
      </div>
      <div class="actions">
        <button id="btn-ver-cliente" class="btn btn-blue" style="display:none;">
          <i class="fas fa-user"></i> Ver pagos del cliente
        </button>
        <button id="btn-ver-amort" class="btn btn-green" style="display:none;">
          <i class="fas fa-list"></i> Ver plan de pagos
        </button>
      </div>
    </div>

    <div class="grid-head">
      <div class="input-group">
        <label for="clienteID-input">Cliente ID:</label>
        <input id="clienteID-input" type="text" placeholder="Ingresa el ClienteID...">
        <button id="buscar-btn"><i class="fas fa-search"></i> Buscar</button>
      </div>
      <div id="filtros-activos" style="text-align:right; color:#567488;"></div>
    </div>

    <div id="resumen-totales"></div>
    <div id="ultimo-pago"></div>

    <div class="tabla-wrapper">
      <table class="tabla-historial">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Monto</th>
            <th>Capital</th>
            <th>Interés</th>
            <th>Multas</th>
            <th>Cajero</th>
            <th>Saldo Restante</th>
          </tr>
        </thead>
        <tbody id="tabla-pagos"></tbody>
      </table>
    </div>

    <div id="empty-msg" class="empty-msg" style="display:none"></div>
  </div>

  <!-- Firebase y lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, orderBy, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- Helpers de URL / formato ---
    function getParams() {
      const url = new URL(window.location.href);
      return {
        clienteID: url.searchParams.get("clienteID") || "",
        creditoID: url.searchParams.get("creditoID") || ""
      };
    }
    function formatMoney(n) {
      const x = Number(n ?? 0);
      return "$" + x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return (
        d.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        ' ' +
        d.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', hour12: true })
      );
    }

    // --- Estado auth y carga inicial ---
    let usuarioAutenticado = null;
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        usuarioAutenticado = user;
        init();
      }
    });

    document.getElementById('buscar-btn').onclick = () => {
      if (usuarioAutenticado) cargarHistorialPorCliente();
    };
    document.getElementById('clienteID-input').onkeydown = e => {
      if (e.key === "Enter" && usuarioAutenticado) cargarHistorialPorCliente();
    };

    async function init() {
      const { clienteID, creditoID } = getParams();

      // Si viene creditoID, priorizamos ese filtro
      if (creditoID) {
        document.getElementById('credit-banner').style.display = '';
        await cargarBannerCredito(creditoID); // llena datos de cabecera del crédito
        await cargarHistorialPorCredito(creditoID);
        // Prellenar el input de cliente cuando tengamos el cliente del crédito
        // (lo hacemos dentro de cargarBannerCredito)
      } else if (clienteID) {
        document.getElementById('clienteID-input').value = clienteID;
        await cargarHistorialPorCliente();
      }
    }

    // --- Cabecera/banner del crédito filtrado ---
    async function cargarBannerCredito(creditoID) {
      try {
        const ref = doc(db, "creditos", creditoID);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          document.getElementById('cb-credito').textContent = creditoID;
          document.getElementById('cb-cliente').textContent = "—";
          document.getElementById('cb-linea').textContent = "—";
          document.getElementById('cb-cuota').textContent = "—";
          document.getElementById('cb-saldo').textContent = "—";
          return;
        }
        const c = snap.data();

        document.getElementById('cb-credito').textContent = creditoID;
        document.getElementById('cb-cliente').textContent = ((c.nombre||"") + " " + (c.apellido||"")).trim() || (c.clienteID || "—");
        document.getElementById('cb-linea').textContent = c.lineaDeCredito || "—";
        document.getElementById('cb-cuota').textContent = c.cuotaAprobada != null ? formatMoney(c.cuotaAprobada) : "—";
        document.getElementById('cb-saldo').textContent = c.saldoActual != null ? formatMoney(c.saldoActual) : "—";

        // Botón "ver pagos del cliente"
        if (c.clienteID) {
          const btnCliente = document.getElementById('btn-ver-cliente');
          btnCliente.style.display = '';
          btnCliente.onclick = () => {
            window.location.href = `historial_pagos_cliente.html?clienteID=${encodeURIComponent(c.clienteID)}`;
          };
          // Prellenar input del cliente
          document.getElementById('clienteID-input').value = c.clienteID;
        }

        // Botón "ver plan de pagos"
        const btnAmort = document.getElementById('btn-ver-amort');
        btnAmort.style.display = '';
        btnAmort.onclick = () => {
          window.open(`amortizacion.html?id=${encodeURIComponent(creditoID)}`, '_self');
        };

        // Texto de filtros activos
        document.getElementById('filtros-activos').innerHTML =
          `Aplicando filtro por <b>Crédito</b> (<span class="pill">${creditoID}</span>)`;
      } catch {
        // Silencioso
      }
    }

    // --- Carga por crédito (principal para no mezclar pagos de distintos créditos) ---
    async function cargarHistorialPorCredito(creditoID) {
      limpiarUI();

      try {
        const pagosQ = query(
          collection(db, "pagos"),
          where("creditoID", "==", creditoID),
          orderBy("fechaPago", "asc")
        );
        const pagosSnap = await getDocs(pagosQ);

        let pagos = [];
        pagosSnap.forEach(doc => {
          const d = doc.data();
          if (!d.anulado) pagos.push(d);
        });

        if (!pagos.length) {
          document.getElementById('empty-msg').textContent =
            "No se encontraron pagos registrados para este crédito.";
          document.getElementById('empty-msg').style.display = '';
          return;
        }

        renderPagos(pagos);
      } catch (err) {
        document.getElementById('empty-msg').textContent =
          "Error de permisos o carga: inicia sesión para ver los pagos.";
        document.getElementById('empty-msg').style.display = '';
      }
    }

    // --- Carga por cliente (fallback / búsqueda manual) ---
    async function cargarHistorialPorCliente() {
      limpiarUI();

      const clienteID = document.getElementById('clienteID-input').value.trim();
      if (!clienteID) {
        document.getElementById('empty-msg').textContent = "Debes ingresar el ClienteID.";
        document.getElementById('empty-msg').style.display = '';
        return;
      }

      try {
        const pagosQ = query(
          collection(db, "pagos"),
          where("clienteID", "==", clienteID),
          orderBy("fechaPago", "asc")
        );
        const pagosSnap = await getDocs(pagosQ);

        let pagos = [];
        pagosSnap.forEach(doc => {
          const d = doc.data();
          if (!d.anulado) pagos.push(d);
        });

        if (!pagos.length) {
          document.getElementById('empty-msg').textContent = "No se encontraron pagos para este cliente.";
          document.getElementById('empty-msg').style.display = '';
          return;
        }

        // Texto de filtros activos
        document.getElementById('filtros-activos').innerHTML =
          `Aplicando filtro por <b>Cliente</b> (<span class="pill">${clienteID}</span>)`;

        renderPagos(pagos);
      } catch (err) {
        document.getElementById('empty-msg').textContent =
          "Error de permisos o carga: inicia sesión para ver los pagos.";
        document.getElementById('empty-msg').style.display = '';
      }
    }

    // --- Render / utilidades ---
    function limpiarUI(){
      document.getElementById('tabla-pagos').innerHTML = "";
      document.getElementById('resumen-totales').innerHTML = "";
      document.getElementById('ultimo-pago').innerHTML = "";
      document.getElementById('empty-msg').style.display = 'none';
      // No limpiamos banner ni filtros activos aquí para que persistan entre cargas.
    }

    function normalizaPago(p){
      return {
        ...p,
        montoPagado: Number(p.montoPagado ?? 0),
        pagoCapital: Number(p.pagoCapital ?? 0),
        pagoInteres: Number(p.pagoInteres ?? 0),
        // hay históricos con pagoMulta en singular
        pagoMultas: Number((p.pagoMultas ?? p.pagoMulta) ?? 0),
        saldoRestante: Number(p.saldoRestante ?? 0)
      };
    }

    function renderPagos(pagosRaw){
      const pagos = pagosRaw.map(normalizaPago);

      // Totales
      let totalPagado = 0, totalCapital = 0, totalInteres = 0, totalMultas = 0;
      pagos.forEach(d => {
        totalPagado += d.montoPagado;
        totalCapital += d.pagoCapital;
        totalInteres += d.pagoInteres;
        totalMultas += d.pagoMultas;
      });

      // Resumen
      document.getElementById('resumen-totales').innerHTML = `
        <div class="resumen-totales">
          <div class="item"><b>Total pagado:</b> ${formatMoney(totalPagado)}</div>
          <div class="item"><b>Total a capital:</b> ${formatMoney(totalCapital)}</div>
          <div class="item"><b>Total a intereses:</b> ${formatMoney(totalInteres)}</div>
          <div class="item"><b>Total a multas:</b> ${formatMoney(totalMultas)}</div>
          <div class="item"><b>Pagos realizados:</b> ${pagos.length}</div>
        </div>
      `;

      // Último pago (resaltado)
      const ultimo = pagos[pagos.length - 1];
      document.getElementById('ultimo-pago').innerHTML = `
        <div class="bloque-ultimo-pago">
          <div style="margin-bottom:6px;"><b>Último pago realizado</b></div>
          <div><b>Fecha:</b> ${formatDate(ultimo.fechaPago)}</div>
          <div><b>Monto pagado:</b> ${formatMoney(ultimo.montoPagado)}</div>
          <div><b>Cajero:</b> ${ultimo.cajeroNombre || ''}</div>
          <div>
            <b>Capital:</b> ${formatMoney(ultimo.pagoCapital)} &nbsp; 
            <b>Interés:</b> ${formatMoney(ultimo.pagoInteres)} &nbsp;
            <b>Multas:</b> ${formatMoney(ultimo.pagoMultas)}
          </div>
          <div><b>Saldo restante después del pago:</b> ${formatMoney(ultimo.saldoRestante)}</div>
        </div>
      `;

      // Tabla
      document.getElementById('tabla-pagos').innerHTML = pagos.map((d, i) => `
        <tr class="${i === pagos.length - 1 ? 'resaltado' : ''}">
          <td>${formatDate(d.fechaPago)}</td>
          <td>${formatMoney(d.montoPagado)}</td>
          <td>${formatMoney(d.pagoCapital)}</td>
          <td>${formatMoney(d.pagoInteres)}</td>
          <td>${formatMoney(d.pagoMultas)}</td>
          <td>${d.cajeroNombre || ''}</td>
          <td>${formatMoney(d.saldoRestante)}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
