<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historial de Pagos por Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #f7fafb;
      color: #2b2e38;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 550px;
      margin: 2.2rem auto 0 auto;
      background: #fff;
      border-radius: 19px;
      box-shadow: 0 4px 28px #3fd6c622;
      padding: 2.4rem 1.4rem 2rem 1.4rem;
      border: 1.7px solid #e8f3fb;
      transition: box-shadow 0.2s;
    }
    .container:focus-within {
      box-shadow: 0 6px 32px #18c8e477;
    }
    .titulo {
      font-size: 1.7rem;
      color: #16a8c9;
      font-weight: bold;
      margin-bottom: .5em;
      text-align: center;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .titulo i {
      color: #18c8e4;
      font-size: 1.45em;
    }
    .filtro-cliente {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 19px;
      flex-wrap: wrap;
    }
    .input-cliente {
      flex: 1 1 0;
      min-width: 190px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1.5px solid #d8eff6;
      font-size: 1.08rem;
      background: #f8fbfc;
      color: #336;
      outline: none;
      transition: border 0.16s;
    }
    .input-cliente:focus {
      border-color: #3fd6c6;
    }
    .btn-buscar {
      background: linear-gradient(90deg,#16a8c9 0,#3fd6c6 100%);
      color: #fff;
      font-weight: 700;
      padding: 9px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1.06rem;
      cursor: pointer;
      transition: background 0.13s, transform 0.10s;
      box-shadow: 0 1px 9px #3fd6c632;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .btn-buscar:active, .btn-buscar:hover {
      background: #0f7990;
      color: #fff;
      transform: scale(1.04);
    }
    .resumen-totales {
      background: #eafcff;
      border-radius: 12px;
      margin-bottom: 19px;
      padding: 14px 18px 9px 18px;
      box-shadow: 0 1px 7px #3fd6c612;
      color: #2a4b59;
      font-size: 1.06rem;
    }
    .resumen-totales .res-label { font-size: 1.01rem; color: #15b7c2; font-weight: 600; }
    .resumen-totales .res-num { font-size: 1.08rem; color: #1b3645; font-weight: bold; }
    .bloque-ultimo-pago {
      background: #dcffe7;
      border-left: 6px solid #39d177;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 13px 17px 7px 17px;
      box-shadow: 0 2px 9px #32f7b32a;
      color: #195;
    }
    .bloque-ultimo-pago span, .bloque-ultimo-pago b { font-size: 1.01rem; }
    .tabla-historial {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.99rem;
      background: #f8fcff;
      border-radius: 13px;
      box-shadow: 0 1px 7px #3fd6c618;
      overflow: hidden;
    }
    .tabla-historial th, .tabla-historial td {
      padding: 8px 10px;
      border-bottom: 1.2px solid #def4fa;
      text-align: center;
    }
    .tabla-historial th {
      background: #18c8e4;
      color: #fff;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 1.06rem;
    }
    .tabla-historial tr:last-child td { border-bottom: none; }
    .resaltado {
      background: #e1fff5 !important;
      color: #28b999 !important;
      font-weight: bold;
    }
    .empty-msg {
      text-align: center;
      color: #888;
      padding: 32px 0;
      font-size: 1.15rem;
    }
    @media (max-width:600px){
      .container{padding:1.1rem .13rem;}
      .tabla-historial th, .tabla-historial td { font-size: .95rem; }
      .filtro-cliente { flex-direction: column; gap: 7px;}
      .input-cliente { width: 99%; }
      .btn-buscar { width: 99%; justify-content: center;}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-file-invoice-dollar"></i> Historial de Pagos</div>
    <form id="filtro-form" class="filtro-cliente" onsubmit="return false;">
      <input id="clienteID-input" class="input-cliente" type="text" placeholder="ClienteID..." autocomplete="off">
      <button class="btn-buscar" id="buscar-btn" type="submit">
        <i class="fas fa-search"></i> Buscar
      </button>
    </form>
    <div id="resumen-totales"></div>
    <div id="ultimo-pago"></div>
    <table class="tabla-historial">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Monto</th>
          <th>Capital</th>
          <th>Interés</th>
          <th>Multas</th>
          <th>Cajero</th>
          <th>Saldo<br>Restante</th>
        </tr>
      </thead>
      <tbody id="tabla-pagos"></tbody>
    </table>
    <div id="empty-msg" class="empty-msg" style="display:none"></div>
  </div>

  <!-- Firebase y lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
        d.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    // Detectar clienteID desde la URL al cargar la página
    function getClienteIDFromURL() {
      const url = new URL(window.location.href);
      return url.searchParams.get("clienteID");
    }

    // Cargar historial SOLO si hay sesión iniciada y clienteID presente
    let usuarioAutenticado = null;
    let clienteID_actual = null;

    // Asignar valor al input y buscar automáticamente si hay clienteID en URL
    window.addEventListener('DOMContentLoaded', () => {
      const urlClienteID = getClienteIDFromURL();
      if (urlClienteID) {
        document.getElementById('clienteID-input').value = urlClienteID;
        clienteID_actual = urlClienteID;
      }
      // Esperar la sesión antes de buscar automáticamente
      onAuthStateChanged(auth, user => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        usuarioAutenticado = user;
        if (clienteID_actual) {
          cargarHistorial(clienteID_actual);
        }
      });
    });

    document.getElementById('filtro-form').onsubmit = function(e){
      const id = document.getElementById('clienteID-input').value.trim();
      if (id) {
        cargarHistorial(id);
      }
    }

    async function cargarHistorial(clienteID) {
      document.getElementById('tabla-pagos').innerHTML = "";
      document.getElementById('resumen-totales').innerHTML = "";
      document.getElementById('ultimo-pago').innerHTML = "";
      document.getElementById('empty-msg').style.display = 'none';

      if (!usuarioAutenticado) {
        document.getElementById('empty-msg').textContent = "Error de permisos: debes iniciar sesión para ver los pagos.";
        document.getElementById('empty-msg').style.display = '';
        return;
      }

      // Pagos de este cliente, excluyendo ANULADOS
      const pagosQ = query(
        collection(db, "pagos"),
        where("clienteID", "==", clienteID),
        orderBy("fechaPago", "asc")
      );
      const pagosSnap = await getDocs(pagosQ);

      let pagos = [];
      pagosSnap.forEach(doc => {
        const d = doc.data();
        if (!d.anulado) pagos.push(d);
      });

      if (!pagos.length) {
        document.getElementById('empty-msg').textContent = "No se encontraron pagos para este cliente.";
        document.getElementById('empty-msg').style.display = '';
        return;
      }

      // Calcular totales y cuotas pactadas
      let totalPagado = 0, totalCapital = 0, totalInteres = 0, totalMultas = 0;
      let cuotasPagadas = pagos.length, cuotasTotales = '', creditoID = pagos[0].creditoID;
      pagos.forEach(d => {
        totalPagado += Number(d.montoPagado || 0);
        totalCapital += Number(d.pagoCapital || 0);
        totalInteres += Number(d.pagoInteres || 0);
        totalMultas += Number(d.pagoMultas || 0);
      });

      // Buscar número de cuotas pactadas (opcional)
      try {
        if (creditoID) {
          const q = query(collection(db, "creditos"), where("__name__", "==", creditoID));
          const snap = await getDocs(q);
          if (!snap.empty) {
            const credito = snap.docs[0].data();
            cuotasTotales = credito.numeroCuotas || "";
          }
        }
      } catch {}

      // Render resumen totales
      document.getElementById('resumen-totales').innerHTML = `
        <div class="resumen-totales">
          <span class="res-label">Total pagado:</span> <span class="res-num">$${totalPagado.toFixed(2)}</span> <br>
          <span class="res-label">Total a capital:</span> <span class="res-num">$${totalCapital.toFixed(2)}</span> <br>
          <span class="res-label">Total a intereses:</span> <span class="res-num">$${totalInteres.toFixed(2)}</span> <br>
          <span class="res-label">Total a multas:</span> <span class="res-num">$${totalMultas.toFixed(2)}</span> <br>
          <span class="res-label">Pagos realizados:</span> <span class="res-num">${cuotasPagadas}${cuotasTotales ? " / " + cuotasTotales : ""} cuotas</span>
        </div>
      `;

      // Render último pago (resaltado)
      let ultimo = pagos[pagos.length - 1];
      document.getElementById('ultimo-pago').innerHTML = `
        <div class="bloque-ultimo-pago">
          <span><b>Último pago realizado</b></span><br>
          <span><b>Fecha:</b> ${formatDate(ultimo.fechaPago)}</span><br>
          <span><b>Monto pagado:</b> $${Number(ultimo.montoPagado).toFixed(2)}</span><br>
          <span><b>Cajero:</b> ${ultimo.cajeroNombre || ''}</span><br>
          <span><b>Capital:</b> $${Number(ultimo.pagoCapital || 0).toFixed(2)} &nbsp; 
                <b>Interés:</b> $${Number(ultimo.pagoInteres || 0).toFixed(2)} &nbsp;
                <b>Multas:</b> $${Number(ultimo.pagoMultas || 0).toFixed(2)}</span><br>
          <span><b>Saldo restante después del pago:</b> $${Number(ultimo.saldoRestante || 0).toFixed(2)}</span>
        </div>
      `;

      // Render tabla historial
      document.getElementById('tabla-pagos').innerHTML = pagos.map((d, i) => `
        <tr class="${i === pagos.length - 1 ? 'resaltado' : ''}">
          <td>${formatDate(d.fechaPago)}</td>
          <td>$${Number(d.montoPagado).toFixed(2)}</td>
          <td>$${Number(d.pagoCapital || 0).toFixed(2)}</td>
          <td>$${Number(d.pagoInteres || 0).toFixed(2)}</td>
          <td>$${Number(d.pagoMultas || 0).toFixed(2)}</td>
          <td>${d.cajeroNombre || ''}</td>
          <td>$${Number(d.saldoRestante || 0).toFixed(2)}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
