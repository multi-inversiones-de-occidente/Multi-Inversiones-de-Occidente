<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Master de Créditos</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Formato de dinero
    function money(n) {
      return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits:2 });
    }

    // Estado visual
    let creditos = [];
    let creditosFiltrados = [];
    let loading = true;

    // --- UI functions ---
    function mostrarCreditos() {
      const contenedor = document.getElementById("creditos-list");
      contenedor.innerHTML = "";
      if (loading) {
        contenedor.innerHTML = `<div class="loader"></div>`;
        return;
      }
      if (creditosFiltrados.length === 0) {
        contenedor.innerHTML = `<div class="noresult">No se encontraron créditos.</div>`;
        return;
      }
      for (const c of creditosFiltrados) {
        contenedor.innerHTML += `
          <div class="card-credito" onclick="verDetalleCredito('${c.id}')">
            <div class="icon"><span class="material-icons">credit_score</span></div>
            <div>
              <div class="nombre">${c.nombre || ""} ${c.apellido || ""}</div>
              <div class="info">
                <span>DUI: <b>${c.numeroDui || '-'}</b></span><br>
                <span>Monto: <b>${money(c.monto)}</b></span><br>
                <span>Estado: <b>${c.estadoCredito || '-'}</b></span>
              </div>
            </div>
          </div>
        `;
      }
    }

    // CAMBIADO: Navega a la página detalle con el id
    window.verDetalleCredito = function(id) {
      location.href = `detalle_credito.html?id=${id}`;
    };

    function aplicarFiltro(term) {
      term = (term || "").toLowerCase();
      creditosFiltrados = creditos.filter(c => {
        return (c.nombre || "").toLowerCase().includes(term)
          || (c.apellido || "").toLowerCase().includes(term)
          || (c.numeroDui || "").toLowerCase().includes(term);
      });
      mostrarCreditos();
    }

    async function cargarCreditos(department) {
      loading = true;
      mostrarCreditos();
      let q = query(collection(db, "creditos"), where("agenciaAsignada", "==", department));
      let snap = await getDocs(q);
      creditos = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
      creditosFiltrados = [...creditos];
      loading = false;
      mostrarCreditos();
    }

    window.addEventListener("DOMContentLoaded", async () => {
      // Autenticación y carga automática del departamento del usuario
      onAuthStateChanged(auth, async user => {
        if (!user) {
          location.href = "login.html";
          return;
        }
        // Buscar el usuario en la colección users para obtener el department
        const q = query(collection(db, "users"), where("__name__", "==", user.uid));
        const snap = await getDocs(q);
        if (snap.empty) {
          alert("No se encontró el usuario.");
          return;
        }
        const userData = snap.docs[0].data();
        const department = userData.department || "";
        document.getElementById("nombre-usuario").innerText = `${userData.nombre || ""} ${userData.apellido || ""}`.trim() || user.email;
        await cargarCreditos(department);
      });

      document.getElementById("busqueda").addEventListener("input", e => aplicarFiltro(e.target.value));
    });
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      margin: 0; background: #101012; color: #fff; min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    header {
      background: #191927; color: #fff; font-size: 1.35rem;
      font-weight: 600; letter-spacing: .5px; text-align:center;
      padding: 1.6rem 0 .8rem 0; margin-bottom: 0.3rem;
      box-shadow: 0 1px 0 #211a3d33;
    }
    .main-content {
      max-width: 480px; margin: 0 auto; padding: 1.3rem 1rem 2.5rem 1rem;
    }
    .search-bar {
      width: 100%;
      margin-bottom: 20px;
    }
    .search-bar input {
      width: 100%; background: #191927; color: #fff;
      border-radius: 9px; border: 1.5px solid #3f3860;
      padding: 13px 14px 13px 44px; font-size: 1.1rem;
      outline: none; box-sizing: border-box;
      transition: border .14s;
    }
    .search-bar input:focus { border-color: #845ef7; }
    .search-bar .material-icons {
      position: absolute; left: 17px; top: 14px; color: #dedede80; font-size: 1.2em;
    }
    .search-wrap { position:relative; }
    .creditos-list {
      margin-top: .2rem;
    }
    .card-credito {
      background: #181828; border-radius: 12px; padding: 1.15rem 1rem 1.1rem 1rem;
      margin-bottom: 15px; display: flex; gap: 15px; align-items: flex-start;
      cursor: pointer; box-shadow: 0 2px 10px #0002;
      transition: box-shadow .16s, background .11s;
    }
    .card-credito:hover { box-shadow: 0 3px 17px #0005; background: #201c2b; }
    .card-credito .icon {
      margin-top: 3px;
      font-size: 34px;
      background: #37335b;
      border-radius: 50%;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .card-credito .material-icons { color: #ffb300; font-size: 32px; }
    .nombre {
      color: #fff; font-size: 1.09rem; font-weight: 500; margin-bottom: 3px;
    }
    .info {
      color: #babad9; font-size: 15px; line-height: 1.45;
    }
    .noresult {
      color: #fff9; font-size: 1.08rem; text-align: center; margin: 2.6rem 0;
    }
    .loader {
      width: 38px; height: 38px; margin: 44px auto 50px auto; border-radius: 50%;
      border: 4.5px solid #4428c8; border-top: 4.5px solid #eee0; animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @media (max-width: 570px) {
      .main-content { max-width: 99vw; padding: 1rem .4rem 1.6rem .4rem; }
      .card-credito { font-size: .97rem; }
    }
    .usuario-info {
      font-size: .99rem;
      color: #ffe5b7;
      font-weight: 400;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header>Master de Créditos</header>
  <div class="main-content">
    <div class="usuario-info">
      <b>Usuario:</b> <span id="nombre-usuario">Cargando...</span>
    </div>
    <div class="search-bar search-wrap">
      <span class="material-icons">search</span>
      <input id="busqueda" type="search" placeholder="Buscar por nombre, apellido o DUI..." autocomplete="off"/>
    </div>
    <div class="creditos-list" id="creditos-list"></div>
  </div>
</body>
</html>
