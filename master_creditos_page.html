<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Master de Créditos</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let creditos = [];
    let filtered = [];
    let departamento = "";

    // Utilidad para mostrar mensajes o estados
    function setStatus(msg, color = "#aaa") {
      const el = document.getElementById("status-msg");
      el.textContent = msg;
      el.style.color = color;
      el.style.display = "block";
    }
    function clearStatus() {
      const el = document.getElementById("status-msg");
      el.textContent = "";
      el.style.display = "none";
    }

    async function loadCreditos() {
      setStatus("Cargando créditos...");
      document.getElementById("lista-creditos").innerHTML = "";
      if (!departamento) {
        setStatus("No tienes departamento asignado.", "#FFD600");
        return;
      }
      try {
        const q = query(collection(db, "creditos"), where("agenciaAsignada", "==", departamento));
        const querySnapshot = await getDocs(q);
        creditos = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        filtered = [...creditos];
        renderCreditos();
        clearStatus();
        if (filtered.length === 0) {
          setStatus("No se encontraron créditos en tu agencia.", "#FFD600");
        }
      } catch (e) {
        setStatus("Error al cargar créditos o permisos insuficientes.", "#FF6B6B");
        console.error(e);
      }
    }

    function renderCreditos() {
      const cont = document.getElementById("lista-creditos");
      if (filtered.length === 0) {
        cont.innerHTML = ""; // El mensaje de "no data" se pone arriba
        return;
      }
      cont.innerHTML = filtered.map(credito => `
        <div class="card-credito" onclick="verDetalle('${credito.id}')">
          <div class="icono"><span>💳</span></div>
          <div>
            <div class="nombre">${(credito.nombre || '')} ${(credito.apellido || '')}</div>
            <div class="info">
              <div><b>DUI:</b> ${credito.numeroDui || '-'}</div>
              <div><b>Monto:</b> $${credito.monto || '-'}</div>
              <div><b>Estado:</b> ${credito.estadoCredito || '-'}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.verDetalle = function (creditoId) {
      // Aquí puedes redirigir a un detalle real
      alert("Ver detalle de crédito: " + creditoId);
    };

    function applySearch() {
      const term = document.getElementById("search-input").value.toLowerCase();
      filtered = creditos.filter(credito => {
        const nombre = (credito.nombre || '').toLowerCase();
        const apellido = (credito.apellido || '').toLowerCase();
        const dui = (credito.numeroDui || '').toLowerCase();
        return nombre.includes(term) || apellido.includes(term) || dui.includes(term);
      });
      renderCreditos();
      if (filtered.length === 0) {
        setStatus("No se encontraron créditos con ese criterio.", "#FFD600");
      } else {
        clearStatus();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async user => {
        if (!user) {
          location.href = "login.html";
          return;
        }
        // Sacar departamento del usuario Firestore
        const userDoc = await getDoc(doc(db, "users", user.uid));
        departamento = userDoc.exists() ? (userDoc.data().department || "") : "";
        document.getElementById("usuario-nombre").textContent = user.email + (departamento ? " – " + departamento : "");
        document.querySelector(".main-card").style.display = "";
        document.getElementById("search-input").addEventListener("input", applySearch);
        await loadCreditos();
      });
    });
  </script>
  <style>
    body {
      background: #101015;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: #1a1a26;
      padding: 1.2rem 0;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    .main-card {
      max-width: 560px;
      margin: 28px auto 0 auto;
      background: #171728;
      border-radius: 16px;
      box-shadow: 0 6px 30px #0003;
      padding: 2.2rem 1.2rem 2rem 1.2rem;
      display: none;
    }
    .usuario-box {
      text-align: center;
      margin-bottom: 18px;
      color: #F8AF40;
      font-weight: 600;
      font-size: 1.08rem;
    }
    .searchbox {
      width: 100%;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #21213a;
      border-radius: 12px;
      padding: 0.55rem 1rem;
    }
    .searchbox input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.07rem;
      outline: none;
      padding: .5rem .3rem;
    }
    .searchbox input::placeholder { color: #cccc; }
    .icon-search { color: #aaa; font-size: 1.28rem; }
    #status-msg {
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 18px;
      color: #aaa;
      display: none;
    }
    #lista-creditos { margin-top: 4px; }
    .loader {
      margin: 44px auto 32px auto;
      border: 4px solid #222;
      border-top: 4px solid #ffbb00;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .no-data {
      color: #aaa;
      text-align: center;
      margin: 62px 0;
      font-size: 1.17rem;
    }
    .card-credito {
      background: #24243b;
      color: #fff;
      border-radius: 13px;
      box-shadow: 0 2px 10px #0002;
      display: flex;
      align-items: flex-start;
      padding: 1.3rem 1rem 1rem 1rem;
      margin-bottom: 16px;
      cursor: pointer;
      gap: 14px;
      transition: background .13s;
    }
    .card-credito:hover { background: #323258; }
    .icono {
      font-size: 2rem;
      margin-top: 3px;
      margin-right: 6px;
    }
    .nombre {
      font-weight: 600;
      font-size: 1.13rem;
      margin-bottom: 5px;
    }
    .info {
      color: #e0e0e0;
      font-size: 0.99rem;
      margin-bottom: 2px;
      margin-top: 4px;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      .main-card { padding: 1rem .3rem 2rem .3rem; max-width: 99vw; }
      .info { font-size: .97rem; }
    }
  </style>
</head>
<body>
  <header>Master de Créditos</header>
  <div class="main-card">
    <div class="usuario-box" id="usuario-nombre">Cargando usuario...</div>
    <div class="searchbox">
      <span class="icon-search">🔍</span>
      <input id="search-input" placeholder="Buscar por nombre, apellido o DUI..." autocomplete="off" />
    </div>
    <div id="status-msg"></div>
    <div id="lista-creditos"></div>
  </div>
</body>
</html>
