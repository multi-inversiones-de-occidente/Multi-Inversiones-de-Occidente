<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Pagar Crédito en Línea – Multi Inversiones</title>

  <!-- Firebase compat (misma versión que usabas) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-functions-compat.js"></script>

  <style>
    :root{
      --bg:#f5f7fb; --card:#fff; --text:#1b2b3a; --muted:#64748b;
      --primary:#0b8a52; --primary-2:#0a6e42; --brand:#243b86;
      --shadow:0 10px 25px rgba(16,24,40,.08);
      --radius:14px;
    }
    *{ box-sizing:border-box }
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display:flex; align-items:flex-start; justify-content:center;
    }
    .container{
      width:100%; max-width: 880px; padding: 20px; margin: 28px 16px;
    }
    .header{
      display:flex; align-items:center; gap:12px; margin-bottom:16px;
    }
    .brand{
      background:#fff; border-radius:999px; padding:8px 12px; box-shadow: var(--shadow);
      display:inline-flex; align-items:center; gap:10px; border:1px solid #eef2f7;
    }
    .brand b{ color: var(--brand); letter-spacing:.2px }
    h1{ font-size:1.25rem; margin:10px 0 18px 0; color:#0f172a }
    .card{
      background:var(--card); border-radius:var(--radius); box-shadow: var(--shadow);
      border: 1px solid #eef2f7;
      padding: 18px;
    }
    label{ display:block; font-weight:700; color:#0f172a; margin-bottom:6px; }
    input[type="text"], input[type="number"]{
      width:100%; padding:12px 12px; border-radius:10px; border:1px solid #d6dee8; outline:none;
      font-size:1rem; color:#0f172a; background:#fff;
    }
    input::placeholder{ color:#94a3b8 }
    .row{ display:grid; grid-template-columns: 1fr auto; gap:10px; }
    .btn{
      border:none; padding:12px 16px; border-radius:10px; font-weight:800; cursor:pointer;
      transition:.15s ease; display:inline-flex; align-items:center; gap:8px;
    }
    .btn-primary{ background:linear-gradient(90deg, var(--primary), var(--primary-2)); color:#fff; }
    .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 12px 24px rgba(11,138,82,.25) }
    .btn-ghost{ background:#f1f5f9; color:#0f172a; }
    .muted{ color: var(--muted); font-size:.95rem }
    .results{ margin-top:14px; display:grid; gap:10px; }
    .result-item{
      border:1px solid #e9edf3; border-radius:12px; padding:12px; background:#fff;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .kpis{ display:flex; gap:12px; flex-wrap:wrap; }
    .kpi{
      background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:8px 10px; text-align:center; min-width:130px;
    }
    .kpi b{ display:block; font-size:.9rem; color:#0f172a; margin-bottom:2px }
    .kpi span{ font-weight:800 }
    .pay-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .amount{ width:160px }
    .msg{ margin-top:12px; padding:12px; border-radius:10px; font-weight:700; text-align:center }
    .msg.error{ background:#fde2e1; color:#7a1c1c; border:1px solid #f7c3c0 }
    .msg.success{ background:#dcf7e9; color:#135a3b; border:1px solid #baf0d8 }
    .loader{ display:inline-block; width:16px; height:16px; border:2px solid #cbd5e1; border-top-color:#0b8a52; border-radius:50%; animation:spin .8s linear infinite }
    @keyframes spin{ to{ transform:rotate(1turn) } }
    .consent{ display:flex; align-items:flex-start; gap:8px; margin-top:8px; font-size:.95rem; color:#0f172a }
    .consent input{ margin-top:3px }
    .help{ margin-top:8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <img src="assets/logo_mi_bw.png" alt="Logo" height="26"/>
        <b>MULTI INVERSIONES DE OCCIDENTE</b>
      </div>
    </div>

    <h1>Pagar crédito en línea</h1>

    <!-- BLOQUE: Buscar por DUI (sin login) -->
    <div class="card" id="search-card">
      <label for="dui">Ingresa tu DUI (solo números)</label>
      <div class="row">
        <input id="dui" type="text" inputmode="numeric" placeholder="Ej.: 012345678" maxlength="9" />
        <button id="btn-buscar" class="btn btn-primary"><span id="sp-buscar">Buscar créditos</span></button>
      </div>
      <div class="help muted">Tu DUI se usará para localizar tus créditos activos. No necesitas crear cuenta.</div>
      <div id="search-msg" class="msg" style="display:none;"></div>
      <div id="results" class="results"></div>
    </div>

    <!-- BLOQUE: Mensaje global -->
    <div id="global-msg" class="msg" style="display:none;"></div>
  </div>

  <script>
    // ========= 1) Firebase =========
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    firebase.initializeApp(firebaseConfig);
    const functions = firebase.functions();

    // ========= 2) Helpers =========
    const $ = (id)=> document.getElementById(id);
    const show = (el, on=true)=> { el.style.display = on ? '' : 'none'; };
    const money = (v)=> {
      const n = Number.isFinite(v) ? v : parseFloat(String(v||0));
      return (Math.round((n + Number.EPSILON)*100)/100).toFixed(2);
    };
    const normDui = (s)=> (String(s||'').replace(/\D+/g,'').slice(0,9));
    const disable = (btn, on=true)=> {
      btn.disabled = on;
      if (on) { btn.dataset.originalText = btn.innerHTML; btn.innerHTML = `<span class="loader"></span>`; }
      else { btn.innerHTML = btn.dataset.originalText || 'Procesar'; }
    };

    // ========= 3) UI Buscar créditos por DUI =========
    const duiInput   = $('dui');
    const btnBuscar  = $('btn-buscar');
    const spBuscar   = $('sp-buscar');
    const resultsDiv = $('results');
    const searchMsg  = $('search-msg');
    const globalMsg  = $('global-msg');

    duiInput.addEventListener('input', ()=> {
      duiInput.value = normDui(duiInput.value);
    });

    btnBuscar.addEventListener('click', async ()=>{
      resultsDiv.innerHTML = '';
      show(searchMsg, false);
      show(globalMsg, false);

      const dui = normDui(duiInput.value);
      if (dui.length !== 9){
        searchMsg.className = 'msg error';
        searchMsg.textContent = 'Por favor ingresa un DUI válido (9 dígitos).';
        show(searchMsg, true);
        return;
      }

      try{
        disable(btnBuscar, true);
        // Llama a la Function: getResumenPorDUI
        const callable = functions.httpsCallable('getResumenPorDUI');
        const resp = await callable({ dui });

        const creditos = Array.isArray(resp.data?.creditos) ? resp.data.creditos : [];
        if (!creditos.length){
          resultsDiv.innerHTML = `<div class="muted">No encontramos créditos activos con ese DUI.</div>`;
          return;
        }

        // Render de tarjetas de crédito
        creditos.forEach(c => {
          const card = document.createElement('div');
          card.className = 'result-item';

          const left = document.createElement('div');
          left.innerHTML = `
            <div style="font-weight:800; color:#0f172a">${c.alias || 'Crédito'}</div>
            <div class="kpis">
              <div class="kpi"><b>Para ponerse al día</b><span>$${money(c.paraPonerseAlDia)}</span></div>
              <div class="kpi"><b>Saldo</b><span>$${money(c.saldoActual)}</span></div>
              ${c.cuotasVencidas>0 ? `<div class="kpi"><b>Cuotas vencidas</b><span>${c.cuotasVencidas}</span></div>`:''}
              ${c.proximaCuotaFecha ? `<div class="kpi"><b>Próxima cuota</b><span>${c.proximaCuotaFecha} ${c.proximaCuotaMonto? `• $${money(c.proximaCuotaMonto)}`:''}</span></div>`:''}
            </div>
            <div class="consent">
              <input type="checkbox" id="consent-${c.creditoID}"/>
              <label for="consent-${c.creditoID}" style="font-weight:600;">Declaro que soy el titular del DUI ingresado y autorizo el cargo por el monto seleccionado.</label>
            </div>
          `;

          const right = document.createElement('div');
          right.innerHTML = `
            <div class="pay-row">
              <button class="btn btn-ghost" data-action="ppd">Pagar PPD</button>
              <input class="amount" type="number" min="0.01" step="0.01" placeholder="Otro monto"/>
              <button class="btn btn-primary" data-action="custom">Pagar</button>
            </div>
            <div class="muted" style="margin-top:6px">El desglose exacto (multas/interés/capital) se aplicará al confirmar el pago.</div>
          `;

          // Wire actions
          const btnPPD = right.querySelector('button[data-action="ppd"]');
          const btnCustom = right.querySelector('button[data-action="custom"]');
          const inputAmount = right.querySelector('input.amount');

          btnPPD.addEventListener('click', ()=> iniciarCheckout({
            dui, creditoId: c.creditoID, amount: Number(c.paraPonerseAlDia||0), consentId:`consent-${c.creditoID}`, btn: btnPPD
          }));

          btnCustom.addEventListener('click', ()=> {
            const amt = parseFloat(inputAmount.value);
            iniciarCheckout({
              dui, creditoId: c.creditoID, amount: Number.isFinite(amt)? amt:0, consentId:`consent-${c.creditoID}`, btn: btnCustom
            });
          });

          card.appendChild(left);
          card.appendChild(right);
          resultsDiv.appendChild(card);
        });

      }catch(err){
        searchMsg.className = 'msg error';
        searchMsg.textContent = `Error al buscar: ${err?.message || err}`;
        show(searchMsg, true);
      }finally{
        disable(btnBuscar, false);
        spBuscar.textContent = 'Buscar créditos';
      }
    });

    // ========= 4) Crear checkout (anon) y redirigir =========
    async function iniciarCheckout({ dui, creditoId, amount, consentId, btn }){
      show(globalMsg, false);
      const consent = document.getElementById(consentId);
      if (!consent || !consent.checked){
        globalMsg.className = 'msg error';
        globalMsg.textContent = 'Debes aceptar la declaración de titularidad para continuar.';
        show(globalMsg, true);
        return;
      }
      if (!(amount > 0.009)){
        globalMsg.className = 'msg error';
        globalMsg.textContent = 'Ingresa un monto válido (mayor a $0.01).';
        show(globalMsg, true);
        return;
      }

      try{
        disable(btn, true);
        const callable = functions.httpsCallable('createCheckoutAnon');
        // returnUrl: página a la que el procesador volverá (la crearemos luego)
        const returnUrl = window.location.origin + '/estado-pago.html';
        const resp = await callable({ dui, creditoId, amount, returnUrl });

        const checkoutUrl = resp.data?.checkoutUrl;
        if (!checkoutUrl){
          throw new Error('No se recibió la URL de pago.');
        }
        // Redirige al checkout hospedado (Stripe/Wompi/PayPal)
        window.location.href = checkoutUrl;

      }catch(err){
        globalMsg.className = 'msg error';
        globalMsg.textContent = `No se pudo iniciar el pago: ${err?.message || err}`;
        show(globalMsg, true);
      }finally{
        disable(btn, false);
      }
    }
  </script>
</body>
</html>
