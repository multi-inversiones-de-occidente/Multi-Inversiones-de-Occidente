<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pagos – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.45rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #67C8F1;
    }
    .container {
      max-width: 600px;
      margin: 2.5rem auto 0 auto;
      background: #191919;
      border-radius: 18px;
      box-shadow: 0 2px 25px #0005;
      padding: 2.3rem 2.2rem;
      min-height: 320px;
    }
    .agencia-row {
      background: #222c2b;
      padding: 10px 18px 10px 15px;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #F8AF40;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 1px 7px #0003;
    }
    .agencia-row i {
      color: #67C8F1;
      font-size: 1.18rem;
    }
    .searchbar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .searchbar input {
      flex: 1;
      background: #212223;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid #333;
      color: #fff;
      font-size: 1rem;
    }
    .cliente-card {
      background: #232c31;
      border-radius: 12px;
      margin-bottom: 13px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #0004;
    }
    .cliente-info {
      font-size: 1rem;
      color: #fff;
    }
    .cliente-dui {
      font-size: 0.98rem;
      color: #8ae1fc;
      margin-top: 2px;
    }
    .btn-pagar {
      background: #13b66b;
      color: #fff;
      border: none;
      padding: 11px 24px;
      border-radius: 9px;
      font-size: 1.02rem;
      font-weight: bold;
      cursor: pointer;
      transition: background .18s;
      margin-left: 15px;
    }
    .btn-pagar:active, .btn-pagar:hover {
      background: #0b854c;
    }
    /* Modal estilos */
    .modal-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #111c;
      z-index: 9998;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: #fff;
      color: #1d2125;
      border-radius: 15px;
      box-shadow: 0 6px 38px #0008;
      padding: 30px 26px 26px 26px;
      max-width: 350px;
      width: 95%;
      z-index: 9999;
      position: relative;
      text-align: left;
      font-size: 1rem;
      animation: showmodal .18s;
    }
    @keyframes showmodal { from { transform: scale(.93); opacity:.6;} to {transform:none;opacity:1;} }
    .modal-title {
      font-size: 1.22rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #1d2125;
    }
    .modal-sub {
      color: #6a7d8a;
      font-size: 1rem;
      margin-bottom: 19px;
    }
    .modal-row { margin-bottom: 18px; }
    .input-group {
      display: flex;
      align-items: center;
      background: #f5f8fb;
      border-radius: 8px;
      padding-left: 10px;
      border: 1px solid #dedede;
    }
    .input-group span {
      color: #13b66b;
      font-size: 1.15rem;
      font-weight: bold;
      margin-right: 5px;
    }
    .input-group input {
      border: none;
      background: transparent;
      padding: 10px 6px 10px 0;
      color: #222;
      font-size: 1.12rem;
      outline: none;
      width: 100%;
    }
    .modal-btns {
      display: flex;
      gap: 13px;
      margin-top: 10px;
      justify-content: flex-end;
    }
    .modal-btn-cancel {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      transition: background .17s;
    }
    .modal-btn-cancel:hover { background: #bb2c1a; }
    .modal-btn-pay {
      background: #13b66b;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      transition: background .16s;
    }
    .modal-btn-pay:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .modal-btn-pay:hover:not(:disabled) { background: #0b854c; }
    .modal-error {
      color: #e74c3c;
      font-size: 0.98rem;
      margin-bottom: 7px;
    }
  </style>
</head>
<body>
  <header>Recepción de Pagos</header>
  <div class="container">
    <div class="agencia-row" id="agencia-row" style="display:none;">
      <i class="fas fa-building"></i>
      <span id="agencia-nombre"></span>
    </div>
    <div class="searchbar">
      <i class="fas fa-search"></i>
      <input id="buscador" type="text" placeholder="Buscar por nombre o DUI..."/>
    </div>
    <div id="clientes-list"></div>
  </div>
  <div id="modal-root"></div>

  <!-- Firebase & lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userDepartment = null;

    // --- Obtiene agency (department) del usuario actual y la muestra ---
    function obtenerAgenciaUsuario() {
      return new Promise((resolve, reject) => {
        onAuthStateChanged(auth, async user => {
          if (!user) {
            window.location.href = "login.html";
            return;
          }
          const usersRef = collection(db, "users");
          const q = query(usersRef, where("__name__", "==", user.uid));
          const snap = await getDocs(q);
          if (!snap.empty) {
            const data = snap.docs[0].data();
            userDepartment = data.department || null;
            // Mostrar en la UI
            const agenciaRow = document.getElementById('agencia-row');
            const agenciaNombre = document.getElementById('agencia-nombre');
            if (userDepartment) {
              agenciaNombre.textContent = userDepartment;
              agenciaRow.style.display = '';
            } else {
              agenciaRow.style.display = 'none';
            }
            resolve(userDepartment);
          } else {
            userDepartment = null;
            document.getElementById('agencia-row').style.display = 'none';
            resolve(null);
          }
        });
      });
    }

    // --- Busca clientes filtrados por agency ---
    async function buscarClientes(term) {
      const clientesList = document.getElementById("clientes-list");
      clientesList.innerHTML = "Cargando...";
      let clientes = [];
      if (!term.trim()) {
        clientesList.innerHTML = "";
        return;
      }
      if (!userDepartment) {
        clientesList.innerHTML = `<div style="color:#ccc;text-align:center;padding:34px 0;">No se detectó agencia asignada a tu usuario.</div>`;
        return;
      }
      const creditosRef = collection(db, "creditos");
      const q = query(creditosRef, where("estadoCredito", "==", "Activo"), where("agenciaAsignada", "==", userDepartment));
      const snap = await getDocs(q);
      snap.forEach(doc => {
        const d = doc.data();
        const nombre = (d.nombre || '').toLowerCase();
        const dui = (d.numeroDui || '').toLowerCase();
        if (nombre.includes(term.toLowerCase()) || dui.includes(term.toLowerCase())) {
          clientes.push({ id: doc.id, ...d });
        }
      });
      if (!clientes.length) {
        clientesList.innerHTML = `<div style="color:#ccc;text-align:center;padding:34px 0;">No se encontraron clientes para tu agencia.</div>`;
        return;
      }
      // Renderiza
      clientesList.innerHTML = clientes.map(cliente => `
        <div class="cliente-card">
          <div>
            <div class="cliente-info"><b>${cliente.nombre}</b></div>
            <div class="cliente-dui">DUI: ${cliente.numeroDui}</div>
          </div>
          <button class="btn-pagar" data-id="${cliente.id}" data-nombre="${cliente.nombre}" data-dui="${cliente.numeroDui}"><i class="fas fa-dollar-sign"></i> Pagar</button>
        </div>
      `).join('');
      // Vincular eventos pagar
      document.querySelectorAll('.btn-pagar').forEach(btn => {
        btn.onclick = function() {
          mostrarDialogoPago({
            id: btn.getAttribute('data-id'),
            nombre: btn.getAttribute('data-nombre'),
            numeroDui: btn.getAttribute('data-dui')
          });
        };
      });
    }

    // --- Modal de Pago Mejorado (sin JS inline) ---
    function mostrarDialogoPago(cliente) {
      let modalRoot = document.getElementById("modal-root");
      let monto = "";
      let errorMsg = "";

      function closeModal() { modalRoot.innerHTML = ""; }

      function pagarHandler() {
        const montoValue = document.getElementById("monto-input").value.trim();
        const montoNum = parseFloat(montoValue);
        if (isNaN(montoNum) || montoNum <= 0) {
          errorMsg = "Ingresa un monto válido mayor a $0.00";
          render();
          setTimeout(() => {
            document.getElementById("monto-input").focus();
          }, 50);
          return;
        }
        closeModal();
        // Aquí debes integrar la lógica real de pago y actualización en Firebase
        alert(`Pago de $${montoNum.toFixed(2)} realizado para ${cliente.nombre} (${cliente.numeroDui}).`);
      }

      function render() {
        modalRoot.innerHTML = `
          <div class="modal-bg" id="modal-bg">
            <div class="modal">
              <div class="modal-title">
                <i class="fas fa-coins" style="color:#13b66b;"></i> Pago a ${cliente.nombre}
              </div>
              <div class="modal-sub">
                <i class="fas fa-id-card"></i> DUI: <b>${cliente.numeroDui}</b>
              </div>
              <div class="modal-row">
                <label for="monto-input" style="font-weight:600;margin-bottom:2px;display:block;">Monto a pagar</label>
                <div class="input-group">
                  <span>$</span>
                  <input id="monto-input" type="number" min="0" step="0.01" placeholder="0.00" value="${monto}" autocomplete="off" autofocus/>
                </div>
              </div>
              ${errorMsg ? `<div class="modal-error">${errorMsg}</div>` : ""}
              <div class="modal-btns">
                <button class="modal-btn-cancel" id="cancelar-pago">Cancelar</button>
                <button class="modal-btn-pay" id="pagar-btn">Pagar</button>
              </div>
            </div>
          </div>
        `;
        // Asignar eventos después del render
        document.getElementById("cancelar-pago").onclick = closeModal;
        document.getElementById("pagar-btn").onclick = pagarHandler;
        document.getElementById("modal-bg").onclick = function(e) {
          if (e.target === this) closeModal();
        };
        document.getElementById("monto-input").onkeydown = e => {
          if (e.key === "Enter") document.getElementById("pagar-btn").click();
        };
      }
      render();
    }

    // --- Cargar agencia usuario y setear buscador ---
    window.addEventListener("DOMContentLoaded", async () => {
      await obtenerAgenciaUsuario();
      document.getElementById("buscador").addEventListener("input", e => {
        buscarClientes(e.target.value);
      });
    });
  </script>
</body>
</html>
