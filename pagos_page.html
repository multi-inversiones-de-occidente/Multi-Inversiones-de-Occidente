<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recepción de Pagos – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ====== NUEVA LÍNEA GRÁFICA ====== */
    :root{
      --bg:#f7f9fc; --bg-2:#eef2f7; --text:#0d1b2a; --white:#ffffff; --muted:#5b6776;
      --brand-blue:#243b86; --brand-cel:#67C8F1; --brand-green:#13b66b; --brand-gold:#F8AF40;
      --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(10,20,40,.08); --glass-shadow:0 20px 60px rgba(12,20,40,.12);
      --radius-2xl:24px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0c0f14; --bg-2:#0f141b; --text:#dfe6ef; --muted:#9aa6b6;
        --glass-bg:rgba(255,255,255,.10); --glass-brd:rgba(255,255,255,.18); --glass-shadow:0 24px 60px rgba(0,0,0,.45);
      }
    }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(36,59,134,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(248,175,64,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }
    .pattern{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(1px 1px at 25px 25px, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(1px 1px at 75px 75px, rgba(255,255,255,.06), transparent 40%);
      background-size:100px 100px; mix-blend-mode:soft-light; opacity:.5;
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
      border-bottom:1px solid var(--glass-brd);
    }
    @media (prefers-color-scheme: dark){
      header{ background:linear-gradient(180deg, rgba(15,20,30,.75), rgba(15,20,30,.35)); }
    }
    .topbar{
      max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:.8rem 16px;
    }
    .logo-plate{
      display:inline-flex; align-items:center; gap:10px; background:var(--glass-bg); border:1px solid var(--glass-brd);
      padding:8px 14px; border-radius:16px; box-shadow:var(--glass-shadow); position:relative; overflow:hidden; isolation:isolate;
    }
    .logo-plate::after{
      content:""; position:absolute; inset:-1px;
      background:linear-gradient(120deg, transparent 0 35%, rgba(255,255,255,.55) 45%, transparent 55% 100%);
      transform:translateX(-120%); animation:plateSheen 6s linear infinite; pointer-events:none;
    }
    @keyframes plateSheen{ 0%{transform:translateX(-120%)} 100%{transform:translateX(120%)} }
    .logo-plate img{ height:28px; width:auto; display:block }
    .brand-name{ font-weight:800; letter-spacing:.2px; color:var(--brand-blue); }
    .page-name{ margin-left:auto; font-weight:700; color:var(--muted); }
    .container{
      position:relative; z-index:1; max-width:900px; margin:0 auto; padding:2.2rem 16px 3rem;
      display:flex; flex-direction:column; align-items:center;
    }
    .visually-hidden{
      position:absolute !important; clip: rect(1px, 1px, 1px, 1px);
      padding:0; border:0; height:1px; width:1px; overflow:hidden; white-space:nowrap;
    }
    .identity-card{
      width:100%; max-width:900px; margin: .2rem auto 1.2rem auto;
      display:flex; align-items:center; gap:14px; padding:10px 12px;
      background:var(--glass-bg); border:1px solid var(--glass-brd); border-radius:22px;
      box-shadow:var(--glass-shadow); position:relative; overflow:hidden; isolation:isolate;
    }
    .identity-card::before{
      content:""; position:absolute; inset:-2px; border-radius:inherit; pointer-events:none;
      background: conic-gradient(from 220deg,
        rgba(103,200,241,.18), rgba(248,175,64,.16), rgba(19,182,107,.16), rgba(103,200,241,.18));
      filter: blur(8px); opacity:.45;
      mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
      -webkit-mask-composite: xor; mask-composite: exclude; padding:1px;
      animation: halo 10s linear infinite;
    }
    @keyframes halo{ to{ transform: rotate(1turn) } }
    .avatar{ width:60px; height:60px; padding:2px; border-radius:50%;
      background: conic-gradient(from 210deg, var(--brand-cel), var(--brand-gold), var(--brand-green), var(--brand-cel));
      position:relative; box-shadow: 0 8px 24px rgba(10,20,40,.15); flex: 0 0 auto; }
    .avatar .inner{ width:100%; height:100%; border-radius:50%;
      background: linear-gradient(180deg, #f6f9ff, #e9eef6);
      overflow:hidden; display:grid; place-items:center; }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
    .avatar .initials{ display:none; width:100%; height:100%; border-radius:50%;
      font-weight:800; letter-spacing:.5px; color:#243b86; font-size:1.05rem;
      background: linear-gradient(180deg, #ffffff, #ecf2fb);
      place-items:center; }
    .avatar .status{ position:absolute; right:2px; bottom:2px; width:12px; height:12px; border-radius:50%;
      background:#22c55e; border:2px solid #fff; box-shadow: 0 0 0 2px rgba(34,197,94,.2); }
    .who{ display:flex; flex-direction:column; gap:6px; min-width:0; width:100%; }
    .email-pill{ display:inline-flex; align-items:center; gap:10px; max-width:100%;
      padding:10px 14px; border-radius:999px;
      background: linear-gradient(180deg, rgba(36,59,134,.08), rgba(103,200,241,.08));
      border: 1px solid rgba(36,59,134,.15);
      font-weight:800; color:var(--brand-blue); letter-spacing:.2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
      position:relative; overflow:hidden; }
    .email-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .email-icon{ color: var(--brand-blue); opacity:.85; }
    .agencia-row{ width:100%; max-width:900px; background: rgba(103,200,241,.12);
      border:1px solid rgba(103,200,241,.25); color:#0f6aa0; font-weight:700; letter-spacing:.2px;
      padding:10px 14px; border-radius:14px; margin: 6px 0 16px 0; display:flex; align-items:center; gap:10px; }
    .agencia-row i{ color:#0f6aa0 }
    .searchbar{ width:100%; max-width:900px; display:flex; align-items:center; gap:10px; margin-bottom:16px;
      background:var(--glass-bg); border:1px solid var(--glass-brd); border-radius:18px; padding:10px 14px;
      box-shadow:var(--glass-shadow); }
    .searchbar i{ color:var(--muted) }
    .searchbar input{ flex:1; background:transparent; border:none; outline:none; color:var(--text);
      font-size:1.05rem; padding:8px 4px; }
    #clientes-list{ width:100%; max-width:900px; }
    .cliente-card{
      background:radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.65), rgba(255,255,255,.28) 40%, rgba(255,255,255,.18) 100%);
      border:1px solid var(--glass-brd);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(10,20,40,.12), 0 2px 6px rgba(10,20,40,.06);
      color:var(--text);
      border-radius:var(--radius-2xl);
      margin-bottom:14px; padding:16px 18px;
      display:flex; justify-content:space-between; align-items:center; gap:14px;
      transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
    }
    .cliente-card:hover{ transform: translateY(-2px); box-shadow:0 18px 45px rgba(10,20,40,.18), 0 6px 16px rgba(10,20,40,.12); }
    .cliente-info b{ font-size:1.07rem }
    .cliente-dui{ color:#3e92cc; margin-top:4px; font-weight:700 }
    .estado-mora{ color:#F08C00; font-weight:800; display:inline-flex; align-items:center; gap:6px; margin-left:8px; }
    .muted{ color:var(--muted); font-size:.92rem }
    .btn-pagar{
      background: linear-gradient(90deg, var(--brand-green) 0%, #0b854c 100%);
      color:#fff; border:none; padding:10px 18px; border-radius:12px;
      font-size:.98rem; font-weight:800; cursor:pointer; transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn-pagar:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(19,182,107,.35) }
    .modal-bg{ position: fixed; inset:0; background: rgba(8,12,20,.55); z-index: 50; display: grid; place-items:center; padding: 14px; }
    .modal{
      width: 100%; max-width: 520px; color: var(--text);
      background: radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.92), rgba(255,255,255,.78) 40%, rgba(255,255,255,.72) 100%);
      border:1px solid var(--glass-brd); border-radius:20px; box-shadow: var(--glass-shadow);
      padding: 22px 18px 16px 18px; position: relative; animation: showmodal .18s ease-out;
    }
    @keyframes showmodal { from { transform: translateY(6px) scale(.98); opacity:.6;} to {transform:none;opacity:1;} }
    .modal-title{ font-size:1.18rem; font-weight:800; margin-bottom:6px; color:var(--brand-blue); display:flex; align-items:center; gap:8px; }
    .modal-sub{ color:var(--muted); margin-bottom:12px; }
    .modal-row{ margin-bottom:12px; }
    .input-group{ display:flex; align-items:center; background: rgba(36,59,134,.06);
      border:1px solid rgba(36,59,134,.18); border-radius:12px; padding-left:10px; }
    .input-group span{ color: var(--brand-green); font-size:1.15rem; font-weight:800; margin-right:6px; }
    .input-group input{ border:none; background:transparent; padding:11px 10px; color:var(--text); font-size:1.12rem; outline:none; width:100%; }
    .modal-btns{ display:flex; gap:10px; justify-content:flex-end; margin-top:10px; }
    .modal-btn-cancel{
      background: linear-gradient(90deg, #e74c3c 0%, #8e0800 100%); color:#fff;
      border:none; padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:800; }
    .modal-btn-pay{
      background: linear-gradient(90deg, var(--brand-green) 0%, #0b854c 100%); color:#fff;
      border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:800; }
    .modal-btn-pay:disabled{ opacity:.5; cursor:not-allowed }
    .kpi-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
    .kpi{ background:rgba(36,59,134,.06); border:1px solid rgba(36,59,134,.18); border-radius:12px; padding:10px; text-align:center }
    .kpi b{ display:block; font-size:.98rem; margin-bottom:4px; color:#0f6aa0 }
    .kpi span{ font-weight:800 }
    .w-100{ width:100% }
  </style>
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>

  <header>
    <div class="topbar">
      <div class="logo-plate">
        <img src="assets/logo_mi_bw.png" alt="Logo" width="140" height="40"/>
        <strong class="brand-name">MULTI INVERSIONES DE OCCIDENTE</strong>
      </div>
      <div class="page-name">Recepción de Pagos</div>
    </div>
  </header>

  <div class="container">
    <h1 class="visually-hidden">Recepción de Pagos</h1>

    <div class="identity-card">
      <div class="avatar" aria-hidden="true">
        <div class="inner">
          <img id="usuario-avatar" alt="Avatar de usuario"/>
          <div id="usuario-iniciales" class="initials">U</div>
        </div>
        <span class="status" title="Conectado"></span>
      </div>
      <div class="who">
        <div class="email-pill" title="Usuario autenticado">
          <i class="fa-solid fa-user email-icon" aria-hidden="true"></i>
          <span id="usuario-email" class="email-text">usuario@correo.com</span>
        </div>
      </div>
    </div>

    <div class="agencia-row" id="agencia-row" style="display:none;">
      <i class="fas fa-building"></i>
      <span id="agencia-nombre"></span>
    </div>

    <div class="searchbar">
      <i class="fas fa-search"></i>
      <input id="buscador" type="text" placeholder="Buscar por nombre o DUI..."/>
    </div>

    <div id="clientes-list" class="w-100"></div>
  </div>

  <div id="modal-root"></div>

  <!-- ==================== Firebase & lógica ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    /* =================== NUM & DATE SAFETY =================== */
    const EPS = 1e-6;
    const TOL = 0.01;       // tolerancia centavos
    const CLOSE_TOL = 0.05; // tolerancia para cerrar capital/estado

    const nowISO = () => new Date().toISOString();
    const n = (x) => {
      if (typeof x === "number" && Number.isFinite(x)) return x;
      if (x === null || x === undefined) return 0;
      const v = parseFloat(String(x).replace(",", "."));
      return Number.isFinite(v) ? v : 0;
    };
    const add = (a,b)=> n(a)+n(b);
    const round2 = (v)=> Math.round((n(v)+Number.EPSILON)*100)/100;

    function parseLocalYMD(ymd){
      try{
        if(!ymd) return null;
        const [y,m,d] = String(ymd).substring(0,10).split("-").map(Number);
        return new Date(y, (m||1)-1, d||1, 0,0,0,0);
      }catch{ return null; }
    }
    function startOfToday(){
      const t = new Date(); t.setHours(0,0,0,0); return t;
    }
    function isBeforeTodayLocal(ymd){
      const d = parseLocalYMD(ymd); if (!d) return false;
      return d.getTime() < startOfToday().getTime();
    }
    function isTodayLocal(ymd){
      const d = parseLocalYMD(ymd); if (!d) return false;
      return d.getTime() === startOfToday().getTime();
    }
    function daysAtraso(ymd){
      const d = parseLocalYMD(ymd); if (!d) return -9999;
      const diff = (startOfToday().getTime() - d.getTime())/(1000*60*60*24);
      return Math.floor(diff); // >=0 incluye HOY como atraso de capital (alineado al cron)
    }

    /* =================== UI helpers =================== */
    function inicialesDesdeEmail(email){
      const base = (email || "").split("@")[0];
      const partes = base.split(/[.\-_]+/).filter(Boolean);
      let ini = partes.slice(0,2).map(s=>s[0]).join("").toUpperCase();
      if(!ini) ini = (email||"U")[0].toUpperCase();
      return ini;
    }

    /* =================== Firebase init =================== */
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    /* ===== Exponer helpers firestore ===== */
    window.firebaseAddDoc = async (collectionName, data) => {
      try{
        return await addDoc(collection(db, collectionName), data);
      }catch(e){ console.error("addDoc error:", e); throw e; }
    };
    window.firebaseUpdateDoc = async (collectionName, docId, data) => {
      try{
        await updateDoc(doc(db, collectionName, docId), data);
      }catch(e){ console.error("updateDoc error:", e); throw e; }
    };

    /* =================== Estado usuario/agencia =================== */
    let userDepartment = null;
    let userNameForTicket = "Sin Nombre";

    function setUserCard(user){
      try{
        const emailEl = document.getElementById("usuario-email");
        const imgEl   = document.getElementById("usuario-avatar");
        const initEl  = document.getElementById("usuario-iniciales");
        emailEl.textContent = user?.email || "usuario@correo.com";
        initEl.textContent  = inicialesDesdeEmail(user?.email || "U");
        const fallbackSrc = "assets/avatar_user.png";
        const usarIniciales = () => { imgEl.style.display = "none"; initEl.style.display = "grid"; };
        imgEl.onerror = () => {
          if (imgEl.dataset.fallbackTried === "1") usarIniciales();
          else { imgEl.dataset.fallbackTried = "1"; imgEl.src = fallbackSrc; }
        };
        imgEl.src = user?.photoURL || fallbackSrc;
      }catch(e){ console.warn("setUserCard:", e); }
    }

    function obtenerAgenciaUsuario() {
      return new Promise((resolve) => {
        onAuthStateChanged(auth, async user => {
          if (!user) { window.location.href = "login.html"; return; }
          setUserCard(user);
          try{
            const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
            if (!snap.empty) {
              const data = snap.docs[0].data();
              userDepartment = data.department || null;
              userNameForTicket = data.nombre_autorizacion || data.nombre || "Sin Nombre";
              const agenciaRow = document.getElementById('agencia-row');
              const agenciaNombre = document.getElementById('agencia-nombre');
              if (userDepartment) { agenciaNombre.textContent = `Agencia asignada: ${userDepartment}`; agenciaRow.style.display = ''; }
              else { agenciaRow.style.display = 'none'; }
              resolve(userDepartment);
            } else {
              userDepartment = null;
              document.getElementById('agencia-row').style.display = 'none';
              resolve(null);
            }
          }catch(err){
            console.error("Error obteniendo agencia:", err);
            userDepartment = null;
            document.getElementById('agencia-row').style.display = 'none';
            resolve(null);
          }
        });
      });
    }

    async function fetchCreditoById(creditoId){
      const snap = await getDocs(query(collection(db, "creditos"), where("__name__", "==", creditoId)));
      if (snap.empty) throw new Error("Crédito no encontrado.");
      const d = snap.docs[0];
      return { id: d.id, data: d.data() };
    }

    /* =================== Búsqueda/listado =================== */
    async function buscarClientes(term) {
      const clientesList = document.getElementById("clientes-list");
      clientesList.innerHTML = "Cargando...";
      if (!term.trim()) { clientesList.innerHTML = ""; return; }
      if (!userDepartment) {
        clientesList.innerHTML = `<div style="color:#9aa6b6;text-align:center;padding:34px 0;">No se detectó agencia asignada a tu usuario.</div>`;
        return;
      }
      try{
        const estadosPermitidos = ["Activo","Mora Temprana","Mora Moderada","Mora Severa","Riesgo Alto"];
        const q = query(collection(db, "creditos"),
                        where("estadoCredito", "in", estadosPermitidos),
                        where("agenciaAsignada", "==", userDepartment));
        const snap = await getDocs(q);
        const clientes = [];
        snap.forEach(s => {
          const d = s.data();
          const nombre = (d.nombre || '').toLowerCase();
          const dui = (d.numeroDui || '').toLowerCase();
          if (nombre.includes(term.toLowerCase()) || dui.includes(term.toLowerCase())) {
            clientes.push({ id: s.id, ...d });
          }
        });
        if (!clientes.length) {
          clientesList.innerHTML = `<div style="color:#9aa6b6;text-align:center;padding:34px 0;">No se encontraron clientes para tu agencia.</div>`;
          return;
        }
        clientesList.innerHTML = clientes.map(c => `
          <div class="cliente-card">
            <div>
              <div class="cliente-info">
                <b>${c.nombre}</b>
                ${c.estadoCredito !== "Activo"
                  ? `<span class="estado-mora" title="Estado: ${c.estadoCredito}">
                      <i class="fas fa-exclamation-triangle"></i>${c.estadoCredito}
                    </span>` : ""}
              </div>
              <div class="cliente-dui">DUI: ${c.numeroDui}</div>
              <div class="muted">Saldo: $${n(c.saldoActual).toFixed(2)} • Interés: $${n(c.interesActual).toFixed(2)} • Al día: $${n(c.paraPonerseAlDia).toFixed(2)}</div>
            </div>
            <button class="btn-pagar" data-id="${c.id}" data-nombre="${c.nombre}" data-dui="${c.numeroDui}">
              <i class="fas fa-dollar-sign"></i> Pagar
            </button>
          </div>
        `).join('');
        document.querySelectorAll('.btn-pagar').forEach(btn => {
          btn.onclick = async function() {
            try{
              const id = btn.getAttribute('data-id');
              const nombre = btn.getAttribute('data-nombre');
              const numeroDui = btn.getAttribute('data-dui');
              const { data } = await fetchCreditoById(id);
              mostrarDialogoPago({ id, nombre, numeroDui }, data);
            }catch(err){
              alert("No se pudo cargar el crédito: " + (err?.message || err));
            }
          };
        });
      }catch(err){
        console.error(err);
        clientesList.innerHTML = `<div style="color:#e74c3c;text-align:center;padding:34px 0;">Error buscando clientes: ${err.message}</div>`;
      }
    }

    /* ============ Correlativo único con transacción ============ */
    async function obtenerCorrelativoUnicoPagos(){
      const ref = doc(db, "counters", "pagos");
      const num = await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (!snap.exists()) {
          tx.set(ref, { next: 2 }); // primer correlativo será 1
          return 1;
        } else {
          const curr = n(snap.data().next);
          const use = curr || 1;
          tx.update(ref, { next: use + 1 });
          return use;
        }
      });
      return String(num).padStart(5, '0');
    }

    /* =================== Modal de pago =================== */
    function mostrarDialogoPago(cliente, creditoData) {
      const modalRoot = document.getElementById("modal-root");
      let monto = "";
      let errorMsg = "";

      // KPIs visibles para cajera (tomados tal cual del crédito)
      const kpi_interesActual = round2(n(creditoData.interesActual));
      const kpi_capitalAtrasado = round2(n(creditoData.capitalAtrasado));
      const kpi_ppd = round2(n(creditoData.paraPonerseAlDia));

      function closeModal(){ modalRoot.innerHTML = ""; }

      function render(){
        modalRoot.innerHTML = `
          <div class="modal-bg" onclick="event.target===this && (${closeModal.toString()})();">
            <div class="modal">
              <div class="modal-title">
                <i class="fas fa-coins" style="color:#13b66b;"></i> Pago a ${cliente.nombre}
              </div>
              <div class="modal-sub"><i class="fas fa-id-card"></i> DUI: <b>${cliente.numeroDui}</b></div>

              <!-- KPIs del crédito (visibles) -->
              <div class="kpi-grid" aria-label="Indicadores del crédito">
                <div class="kpi"><b>Para ponerse al día</b><span>$${kpi_ppd.toFixed(2)}</span></div>
                <div class="kpi"><b>Capital atrasado</b><span>$${kpi_capitalAtrasado.toFixed(2)}</span></div>
                <div class="kpi"><b>Interés actual</b><span>$${kpi_interesActual.toFixed(2)}</span></div>
              </div>

              <div class="modal-row">
                <label for="monto-input" style="font-weight:700;margin-bottom:6px;display:block;">Monto a pagar</label>
                <div class="input-group">
                  <span>$</span>
                  <input id="monto-input" type="number" min="0" step="0.01" placeholder="0.00" value="${monto}" autocomplete="off" autofocus/>
                </div>
                <div class="muted" style="margin-top:6px;">Orden: <b>Multas</b> → <b>Interés global</b> → <b>Capital</b> (en cadena).</div>
              </div>
              ${errorMsg ? `<div class="modal-error" style="color:#c0392b;font-weight:700">${errorMsg}</div>` : ""}
              <div class="modal-btns">
                <button class="modal-btn-cancel" id="cancelar-pago">Cancelar</button>
                <button class="modal-btn-pay" id="pagar-btn">Pagar</button>
              </div>
            </div>
          </div>`;
        document.getElementById("cancelar-pago").onclick = closeModal;
        document.getElementById("pagar-btn").onclick = async () => {
          try{
            const montoValue = document.getElementById("monto-input").value.trim();
            const montoNum = n(montoValue);
            if (!(montoValue.length) || !Number.isFinite(montoNum) || montoNum <= 0) {
              errorMsg = "Ingresa un monto válido mayor a $0.00";
              render(); setTimeout(()=>document.getElementById("monto-input")?.focus(), 50);
              return;
            }
            await realizarPago(cliente, montoNum);
            closeModal();
          }catch(err){
            alert("Error al realizar el pago: " + (err?.message || err));
          }
        };
        const inp = document.getElementById("monto-input");
        inp.onkeydown = e => { if (e.key === "Enter") document.getElementById("pagar-btn").click(); };
        setTimeout(()=> inp?.focus(), 0);
      }
      render();
    }

    /* =================== LÓGICA DE PAGO =================== */
    async function realizarPago(cliente, montoNum){
      const fechaPago = nowISO();
      try{
        const user = auth.currentUser;
        if(!user) throw new Error("Sesión inválida. Inicia sesión.");

        // Datos del cajero / sucursal
        const userSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
        const userData = userSnap?.docs?.[0]?.data() || {};
        const cajeroNombre = userData.nombre_autorizacion || userData.nombre || userNameForTicket || "Sin Nombre";
        const sucursal = userData.department || userDepartment || "N/A";

        // Traer crédito
        const { data: creditoData } = await fetchCreditoById(cliente.id);

        // ======== 0) Correlativo seguro (antes de todo) ========
        const correlativoStr = await obtenerCorrelativoUnicoPagos();

        // ======== 0.1) Guardar snapshot previo para reversión ========
        // Se guarda TODO el crédito tal cual, más el correlativo y metadatos.
        await window.firebaseAddDoc("reversionPago", {
          correlativo: Number(correlativoStr),
          creditoID: cliente.id,
          clienteID: creditoData.clienteID || "",
          snapshot: JSON.parse(JSON.stringify(creditoData)),
          createdAt: new Date(),
          realizadoPorUID: user.uid,
          realizadoPorNombre: cajeroNombre,
          sucursal: sucursal
        });

        // ======== 1) Normalizar estructuras ========
        let saldoActual = round2(n(creditoData.saldoActual));
        let interesActual = round2(n(creditoData.interesActual)); // TAL CUAL Cron
        let multasAcumuladas = round2(n(creditoData.multasAcumuladas));
        let paraPonerseAlDia = round2(n(creditoData.paraPonerseAlDia));

        let amortizacion = Array.isArray(creditoData.amortizacion) ? JSON.parse(JSON.stringify(creditoData.amortizacion)) : [];
        amortizacion = amortizacion.map(c => ({
          ...c,
          capital: n(c.capital),
          interes: n(c.interes),
          cuota: n(c.cuota),
          saldo: n(c.saldo),
          montoPagado: n(c.montoPagado),                  // usado como capital pagado
          montoPagadoInteres: n(c.montoPagadoInteres),    // legacy/visual
          estado: c.estado || "Pendiente",
          fecha: c.fecha,
          fechaPagoReal: c.fechaPagoReal || null,
          numeroCuota: c.numeroCuota
        }));

        let historialMultas = Array.isArray(creditoData.historialMultas)
          ? JSON.parse(JSON.stringify(creditoData.historialMultas)).filter(m => !!m)
          : [];

        let restante = round2(n(montoNum));
        let pagoMultas = 0, pagoInteres = 0, pagoCapital = 0;

        // ======== 2) MULTAS primero ========
        // Ordenar por fecha (antiguas primero)
        historialMultas.sort((a,b) => new Date(a.fecha||0) - new Date(b.fecha||0));
        for (let i=0; i<historialMultas.length && restante>EPS; i++){
          const m = historialMultas[i];
          const noPag = (!m.estadoCuota || m.estadoCuota === "No Pagada");
          if (!noPag) continue;
          const montoMulta = round2(n(m.monto));
          if (montoMulta <= EPS){ m.estadoCuota = "Pagada"; continue; }
          const pagar = Math.min(restante, montoMulta);
          if (pagar > EPS){
            pagoMultas = add(pagoMultas, pagar);
            restante = round2(restante - pagar);
            const nuevo = round2(montoMulta - pagar);
            if (nuevo <= EPS){ m.estadoCuota = "Pagada"; m.monto = 0; }
            else { m.monto = nuevo; m.estadoCuota = "No Pagada"; }
          }
        }
        // Recalcular multasAcumuladas = suma de No Pagadas
        multasAcumuladas = round2(historialMultas.reduce((acc,m)=>{
          if (!m.estadoCuota || m.estadoCuota === "No Pagada") return acc + n(m.monto);
          return acc;
        }, 0));

        // ======== 3) INTERÉS GLOBAL (no por cuota) ========
        if (restante > EPS && interesActual > EPS){
          const aplicadoInteres = Math.min(restante, interesActual);
          pagoInteres = add(pagoInteres, aplicadoInteres);
          restante = round2(restante - aplicadoInteres);
          interesActual = round2(interesActual - aplicadoInteres);
        }

        // ======== 4) CAPITAL en cadena ========
        function abonarCapital(selectorFn){
          for (let i=0; i<amortizacion.length && restante>EPS; i++){
            const c = amortizacion[i];
            if (!selectorFn(c)) continue;
            const faltaCap = Math.max(0, round2(n(c.capital) - n(c.montoPagado)));
            if (faltaCap <= EPS) continue;
            const abono = Math.min(restante, faltaCap);
            c.montoPagado = round2(add(c.montoPagado, abono));
            pagoCapital = add(pagoCapital, abono);
            restante = round2(restante - abono);
          }
        }
        // Orden: vencidas (< hoy) → hoy → futuras (> hoy)
        abonarCapital(c=> isBeforeTodayLocal(c.fecha));
        abonarCapital(c=> isTodayLocal(c.fecha));
        abonarCapital(c=> !isBeforeTodayLocal(c.fecha) && !isTodayLocal(c.fecha));

        // ======== 5) Estados por cuota (por capital) ========
        for (let i=0;i<amortizacion.length;i++){
          const c = amortizacion[i];
          const capOk = n(c.montoPagado) + CLOSE_TOL >= n(c.capital);
          if (capOk){ c.estado = "Pagada"; if (!c.fechaPagoReal) c.fechaPagoReal = fechaPago; }
          else if (n(c.montoPagado) > EPS){ c.estado = "Parcial"; c.fechaPagoReal = null; }
          else { c.estado = "Pendiente"; c.fechaPagoReal = null; }
        }

        // ======== 6) KPIs (alineados al cron) ========
        // capitalVencido: sumar capital pendiente de cuotas con diasAtraso >= 0 (incluye HOY)
        let capitalAtrasado = 0;
        let cuotasAtrasadas = 0;
        let maxDiasAtraso = 0;

        for (const c of amortizacion){
          const atras = daysAtraso(c.fecha);
          const faltaCap = Math.max(0, round2(n(c.capital) - n(c.montoPagado)));
          if (atras >= 0 && faltaCap > EPS){
            capitalAtrasado = round2(add(capitalAtrasado, faltaCap));
          }
          if (atras >= 1 && faltaCap > EPS){
            cuotasAtrasadas++;
            if (atras > maxDiasAtraso) maxDiasAtraso = atras;
          }
        }

        // PPD = interesActual + capitalAtrasado + multas No Pagadas
        paraPonerseAlDia = round2(add(add(interesActual, capitalAtrasado), multasAcumuladas));

        // ======== 7) saldoActual (simple) ========
        const saldoAnterior = round2(n(creditoData.saldoActual));
        let saldoNuevo = round2(saldoAnterior - pagoCapital);
        if (saldoNuevo < 0) saldoNuevo = 0;

        // ======== 8) Estado del crédito ========
        let nuevoEstado = (saldoNuevo <= EPS) ? "Pagado" : (creditoData.estadoCredito || "Activo");
        if (nuevoEstado !== "Pagado"){
          if (cuotasAtrasadas > 0){
            if (maxDiasAtraso <= 30) nuevoEstado = "Mora Temprana";
            else if (maxDiasAtraso <= 60) nuevoEstado = "Mora Moderada";
            else if (maxDiasAtraso <= 90) nuevoEstado = "Mora Severa";
            else if (maxDiasAtraso <= 180) nuevoEstado = "Riesgo Alto";
            else nuevoEstado = "Cobro Judicial";
          } else {
            nuevoEstado = "Activo";
          }
        }

        // ======== 9) Recibo (auditoría) ========
        await window.firebaseAddDoc("pagos", {
          clienteID: creditoData.clienteID,
          creditoID: cliente.id,
          nombres: creditoData.nombre,
          apellido: creditoData.apellido || "",
          numeroDui: creditoData.numeroDui || "",
          montoPagado: round2(montoNum),
          fechaPago: fechaPago,
          pagoMultas: round2(pagoMultas),
          pagoInteres: round2(pagoInteres),
          pagoCapital: round2(pagoCapital),
          saldoRestante: round2(saldoNuevo),
          cajeroID: user.uid,
          cajeroNombre: cajeroNombre,
          sucursal: sucursal,
          correlativo: Number(correlativoStr),
          timestamp: new Date(),
          paraPonerseAlDiaAntes: round2(n(creditoData.paraPonerseAlDia)),
          paraPonerseAlDiaDespues: round2(paraPonerseAlDia)
        });

        // ======== 10) Persistir crédito actualizado ========
        await window.firebaseUpdateDoc("creditos", cliente.id, {
          saldoActual: round2(saldoNuevo),
          interesActual: round2(interesActual),
          capitalAtrasado: round2(capitalAtrasado),
          paraPonerseAlDia: round2(paraPonerseAlDia),
          multasAcumuladas: round2(multasAcumuladas),
          cuotasAtrasadas: cuotasAtrasadas,
          ultimaActualizacion: fechaPago,
          // SIN tocar fechaUltimoCalculoIntereses: la maneja el CRON
          estadoCredito: nuevoEstado,
          amortizacion: amortizacion,
          historialMultas: historialMultas
        });

        // ======== 11) Redirigir a ticket ========
        const url = `ticket_page.html?correlativo=${encodeURIComponent(correlativoStr)}` +
          `&cliente=${encodeURIComponent(creditoData.nombre)}` +
          `&apellido=${encodeURIComponent(creditoData.apellido || '')}` +
          `&numeroDui=${encodeURIComponent(creditoData.numeroDui || '')}` +
          `&monto=${encodeURIComponent(round2(montoNum).toFixed(2))}` +
          `&agencia=${encodeURIComponent(sucursal)}` +
          `&fecha=${encodeURIComponent(fechaPago)}` +
          `&pagoCapital=${encodeURIComponent(round2(pagoCapital).toFixed(2))}` +
          `&pagoInteres=${encodeURIComponent(round2(pagoInteres).toFixed(2))}` +
          `&pagoMultas=${encodeURIComponent(round2(pagoMultas).toFixed(2))}` +
          `&saldoRestante=${encodeURIComponent(round2(saldoNuevo).toFixed(2))}`;
        window.location.href = url;

      }catch(e){
        console.error(e);
        alert("Error al realizar el pago: " + (e?.message || e));
        throw e;
      }
    }

    /* =================== Inicio =================== */
    window.addEventListener("DOMContentLoaded", async () => {
      try{
        await obtenerAgenciaUsuario();
        const buscador = document.getElementById("buscador");
        buscador.addEventListener("input", e => { buscarClientes(e.target.value); });
      }catch(e){
        console.error("Init error:", e);
        alert("No se pudo inicializar la página de pagos.");
      }
    });
  </script>
</body>
</html>
