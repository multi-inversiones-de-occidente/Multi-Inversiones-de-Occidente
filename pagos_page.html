<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recepción de Pagos – Multi Inversiones (política estricta)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #101212; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    header { background: #000; padding: 1rem 0; text-align: center; font-size: 1.45rem; letter-spacing: 1px; font-weight: 700; color: #67C8F1;}
    .container { max-width: 600px; margin: 2.5rem auto 0 auto; background: #191919; border-radius: 18px; box-shadow: 0 2px 25px #0005; padding: 2.3rem 2.2rem; min-height: 320px;}
    .agencia-row { background: #222c2b; padding: 10px 18px 10px 15px; border-radius: 9px; margin-bottom: 17px; font-size: 1.1rem; font-weight: 600; color: #F8AF40; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 7px #0003;}
    .agencia-row i { color: #67C8F1; font-size: 1.18rem;}
    .searchbar { margin-bottom: 20px; display: flex; align-items: center; gap: 8px;}
    .searchbar input { flex: 1; background: #212223; padding: 10px 12px; border-radius: 9px; border: 1px solid #333; color: #fff; font-size: 1rem;}
    .cliente-card { background: #232c31; border-radius: 12px; margin-bottom: 13px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 12px #0004;}
    .cliente-info { font-size: 1rem; color: #fff;}
    .cliente-dui { font-size: 0.98rem; color: #8ae1fc; margin-top: 2px;}
    .estado-mora { color: #FFD166; font-weight: 600; font-size: 0.96rem; display: flex; align-items: center; gap: 5px;}
    .btn-pagar { background: #13b66b; color: #fff; border: none; padding: 11px 24px; border-radius: 9px; font-size: 1.02rem; font-weight: bold; cursor: pointer; transition: background .18s; margin-left: 15px;}
    .btn-pagar:active, .btn-pagar:hover { background: #0b854c; }
    .modal-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #111c; z-index: 9998; display: flex; align-items: center; justify-content: center;}
    .modal { background: #fff; color: #1d2125; border-radius: 15px; box-shadow: 0 6px 38px #0008; padding: 30px 26px 26px 26px; max-width: 350px; width: 95%; z-index: 9999; position: relative; text-align: left; font-size: 1rem; animation: showmodal .18s;}
    @keyframes showmodal { from { transform: scale(.93); opacity:.6;} to {transform:none;opacity:1;} }
    .modal-title { font-size: 1.22rem; font-weight: bold; margin-bottom: 6px; color: #1d2125;}
    .modal-sub { color: #6a7d8a; font-size: 1rem; margin-bottom: 19px;}
    .modal-row { margin-bottom: 18px; }
    .input-group { display: flex; align-items: center; background: #f5f8fb; border-radius: 8px; padding-left: 10px; border: 1px solid #dedede;}
    .input-group span { color: #13b66b; font-size: 1.15rem; font-weight: bold; margin-right: 5px;}
    .input-group input { border: none; background: transparent; padding: 10px 6px 10px 0; color: #222; font-size: 1.12rem; outline: none; width: 100%; }
    .modal-btns { display: flex; gap: 13px; margin-top: 10px; justify-content: flex-end;}
    .modal-btn-cancel { background: #e74c3c; color: #fff; border: none; padding: 10px 18px; border-radius: 7px; cursor: pointer; font-weight: bold; transition: background .17s;}
    .modal-btn-cancel:hover { background: #bb2c1a; }
    .modal-btn-pay { background: #13b66b; color: #fff; border: none; padding: 10px 22px; border-radius: 7px; cursor: pointer; font-weight: bold; transition: background .16s;}
    .modal-btn-pay:disabled { opacity: .45; cursor: not-allowed;}
    .modal-btn-pay:hover:not(:disabled) { background: #0b854c; }
    .modal-error { color: #e74c3c; font-size: 0.98rem; margin-bottom: 7px;}
  </style>
</head>
<body>
  <header>Recepción de Pagos</header>
  <div class="container">
    <div class="agencia-row" id="agencia-row" style="display:none;">
      <i class="fas fa-building"></i>
      <span id="agencia-nombre"></span>
    </div>
    <div class="searchbar">
      <i class="fas fa-search"></i>
      <input id="buscador" type="text" placeholder="Buscar por nombre o DUI..."/>
    </div>
    <div id="clientes-list"></div>
  </div>
  <div id="modal-root"></div>

  <!-- Firebase & lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // ==== Utilidades de fecha ====
    function startOfLocalDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
    function parseDateMaybe(s){ try{ const d = new Date(s); return isNaN(d.getTime())? null : d; }catch{ return null; } }

    // ==== Redondeo estricto a 2 decimales y tolerancia (0.8 ctvs) ====
    const r2 = (x) => +((Math.round((+x + Number.EPSILON) * 100) / 100).toFixed(2));
    const EPS = 0.008;

    // ==== Firebase init ====
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userDepartment = null;

    // ==== Correlativo único (blindado) ====
    async function obtenerCorrelativoUnicoPagos() {
      const pagosSnap = await getDocs(collection(db, "pagos"));
      const usados = new Set();
      pagosSnap.forEach(d => {
        let c = d.data().correlativo;
        if (typeof c === 'string' && !isNaN(c)) c = Number(c);
        if (typeof c === 'number' && c > 0) usados.add(c);
      });
      let corr = 1; while (usados.has(corr)) corr++; return corr;
    }

    function obtenerAgenciaUsuario() {
      return new Promise((resolve) => {
        onAuthStateChanged(auth, async user => {
          if (!user) { window.location.href = "login.html"; return; }
          const usersRef = collection(db, "users");
          const q = query(usersRef, where("__name__", "==", user.uid));
          const snap = await getDocs(q);
          if (!snap.empty) {
            const data = snap.docs[0].data();
            userDepartment = data.department || null;
            const agenciaRow = document.getElementById('agencia-row');
            const agenciaNombre = document.getElementById('agencia-nombre');
            if (userDepartment) { agenciaNombre.textContent = userDepartment; agenciaRow.style.display = ''; }
            else { agenciaRow.style.display = 'none'; }
            resolve(userDepartment);
          } else { userDepartment = null; document.getElementById('agencia-row').style.display = 'none'; resolve(null); }
        });
      });
    }

    async function buscarClientes(term) {
      const clientesList = document.getElementById("clientes-list");
      clientesList.innerHTML = "Cargando...";
      let clientes = [];
      if (!term.trim()) { clientesList.innerHTML = ""; return; }
      if (!userDepartment) { clientesList.innerHTML = `<div style="color:#ccc;text-align:center;padding:34px 0;">No se detectó agencia asignada a tu usuario.</div>`; return; }
      const estadosPermitidos = ["Activo", "Mora Temprana", "Mora Moderada", "Mora Severa", "Riesgo Alto"]; // excluye Pagado/Anulado
      const creditosRef = collection(db, "creditos");
      const q = query(creditosRef, where("estadoCredito", "in", estadosPermitidos), where("agenciaAsignada", "==", userDepartment));
      const snap = await getDocs(q);
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const nombre = (d.nombre || '').toLowerCase();
        const dui = (d.numeroDui || '').toLowerCase();
        if (nombre.includes(term.toLowerCase()) || dui.includes(term.toLowerCase())) {
          clientes.push({ id: docSnap.id, ...d });
        }
      });
      if (!clientes.length) { clientesList.innerHTML = `<div style="color:#ccc;text-align:center;padding:34px 0;">No se encontraron clientes para tu agencia.</div>`; return; }
      clientesList.innerHTML = clientes.map(cliente => `
        <div class="cliente-card">
          <div>
            <div class="cliente-info">
              <b>${cliente.nombre}</b>
              ${cliente.estadoCredito !== "Activo"
                ? `<span class="estado-mora" title="Estado: ${cliente.estadoCredito}">
                    <i class="fas fa-exclamation-triangle"></i>
                    ${cliente.estadoCredito}
                  </span>`
                : ""}
            </div>
            <div class="cliente-dui">DUI: ${cliente.numeroDui}</div>
          </div>
          <button class="btn-pagar" data-id="${cliente.id}" data-nombre="${cliente.nombre}" data-dui="${cliente.numeroDui}"><i class="fas fa-dollar-sign"></i> Pagar</button>
        </div>
      `).join('');
      document.querySelectorAll('.btn-pagar').forEach(btn => {
        btn.onclick = function() {
          mostrarDialogoPago({ id: btn.getAttribute('data-id'), nombre: btn.getAttribute('data-nombre'), numeroDui: btn.getAttribute('data-dui') });
        };
      });
    }

    function mostrarDialogoPago(cliente) {
      let modalRoot = document.getElementById("modal-root");
      let monto = ""; let errorMsg = "";

      function closeModal() { modalRoot.innerHTML = ""; }
      function render() {
        modalRoot.innerHTML = `
          <div class="modal-bg" onclick="event.target===this && (${closeModal.toString()})();">
            <div class="modal">
              <div class="modal-title"><i class="fas fa-coins" style="color:#13b66b;"></i> Pago a ${cliente.nombre}</div>
              <div class="modal-sub"><i class="fas fa-id-card"></i> DUI: <b>${cliente.numeroDui}</b></div>
              <div class="modal-row">
                <label for="monto-input" style="font-weight:600;margin-bottom:2px;display:block;">Monto a pagar</label>
                <div class="input-group">
                  <span>$</span>
                  <input id="monto-input" type="number" min="0" step="0.01" placeholder="0.00" value="${monto}" autocomplete="off" autofocus/>
                </div>
              </div>
              ${errorMsg ? `<div class="modal-error">${errorMsg}</div>` : ""}
              <div class="modal-btns">
                <button class="modal-btn-cancel" id="cancelar-pago">Cancelar</button>
                <button class="modal-btn-pay" id="pagar-btn">Pagar</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById("cancelar-pago").onclick = closeModal;
        document.getElementById("pagar-btn").onclick = () => {
          const montoValue = document.getElementById("monto-input").value.trim();
          const montoNum = parseFloat(montoValue);
          if (isNaN(montoNum) || montoNum <= 0) { errorMsg = "Ingresa un monto válido mayor a $0.00"; render(); setTimeout(()=>document.getElementById("monto-input").focus(),50); return; }
          realizarPago(cliente, montoNum);
          closeModal();
        };
        document.getElementById("monto-input").onkeydown = e => { if (e.key === "Enter") document.getElementById("pagar-btn").click(); };
      }
      render();
    }

    // ==== LÓGICA DE PAGO – política estricta (con tolerancia 0.008) ====
    async function realizarPago(cliente, montoNum) {
      try {
        const user = auth.currentUser;
        const usersRef = collection(db, "users");
        const userSnap = await getDocs(query(usersRef, where("__name__", "==", user.uid)));
        const userData = userSnap.docs[0].data();
        const cajeroNombre = userData.nombre_autorizacion || userData.nombre || "Sin Nombre";
        const sucursal = userData.department || "N/A";
        const fechaPagoISO = new Date().toISOString();

        // Fecha-valor = hoy (pantalla normal)
        const V0 = startOfLocalDay(new Date());

        // Traer crédito
        const creditoSnap = await getDocs(query(collection(db, "creditos"), where("__name__", "==", cliente.id)));
        if (creditoSnap.empty) throw new Error("Crédito no encontrado.");
        const creditoData = creditoSnap.docs[0].data();

        // Bases
        let saldoActual = parseFloat(creditoData.saldoActual || 0);
        let interesActual = parseFloat(creditoData.interesActual || 0); // bucket global a hoy 00:00
        let multasAcumuladas = parseFloat(creditoData.multasAcumuladas || 0);

        // Clonar
        let amortizacion = Array.isArray(creditoData.amortizacion) ? creditoData.amortizacion.map(c => ({
          ...c,
          estado: c.estado || 'Pendiente',
          montoPagado: typeof c.montoPagado === 'number' ? c.montoPagado : parseFloat(c.montoPagado || 0) || 0,
          montoPagadoInteres: typeof c.montoPagadoInteres === 'number' ? c.montoPagadoInteres : parseFloat(c.montoPagadoInteres || 0) || 0,
          fechaPagoReal: c.fechaPagoReal || null,
        })) : [];
        let historialMultas = Array.isArray(creditoData.historialMultas) ? JSON.parse(JSON.stringify(creditoData.historialMultas)) : [];

        let restante = r2(montoNum);
        let pagoMultas = 0, pagoInteres = 0, pagoCapital = 0;

        // 1) MULTAS (fecha <= V0) y "No Pagada"
        if (restante > 0 && historialMultas.length) {
          for (let i = 0; i < historialMultas.length && restante > 0; i++) {
            const m = historialMultas[i];
            const f = parseDateMaybe(m.fecha) || V0;
            const estado = m.estadoCuota || 'No Pagada';
            const montoMulta = parseFloat(m.monto || 0) || 0;
            if (estado === 'No Pagada' && startOfLocalDay(f) <= V0 && montoMulta > 0) {
              const ab = Math.min(restante, montoMulta);
              if (ab > 0) {
                pagoMultas = r2(pagoMultas + ab);
                restante   = r2(restante - ab);
                const nuevo = r2(montoMulta - ab);
                m.monto = nuevo;
                if (nuevo <= EPS) { m.estadoCuota = 'Pagada'; m.monto = 0; }
              }
            }
          }
        }
        // Recalcular multas NO PAGADAS
        multasAcumuladas = r2(historialMultas.reduce((acc, m) => acc + ((m.estadoCuota === 'No Pagada' || !m.estadoCuota) ? (parseFloat(m.monto)||0) : 0), 0));

        // 2A) INTERÉS vencido por cuota (FIFO, capado por cuota) – NO tocar interesActual global aquí
        if (restante > 0) {
          const cuotasVencidasOrden = amortizacion
            .map(c => ({...c}))
            .filter(c => { const f = startOfLocalDay(parseDateMaybe(c.fecha) || V0); return f <= V0 && c.estado !== 'Pagada'; })
            .sort((a,b) => new Date(a.fecha) - new Date(b.fecha));

          let interesPendTotal = 0;
          for (const c of cuotasVencidasOrden) {
            const intCuota = parseFloat(c.interes||0) || 0;
            const pagInt   = parseFloat(c.montoPagadoInteres||0) || 0;
            interesPendTotal += Math.max(0, r2(intCuota - pagInt));
          }

          let interesAConsumir = Math.min(restante, interesPendTotal);
          let interesConsumido = 0;

          for (let i = 0; i < amortizacion.length && interesAConsumir > 0; i++) {
            const c = amortizacion[i];
            const f = startOfLocalDay(parseDateMaybe(c.fecha) || V0);
            if (f <= V0 && c.estado !== 'Pagada') {
              const intCuota = parseFloat(c.interes || 0) || 0;
              const pagInt   = parseFloat(c.montoPagadoInteres || 0) || 0;
              const faltInt  = Math.max(0, r2(intCuota - pagInt));
              if (faltInt > 0) {
                const ab = Math.min(faltInt, interesAConsumir);
                if (ab > 0) {
                  c.montoPagadoInteres = r2(pagInt + ab);
                  interesAConsumir = r2(interesAConsumir - ab);
                  interesConsumido = r2(interesConsumido + ab);
                }
              }
            }
          }
          if (interesConsumido > 0) {
            pagoInteres = r2(pagoInteres + interesConsumido);
            restante    = r2(restante - interesConsumido);
            // NOTA: No ajustar interesActual aquí (2A).
          }
        }

        // 2B) INTERÉS global remanente (antes de capital)
        if (restante > 0 && interesActual > 0) {
          const ab = Math.min(restante, interesActual);
          pagoInteres   = r2(pagoInteres + ab);
          interesActual = Math.max(0, r2(interesActual - ab));
          restante      = r2(restante - ab);
        }

        // 3) CAPITAL de cuotas con fecha <= V0
        if (restante > 0) {
          for (let i = 0; i < amortizacion.length && restante > 0; i++) {
            const c = amortizacion[i];
            const f = startOfLocalDay(parseDateMaybe(c.fecha) || V0);
            if (f <= V0 && c.estado !== 'Pagada') {
              const cap  = parseFloat(c.capital || 0) || 0;
              const pagC = parseFloat(c.montoPagado || 0) || 0;
              const faltC= Math.max(0, r2(cap - pagC));
              if (faltC > 0) {
                const ab = Math.min(faltC, restante);
                c.montoPagado = r2(pagC + ab);
                pagoCapital   = r2(pagoCapital + ab);
                restante      = r2(restante - ab);
              }
            }
          }
        }

        // 4) PREPAGO de capital (cuotas futuras)
        if (restante > 0) {
          for (let i = 0; i < amortizacion.length && restante > 0; i++) {
            const c = amortizacion[i];
            const f = startOfLocalDay(parseDateMaybe(c.fecha) || V0);
            if (f > V0 && c.estado !== 'Pagada') {
              const cap  = parseFloat(c.capital || 0) || 0;
              const pagC = parseFloat(c.montoPagado || 0) || 0;
              const faltC= Math.max(0, r2(cap - pagC));
              if (faltC > 0) {
                const ab = Math.min(faltC, restante);
                c.montoPagado = r2(pagC + ab);
                pagoCapital   = r2(pagoCapital + ab);
                restante      = r2(restante - ab);
              }
            }
          }
        }

        // --- SNAP: normaliza cuotas saldadas por tolerancia (<= 0.8 ctvs) antes de evaluar estados
        for (const c of amortizacion) {
          const cap  = r2(c.capital || 0);
          const int  = r2(c.interes || 0);
          const pagC = r2(c.montoPagado || 0);
          const pagI = r2(c.montoPagadoInteres || 0);

          const capDiff = r2(cap - pagC);
          const intDiff = r2(int - pagI);

          if (capDiff <= EPS && intDiff <= EPS) {
            c.montoPagado = cap;
            c.montoPagadoInteres = int;
            c.estado = 'Pagada';
            c.fechaPagoReal = c.fechaPagoReal || new Date().toISOString();
          }
        }

        // 5) Estados de cuotas (regla con tolerancia + r2)
        const nowISO = new Date().toISOString();
        for (let i = 0; i < amortizacion.length; i++) {
          const c = amortizacion[i];
          const f = startOfLocalDay(parseDateMaybe(c.fecha) || V0);

          const cap  = r2(c.capital || 0);
          const int  = r2(c.interes || 0);
          const pagC = r2(c.montoPagado || 0);
          const pagI = r2(c.montoPagadoInteres || 0);

          const capDiff = r2(cap - pagC);
          const intDiff = r2(int - pagI);

          const capOK = capDiff <= EPS;
          const intOK = intDiff <= EPS;

          if (f <= V0) {
            if (capOK && intOK) { c.estado = 'Pagada'; c.fechaPagoReal = c.fechaPagoReal || nowISO; }
            else if (pagC > 0 || pagI > 0) { c.estado = 'Parcial'; c.fechaPagoReal = null; }
            else { c.estado = 'Pendiente'; c.fechaPagoReal = null; }
          } else {
            // Futuras: el prepago se reconoce por capital
            if (capOK) { c.estado = 'Pagada'; c.fechaPagoReal = c.fechaPagoReal || nowISO; c.pagadaAdelantada = true; }
            else if (pagC > 0) { c.estado = 'Parcial'; c.fechaPagoReal = null; }
            else { c.estado = 'Pendiente'; c.fechaPagoReal = null; }
          }
        }

        // 6) Recalcular saldos y PPD con r2
        saldoActual = r2(amortizacion.reduce((acc, c) => {
          const cap  = r2(c.capital || 0);
          const pagC = r2(c.montoPagado || 0);
          return acc + Math.max(0, r2(cap - pagC));
        }, 0));

        const hoyLocal = startOfLocalDay(new Date());
        let capitalAtrasado = 0, cuotasAtrasadas = 0;
        for (const c of amortizacion) {
          const f = startOfLocalDay(parseDateMaybe(c.fecha) || V0);
          if (f < hoyLocal && c.estado !== 'Pagada') {
            const cap  = r2(c.capital || 0);
            const pagC = r2(c.montoPagado || 0);
            capitalAtrasado += Math.max(0, r2(cap - pagC));
            cuotasAtrasadas++;
          }
        }
        capitalAtrasado = r2(capitalAtrasado);

        // Multas NO pagadas
        multasAcumuladas = r2(historialMultas.reduce((acc, m) => {
          const pendiente = (m.estadoCuota === 'No Pagada' || !m.estadoCuota) ? (parseFloat(m.monto)||0) : 0;
          return acc + pendiente;
        }, 0));

        // Para ponerse al día = interesActual remanente + capital vencido + multas
        const paraPonerseAlDia = r2((interesActual || 0) + (capitalAtrasado || 0) + (multasAcumuladas || 0));

        // Estado crédito
        const NEAR_ZERO = EPS; // usa misma tolerancia para cierre
        let nuevoEstado = saldoActual <= NEAR_ZERO ? 'Pagado' : creditoData.estadoCredito;
        if (nuevoEstado !== 'Pagado') {
          if (cuotasAtrasadas === 0 && multasAcumuladas <= NEAR_ZERO) nuevoEstado = 'Activo';
          else if (cuotasAtrasadas > 0) nuevoEstado = 'Mora Temprana';
        }

        // 7) Registrar pago (correlativo único)
        const correlativo = await obtenerCorrelativoUnicoPagos();
        await addDoc(collection(db, 'pagos'), {
          clienteID: creditoData.clienteID,
          creditoID: cliente.id,
          nombres: creditoData.nombre,
          apellido: creditoData.apellido || '',
          numeroDui: creditoData.numeroDui || '',
          montoPagado: r2(montoNum),
          fechaPago: fechaPagoISO,
          pagoMultas: r2(pagoMultas),
          pagoInteres: r2(pagoInteres),
          pagoCapital: r2(pagoCapital),
          saldoRestante: r2(saldoActual),
          cajeroID: user.uid,
          cajeroNombre: cajeroNombre,
          sucursal: sucursal,
          correlativo: correlativo, // numérico global
          timestamp: new Date()
        });

        // 8) Actualizar crédito
        await updateDoc(doc(db, 'creditos', cliente.id), {
          saldoActual: r2(saldoActual),
          interesActual: r2(interesActual),
          capitalAtrasado: r2(capitalAtrasado),
          paraPonerseAlDia: r2(paraPonerseAlDia),
          multasAcumuladas: r2(multasAcumuladas),
          ultimaActualizacion: fechaPagoISO,
          fechaUltimoCalculoIntereses: fechaPagoISO,
          estadoCredito: nuevoEstado,
          amortizacion: amortizacion,
          historialMultas: historialMultas
        });

        // Ticket
        window.location.href = `ticket_page.html?correlativo=${correlativo}` +
          `&cliente=${encodeURIComponent(creditoData.nombre)}` +
          `&apellido=${encodeURIComponent(creditoData.apellido || '')}` +
          `&numeroDui=${encodeURIComponent(creditoData.numeroDui || '')}` +
          `&monto=${(r2(montoNum)).toFixed(2)}` +
          `&agencia=${encodeURIComponent(sucursal)}` +
          `&fecha=${encodeURIComponent(fechaPagoISO)}` +
          `&pagoCapital=${(r2(pagoCapital)).toFixed(2)}` +
          `&pagoInteres=${(r2(pagoInteres)).toFixed(2)}` +
          `&pagoMultas=${(r2(pagoMultas)).toFixed(2)}` +
          `&saldoRestante=${(r2(saldoActual)).toFixed(2)}`;

      } catch (e) {
        alert("Error al realizar el pago: " + (e?.message || e));
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await obtenerAgenciaUsuario();
      document.getElementById("buscador").addEventListener("input", e => { buscarClientes(e.target.value); });
    });
  </script>
</body>
</html>
