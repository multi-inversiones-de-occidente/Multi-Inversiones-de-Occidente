<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Papelería Legal</title>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, doc, getDoc, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Utilidad para extraer parámetros de la URL
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Función que valida el acceso antes de mostrar el contenido
    async function validarAperturaPapeleria() {
      const asignacionID = getParam("id");
      if (!asignacionID) {
        document.getElementById('papeleria-contenido').innerHTML = `<div class="error">ID de asignación no especificado en la URL.</div>`;
        return false;
      }
      return new Promise((resolve, reject) => {
        onAuthStateChanged(auth, async user => {
          if (!user) {
            window.location.href = "login.html";
            resolve(false);
            return;
          }
          try {
            // 1) Leer la asignación
            const asignRef = doc(db, "asignacion_de_cuota", asignacionID);
            const asignSnap = await getDoc(asignRef);
            if (!asignSnap.exists()) throw new Error("Asignación no encontrada.");
            const asignData = asignSnap.data();

            // 2) Validar el campo de apertura
            if (asignData.creditoAperturado) {
              resolve(true);
              return;
            }
            // 3) Si no, busca crédito activo antiguo
            const q = query(
              collection(db, "creditos"),
              where("clienteID", "==", asignData.clienteID),
              where("estadoCredito", "==", "Activo")
            );
            const creditosSnap = await getDocs(q);

            if (!creditosSnap.empty) {
              resolve(true);
            } else {
              resolve(false);
            }
          } catch (err) {
            document.getElementById('papeleria-contenido').innerHTML = `<div class="error">Error: ${err.message}</div>`;
            resolve(false);
          }
        });
      });
    }

    async function loadResumenPapeleria() {
      // Bloquea primero hasta validar
      document.getElementById('papeleria-contenido').innerHTML = `<div style="color:#ccc;text-align:center;padding:38px 0;">Verificando acceso...</div>`;
      const acceso = await validarAperturaPapeleria();
      if (!acceso) {
        // BLOQUEA TODO: muestra modal y oculta la papelería
        document.getElementById('modal-bloqueo').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        document.getElementById('papeleria-contenido').style.display = 'none';
        return;
      }
      // Si la validación pasó, muestra normalmente los botones
      const asignacionID = getParam("id");
      let html = `
        <h2>Papelería Legal</h2>
        <div class="papeleria-btns">
          <a href="hoja_apertura.html?id=${asignacionID}" class="btn-papeleria">
            <i class="fas fa-file-contract"></i>
            Hoja de Apertura
          </a>
          <a href="pagare_sin_protesto.html?id=${asignacionID}" class="btn-papeleria">
            <i class="fas fa-file-signature"></i>
            Pagaré sin Protesto
          </a>
          <a href="contrato_mutuo.html?id=${asignacionID}" class="btn-papeleria">
            <i class="fas fa-file-shield"></i>
            Contrato Mutuo
          </a>
          <a href="plan_pagos.html?id=${asignacionID}" class="btn-papeleria">
            <i class="fas fa-file-invoice-dollar"></i>
            Plan de Pagos
          </a>
        </div>
        <div style="height:34px"></div>
        <div style="text-align:center;color:#aaa;">Seleccione el documento legal que desea visualizar e imprimir.</div>
      `;
      document.getElementById('papeleria-contenido').innerHTML = html;
      document.getElementById('papeleria-contenido').style.display = '';
    }

    window.addEventListener("DOMContentLoaded", loadResumenPapeleria);
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #111; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; margin: 0; }
    header {
      background:#000; padding:1rem 0;
      text-align:center; font-size:1.5rem;
      letter-spacing:1px; font-weight:700;
      color: #67C8F1;
    }
    .container {
      max-width: 580px; margin:2.2rem auto 0 auto;
      background: #181818;
      border-radius: 18px; box-shadow: 0 2px 25px #0005;
      padding: 2.4rem 1.6rem 1.8rem 1.6rem;
    }
    h1 { color: #F8AF40; font-size:2rem; text-align:center; font-weight:bold; margin-top:0; margin-bottom:1.5rem;}
    h2 { color:#67C8F1; font-size:1.13rem; margin:1.2rem 0 1.5rem 0; letter-spacing:.5px; text-align:center;}
    .papeleria-btns {
      display: flex;
      flex-direction: column;
      gap: 26px;
      margin: 0 auto;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
    }
    .btn-papeleria {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #212a2c;
      color: #F8AF40;
      text-decoration: none;
      font-size: 1.18rem;
      font-weight: 600;
      padding: 1.3em 2.6em;
      border-radius: 13px;
      box-shadow: 0 2px 7px #0004;
      transition: background 0.13s, color 0.13s, transform 0.09s;
      border: 2px solid #444;
    }
    .btn-papeleria i {
      font-size: 2.4rem;
      margin-bottom: 0.37em;
      color: #67C8F1;
    }
    .btn-papeleria:hover {
      background: #252c36;
      color: #fff;
      transform: scale(1.04);
      border-color: #67C8F1;
    }
    .error { color:#f55; font-size:1.13rem; padding:24px 0; text-align:center;}
    /* MODAL */
    #modal-bloqueo {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(17,18,26,0.88);
      align-items: center; justify-content: center;
    }
    #modal-bloqueo .modal-box {
      background: #222a2c;
      padding: 42px 28px;
      border-radius: 18px;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 8px 32px #000b;
    }
    #modal-bloqueo i { font-size:2.4em;color:#f55;margin-bottom:8px;}
    #modal-bloqueo h3 { color:#F8AF40;font-weight:900;}
    #modal-bloqueo p {margin:16px 0 12px 0;color:#fff;font-size:1.08em;}
    #modal-bloqueo button {
      background:#f55;border:none;color:#fff;
      font-weight:700;padding:9px 30px;
      border-radius:10px;font-size:1.07em;
      cursor:pointer;
    }
    @media (max-width:680px) {
      .container { padding: 1.2rem 0.5rem;}
      .btn-papeleria { font-size:1rem; padding: 1em 1em;}
    }
  </style>
</head>
<body>
  <header>Papelería Legal</header>
  <div class="container">
    <h1><i class="fas fa-file-alt"></i> Papelería Legal</h1>
    <div id="papeleria-contenido">
      <div style="color:#ccc;text-align:center;padding:38px 0;">Cargando información...</div>
    </div>
  </div>

  <!-- MODAL BLOQUEO ACCESO -->
  <div id="modal-bloqueo">
    <div class="modal-box">
      <i class="fas fa-ban"></i>
      <h3>¡Acceso bloqueado!</h3>
      <p>
        No puedes generar la papelería legal.<br>
        <b>Primero debes aperturar el crédito.</b>
      </p>
      <button onclick="window.location.href='detalle_aprobacion.html?id='+new URLSearchParams(window.location.search).get('id')">Regresar</button>
    </div>
  </div>
</body>
</html>
