<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperación – Entrega de Intereses</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #191d20; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    header { background: #000; padding: 1.1rem 0; text-align: center; font-size: 1.7rem; font-weight: 700; color: #F8AF40;}
    .container { max-width: 1100px; margin: 2.2rem auto 0 auto; background: #23272c; border-radius: 16px; box-shadow: 0 2px 22px #0008; padding: 2.2rem 1.6rem 1.7rem 1.6rem;}
    h2 { color: #F8AF40; margin-bottom: 1.2rem; text-align: center; }

    .filtros { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; align-items: end; margin-bottom: .8em;}
    .filtros .campo { grid-column: span 3; min-width: 160px; }
    .filtros .campo label { display:block; font-size:1.02rem; font-weight:700; margin-bottom:6px;}
    .filtros input[type="date"], .filtros select {
      background: #202324; color: #fff; border: 1.5px solid #515151; border-radius: 7px; font-size: 1.02rem; padding: 8px 12px; width: 100%;
    }
    .btn-filtrar, .btn-imprimir, .btn-excel { background: #F8AF40; color: #181818; border: none; border-radius: 8px; font-size: 1.02rem; font-weight: 700; padding: 10px 22px; cursor: pointer;}
    .btn-filtrar:hover, .btn-imprimir:hover, .btn-excel:hover { background: #d98b1a;}
    .acciones { display:flex; gap:10px; flex-wrap:wrap; margin: 12px 0 16px 0; }

    .panel-ejecutivos { background:#1f2226; border:1px solid #3a3d42; border-radius:12px; padding:12px; margin: 12px 0 8px 0;}
    .panel-ejecutivos h3 { margin:0 0 10px 0; font-size:1.02rem; color:#8fd3ff; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { background:#2a2f35; border:1px solid #3b424a; color:#e6f6ff; padding:6px 10px; border-radius:999px; font-size:.92rem; }
    .chip b { color:#F8AF40; }

    table { width:100%; border-collapse:collapse; margin-bottom:24px; margin-top: 1.0rem; background:#24282d;}
    th, td { border-bottom: 1px solid #313336; padding: 9px 6px; text-align: left; font-size: 0.98rem;}
    th { color: #F8AF40; background: #18191b;}
    tr:last-child td { border-bottom: none;}
    .sumas { font-weight: bold; color: #F8AF40; border-top: 2px solid #F8AF40;}
    .nada {text-align:center; color:#bbb; padding:18px 0 24px 0;}
    .subtitulo { margin-top: 6px; font-weight:700; color:#8fd3ff; }

    @media (max-width: 1020px) {
      .filtros { grid-template-columns: 1fr; }
      .filtros .campo { grid-column: span 1; }
    }
    @media print {
      body, html { background: #fff !important; color: #000 !important;}
      .container { box-shadow: none !important; background: #fff !important; color: #000;}
      .filtros, .acciones, .panel-ejecutivos, header { display: none !important;}
      table { background: #fff !important; color: #000 !important;}
      th { color: #000 !important; background: #f8f8f8 !important;}
    }
  </style>
</head>
<body>
  <header>Recuperación</header>
  <div class="container">
    <h2>Entrega de Intereses</h2>

    <div class="filtros">
      <div class="campo">
        <label for="desde">Desde</label>
        <input type="date" id="desde"/>
      </div>
      <div class="campo">
        <label for="hasta">Hasta</label>
        <input type="date" id="hasta"/>
      </div>
      <div class="campo">
        <label for="sel-ejecutivo">Ejecutivo</label>
        <select id="sel-ejecutivo">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="campo" style="display:flex; align-items:end;">
        <button class="btn-filtrar" id="btn-filtrar"><i class="fas fa-filter"></i> Filtrar</button>
      </div>
    </div>

    <div class="panel-ejecutivos">
      <h3>Ejecutivos del departamento (asignados a créditos)</h3>
      <div id="chips-ejecutivos" class="chips"></div>
    </div>

    <div class="acciones">
      <button class="btn-imprimir" id="btn-imprimir"><i class="fas fa-print"></i> Imprimir Reporte</button>
      <button class="btn-excel" id="btn-excel"><i class="fas fa-file-excel"></i> Generar Excel</button>
    </div>

    <div id="tabla-resultados"></div>

    <div class="subtitulo">Resumen por ejecutivo</div>
    <div id="tabla-resumen"></div>
  </div>

  <!-- ExcelJS -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

  <!-- Firebase + lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let agenciaActual = "";
    let pagosFiltrados = [];   // resultados visibles (detalle)
    let resumenAsignado = [];  // para Excel
    let ejecutivosMap = new Map(); // nombre -> {nombre, conteoCreditos}

    // Fechas por defecto (21 de junio 2025 hasta hoy)
    function fechaActualISO() {
      const hoy = new Date();
      const yyyy = hoy.getFullYear();
      const mm = String(hoy.getMonth() + 1).padStart(2, '0');
      const dd = String(hoy.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("desde").value = "2025-06-21";
      document.getElementById("hasta").value = fechaActualISO();
    });

    // Auth + agencia
    onAuthStateChanged(auth, async user => {
      if (!user) return location.href = "login.html";
      const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
      if (snap.empty) return;
      agenciaActual = snap.docs[0].data().department || "";
      await cargarEjecutivosDeAgencia(); // llena select + chips
    });

    // Eventos UI
    document.getElementById("btn-filtrar").onclick = cargarPagos;
    document.getElementById("btn-imprimir").onclick = () => {
      if (!pagosFiltrados.length) return alert("No hay datos para imprimir.");
      window.print();
    };
    document.getElementById("btn-excel").onclick = generarExcel;
    document.getElementById("sel-ejecutivo").addEventListener('change', cargarPagos);

    // --- Cargar ejecutivos (lista a quienes se les han asignado créditos) de la agencia del usuario ---
    async function cargarEjecutivosDeAgencia() {
      const sel = document.getElementById("sel-ejecutivo");
      const chips = document.getElementById("chips-ejecutivos");
      sel.innerHTML = `<option value="">Todos</option>`;
      chips.innerHTML = `<span class="chip">Cargando...</span>`;
      ejecutivosMap = new Map();

      if (!agenciaActual) {
        chips.innerHTML = `<span class="chip">No se detectó agencia del usuario.</span>`;
        return;
      }

      // Traer TODOS los créditos de la agencia para listar ejecutivos únicos (asignadoA)
      const creditosQ = query(
        collection(db, "creditos"),
        where("agenciaAsignada", "==", agenciaActual)
      );
      const credSnap = await getDocs(creditosQ);

      if (credSnap.empty) {
        chips.innerHTML = `<span class="chip">No hay créditos en tu agencia.</span>`;
        return;
      }

      // Construir set/contador por asignadoA
      for (const d of credSnap.docs) {
        const c = d.data();
        const nom = normalizeName(c.asignadoA || "");
        if (!nom) continue;
        if (!ejecutivosMap.has(nom)) ejecutivosMap.set(nom, { nombre: nom, conteo: 0 });
        ejecutivosMap.get(nom).conteo += 1;
      }

      // Poblar select (ordenado)
      const lista = Array.from(ejecutivosMap.values()).sort((a,b)=> a.nombre.localeCompare(b.nombre));
      sel.innerHTML = `<option value="">Todos</option>` + lista.map(e => `<option value="${escapeHtml(e.nombre)}">${escapeHtml(e.nombre)}</option>`).join("");

      // Render chips
      chips.innerHTML = lista.map(e => `<span class="chip"><b>${escapeHtml(e.nombre)}</b> · ${e.conteo}</span>`).join("") || `<span class="chip">Sin ejecutivos.</span>`;
    }

    // --- Cargar pagos por fecha + agencia + (opcional) ejecutivo seleccionado ---
    async function cargarPagos() {
      const desde = document.getElementById("desde").value;
      const hasta = document.getElementById("hasta").value;
      const tablaDiv = document.getElementById("tabla-resultados");
      const resumenDiv = document.getElementById("tabla-resumen");
      tablaDiv.innerHTML = "<div style='text-align:center;padding:25px;'>Cargando...</div>";
      resumenDiv.innerHTML = "";

      if (!desde || !hasta) { tablaDiv.innerHTML = `<div class="nada">Seleccione el rango de fechas.</div>`; pagosFiltrados = []; return; }
      if (!agenciaActual) { tablaDiv.innerHTML = `<div class="nada">No se pudo determinar la agencia del usuario.</div>`; pagosFiltrados = []; return; }

      const desdeISO = new Date(desde + "T00:00:00").toISOString();
      const hastaISO = new Date(hasta + "T23:59:59").toISOString();
      const ejecutivoSel = document.getElementById("sel-ejecutivo").value || "";

      // Query a pagos por rango y sucursal (agencia)
      const pagosQ = query(
        collection(db, "pagos"),
        where("fechaPago", ">=", desdeISO),
        where("fechaPago", "<=", hastaISO),
        where("sucursal", "==", agenciaActual)
      );
      const pagosSnap = await getDocs(pagosQ);

      if (pagosSnap.empty) {
        tablaDiv.innerHTML = `<div class="nada">No se encontraron pagos en ese rango.</div>`;
        pagosFiltrados = [];
        return;
      }

      const creditosCache = {};
      const pagos = [];

      for (const docPago of pagosSnap.docs) {
        const p = docPago.data();
        if (p.anulado) continue; // Excluir pagos anulados

        // Buscar asignadoA (ejecutivo) del crédito
        if (!creditosCache[p.creditoID]) {
          const cr = await getDoc(doc(db, "creditos", p.creditoID));
          creditosCache[p.creditoID] = cr.exists() ? cr.data() : {};
        }
        const c = creditosCache[p.creditoID];
        const ejecutivo = normalizeName(c?.asignadoA || "");

        // Filtrar por ejecutivo si el usuario seleccionó uno
        if (ejecutivoSel && ejecutivo !== ejecutivoSel) continue;

        const cliente = `${c?.nombre || ""} ${c?.apellido || ""}`.trim();

        pagos.push({
          fechaPago: p.fechaPago ? p.fechaPago.substring(0,10) : "",
          cliente,
          ejecutivo,
          montoPagado: parseFloat(p.montoPagado || 0) || 0,
          pagoCapital: parseFloat(p.pagoCapital || 0) || 0,
          pagoInteres: parseFloat(p.pagoInteres || 0) || 0,
          // >>> NUEVO: pagoMulta <<<
          pagoMulta: parseFloat(p.pagoMulta || 0) || 0
        });
      }

      if (!pagos.length) {
        const msg = ejecutivoSel ? `No hay pagos para el ejecutivo <b>${escapeHtml(ejecutivoSel)}</b> en ese rango.` : `No se encontraron pagos en ese rango.`;
        tablaDiv.innerHTML = `<div class="nada">${msg}</div>`;
        pagosFiltrados = [];
        return;
      }

      pagosFiltrados = pagos;
      renderTabla(pagosFiltrados);
      renderResumen(pagosFiltrados);
    }

    function renderTabla(pagos) {
      const tablaDiv = document.getElementById("tabla-resultados");
      const totalPagado = pagos.reduce((a, b) => a + b.montoPagado, 0);
      const totalCapital = pagos.reduce((a, b) => a + b.pagoCapital, 0);
      const totalInteres = pagos.reduce((a, b) => a + b.pagoInteres, 0);
      // >>> NUEVO total de multas <<<
      const totalMulta = pagos.reduce((a, b) => a + b.pagoMulta, 0);

      const rowsHTML = pagos.map(p => `
        <tr>
          <td>${p.fechaPago}</td>
          <td>${escapeHtml(p.cliente)}</td>
          <td>${escapeHtml(p.ejecutivo)}</td>
          <td>$${p.montoPagado.toFixed(2)}</td>
          <td>$${p.pagoCapital.toFixed(2)}</td>
          <td>$${p.pagoInteres.toFixed(2)}</td>
          <td>$${p.pagoMulta.toFixed(2)}</td>
        </tr>
      `).join("");

      const html = `
        <table id="tabla-pagos">
          <thead>
            <tr>
              <th>Fecha de Pago</th>
              <th>Cliente</th>
              <th>Ejecutivo</th>
              <th>Monto Pagado</th>
              <th>Capital</th>
              <th>Abono de Interés</th>
              <th>Pago Multa</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHTML}
            <tr class="sumas">
              <td colspan="3">Totales</td>
              <td>$${totalPagado.toFixed(2)}</td>
              <td>$${totalCapital.toFixed(2)}</td>
              <td>$${totalInteres.toFixed(2)}</td>
              <td>$${totalMulta.toFixed(2)}</td>
            </tr>
          </tbody>
        </table>
      `;
      tablaDiv.innerHTML = html;
    }

    function renderResumen(pagos) {
      const resumenDiv = document.getElementById("tabla-resumen");
      const mapa = new Map();

      for (const p of pagos) {
        const key = p.ejecutivo || "—";
        if (!mapa.has(key)) mapa.set(key, { persona: key, total: 0, capital: 0, interes: 0 });
        const acc = mapa.get(key);
        acc.total += p.montoPagado;
        acc.capital += p.pagoCapital;
        acc.interes += p.pagoInteres;
        // Nota: el resumen continúa igual (solo total/capital/interés),
        // porque pediste añadir pagoMulta únicamente en "esa misma tabla".
      }

      const filas = Array.from(mapa.values()).sort((a,b)=> b.interes - a.interes);
      resumenAsignado = filas;

      const html = `
        <table id="tabla-resumen-asignado">
          <thead>
            <tr>
              <th>Ejecutivo</th>
              <th>Monto Pagado</th>
              <th>Capital</th>
              <th>Interés</th>
            </tr>
          </thead>
          <tbody>
            ${filas.map(f => `
              <tr>
                <td>${escapeHtml(f.persona)}</td>
                <td>$${f.total.toFixed(2)}</td>
                <td>$${f.capital.toFixed(2)}</td>
                <td>$${f.interes.toFixed(2)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      resumenDiv.innerHTML = html;
    }

    // --- Excel: Detalle + Resumen ---
    async function generarExcel() {
      if (!pagosFiltrados.length) return alert("No hay datos para exportar.");

      const workbook = new window.ExcelJS.Workbook();
      const detalle = workbook.addWorksheet("Detalle");
      const resumen = workbook.addWorksheet("Resumen");

      // >>> Añadimos "Pago Multa" al detalle
      detalle.addRow(["Fecha de Pago", "Cliente", "Ejecutivo", "Monto Pagado", "Capital", "Abono de Interés", "Pago Multa"]);
      pagosFiltrados.forEach(p => {
        detalle.addRow([
          p.fechaPago, p.cliente, p.ejecutivo, p.montoPagado, p.pagoCapital, p.pagoInteres, p.pagoMulta
        ]);
      });

      const totalPagado  = pagosFiltrados.reduce((a,b)=>a+b.montoPagado,0);
      const totalCapital = pagosFiltrados.reduce((a,b)=>a+b.pagoCapital,0);
      const totalInteres = pagosFiltrados.reduce((a,b)=>a+b.pagoInteres,0);
      const totalMulta   = pagosFiltrados.reduce((a,b)=>a+b.pagoMulta,0);
      detalle.addRow([]);
      detalle.addRow(["Totales", "", "", totalPagado, totalCapital, totalInteres, totalMulta]);

      // Resumen (se mantiene igual)
      resumen.addRow(["Ejecutivo", "Monto Pagado", "Capital", "Interés"]);
      resumenAsignado.forEach(r => {
        resumen.addRow([r.persona, r.total, r.capital, r.interes]);
      });

      const buf = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "reporte_recuperacion.xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // utils
    function normalizeName(x){ return String(x||"").trim().replace(/\s+/g,' '); }
    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
  </script>
</body>
</html>
