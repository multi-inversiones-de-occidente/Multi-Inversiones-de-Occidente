<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Referencias del Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #f7fafd;
      color: #233047;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 2.5rem auto 0 auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 6px 26px #3ad6d888, 0 1.5px 18px #0001;
      padding: 2.6rem 2.2rem 2.2rem 2.2rem;
    }
    .titulo {
      font-size: 1.6rem;
      color: #16b0bb;
      font-weight: bold;
      margin-bottom: 1.4em;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 19px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-group label {
      color: #6b82a7;
      font-size: 1.02rem;
      font-weight: 500;
      margin-right: 6px;
    }
    .input-group input {
      width: 76%;
      padding: 9px 13px;
      border-radius: 8px;
      border: 1.2px solid #c8eaf7;
      font-size: 1.06rem;
      background: #f5faff;
      color: #234;
      font-weight: 600;
    }
    .input-group input:focus {
      border-color: #16b0bb;
      background: #e7fafd;
    }
    .input-group button {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg,#16b0bb 40%,#3586ea 100%);
      color: #fff;
      font-weight: 600;
      font-size: 1.07rem;
      cursor: pointer;
      box-shadow: 0 2px 10px #16d0bb22;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.13s, transform .11s;
    }
    .input-group button:hover {
      background: #158196;
      transform: scale(1.04);
    }

    .bloque-ref {
      margin-bottom: 23px;
      background: #effafd;
      border-radius: 13px;
      box-shadow: 0 1.5px 7px #16d0bb13;
      padding: 18px 20px 13px 20px;
    }
    .bloque-ref h3 {
      margin: 0 0 13px 0;
      color: #16b0bb;
      font-size: 1.14rem;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .referencia-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 0 13px;
    }
    .ref-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px #16d0bb09;
      margin-bottom: 13px;
      padding: 12px 18px;
      min-width: 220px;
      flex: 1 1 0;
      max-width: 31%;
      border-left: 6px solid #16b0bb55;
      transition: box-shadow .15s;
    }
    .ref-card:hover { box-shadow: 0 5px 16px #16b0bb22; }
    .ref-label { font-weight: 500; color: #099aa7; }
    .ref-dato { font-weight: 600; color: #25485a; margin-left: 4px;}
    .doc-links {
      margin: 16px 0 0 0;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .doc-link-btn {
      background: #16b0bb;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: .99rem;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 6px #16d0bb24;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      transition: background .13s, box-shadow .14s;
    }
    .doc-link-btn:hover {
      background: #158196;
      text-decoration: underline;
    }
    .img-doc {
      display: block;
      max-width: 140px;
      margin: 14px 12px 0 0;
      border-radius: 6px;
      box-shadow: 0 1px 8px #0003;
      border: 1.3px solid #ddeef3;
    }
    .info-simple {
      margin: 20px 0 0 0;
      padding: 13px 15px;
      background: #f7fafd;
      border-radius: 9px;
      font-size: 1.07rem;
      color: #4b6889;
      box-shadow: 0 1px 8px #16d0bb07;
    }
    .no-data {
      color: #b23c3c;
      font-weight: 600;
      font-size: 1.07rem;
      text-align: center;
      padding: 30px 0 16px 0;
    }
    @media (max-width: 900px) {
      .container { max-width: 98vw; }
      .referencia-lista { flex-direction: column; }
      .ref-card { max-width: 100%; }
    }
    @media (max-width: 600px){
      .container { padding:1.1rem .12rem; }
      .input-group input { width: 100%; }
      .input-group { flex-direction: column; align-items: stretch; gap: 9px;}
      .doc-links { flex-direction: column; gap: 7px;}
      .img-doc { max-width: 95vw; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-user-friends"></i> Referencias del Cliente</div>
    <div class="input-group">
      <label for="clienteID-input">Cliente ID:</label>
      <input id="clienteID-input" type="text" placeholder="Ingresa el ClienteID...">
      <button id="buscar-btn"><i class="fas fa-search"></i> Buscar</button>
    </div>
    <div id="datos-cliente"></div>
    <div id="ref-familiares"></div>
    <div id="ref-personales"></div>
    <div id="doc-links"></div>
    <div id="info-simple"></div>
    <div id="no-data" class="no-data" style="display:none"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function getClienteIDParam() {
      const url = new URL(window.location.href);
      return url.searchParams.get("clienteID") || "";
    }

    // Renderiza referencias
    function referenciaCard(tipo, n, data) {
      if (!data[`${tipo}${n}-nombre`]) return "";
      return `
        <div class="ref-card">
          <div><span class="ref-label">Nombre:</span><span class="ref-dato">${data[`${tipo}${n}-nombre`]}</span></div>
          <div><span class="ref-label">Parentesco:</span><span class="ref-dato">${data[`${tipo}${n}-parentesco`]}</span></div>
          <div><span class="ref-label">Teléfono:</span><span class="ref-dato">${data[`${tipo}${n}-telefono`]}</span></div>
          <div><span class="ref-label">Dirección:</span><span class="ref-dato">${data[`${tipo}${n}-direccion`]}</span></div>
        </div>
      `;
    }

    // Renderiza los links de imágenes y documentos
    function renderDocs(data) {
      let docs = [];
      if (data.dui_front) docs.push({ url: data.dui_front, label: "Foto DUI (Frente)" });
      if (data.dui_back) docs.push({ url: data.dui_back, label: "Foto DUI (Reverso)" });
      if (data.recibo) docs.push({ url: data.recibo, label: "Recibo de Servicio" });
      return docs.map(d =>
        `<a class="doc-link-btn" href="${d.url}" target="_blank"><i class="fas fa-image"></i> ${d.label}</a>`
      ).join('');
    }

    function renderDocsImg(data) {
      let imgs = [];
      if (data.dui_front) imgs.push(`<a href="${data.dui_front}" target="_blank"><img src="${data.dui_front}" class="img-doc" alt="DUI Frente"></a>`);
      if (data.dui_back) imgs.push(`<a href="${data.dui_back}" target="_blank"><img src="${data.dui_back}" class="img-doc" alt="DUI Reverso"></a>`);
      if (data.recibo) imgs.push(`<a href="${data.recibo}" target="_blank"><img src="${data.recibo}" class="img-doc" alt="Recibo"></a>`);
      return imgs.join('');
    }

    // Renderiza datos simples del cliente
    function renderInfoSimple(data) {
      return `
        <div>
          <b>Nombre:</b> ${data.nombre || "-"} ${data.apellido || "-"}<br>
          <b>DUI:</b> ${data.numeroDui || "-"}<br>
          <b>Teléfono:</b> ${data.telefono || "-"}<br>
          <b>Dirección:</b> ${data.direccion || "-"}<br>
          <b>Profesión:</b> ${data.profesion || "-"}<br>
          <b>Estado civil:</b> ${data.estadoCivil || "-"}<br>
          <b>Tipo de vivienda:</b> ${data.tipoVivienda || "-"}<br>
          <b>Departamento:</b> ${data.departamento || "-"}, <b>Municipio:</b> ${data.municipio || "-"}
        </div>
      `;
    }

    let usuarioAutenticado = null;
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        usuarioAutenticado = user;
        const param = getClienteIDParam();
        if (param) {
          document.getElementById('clienteID-input').value = param;
          buscarReferencias();
        }
      }
    });

    document.getElementById('buscar-btn').onclick = () => {
      if (usuarioAutenticado) buscarReferencias();
    };
    document.getElementById('clienteID-input').onkeydown = e => {
      if (e.key === "Enter" && usuarioAutenticado) buscarReferencias();
    };

    async function buscarReferencias() {
      const clienteID = document.getElementById('clienteID-input').value.trim();
      document.getElementById('datos-cliente').innerHTML = "";
      document.getElementById('ref-familiares').innerHTML = "";
      document.getElementById('ref-personales').innerHTML = "";
      document.getElementById('doc-links').innerHTML = "";
      document.getElementById('info-simple').innerHTML = "";
      document.getElementById('no-data').style.display = 'none';

      if (!clienteID) {
        document.getElementById('no-data').textContent = "Debes ingresar el ClienteID.";
        document.getElementById('no-data').style.display = '';
        return;
      }
      try {
        const refQ = query(
          collection(db, "Archivo Solicitudes"),
          where("clienteID", "==", clienteID)
        );
        const refSnap = await getDocs(refQ);
        if (refSnap.empty) {
          document.getElementById('no-data').textContent = "No se encontraron referencias para este cliente.";
          document.getElementById('no-data').style.display = '';
          return;
        }
        // Solo tomamos el primero (última solicitud del cliente)
        const data = refSnap.docs[0].data();

        // Datos principales
        document.getElementById('info-simple').innerHTML = renderInfoSimple(data);

        // Familiares
        let famHtml = '';
        for (let n = 1; n <= 3; n++) famHtml += referenciaCard("Familiar", n, data);
        if (famHtml)
          document.getElementById('ref-familiares').innerHTML =
            `<div class="bloque-ref"><h3><i class="fas fa-users"></i> Referencias Familiares</h3>
             <div class="referencia-lista">${famHtml}</div></div>`;

        // Personales
        let perHtml = '';
        for (let n = 1; n <= 3; n++) perHtml += referenciaCard("Personal", n, data);
        if (perHtml)
          document.getElementById('ref-personales').innerHTML =
            `<div class="bloque-ref"><h3><i class="fas fa-user"></i> Referencias Personales</h3>
             <div class="referencia-lista">${perHtml}</div></div>`;

        // Documentos y links
        let docsBtn = renderDocs(data);
        let docsImg = renderDocsImg(data);
        if (docsBtn || docsImg) {
          document.getElementById('doc-links').innerHTML =
            `<div class="bloque-ref">
              <h3><i class="fas fa-id-card"></i> Documentos Adjuntos</h3>
              <div class="doc-links">${docsBtn}</div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">${docsImg}</div>
             </div>`;
        }
      } catch (err) {
        document.getElementById('no-data').textContent = "Error de permisos: debes iniciar sesión para ver las referencias.";
        document.getElementById('no-data').style.display = '';
      }
    }
  </script>
</body>
</html>
