<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Referencias del Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #f7fafd;
      color: #233047;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 2.5rem auto 0 auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 6px 26px #3ad6d888, 0 1.5px 18px #0001;
      padding: 2.6rem 2.2rem 2.2rem 2.2rem;
    }
    .titulo {
      font-size: 1.6rem;
      color: #16b0bb;
      font-weight: bold;
      margin-bottom: 1.4em;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 19px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-group label {
      color: #6b82a7;
      font-size: 1.02rem;
      font-weight: 500;
      margin-right: 6px;
    }
    .input-group input {
      width: 76%;
      padding: 9px 13px;
      border-radius: 8px;
      border: 1.2px solid #c8eaf7;
      font-size: 1.06rem;
      background: #f5faff;
      color: #234;
      font-weight: 600;
    }
    .input-group input:focus {
      border-color: #16b0bb;
      background: #e7fafd;
    }
    .input-group button {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg,#16b0bb 40%,#3586ea 100%);
      color: #fff;
      font-weight: 600;
      font-size: 1.07rem;
      cursor: pointer;
      box-shadow: 0 2px 10px #16d0bb22;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background 0.13s, transform .11s;
    }
    .input-group button:hover {
      background: #158196;
      transform: scale(1.04);
    }

    .bloque-ref {
      margin-bottom: 23px;
      background: #effafd;
      border-radius: 13px;
      box-shadow: 0 1.5px 7px #16d0bb13;
      padding: 18px 20px 13px 20px;
    }
    .bloque-ref h3 {
      margin: 0 0 13px 0;
      color: #16b0bb;
      font-size: 1.14rem;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .referencia-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 0 13px;
    }
    .ref-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px #16d0bb09;
      margin-bottom: 13px;
      padding: 12px 18px;
      min-width: 220px;
      flex: 1 1 0;
      max-width: 31%;
      border-left: 6px solid #16b0bb55;
      transition: box-shadow .15s;
    }
    .ref-card:hover { box-shadow: 0 5px 16px #16d0bb22; }
    .ref-label { font-weight: 500; color: #099aa7; }
    .ref-dato { font-weight: 600; color: #25485a; margin-left: 4px;}
    .doc-links {
      margin: 16px 0 0 0;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .doc-link-btn {
      background: #16b0bb;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: .99rem;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 6px #16d0bb24;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      transition: background .13s, box-shadow .14s;
    }
    .doc-link-btn:hover {
      background: #158196;
      text-decoration: underline;
    }
    .img-doc {
      display: block;
      max-width: 140px;
      margin: 14px 12px 0 0;
      border-radius: 6px;
      box-shadow: 0 1px 8px #0003;
      border: 1.3px solid #ddeef3;
    }
    .info-simple {
      margin: 20px 0 0 0;
      padding: 13px 15px;
      background: #f7fafd;
      border-radius: 9px;
      font-size: 1.07rem;
      color: #4b6889;
      box-shadow: 0 1px 8px #16d0bb07;
    }
    .no-data {
      color: #b23c3c;
      font-weight: 600;
      font-size: 1.07rem;
      text-align: center;
      padding: 30px 0 16px 0;
    }

    /* ==== Estilos para la ficha seccionada del cliente ==== */
    .info-header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #158196;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .info-header-title-left {
      display:flex;
      align-items:center;
      gap:8px;
    }
    .info-header-title i {
      color: #16b0bb;
    }
    .info-email-highlight {
      font-size: 0.96rem;
      color: #0c4c7a;
      background: #e3f2ff;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      font-weight: 600;
      border: 1px solid #c3ddff;
      box-shadow: 0 1px 4px #145a9c1f;
      max-width: 100%;
      word-break: break-all;
    }
    .info-email-highlight i {
      color:#145a9c;
    }

    .info-section {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px dashed #d3e3f5;
    }
    .info-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #16b0bb;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 0.3rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 4px 14px;
    }
    .info-row {
      font-size: 0.95rem;
    }
    .info-label {
      font-weight: 600;
      color: #5578a0;
    }
    .info-value {
      font-weight: 600;
      color: #244057;
      margin-left: 3px;
    }

    @media (max-width: 900px) {
      .container { max-width: 98vw; }
      .referencia-lista { flex-direction: column; }
      .ref-card { max-width: 100%; }
    }
    @media (max-width: 600px){
      .container { padding:1.1rem .12rem; }
      .input-group input { width: 100%; }
      .input-group { flex-direction: column; align-items: stretch; gap: 9px;}
      .doc-links { flex-direction: column; gap: 7px;}
      .img-doc { max-width: 95vw; }
      .info-header-title { flex-direction: column; align-items:flex-start; gap:6px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="titulo"><i class="fas fa-user-friends"></i> Referencias del Cliente</div>
    <div class="input-group">
      <label for="clienteID-input">Cliente ID:</label>
      <input id="clienteID-input" type="text" placeholder="Ingresa el ClienteID...">
      <button id="buscar-btn"><i class="fas fa-search"></i> Buscar</button>
    </div>
    <div id="datos-cliente"></div>
    <div id="ref-familiares"></div>
    <div id="ref-personales"></div>
    <div id="doc-links"></div>
    <div id="info-simple" class="info-simple"></div>
    <div id="no-data" class="no-data" style="display:none"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs,
      orderBy, limit, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    function getClienteIDParam() {
      const url = new URL(window.location.href);
      return url.searchParams.get("clienteID") || "";
    }

    // ============ Helpers para soportar migrado + legacy ============

    // Normaliza referencias: arrays (migrado) o claves sueltas (legacy)
    function extractReferencias(data) {
      const isValid = (r) => r && r.nombre && String(r.nombre).trim() !== "";
      let familiares = [], personales = [];

      if (Array.isArray(data.familiares)) {
        familiares = data.familiares.filter(isValid);
      }
      if (Array.isArray(data.personales)) {
        personales = data.personales.filter(isValid);
      }

      // Legacy (si aún no hay arrays válidos)
      if (!familiares.length) {
        for (let n = 1; n <= 3; n++) {
          const r = {
            nombre: data[`Familiar${n}-nombre`] || "",
            parentesco: data[`Familiar${n}-parentesco`] || "",
            telefono: data[`Familiar${n}-telefono`] || "",
            direccion: data[`Familiar${n}-direccion`] || ""
          };
          if (isValid(r)) familiares.push(r);
        }
      }
      if (!personales.length) {
        for (let n = 1; n <= 3; n++) {
          const r = {
            nombre: data[`Personal${n}-nombre`] || "",
            parentesco: data[`Personal${n}-parentesco`] || "",
            telefono: data[`Personal${n}-telefono`] || "",
            direccion: data[`Personal${n}-direccion`] || ""
          };
          if (isValid(r)) personales.push(r);
        }
      }
      return { familiares, personales };
    }

    function referenciaCardFromObj(r) {
      if (!r || !r.nombre) return "";
      return `
        <div class="ref-card">
          <div><span class="ref-label">Nombre:</span><span class="ref-dato">${r.nombre}</span></div>
          <div><span class="ref-label">Parentesco:</span><span class="ref-dato">${r.parentesco || "-"}</span></div>
          <div><span class="ref-label">Teléfono:</span><span class="ref-dato">${r.telefono || "-"}</span></div>
          <div><span class="ref-label">Dirección:</span><span class="ref-dato">${r.direccion || "-"}</span></div>
        </div>
      `;
    }

    // Evidencias: unifica migrado (evidencias.*) y legacy (raíz)
    function pickEvidencias(data) {
      const ev = data.evidencias || {};
      const out = {
        dui_front: ev.dui_front || data.dui_front || "",
        dui_back:  ev.dui_back  || data.dui_back  || "",
        recibo:    data.recibo   || "",
        comprobantes: Array.isArray(ev.comprobantes) ? ev.comprobantes.filter(Boolean)
                    : (Array.isArray(data.comprobantes) ? data.comprobantes.filter(Boolean) : [])
      };
      if (!out.dui_front) delete out.dui_front;
      if (!out.dui_back)  delete out.dui_back;
      if (!out.recibo)    delete out.recibo;
      return out;
    }

    function renderDocs(data) {
      const ev = pickEvidencias(data);
      const docs = [];
      if (ev.dui_front) docs.push({ url: ev.dui_front, label: "Foto DUI (Frente)" });
      if (ev.dui_back)  docs.push({ url: ev.dui_back,  label: "Foto DUI (Reverso)" });
      if (ev.recibo)    docs.push({ url: ev.recibo,    label: "Recibo de Servicio" });
      (ev.comprobantes || []).forEach((u, i) => docs.push({ url: u, label: `Comprobante ${i + 1}` }));
      return docs.map(d =>
        `<a class="doc-link-btn" href="${d.url}" target="_blank"><i class="fas fa-image"></i> ${d.label}</a>`
      ).join('');
    }

    function renderDocsImg(data) {
      const ev = pickEvidencias(data);
      const imgs = [];
      if (ev.dui_front) imgs.push(`<a href="${ev.dui_front}" target="_blank"><img src="${ev.dui_front}" class="img-doc" alt="DUI Frente"></a>`);
      if (ev.dui_back)  imgs.push(`<a href="${ev.dui_back}"  target="_blank"><img src="${ev.dui_back}"  class="img-doc" alt="DUI Reverso"></a>`);
      if (ev.recibo)    imgs.push(`<a href="${ev.recibo}"    target="_blank"><img src="${ev.recibo}"    class="img-doc" alt="Recibo"></a>`);
      (ev.comprobantes || []).forEach(u => imgs.push(`<a href="${u}" target="_blank"><img src="${u}" class="img-doc" alt="Comprobante"></a>`));
      return imgs.join('');
    }

    // ===== Info simple, completa y seccionada =====
    function renderInfoSimple(user, solicitud) {
      // Email prioritario: users.email, luego otros posibles campos
      const email =
        (user.email && String(user.email).trim() !== "") ? user.email :
        (user.correo && String(user.correo).trim() !== "") ? user.correo :
        (solicitud.email && String(solicitud.email).trim() !== "") ? solicitud.email :
        "N/D";

      // Nombre y DUI: priorizar datos de la solicitud (por si están más actualizados)
      const nombre   = (solicitud.nombre || user.nombre || "-").trim();
      const apellido = (solicitud.apellido || user.apellido || "-").trim();
      const nombreCompleto = `${nombre} ${apellido}`.trim() || "-";

      const dui       = solicitud.numeroDui || user.numeroDui || "-";
      const telefono  = solicitud.telefono || user.telefono || "-";
      const direccion = solicitud.direccion || user.direccion || "-";

      // Campos de Archivo Solicitudes
      const sexo            = solicitud.sexo || "-";
      const estadoCivil     = solicitud.estadoCivil || "-";
      const tipoVivienda    = solicitud.tipoVivienda || "-";
      const departamento    = solicitud.departamento || "-";
      const municipio       = solicitud.municipio || "-";
      const profesion       = solicitud.profesion || "-";
      const creditLine      = solicitud.creditLine || "-";
      const estadoSolicitud = solicitud.estado || "-";

      const puntoReferencia = solicitud.puntoReferencia || "-";

      // Cónyuge
      const nombreConyugueRaw = solicitud.nombreConyugue;
      const numeroConyugueRaw = solicitud.numeroConyugue;
      const nombreConyugue =
        (nombreConyugueRaw && String(nombreConyugueRaw).trim() !== "") ? nombreConyugueRaw : "N/D";
      const numeroConyugue =
        (numeroConyugueRaw && String(numeroConyugueRaw).trim() !== "") ? numeroConyugueRaw : "N/D";

      const tipoNegocio      = solicitud.tipoNegocio || "-";
      const direccionNegocio = solicitud.direccionNegocio || "-";
      const tiempoNegocio    = solicitud.tiempoNegocio || "-";
      const ventasNetas      = solicitud.ventasNetas || "-";
      const comprasNetas     = solicitud.comprasNetas || "-";

      const ingresosMensuales = solicitud.ingresosMensuales || "-";
      const ingresosTotales   = (solicitud.ingresosTotales ?? "-");
      const egresosTotales    = (solicitud.egresosTotales ?? "-");
      const sueldo            = solicitud.sueldo || "-";
      const pagoCreditos      = solicitud.pagoCreditos || "-";
      const ayudaFamiliar     = solicitud.ayudaFamiliar || "-";
      const alquiler          = solicitud.alquiler || "-";
      const serviciosBasicos  = solicitud.serviciosBasicos || "-";
      const gastosAlimenticios= solicitud.gastosAlimenticios || "-";
      const solvenciaEconomica= (solicitud.solvenciaEconomica ?? "-");

      const montoSolicitar      = solicitud.montoSolicitar || "-";
      const montoAprobado       = solicitud.montoAprobado || "-";
      const tiempoRespuesta     = (solicitud.tiempoRespuesta ?? "-");
      const calificacionCliente = (solicitud.calificacionCliente ?? "-");
      const calificacionTiempo  = solicitud.calificacionTiempo || "-";

      const observaciones = (solicitud.observaciones && solicitud.observaciones.trim() !== "")
        ? solicitud.observaciones
        : "-";

      // Fecha de solicitud (si es Timestamp de Firestore)
      let fechaSolicitud = "-";
      if (solicitud.fechaSolicitud && typeof solicitud.fechaSolicitud.toDate === "function") {
        const f = solicitud.fechaSolicitud.toDate();
        fechaSolicitud = f.toLocaleString("es-SV");
      }

      return `
        <div>
          <div class="info-header-title">
            <div class="info-header-title-left">
              <i class="fas fa-id-card"></i>
              <span>Ficha del cliente</span>
            </div>
            <div class="info-email-highlight" title="Correo principal del cliente">
              <i class="fas fa-envelope"></i>
              <span>${email}</span>
            </div>
          </div>

          <!-- Datos personales -->
          <div class="info-section">
            <div class="info-section-title">Datos personales</div>
            <div class="info-grid">
              <div class="info-row"><span class="info-label">Nombre:</span><span class="info-value">${nombreCompleto}</span></div>
              <div class="info-row"><span class="info-label">DUI:</span><span class="info-value">${dui}</span></div>
              <div class="info-row"><span class="info-label">Sexo:</span><span class="info-value">${sexo}</span></div>
              <div class="info-row"><span class="info-label">Teléfono:</span><span class="info-value">${telefono}</span></div>
              <div class="info-row"><span class="info-label">Profesión:</span><span class="info-value">${profesion}</span></div>
              <div class="info-row"><span class="info-label">Estado civil:</span><span class="info-value">${estadoCivil}</span></div>
              <div class="info-row"><span class="info-label">Cónyuge:</span><span class="info-value">${nombreConyugue}</span></div>
              <div class="info-row"><span class="info-label">Teléfono cónyuge:</span><span class="info-value">${numeroConyugue}</span></div>
            </div>
          </div>

          <!-- Domicilio -->
          <div class="info-section">
            <div class="info-section-title">Domicilio</div>
            <div class="info-grid">
              <div class="info-row"><span class="info-label">Dirección:</span><span class="info-value">${direccion}</span></div>
              <div class="info-row"><span class="info-label">Punto de referencia:</span><span class="info-value">${puntoReferencia}</span></div>
              <div class="info-row"><span class="info-label">Departamento:</span><span class="info-value">${departamento}</span></div>
              <div class="info-row"><span class="info-label">Municipio:</span><span class="info-value">${municipio}</span></div>
              <div class="info-row"><span class="info-label">Tipo de vivienda:</span><span class="info-value">${tipoVivienda}</span></div>
              <div class="info-row"><span class="info-label">Alquiler:</span><span class="info-value">${alquiler}</span></div>
              <div class="info-row"><span class="info-label">Ayuda familiar:</span><span class="info-value">${ayudaFamiliar}</span></div>
              <div class="info-row"><span class="info-label">Servicios básicos:</span><span class="info-value">${serviciosBasicos}</span></div>
              <div class="info-row"><span class="info-label">Gastos alimenticios:</span><span class="info-value">${gastosAlimenticios}</span></div>
            </div>
          </div>

          <!-- Negocio -->
          <div class="info-section">
            <div class="info-section-title">Negocio</div>
            <div class="info-grid">
              <div class="info-row"><span class="info-label">Tipo de negocio:</span><span class="info-value">${tipoNegocio}</span></div>
              <div class="info-row"><span class="info-label">Dirección del negocio:</span><span class="info-value">${direccionNegocio}</span></div>
              <div class="info-row"><span class="info-label">Tiempo de negocio:</span><span class="info-value">${tiempoNegocio}</span></div>
              <div class="info-row"><span class="info-label">Ventas netas:</span><span class="info-value">${ventasNetas}</span></div>
              <div class="info-row"><span class="info-label">Compras netas:</span><span class="info-value">${comprasNetas}</span></div>
            </div>
          </div>

          <!-- Ingresos y egresos -->
          <div class="info-section">
            <div class="info-section-title">Ingresos y egresos</div>
            <div class="info-grid">
              <div class="info-row"><span class="info-label">Ingresos mensuales (declarados):</span><span class="info-value">${ingresosMensuales}</span></div>
              <div class="info-row"><span class="info-label">Ingresos totales:</span><span class="info-value">${ingresosTotales}</span></div>
              <div class="info-row"><span class="info-label">Egresos totales:</span><span class="info-value">${egresosTotales}</span></div>
              <div class="info-row"><span class="info-label">Sueldo fijo:</span><span class="info-value">${sueldo}</span></div>
              <div class="info-row"><span class="info-label">Pago a créditos:</span><span class="info-value">${pagoCreditos}</span></div>
              <div class="info-row"><span class="info-label">Solvencia económica:</span><span class="info-value">${solvenciaEconomica}</span></div>
            </div>
          </div>

          <!-- Detalle de crédito -->
          <div class="info-section">
            <div class="info-section-title">Detalle del crédito</div>
            <div class="info-grid">
              <div class="info-row"><span class="info-label">Línea de crédito:</span><span class="info-value">${creditLine}</span></div>
              <div class="info-row"><span class="info-label">Estado de la solicitud:</span><span class="info-value">${estadoSolicitud}</span></div>
              <div class="info-row"><span class="info-label">Monto solicitado:</span><span class="info-value">${montoSolicitar}</span></div>
              <div class="info-row"><span class="info-label">Monto aprobado:</span><span class="info-value">${montoAprobado}</span></div>
              <div class="info-row"><span class="info-label">Tiempo de respuesta (minutos):</span><span class="info-value">${tiempoRespuesta}</span></div>
              <div class="info-row"><span class="info-label">Calificación del cliente:</span><span class="info-value">${calificacionCliente}</span></div>
              <div class="info-row"><span class="info-label">Calificación del tiempo:</span><span class="info-value">${calificacionTiempo}</span></div>
              <div class="info-row"><span class="info-label">Fecha de solicitud:</span><span class="info-value">${fechaSolicitud}</span></div>
            </div>
            <div class="info-row" style="margin-top:6px;">
              <span class="info-label">Observaciones:</span>
              <span class="info-value">${observaciones}</span>
            </div>
          </div>
        </div>
      `;
    }

    // ================== Auth + arranque ==================
    let usuarioAutenticado = null;
    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        usuarioAutenticado = user;
        const param = getClienteIDParam();
        if (param) {
          document.getElementById('clienteID-input').value = param;
          buscarReferencias();
        }
      }
    });

    document.getElementById('buscar-btn').onclick = () => {
      if (usuarioAutenticado) buscarReferencias();
    };
    document.getElementById('clienteID-input').onkeydown = e => {
      if (e.key === "Enter" && usuarioAutenticado) buscarReferencias();
    };

    // ================== Búsqueda principal ==================
    async function buscarReferencias() {
      const clienteID = document.getElementById('clienteID-input').value.trim();
      document.getElementById('datos-cliente').innerHTML = "";
      document.getElementById('ref-familiares').innerHTML = "";
      document.getElementById('ref-personales').innerHTML = "";
      document.getElementById('doc-links').innerHTML = "";
      document.getElementById('info-simple').innerHTML = "";
      document.getElementById('no-data').style.display = 'none';

      if (!clienteID) {
        document.getElementById('no-data').textContent = "Debes ingresar el ClienteID.";
        document.getElementById('no-data').style.display = '';
        return;
      }

      try {
        // 1) Última solicitud del cliente (migradas o legacy)
        const base = collection(db, "Archivo Solicitudes");
        const queries = [
          query(base, where("clienteID", "==", clienteID), orderBy("migratedAt", "desc"), limit(1)),
          query(base, where("clienteID", "==", clienteID), orderBy("fechaSolicitud", "desc"), limit(1)),
          query(base, where("clienteID", "==", clienteID), limit(1))
        ];

        let refSnap = null;
        for (const q of queries) {
          try {
            const s = await getDocs(q);
            if (!s.empty) { refSnap = s; break; }
          } catch (_) { /* si falta índice/campo, intentar siguiente */ }
        }
        if (!refSnap) {
          document.getElementById('no-data').textContent = "No se encontraron referencias para este cliente.";
          document.getElementById('no-data').style.display = '';
          return;
        }
        const data = refSnap.docs[0].data();

        // 2) Datos base del cliente en users/{clienteID}
        let userData = {};
        try {
          const uSnap = await getDoc(doc(db, "users", clienteID));
          if (uSnap.exists()) userData = uSnap.data();
        } catch {}

        // 3) Info simple (mezcla users + solicitud) — más completa
        document.getElementById('info-simple').innerHTML = renderInfoSimple(userData, data);

        // 4) Referencias (arrays migradas o legacy)
        const { familiares, personales } = extractReferencias(data);

        if (familiares.length) {
          const famHtml = familiares.map(referenciaCardFromObj).join("");
          document.getElementById('ref-familiares').innerHTML =
            `<div class="bloque-ref">
              <h3><i class="fas fa-users"></i> Referencias Familiares</h3>
              <div class="referencia-lista">${famHtml}</div>
            </div>`;
        }

        if (personales.length) {
          const perHtml = personales.map(referenciaCardFromObj).join("");
          document.getElementById('ref-personales').innerHTML =
            `<div class="bloque-ref">
              <h3><i class="fas fa-user"></i> Referencias Personales</h3>
              <div class="referencia-lista">${perHtml}</div>
            </div>`;
        }

        // 5) Adjuntos (migrado + legacy)
        const docsBtn = renderDocs(data);
        const docsImg = renderDocsImg(data);
        if (docsBtn || docsImg) {
          document.getElementById('doc-links').innerHTML =
            `<div class="bloque-ref">
              <h3><i class="fas fa-id-card"></i> Documentos Adjuntos</h3>
              <div class="doc-links">${docsBtn}</div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">${docsImg}</div>
            </div>`;
        }

      } catch (err) {
        document.getElementById('no-data').textContent =
          "Error de permisos o conexión: debes iniciar sesión para ver las referencias.";
        document.getElementById('no-data').style.display = '';
      }
    }
  </script>
</body>
</html>
