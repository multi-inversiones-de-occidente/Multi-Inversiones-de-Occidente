<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reimpresión de Tickets – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #111314;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #191b21;
      padding: 1.25rem 0 1.25rem 0;
      text-align: center;
      font-size: 1.7rem;
      letter-spacing: 1px;
      font-weight: 800;
      color: #ffe37a;
      margin-bottom: 2.5rem;
    }
    .center-card {
      max-width: 400px;
      margin: 44px auto 0 auto;
      background: #17191c;
      border-radius: 18px;
      box-shadow: 0 6px 32px #0005;
      padding: 2.2rem 1.5rem 2.4rem 1.5rem;
      min-height: 260px;
      text-align: center;
    }
    .titulo-buscar {
      font-size: 1.18rem;
      font-weight: bold;
      margin-bottom: 18px;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .input-main {
      width: 100%;
      background: #262a31;
      color: #fff;
      border: 1.5px solid #32353b;
      border-radius: 10px;
      font-size: 1.07rem;
      padding: 13px 12px;
      margin-bottom: 1em;
      outline: none;
      box-sizing: border-box;
      font-weight: 500;
      letter-spacing: 1px;
      transition: border-color .18s;
    }
    .input-main:focus { border-color: #FFD600; }
    .btn-main {
      width: 100%;
      background: #13b66b;
      color: #fff;
      font-size: 1.11rem;
      font-weight: bold;
      border: none;
      border-radius: 9px;
      padding: 13px 0;
      cursor: pointer;
      margin-top: 0.7em;
      transition: background .17s;
    }
    .btn-main:active,
    .btn-main:hover { background: #0b854c; }
    .ticket-box {
      margin-top: 35px;
    }
    .ticket-header {
      font-size: 1.12rem;
      color: #13b66b;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .ticket-details {
      background: #fff;
      color: #181818;
      border-radius: 10px;
      padding: 16px 15px 16px 15px;
      box-shadow: 0 2px 12px #0003;
      text-align: left;
      font-size: 1.03rem;
      margin-bottom: 22px;
    }
    .ticket-details strong { color: #111; min-width: 110px; display: inline-block; }
    .btn-imprimir {
      display: block;
      margin: 0 auto 0 auto;
      padding: 12px 28px;
      background: #f8af40;
      color: #232323;
      font-size: 1.04rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 1px 10px #f8af4045;
      transition: background .17s;
      text-align: center;
      margin-top: 6px;
    }
    .btn-imprimir:hover {
      background: #ffd600;
      color: #232323;
    }
    .error-msg {
      color: #ff6363;
      font-weight: bold;
      margin-top: 18px;
      font-size: 1.08rem;
    }
    @media (max-width: 540px) {
      .center-card { max-width: 97vw; padding: 1.1rem 2vw;}
      .ticket-details { font-size: .97rem;}
    }
  </style>
</head>
<body>
  <header>Reimpresión de Tickets</header>
  <div class="center-card">
    <!-- BUSCAR POR CORRELATIVO -->
    <form id="formBuscarTicket" autocomplete="off">
      <div class="titulo-buscar">
        <i class="fas fa-search"></i> Buscar Ticket por Correlativo
      </div>
      <input type="text" class="input-main" id="input-correlativo" placeholder="Correlativo..." maxlength="15" required />
      <button class="btn-main" type="submit"><i class="fas fa-search"></i> Buscar Ticket</button>
    </form>
    <div id="ticket-container" class="ticket-box"></div>
    <div id="error-msg" class="error-msg" style="display:none"></div>

    <!-- BUSCAR POR DUI -->
    <div style="margin-top:2.2em;">
      <div class="titulo-buscar">
        <i class="fas fa-id-card"></i> Buscar Tickets por DUI del Cliente
      </div>
      <form id="formBuscarDui" autocomplete="off" style="margin-bottom:1em;">
        <input type="text" class="input-main" id="input-dui" placeholder="DUI del cliente..." maxlength="15" required />
        <button class="btn-main" type="submit"><i class="fas fa-search"></i> Buscar por DUI</button>
      </form>
      <div id="tickets-dui-container"></div>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let usuarioListo = false;
    let usuario = null;

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        usuarioListo = true;
        usuario = user;
      }
    });

    // --- BUSCAR POR CORRELATIVO ---
    document.getElementById('formBuscarTicket').onsubmit = async function(e) {
      e.preventDefault();
      if (!usuarioListo) {
        document.getElementById("error-msg").textContent = "Espera a que se inicie sesión...";
        document.getElementById("error-msg").style.display = "block";
        return;
      }
      document.getElementById("error-msg").style.display = "none";
      document.getElementById("ticket-container").innerHTML = "";

      const correlativoInput = document.getElementById('input-correlativo').value.trim();
      if (!correlativoInput) return;

      // Buscar como string y como número
      let correlativoNum = Number(correlativoInput);
      let correlativosBuscar = [correlativoInput];
      if (!isNaN(correlativoNum) && correlativoInput !== "") correlativosBuscar.push(correlativoNum);

      let ticket = null;
      let creditoAnulado = false;

      // Busca en pagos
      const pagosQuery = query(collection(db, "pagos"), where("correlativo", "in", correlativosBuscar));
      const pagosSnap = await getDocs(pagosQuery);
      if (!pagosSnap.empty) {
        ticket = { ...pagosSnap.docs[0].data(), tipo: "pago", id: pagosSnap.docs[0].id };
        // Si es pago de crédito, revisar si el crédito está anulado
        if (ticket.creditoID) {
          const creditoDoc = await getDoc(doc(db, "creditos", ticket.creditoID));
          if (creditoDoc.exists()) {
            const dataCred = creditoDoc.data();
            if (dataCred.anulado === true) creditoAnulado = true;
          }
        }
      }

      // Si no en pagos, busca en movimientosCaja
      if (!ticket && !creditoAnulado) {
        const movCajaQuery = query(collection(db, "movimientosCaja"), where("correlativo", "in", correlativosBuscar));
        const movCajaSnap = await getDocs(movCajaQuery);
        if (!movCajaSnap.empty) {
          ticket = { ...movCajaSnap.docs[0].data(), tipo: "movimientoCaja" };
        }
      }

      // Si no en movimientos_caja (con guión bajo)
      if (!ticket && !creditoAnulado) {
        const movCaja2Query = query(collection(db, "movimientos_caja"), where("correlativo", "in", correlativosBuscar));
        const movCaja2Snap = await getDocs(movCaja2Query);
        if (!movCaja2Snap.empty) {
          ticket = { ...movCaja2Snap.docs[0].data(), tipo: "movimientoCaja" };
        }
      }

      if (creditoAnulado) {
        document.getElementById("error-msg").textContent = "El crédito asociado a este ticket fue ANULADO. No se puede mostrar el comprobante.";
        document.getElementById("error-msg").style.display = "block";
        return;
      }

      if (!ticket) {
        document.getElementById("error-msg").textContent = "No se encontró ningún ticket con ese correlativo.";
        document.getElementById("error-msg").style.display = "block";
        return;
      }

      let dui = "";
      // Si es de pagos, intenta traer el DUI
      if (ticket.tipo === "pago" && ticket.creditoID) {
        const creditoDoc = await getDoc(doc(db, "creditos", ticket.creditoID));
        if (creditoDoc.exists()) {
          dui = creditoDoc.data().numeroDui || "";
        }
      }

      let html = '';
      if (ticket.tipo === "pago") {
        html = `
          <div class="ticket-header"><i class="fas fa-receipt"></i> Comprobante de Pago</div>
          <div class="ticket-details">
            <div><strong>Correlativo:</strong> ${ticket.correlativo}</div>
            <div><strong>Cliente:</strong> ${(ticket.nombres || ticket.clienteNombre || '-')}</div>
            <div><strong>DUI:</strong> ${dui || '-'}</div>
            <div><strong>Monto Pagado:</strong> $${Number(ticket.montoPagado).toFixed(2)}</div>
            <div><strong>Pago Capital:</strong> $${Number(ticket.pagoCapital || 0).toFixed(2)}</div>
            <div><strong>Pago Interés:</strong> $${Number(ticket.pagoInteres || 0).toFixed(2)}</div>
            <div><strong>Pago Multas:</strong> $${Number(ticket.pagoMultas || 0).toFixed(2)}</div>
            <div><strong>Saldo Restante:</strong> $${Number(ticket.saldoRestante || 0).toFixed(2)}</div>
            <div><strong>Fecha:</strong> ${(ticket.fechaPago || ticket.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
            <div><strong>Agencia:</strong> ${ticket.sucursal || ticket.agencia || '-'}</div>
          </div>
          <button class="btn-imprimir" onclick="window.imprimirTicketPorId && imprimirTicketPorId('${ticket.id}') || window.print()">
            <i class="fas fa-print"></i> Imprimir Ticket
          </button>
        `;
      } else {
        html = `
          <div class="ticket-header"><i class="fas fa-receipt"></i> Comprobante de Movimiento de Caja</div>
          <div class="ticket-details">
            <div><strong>Correlativo:</strong> ${ticket.correlativo}</div>
            <div><strong>Tipo:</strong> ${ticket.descripcion || ticket.tipo || '-'}</div>
            <div><strong>Nombre:</strong> ${ticket.nombre || '-'}</div>
            <div><strong>Monto:</strong> $${Number(ticket.monto || 0).toFixed(2)}</div>
            <div><strong>Usuario:</strong> ${ticket.usuario || '-'}</div>
            <div><strong>Fecha:</strong> ${(ticket.fecha || ticket.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
            <div><strong>Agencia:</strong> ${ticket.agencia || '-'}</div>
            <div><strong>Observaciones:</strong> ${ticket.observaciones || '-'}</div>
          </div>
          <button class="btn-imprimir" onclick='window.imprimirMovimientoCajaTicket && imprimirMovimientoCajaTicket(${JSON.stringify(ticket)})'>
            <i class="fas fa-print"></i> Imprimir Ticket
          </button>
        `;
      }

      document.getElementById("ticket-container").innerHTML = html;
    };

    // --- BUSQUEDA DE TICKETS POR DUI ---
    document.getElementById('formBuscarDui').onsubmit = async function(e) {
      e.preventDefault();
      document.getElementById("tickets-dui-container").innerHTML = "";
      const duiInput = document.getElementById('input-dui').value.trim();
      if (!duiInput) return;

      // 1. Buscar todos los créditos con ese DUI
      const creditosRef = collection(db, "creditos");
      const qCred = query(creditosRef, where("numeroDui", "==", duiInput));
      const snapCred = await getDocs(qCred);

      if (snapCred.empty) {
        document.getElementById("tickets-dui-container").innerHTML =
          `<div style="color:#ff6363;text-align:center;padding:34px 0;">No se encontraron créditos con ese DUI.</div>`;
        return;
      }

      // 2. Tomar solo los créditos NO ANULADOS
      const creditosActivos = snapCred.docs.filter(doc => doc.data().anulado !== true);
      if (creditosActivos.length === 0) {
        document.getElementById("tickets-dui-container").innerHTML =
          `<div style="color:#ff6363;text-align:center;padding:34px 0;">No se encontraron créditos activos con ese DUI.</div>`;
        return;
      }

      // 2.1 Tomar los creditosID no anulados
      const creditosIDs = creditosActivos.map(doc => doc.id);

      // 3. Buscar pagos de esos creditos
      const pagosRef = collection(db, "pagos");
      let pagosAll = [];
      for (let i = 0; i < creditosIDs.length; i += 10) {
        const creditosSlice = creditosIDs.slice(i, i+10);
        const qPagos = query(pagosRef, where("creditoID", "in", creditosSlice));
        const snapPagos = await getDocs(qPagos);
        pagosAll = pagosAll.concat(snapPagos.docs.map(doc => ({id: doc.id, ...doc.data()})));
      }

      // 3.1 Filtrar anulados (solo mostrar si anulado !== true)
      pagosAll = pagosAll.filter(pago => pago.anulado !== true);

      if (pagosAll.length === 0) {
        document.getElementById("tickets-dui-container").innerHTML =
          `<div style="color:#ff6363;text-align:center;padding:34px 0;">No se encontraron pagos para este DUI.</div>`;
        return;
      }

      // 4. Ordenar por fecha de pago descendente (más nuevos primero)
      pagosAll.sort((a, b) => {
        const fa = new Date(a.fechaPago || a.timestamp || 0).getTime();
        const fb = new Date(b.fechaPago || b.timestamp || 0).getTime();
        return fb - fa;
      });

      // 5. Mostrar los tickets bonitos
      let html = "";
      for (let pago of pagosAll) {
        html += `
          <div class="ticket-details" style="margin-bottom:18px;">
            <div><strong>Fecha:</strong> ${(pago.fechaPago || pago.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
            <div><strong>Correlativo:</strong> ${pago.correlativo || "<span style='color:#888'>Sin correlativo</span>"}</div>
            <div><strong>Cliente:</strong> ${(pago.nombres || "")}</div>
            <div><strong>Monto Pagado:</strong> $${Number(pago.montoPagado).toFixed(2)}</div>
            <div><strong>Pago Capital:</strong> $${Number(pago.pagoCapital || 0).toFixed(2)}</div>
            <div><strong>Pago Interés:</strong> $${Number(pago.pagoInteres || 0).toFixed(2)}</div>
            <div><strong>Pago Multas:</strong> $${Number(pago.pagoMultas || 0).toFixed(2)}</div>
            <div><strong>Saldo Restante:</strong> $${Number(pago.saldoRestante || 0).toFixed(2)}</div>
            <button class="btn-imprimir" onclick="imprimirTicketPorId('${pago.id}')">
              <i class="fas fa-print"></i> Imprimir Ticket
            </button>
          </div>
        `;
      }
      document.getElementById("tickets-dui-container").innerHTML = html;
    };

    // --- IMPRIMIR TICKET INDIVIDUAL POR ID ---
    window.imprimirTicketPorId = async function(pagoId) {
      const docRef = doc(db, "pagos", pagoId);
      const docSnap = await getDoc(docRef);
      if (!docSnap.exists()) {
        alert("No se encontró el ticket.");
        return;
      }
      const pago = docSnap.data();

      // Buscar el DUI en el crédito y verificar si está anulado
      let dui = "";
      let anulado = false;
      if (pago.creditoID) {
        const creditoDoc = await getDoc(doc(db, "creditos", pago.creditoID));
        if (creditoDoc.exists()) {
          dui = creditoDoc.data().numeroDui || "";
          if (creditoDoc.data().anulado === true) anulado = true;
        }
      }
      if (anulado) {
        alert("El crédito asociado a este ticket fue ANULADO. No se puede imprimir el comprobante.");
        return;
      }

      let printHtml = `
        <html>
        <head>
          <title>Imprimir Ticket</title>
          <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #232323; margin:0; }
            .ticket-container { max-width: 420px; margin: 28px auto; background: #fff; border-radius: 11px; box-shadow: 0 2px 14px #0002; padding: 2.2rem 1.6rem 1.3rem 1.6rem; }
            .ticket-header { font-size: 1.22rem; color: #13b66b; font-weight: 700; margin-bottom: 9px; text-align:center; }
            .ticket-details strong { color: #333; min-width: 110px; display: inline-block; }
            .ticket-details { font-size: 1.04rem; padding:7px 0 0 0; }
          </style>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        </head>
        <body>
          <div class="ticket-container">
            <div class="ticket-header"><i class="fas fa-receipt"></i> Comprobante de Pago</div>
            <div class="ticket-details">
              <div><strong>Fecha:</strong> ${(pago.fechaPago || pago.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
              <div><strong>Correlativo:</strong> ${pago.correlativo || "<span style='color:#888'>Sin correlativo</span>"}</div>
              <div><strong>Cliente:</strong> ${(pago.nombres || "")}</div>
              <div><strong>DUI:</strong> ${dui || '-'}</div>
              <div><strong>Monto Pagado:</strong> $${Number(pago.montoPagado).toFixed(2)}</div>
              <div><strong>Pago Capital:</strong> $${Number(pago.pagoCapital || 0).toFixed(2)}</div>
              <div><strong>Pago Interés:</strong> $${Number(pago.pagoInteres || 0).toFixed(2)}</div>
              <div><strong>Pago Multas:</strong> $${Number(pago.pagoMultas || 0).toFixed(2)}</div>
              <div><strong>Saldo Restante:</strong> $${Number(pago.saldoRestante || 0).toFixed(2)}</div>
            </div>
            <div style="text-align:center;margin-top:28px;">
              <button onclick="window.print()" style="background:#13b66b;color:#fff;font-size:1.03rem;padding:10px 30px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Imprimir</button>
            </div>
          </div>
        </body>
        </html>
      `;
      const printWindow = window.open('', '_blank', 'width=600,height=600');
      printWindow.document.write(printHtml);
      printWindow.document.close();
      setTimeout(() => { printWindow.focus(); }, 500);
    };
  </script>
  <!-- FUNCIÓN PARA IMPRIMIR MOVIMIENTOS DE CAJA -->
  <script>
    window.imprimirMovimientoCajaTicket = function(ticket) {
      if (typeof ticket === 'string') ticket = JSON.parse(ticket);
      const printHtml = `
        <html>
        <head>
          <title>Imprimir Movimiento de Caja</title>
          <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; color: #232323; margin:0; }
            .ticket-container { max-width: 420px; margin: 28px auto; background: #fff; border-radius: 11px; box-shadow: 0 2px 14px #0002; padding: 2.2rem 1.6rem 1.3rem 1.6rem; }
            .ticket-header { font-size: 1.22rem; color: #f8af40; font-weight: 700; margin-bottom: 9px; text-align:center; }
            .ticket-details strong { color: #333; min-width: 110px; display: inline-block; }
            .ticket-details { font-size: 1.04rem; padding:7px 0 0 0; }
          </style>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        </head>
        <body>
          <div class="ticket-container">
            <div class="ticket-header"><i class="fas fa-cash-register"></i> Movimiento de Caja</div>
            <div class="ticket-details">
              <div><strong>Correlativo:</strong> ${ticket.correlativo}</div>
              <div><strong>Tipo:</strong> ${ticket.tipo || ticket.descripcion || '-'}</div>
              <div><strong>Nombre:</strong> ${ticket.nombre || '-'}</div>
              <div><strong>Monto:</strong> $${Number(ticket.monto || 0).toFixed(2)}</div>
              <div><strong>Usuario:</strong> ${ticket.usuario || '-'}</div>
              <div><strong>Fecha:</strong> ${(ticket.fecha || ticket.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
              <div><strong>Agencia:</strong> ${ticket.agencia || '-'}</div>
              <div><strong>Observaciones:</strong> ${ticket.observaciones || '-'}</div>
            </div>
            <div style="text-align:center;margin-top:28px;">
              <button onclick="window.print()" style="background:#f8af40;color:#232323;font-size:1.03rem;padding:10px 30px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Imprimir</button>
            </div>
          </div>
        </body>
        </html>
      `;
      const printWindow = window.open('', '_blank', 'width=600,height=600');
      printWindow.document.write(printHtml);
      printWindow.document.close();
      setTimeout(() => { printWindow.focus(); }, 500);
    };
  </script>
</body>
</html>
