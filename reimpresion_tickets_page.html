<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reimpresión de Tickets – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #111314;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #191b21;
      padding: 1.25rem 0 1.25rem 0;
      text-align: center;
      font-size: 1.7rem;
      letter-spacing: 1px;
      font-weight: 800;
      color: #ffe37a;
      margin-bottom: 2.5rem;
    }
    .center-card {
      max-width: 400px;
      margin: 44px auto 0 auto;
      background: #17191c;
      border-radius: 18px;
      box-shadow: 0 6px 32px #0005;
      padding: 2.2rem 1.5rem 2.4rem 1.5rem;
      min-height: 260px;
      text-align: center;
    }
    .titulo-buscar {
      font-size: 1.18rem;
      font-weight: bold;
      margin-bottom: 18px;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .input-main {
      width: 100%;
      background: #262a31;
      color: #fff;
      border: 1.5px solid #32353b;
      border-radius: 10px;
      font-size: 1.07rem;
      padding: 13px 12px;
      margin-bottom: 1em;
      outline: none;
      box-sizing: border-box;
      font-weight: 500;
      letter-spacing: 1px;
      transition: border-color .18s;
    }
    .input-main:focus { border-color: #FFD600; }
    .btn-main {
      width: 100%;
      background: #13b66b;
      color: #fff;
      font-size: 1.11rem;
      font-weight: bold;
      border: none;
      border-radius: 9px;
      padding: 13px 0;
      cursor: pointer;
      margin-top: 0.7em;
      transition: background .17s;
    }
    .btn-main:active,
    .btn-main:hover { background: #0b854c; }
    .ticket-box {
      margin-top: 35px;
    }
    .ticket-header {
      font-size: 1.12rem;
      color: #13b66b;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .ticket-details {
      background: #fff;
      color: #181818;
      border-radius: 10px;
      padding: 16px 15px 16px 15px;
      box-shadow: 0 2px 12px #0003;
      text-align: left;
      font-size: 1.03rem;
      margin-bottom: 22px;
    }
    .ticket-details strong { color: #111; min-width: 110px; display: inline-block; }
    .btn-imprimir {
      display: block;
      margin: 0 auto 0 auto;
      padding: 12px 28px;
      background: #f8af40;
      color: #232323;
      font-size: 1.04rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 1px 10px #f8af4045;
      transition: background .17s;
      text-align: center;
      margin-top: 6px;
    }
    .btn-imprimir:hover {
      background: #ffd600;
      color: #232323;
    }
    .error-msg {
      color: #ff6363;
      font-weight: bold;
      margin-top: 18px;
      font-size: 1.08rem;
    }
    @media (max-width: 540px) {
      .center-card { max-width: 97vw; padding: 1.1rem 2vw;}
    }
  </style>
</head>
<body>
  <header>Reimpresión de Tickets</header>
  <div class="center-card">
    <form id="formBuscarTicket" autocomplete="off">
      <div class="titulo-buscar">
        <i class="fas fa-search"></i> Buscar Ticket por Correlativo
      </div>
      <input type="text" class="input-main" id="input-correlativo" placeholder="Correlativo..." maxlength="15" required />
      <button class="btn-main" type="submit"><i class="fas fa-search"></i> Buscar Ticket</button>
    </form>
    <div id="ticket-container" class="ticket-box"></div>
    <div id="error-msg" class="error-msg" style="display:none"></div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Debes esperar la autenticación ANTES de dejar buscar tickets
    let usuarioListo = false;
    let usuario = null;

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        usuarioListo = true;
        usuario = user;
      }
    });

    document.getElementById('formBuscarTicket').onsubmit = async function(e) {
      e.preventDefault();
      if (!usuarioListo) {
        document.getElementById("error-msg").textContent = "Espera a que se inicie sesión...";
        document.getElementById("error-msg").style.display = "block";
        return;
      }
      document.getElementById("error-msg").style.display = "none";
      document.getElementById("ticket-container").innerHTML = "";

      const correlativo = document.getElementById('input-correlativo').value.trim();
      if (!correlativo) return;

      let ticket = null;
      // Busca en pagos
      const pagosQuery = query(collection(db, "pagos"), where("correlativo", "==", correlativo));
      const pagosSnap = await getDocs(pagosQuery);
      if (!pagosSnap.empty) {
        ticket = { ...pagosSnap.docs[0].data(), tipo: "pago" };
      }

      // Si no en pagos, busca en movimientosCaja
      if (!ticket) {
        const movCajaQuery = query(collection(db, "movimientosCaja"), where("correlativo", "==", correlativo));
        const movCajaSnap = await getDocs(movCajaQuery);
        if (!movCajaSnap.empty) {
          ticket = { ...movCajaSnap.docs[0].data(), tipo: "movimientoCaja" };
        }
      }

      // Si no en movimientos_caja (con guión bajo)
      if (!ticket) {
        const movCaja2Query = query(collection(db, "movimientos_caja"), where("correlativo", "==", correlativo));
        const movCaja2Snap = await getDocs(movCaja2Query);
        if (!movCaja2Snap.empty) {
          ticket = { ...movCaja2Snap.docs[0].data(), tipo: "movimientoCaja" };
        }
      }

      if (!ticket) {
        document.getElementById("error-msg").textContent = "No se encontró ningún ticket con ese correlativo.";
        document.getElementById("error-msg").style.display = "block";
        return;
      }

      // Muestra el ticket de acuerdo al tipo (puedes personalizar esto)
      let html = '';
      if (ticket.tipo === "pago") {
        html = `
          <div class="ticket-header"><i class="fas fa-receipt"></i> Comprobante de Pago</div>
          <div class="ticket-details">
            <div><strong>Correlativo:</strong> ${ticket.correlativo}</div>
            <div><strong>Cliente:</strong> ${ticket.nombres || ticket.clienteNombre || '-'}</div>
            <div><strong>Monto Pagado:</strong> $${Number(ticket.montoPagado).toFixed(2)}</div>
            <div><strong>Pago Capital:</strong> $${Number(ticket.pagoCapital || 0).toFixed(2)}</div>
            <div><strong>Pago Interés:</strong> $${Number(ticket.pagoInteres || 0).toFixed(2)}</div>
            <div><strong>Pago Multas:</strong> $${Number(ticket.pagoMultas || 0).toFixed(2)}</div>
            <div><strong>Saldo Restante:</strong> $${Number(ticket.saldoRestante || 0).toFixed(2)}</div>
            <div><strong>Fecha:</strong> ${(ticket.fechaPago || ticket.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
            <div><strong>Agencia:</strong> ${ticket.sucursal || ticket.agencia || '-'}</div>
          </div>
          <button class="btn-imprimir" onclick="window.print()"><i class="fas fa-print"></i> Imprimir Ticket</button>
        `;
      } else {
        // Movimiento de caja
        html = `
          <div class="ticket-header"><i class="fas fa-receipt"></i> Comprobante de Movimiento de Caja</div>
          <div class="ticket-details">
            <div><strong>Correlativo:</strong> ${ticket.correlativo}</div>
            <div><strong>Tipo:</strong> ${ticket.descripcion || ticket.tipo || '-'}</div>
            <div><strong>Nombre:</strong> ${ticket.nombre || '-'}</div>
            <div><strong>Monto:</strong> $${Number(ticket.monto || 0).toFixed(2)}</div>
            <div><strong>Usuario:</strong> ${ticket.usuario || '-'}</div>
            <div><strong>Fecha:</strong> ${(ticket.fecha || ticket.timestamp || '-').toString().slice(0,19).replace('T',' ')}</div>
            <div><strong>Agencia:</strong> ${ticket.agencia || '-'}</div>
            <div><strong>Observaciones:</strong> ${ticket.observaciones || '-'}</div>
          </div>
          <button class="btn-imprimir" onclick="window.print()"><i class="fas fa-print"></i> Imprimir Ticket</button>
        `;
      }

      document.getElementById("ticket-container").innerHTML = html;
    };
  </script>
</body>
</html>
