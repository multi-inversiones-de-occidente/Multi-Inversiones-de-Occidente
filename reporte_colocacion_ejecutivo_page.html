<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte de Colocación de Créditos</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let usuarioNombre = "";
    let usuarioAgencia = ""; // <- Agencia del usuario logueado
    let creditosData = [];          // créditos del usuario logueado (para la tabla)
    let docsPermitidosGlobal = [];  // créditos permitidos (todos los usuarios) para globales (de la misma agencia)
    let fechaDesde = null;
    let fechaHasta = null;

    function normaliza(str) {
      return (str || '').toString().trim().toLowerCase();
    }

    function formatFecha(fecha) {
      const d = new Date(fecha);
      return d.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    // Helper robusto para número
    function toNum(v) {
      const n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : Number(v);
      return isNaN(n) ? 0 : n;
    }

    // Estados permitidos
    function estadoPermitido(estado) {
      const e = normaliza(estado);
      return e === 'activo' || e === 'mora temprana';
    }

    // Toma la agencia del usuario desde el doc de users, probando campos comunes
    function extraerAgenciaUsuario(data) {
      const candidatos = [
        data.agenciaAsignada,
        data.agencia,
        data.sede,
        data.agenciaNombre
      ];
      for (const c of candidatos) {
        if ((c || '').toString().trim() !== '') return c.toString().trim();
      }
      return '';
    }

    async function obtenerCreditos() {
      try {
        if (!usuarioNombre || !usuarioAgencia) {
          document.getElementById('resultados').innerHTML = '<div style="text-align:center;color:#ffb">Falta la agencia del usuario. Verifica el perfil en "users".</div>';
          return;
        }
        document.getElementById('resultados').innerHTML = '<div class="loader"></div>';
        document.getElementById('resumen-global').innerHTML = '<div class="loader"></div>';
        document.getElementById('resumen-por-usuario').innerHTML = '';
        document.getElementById('resumen-linea').innerHTML = '';

        const creditosRef = collection(db, "creditos");
        const q = query(creditosRef, orderBy("fechaInicio", "desc"));
        const snapshot = await getDocs(q);

        // Trae TODO y luego filtra por fecha, estados permitidos y AGENCIA
        let docs = [];
        snapshot.forEach(d => {
          const data = d.data();
          data.id = d.id;
          docs.push(data);
        });

        // Preprocesar fecha
        docs = docs.map(doc => {
          let fechaDoc = doc.fechaInicio;
          if (typeof fechaDoc === "object" && fechaDoc?.seconds) {
            fechaDoc = new Date(fechaDoc.seconds * 1000);
          } else if (typeof fechaDoc === "string") {
            fechaDoc = new Date(fechaDoc);
          } else {
            fechaDoc = new Date(fechaDoc);
          }
          doc._fechaObj = fechaDoc;
          return doc;
        });

        // Filtrar por rango fechas + estados permitidos + AGENCIA del usuario
        const docsFiltrados = docs.filter(doc => {
          if (fechaDesde && doc._fechaObj < fechaDesde) return false;
          if (fechaHasta && doc._fechaObj > new Date(fechaHasta.getFullYear(), fechaHasta.getMonth(), fechaHasta.getDate(), 23,59,59)) return false;
          if (!estadoPermitido(doc.estadoCredito)) return false;
          if (normaliza(doc.agenciaAsignada) !== normaliza(usuarioAgencia)) return false;
          return true;
        });

        // Guardar globales (todos los usuarios) para tarjetas/tabla global (pero solo de ESTA AGENCIA)
        docsPermitidosGlobal = docsFiltrados;

        // Filtrar por usuario logueado para la tabla principal (se mantiene comportamiento original)
        creditosData = docsFiltrados.filter(doc => normaliza(doc.asignadoA) === normaliza(usuarioNombre));

        renderEncabezadoAgencia();
        renderCreditos();
        renderResumenGlobal();
        renderResumenPorUsuario();
        renderResumenLinea();
      } catch (err) {
        document.getElementById('resultados').innerHTML = '<div style="color:#f44; text-align:center">Error al cargar datos</div>';
        console.error(err);
      }
    }

    function renderEncabezadoAgencia() {
      const el = document.getElementById('agencia-usuario');
      el.textContent = usuarioAgencia ? `Agencia: ${usuarioAgencia}` : 'Agencia: —';
    }

    function renderCreditos() {
      const contenedor = document.getElementById('resultados');
      if (!creditosData.length) {
        contenedor.innerHTML = `<div style="text-align:center;color:#fff7">No hay créditos en el rango seleccionado para tu usuario en esta agencia.</div>`;
        document.getElementById("btn-imprimir")?.classList.add("oculto");
        document.getElementById("btn-pdf")?.classList.add("oculto");
        return;
      }
      let totalGeneral = 0;
      let html = `
      <h2 class="subtitulo">Detalle (Tus Créditos)</h2>
      <div class="tabla-scroll">
      <table class="tabla-reporte" id="tabla-reporte">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Agencia</th>
            <th>Cliente</th>
            <th>DUI</th>
            <th>Monto</th>
            <th>Línea</th>
            <th>Frecuencia</th>
            <th>Cuotas</th>
            <th>Cuota</th>
            <th>Tasa %</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
      `;
      creditosData.forEach(doc => {
        totalGeneral += toNum(doc.montoAprobado);
        html += `
          <tr>
            <td>${formatFecha(doc._fechaObj)}</td>
            <td>${doc.agenciaAsignada ?? '-'}</td>
            <td>${(doc.nombre ?? '') + ' ' + (doc.apellido ?? '')}</td>
            <td>${doc.numeroDui ?? '-'}</td>
            <td style="text-align:right;">$${toNum(doc.montoAprobado).toFixed(2)}</td>
            <td>${doc.lineaDeCredito ?? '-'}</td>
            <td>${doc.frecuenciaPago ?? '-'}</td>
            <td>${doc.numeroCuotas ?? '-'}</td>
            <td style="text-align:right;">$${toNum(doc.cuotaAprobada).toFixed(2)}</td>
            <td>${doc.tasaAnualCredito ?? '-'}</td>
            <td>${doc.estadoCredito ?? '-'}</td>
          </tr>
        `;
      });
      html += `
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4" style="text-align:right"><b>TOTAL</b></td>
            <td style="text-align:right;font-weight:bold;">$${totalGeneral.toFixed(2)}</td>
            <td colspan="6"></td>
          </tr>
        </tfoot>
      </table>
      </div>
      `;
      contenedor.innerHTML = html;
      document.getElementById("btn-imprimir")?.classList.remove("oculto");
      document.getElementById("btn-pdf")?.classList.remove("oculto");
    }

    // === Resumen Global (tarjetas) ===
    function renderResumenGlobal() {
      const wrap = document.getElementById('resumen-global');

      // Peso global (de esta agencia) = suma de saldoActual
      const pesoGlobal = docsPermitidosGlobal.reduce((s, d) => s + toNum(d.saldoActual), 0);

      // Para el usuario logueado
      const misDocs = docsPermitidosGlobal.filter(d => normaliza(d.asignadoA) === normaliza(usuarioNombre));
      const miPeso = misDocs.reduce((s, d) => s + toNum(d.saldoActual), 0);

      // Distintos clientes (clienteID || DUI || nombre+apellido)
      const clienteKey = (d) => (d.clienteID || d.numeroDui || ((d.nombre||'') + ' ' + (d.apellido||''))).toString();
      const totalClientesSet = new Set(docsPermitidosGlobal.map(clienteKey));
      const misClientesSet   = new Set(misDocs.map(clienteKey));

      wrap.innerHTML = `
        <h2 class="subtitulo">Datos Globales — ${usuarioAgencia}</h2>
        <div class="cards-row">
          <div class="card kpi">
            <div class="kpi-title">Peso de la Cartera (Agencia)</div>
            <div class="kpi-value">$${pesoGlobal.toFixed(2)}</div>
            <div class="kpi-sub">Estados: Activo + Mora Temprana</div>
          </div>
          <div class="card kpi">
            <div class="kpi-title">Clientes (Agencia)</div>
            <div class="kpi-value">${totalClientesSet.size}</div>
            <div class="kpi-sub">Únicos en periodo</div>
          </div>
          <div class="card kpi">
            <div class="kpi-title">Tu Cartera</div>
            <div class="kpi-value">$${miPeso.toFixed(2)}</div>
            <div class="kpi-sub">Asignado a: ${usuarioNombre}</div>
          </div>
          <div class="card kpi">
            <div class="kpi-title">Tus Clientes</div>
            <div class="kpi-value">${misClientesSet.size}</div>
            <div class="kpi-sub">Únicos en periodo</div>
          </div>
        </div>
      `;
    }

    // === Resumen Por Usuario (tabla) ===
    function renderResumenPorUsuario() {
      const cont = document.getElementById('resumen-por-usuario');
      if (!docsPermitidosGlobal.length) {
        cont.innerHTML = '';
        return;
      }

      const mapa = new Map();
      const clienteKey = (d) => (d.clienteID || d.numeroDui || ((d.nombre||'') + ' ' + (d.apellido||''))).toString();

      docsPermitidosGlobal.forEach(d => {
        const user = (d.asignadoA || '—').toString().trim();
        if (!mapa.has(user)) mapa.set(user, { peso: 0, clientes: new Set() });
        const obj = mapa.get(user);
        obj.peso += toNum(d.saldoActual);
        obj.clientes.add(clienteKey(d));
      });

      const filas = Array.from(mapa.entries())
        .map(([user, datos]) => ({
          user,
          peso: datos.peso,
          clientes: datos.clientes.size
        }))
        .sort((a,b)=> b.peso - a.peso);

      let html = `
        <h2 class="subtitulo">Resumen por Usuario (asignadoA) — ${usuarioAgencia}</h2>
        <div class="tabla-scroll">
          <table class="tabla-resumen">
            <thead>
              <tr>
                <th>Usuario</th>
                <th># Clientes</th>
                <th>Peso de Cartera</th>
              </tr>
            </thead>
            <tbody>
      `;
      filas.forEach(f => {
        html += `
          <tr>
            <td>${f.user}</td>
            <td style="text-align:right;">${f.clientes}</td>
            <td style="text-align:right;">$${f.peso.toFixed(2)}</td>
          </tr>
        `;
      });
      html += `
            </tbody>
          </table>
        </div>
      `;
      cont.innerHTML = html;
    }

    // === Resumen por Tipo de Crédito (se mantiene lo trabajado) ===
    function renderResumenLinea() {
      const cont = document.getElementById('resumen-linea');
      if (!docsPermitidosGlobal.length) {
        cont.innerHTML = '';
        return;
      }
      const total = docsPermitidosGlobal.reduce((s,d)=> s + toNum(d.montoAprobado), 0);
      const mapa = new Map();
      docsPermitidosGlobal.forEach(d => {
        const k = (d.lineaDeCredito || '—').toString().trim();
        if (!mapa.has(k)) mapa.set(k, { count: 0, monto: 0 });
        const o = mapa.get(k);
        o.count += 1;
        o.monto += toNum(d.montoAprobado);
      });

      const filas = Array.from(mapa.entries())
        .map(([k, v]) => ({
          linea: k,
          cantidad: v.count,
          monto: v.monto,
          pct: total > 0 ? (v.monto / total) * 100 : 0
        }))
        .sort((a,b)=> b.monto - a.monto);

      let html = `
        <h2 class="subtitulo">Resumen por Tipo de Crédito — ${usuarioAgencia}</h2>
        <div class="tabla-scroll">
          <table class="tabla-resumen">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Cantidad</th>
                <th>Monto Total</th>
                <th>% del Total</th>
              </tr>
            </thead>
            <tbody>
      `;
      filas.forEach(f => {
        html += `
          <tr>
            <td>${f.linea}</td>
            <td style="text-align:right;">${f.cantidad}</td>
            <td style="text-align:right;">$${f.monto.toFixed(2)}</td>
            <td style="text-align:right;">${f.pct.toFixed(1)}%</td>
          </tr>
        `;
      });
      html += `
            </tbody>
          </table>
        </div>
      `;
      cont.innerHTML = html;
    }

    function imprimirTabla() {
      // Imprime tarjetas + resúmenes + tabla
      const contenido = `
        <h2>Datos Globales — ${usuarioAgencia}</h2>
        ${document.getElementById('resumen-global').innerHTML}
        ${document.getElementById('resumen-por-usuario').innerHTML}
        ${document.getElementById('resumen-linea').innerHTML}
        ${document.getElementById('resultados').innerHTML}
      `;
      const ventana = window.open('', '', 'width=1000,height=700');
      ventana.document.write(`
        <html>
        <head>
          <title>Reporte de Colocación de Créditos</title>
          <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; padding: 24px; }
            h2 { margin: 12px 0 6px 0; }
            .cards-row { display:flex; gap:12px; flex-wrap:wrap; }
            .card { border:1px solid #bbb; border-radius:10px; padding:12px 16px; }
            table { width: 100%; border-collapse: collapse; margin-top: 12px; }
            th, td { border: 1px solid #bbb; padding: 6px 10px; font-size: 1rem;}
            th { background: #19b3ae; color: #fff;}
            tfoot td { font-size: 1.12rem; background:#eafdfc; font-weight:bold;}
          </style>
        </head>
        <body>
          <h2>Reporte de Colocación de Créditos — ${usuarioAgencia}</h2>
          ${contenido}
        </body>
        </html>
      `);
      ventana.document.close();
      ventana.print();
    }

    // ----- PDF -----
    async function descargarPDF() {
      if (!docsPermitidosGlobal.length) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'pt', 'a4'); // landscape
      const fecha = new Date();
      const titulo = "Reporte de Colocación de Créditos";
      const empresa = "MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.";
      const usuarioEmail = document.getElementById("usuario-nombre").textContent;

      doc.setFontSize(15);
      doc.text(empresa, 40, 40);
      doc.setFontSize(11);
      doc.text(`${titulo} — ${usuarioAgencia}`, 40, 60);
      doc.text(`Usuario: ${usuarioEmail}`, 40, 78);
      doc.text(`Fecha de generación: ${fecha.toLocaleString('es-SV')}`, 40, 94);

      // ======= Datos Globales (tarjetas) =======
      const pesoGlobal = docsPermitidosGlobal.reduce((s, d) => s + toNum(d.saldoActual), 0);
      const misDocs = docsPermitidosGlobal.filter(d => normaliza(d.asignadoA) === normaliza(usuarioNombre));
      const miPeso = misDocs.reduce((s, d) => s + toNum(d.saldoActual), 0);
      const clienteKey = (d) => (d.clienteID || d.numeroDui || ((d.nombre||'') + ' ' + (d.apellido||''))).toString();
      const totalClientesSet = new Set(docsPermitidosGlobal.map(clienteKey));
      const misClientesSet   = new Set(misDocs.map(clienteKey));

      doc.autoTable({
        head: [["Métrica","Valor"]],
        body: [
          ["Agencia", `${usuarioAgencia}`],
          ["Peso de la Cartera (Agencia)", `$${pesoGlobal.toFixed(2)}`],
          ["Clientes (Agencia)", `${totalClientesSet.size}`],
          [`Tu Cartera (${usuarioNombre})`, `$${miPeso.toFixed(2)}`],
          ["Tus Clientes", `${misClientesSet.size}`],
          ["Estados incluidos", "Activo, Mora Temprana"]
        ],
        startY: 110,
        theme: 'striped',
        headStyles: { fillColor: [13, 197, 185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      // ======= Resumen por Usuario (en la misma agencia) =======
      const mapa = new Map();
      docsPermitidosGlobal.forEach(d => {
        const user = (d.asignadoA || '—').toString().trim();
        if (!mapa.has(user)) mapa.set(user, { peso: 0, clientes: new Set() });
        const o = mapa.get(user);
        o.peso += toNum(d.saldoActual);
        o.clientes.add(clienteKey(d));
      });
      const filasUsuarios = Array.from(mapa.entries())
        .map(([user, datos]) => [user, `${datos.clientes.size}`, `$${datos.peso.toFixed(2)}`])
        .sort((a,b)=> parseFloat(b[2].replace(/[^0-9.]/g,'')) - parseFloat(a[2].replace(/[^0-9.]/g,'')));

      doc.autoTable({
        head: [["Usuario","# Clientes","Peso de Cartera"]],
        body: filasUsuarios,
        startY: doc.lastAutoTable.finalY + 12,
        theme: 'striped',
        headStyles: { fillColor: [13, 197, 185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      // ======= Resumen por Tipo de Crédito (en la misma agencia) =======
      const totalMonto = docsPermitidosGlobal.reduce((s,d)=> s + toNum(d.montoAprobado), 0);
      const mapaLinea = new Map();
      docsPermitidosGlobal.forEach(d => {
        const k = (d.lineaDeCredito || '—').toString().trim();
        if (!mapaLinea.has(k)) mapaLinea.set(k, { count: 0, monto: 0 });
        const o = mapaLinea.get(k);
        o.count += 1;
        o.monto += toNum(d.montoAprobado);
      });
      const bodyLinea = Array.from(mapaLinea.entries())
        .map(([k,v]) => [k, `${v.count}`, `$${v.monto.toFixed(2)}`, `${(totalMonto>0 ? (v.monto/totalMonto*100) : 0).toFixed(1)}%`])
        .sort((a,b)=> parseFloat(b[2].replace(/[^0-9.]/g,'')) - parseFloat(a[2].replace(/[^0-9.]/g,'')));

      doc.autoTable({
        head: [["Tipo","Cantidad","Monto Total","% del Total"]],
        body: bodyLinea,
        startY: doc.lastAutoTable.finalY + 12,
        theme: 'striped',
        headStyles: { fillColor: [13, 197, 185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      // ======= Detalle (tabla usuario logueado) =======
      const head = [[
        "Fecha", "Agencia", "Cliente", "DUI", "Monto", "Línea", "Frecuencia", "Cuotas", "Cuota", "Tasa %", "Estado"
      ]];
      const body = creditosData.map(d => [
        formatFecha(d._fechaObj),
        d.agenciaAsignada ?? '-',
        (d.nombre ?? '') + ' ' + (d.apellido ?? ''),
        d.numeroDui ?? '-',
        `$${toNum(d.montoAprobado).toFixed(2)}`,
        d.lineaDeCredito ?? '-',
        d.frecuenciaPago ?? '-',
        d.numeroCuotas ?? '-',
        `$${toNum(d.cuotaAprobada).toFixed(2)}`,
        d.tasaAnualCredito ?? '-',
        d.estadoCredito ?? '-'
      ]);
      let totalUsuario = creditosData.reduce((s, d) => s + toNum(d.montoAprobado), 0);

      doc.autoTable({
        head,
        body,
        startY: doc.lastAutoTable.finalY + 12,
        theme: 'striped',
        headStyles: { fillColor: [13, 197, 185], textColor: [255,255,255], fontStyle: 'bold' },
        foot: [[ "", "", "", "TOTAL", `$${totalUsuario.toFixed(2)}`, "", "", "", "", "", "" ]],
        footStyles: { fillColor: [27, 147, 106], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      doc.save(`reporte_creditos_${usuarioAgencia}_${fecha.toLocaleDateString('es-SV').replace(/\//g, '-')}.pdf`);
    }

    function onFechaDesdeChange(e) {
      const val = e.target.value;
      fechaDesde = val ? new Date(val) : null;
      obtenerCreditos();
    }
    function onFechaHastaChange(e) {
      const val = e.target.value;
      fechaHasta = val ? new Date(val) : null;
      obtenerCreditos();
    }

    window.addEventListener("DOMContentLoaded", async () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";

        // Busca el usuario en la colección 'users' para obtener nombre y AGENCIA
        const usersRef = collection(db, "users");
        const q = query(usersRef);
        const snapshot = await getDocs(q);
        let found = false;

        snapshot.forEach(docu => {
          const data = docu.data();
          if ((data.email || '').trim().toLowerCase() === (user.email || '').trim().toLowerCase()) {
            usuarioNombre = (data.nombre || '').trim();
            usuarioAgencia = extraerAgenciaUsuario(data); // <- tomar agencia del usuario
            found = true;
          }
        });

        if (!found) {
          alert("No se encontró el usuario en la base de datos.");
          return;
        }
        document.getElementById("usuario-nombre").textContent = user.email;
        renderEncabezadoAgencia();

        // Primer día del mes actual hasta hoy
        const now = new Date();
        document.getElementById('fecha-desde').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        document.getElementById('fecha-hasta').value = `${now.getFullYear()}-${String(now.getDate()).padStart(2,'0')}`;
        fechaDesde = new Date(now.getFullYear(), now.getMonth(), 1);
        fechaHasta = now;

        obtenerCreditos();
      });

      document.getElementById('fecha-desde').addEventListener('change', onFechaDesdeChange);
      document.getElementById('fecha-hasta').addEventListener('change', onFechaHastaChange);
      document.getElementById('btn-imprimir').addEventListener('click', imprimirTabla);
      document.getElementById('btn-pdf').addEventListener('click', descargarPDF);
    });
  </script>

  <!-- Librerías para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; min-height: 100vh;
    }
    header {
      background:#000; padding:1.07rem 0; text-align:center;
      font-size:1.29rem; letter-spacing:1px; font-weight:700;
      color:#67C8F1;
    }
    .container {
      max-width: 1050px;
      margin: 2.4rem auto 0 auto;
      background: #1c1d1f;
      border-radius: 17px;
      box-shadow: 0 2px 28px #0005;
      padding: 2.1rem 1.2rem 2.7rem 1.2rem;
      display: flex;
      flex-direction: column;
    }
    #usuario-nombre {
      color: #F8AF40;
      font-size: 1.03rem;
      text-align: right;
      margin-bottom: 0.2rem;
      font-weight: 600;
    }
    #agencia-usuario {
      color:#9ad7d2;
      font-size: .96rem;
      text-align:right;
      margin-bottom: .6rem;
      font-weight:600;
    }
    h1 {
      font-size: 1.36rem;
      font-weight: bold;
      text-align: center;
      color: #00e6c0;
      margin-bottom: 1.0rem;
      letter-spacing: .8px;
    }
    .filtros-row {
      display: flex;
      gap: 1.1rem;
      justify-content: center;
      margin-bottom: .9rem;
      flex-wrap: wrap;
    }
    .filtro-fecha {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #222;
      padding: 0.7rem 1.1rem 0.5rem 1.1rem;
      border-radius: 8px;
    }
    .filtro-fecha label {
      color: #67C8F1;
      font-size: .97rem;
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .filtro-fecha input[type="date"] {
      background: #191a1c;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 0.39rem 0.7rem;
      font-size: 1.01rem;
    }

    /* Tarjetas KPI */
    .cards-row {
      display:flex; gap:14px; flex-wrap:wrap; justify-content: center; margin: 8px 0 16px 0;
    }
    .card.kpi {
      background:#141717; border:1px solid #244f4c; border-radius:12px; padding:14px 16px; min-width:220px;
      box-shadow: 0 2px 10px #0006;
    }
    .kpi-title { color:#9ad7d2; font-weight:600; font-size:.95rem; }
    .kpi-value { font-size:1.4rem; font-weight:800; margin-top:6px; color:#fff; }
    .kpi-sub { font-size:.85rem; color:#8fb4b2; margin-top:2px; }

    .subtitulo {
      font-size: 1.05rem; color:#9ad7d2; margin: 14px 4px 6px 4px; font-weight:700; text-align:center;
    }

    .tabla-scroll {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 1.1rem;
      margin-top: 10px;
    }
    .tabla-reporte, .tabla-resumen {
      border-radius: 12px;
      background: #191e1e;
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
      margin: auto;
      font-size: 0.98rem;
    }
    .tabla-reporte th, .tabla-reporte td, .tabla-resumen th, .tabla-resumen td {
      border: 1px solid #244f4c;
      padding: 7px 7px;
      text-align: left;
    }
    .tabla-reporte th, .tabla-resumen th {
      background: #0dc5b9;
      color: #fff;
      font-weight: bold;
      text-align: center;
      font-size: 1.01rem;
    }
    .tabla-reporte tr:nth-child(even) td, .tabla-resumen tr:nth-child(even) td { background: #191e1e; }
    .tabla-reporte tr:nth-child(odd) td, .tabla-resumen tr:nth-child(odd) td { background: #222627; }
    .tabla-reporte tfoot td {
      background: #1b936a;
      color: #fff;
      font-weight: bold;
      font-size: 1.07rem;
      text-align: right;
    }
    #btn-imprimir, #btn-pdf {
      margin: 0 auto 0.4rem auto;
      background: #19b3ae;
      color: #fff;
      border: none;
      font-size: 1.09rem;
      font-weight: 600;
      border-radius: 7px;
      padding: 10px 30px;
      cursor: pointer;
      box-shadow: 0 2px 6px #00e6c042;
      transition: background .18s;
      display: block;
    }
    #btn-imprimir:hover, #btn-pdf:hover { background: #11a09a; }

    .loader {
      border: 4px solid #232324;
      border-top: 4px solid #13b66b;
      border-radius: 50%;
      width: 46px; height: 46px;
      animation: spin 1.1s linear infinite;
      margin: 1.0rem auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .oculto { display: none !important; }

    @media (max-width: 1100px) {
      .container { max-width: 99vw; }
      .tabla-reporte, .tabla-resumen { min-width: 650px; }
    }
    @media (max-width: 700px) {
      .container { padding: 1.1rem 1vw; }
      .tabla-reporte, .tabla-resumen { font-size: .91rem;}
    }
  </style>
</head>
<body>
  <header>Reporte de Colocación de Créditos</header>
  <div class="container">
    <div id="usuario-nombre"></div>
    <div id="agencia-usuario"></div>
    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.97rem;color:#fff;font-weight:400">Colocación de Créditos</span>
    </h1>

    <div class="filtros-row">
      <div class="filtro-fecha">
        <label for="fecha-desde">Desde:</label>
        <input type="date" id="fecha-desde" />
      </div>
      <div class="filtro-fecha">
        <label for="fecha-hasta">Hasta:</label>
        <input type="date" id="fecha-hasta" />
      </div>
    </div>

    <!-- Tarjetas Globales (de la misma agencia) -->
    <div id="resumen-global"></div>

    <!-- Resumen por Usuario (de la misma agencia) -->
    <div id="resumen-por-usuario"></div>

    <!-- Resumen por Tipo de Crédito (de la misma agencia) -->
    <div id="resumen-linea"></div>

    <!-- Detalle (tabla del usuario logueado) -->
    <div id="resultados"></div>

    <button id="btn-imprimir" class="oculto"><i class="fas fa-print"></i> Imprimir</button>
    <button id="btn-pdf" class="oculto"><i class="fas fa-file-pdf"></i> Descargar PDF</button>
  </div>
</body>
</html>
