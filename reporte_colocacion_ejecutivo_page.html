<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte de Colocación de Créditos</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let usuarioNombre = "";
    let creditosData = [];
    let fechaDesde = null;
    let fechaHasta = null;

    function normaliza(str) {
      return (str || '').toString().trim().toLowerCase();
    }

    function formatFecha(fecha) {
      const d = new Date(fecha);
      return d.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    async function obtenerCreditos() {
      try {
        if (!usuarioNombre) return;
        document.getElementById('resultados').innerHTML = '<div class="loader"></div>';
        const creditosRef = collection(db, "creditos");
        const q = query(
          creditosRef,
          orderBy("fechaInicio", "desc")
        );
        const snapshot = await getDocs(q);
        let docs = [];
        snapshot.forEach(doc => {
          let d = doc.data();
          d.id = doc.id;
          docs.push(d);
        });
        // Filtra por usuario asignado y fechas
        docs = docs.filter(doc => {
          // Comparar asignadoA con el nombre del usuario logueado (no email)
          if (normaliza(doc.asignadoA) !== normaliza(usuarioNombre)) return false;
          // Filtrar por rango de fechas
          let fechaDoc = doc.fechaInicio;
          if (typeof fechaDoc === "object" && fechaDoc.seconds) {
            fechaDoc = new Date(fechaDoc.seconds * 1000);
          } else if (typeof fechaDoc === "string") {
            fechaDoc = new Date(fechaDoc);
          } else {
            fechaDoc = new Date(fechaDoc);
          }
          if (fechaDesde && fechaDoc < fechaDesde) return false;
          if (fechaHasta && fechaDoc > new Date(fechaHasta.getFullYear(), fechaHasta.getMonth(), fechaHasta.getDate(), 23,59,59)) return false;
          doc._fechaObj = fechaDoc;
          return true;
        });

        creditosData = docs;
        renderCreditos();
      } catch (err) {
        document.getElementById('resultados').innerHTML = '<div style="color:#f44; text-align:center">Error al cargar datos</div>';
        console.error(err);
      }
    }

    function renderCreditos() {
      const contenedor = document.getElementById('resultados');
      if (!creditosData.length) {
        contenedor.innerHTML = `<div style="text-align:center;color:#fff7">No hay créditos en el rango seleccionado.</div>`;
        document.getElementById("btn-imprimir")?.classList.add("oculto");
        document.getElementById("btn-pdf")?.classList.add("oculto");
        return;
      }
      let totalGeneral = 0;
      let html = `
      <div class="tabla-scroll">
      <table class="tabla-reporte" id="tabla-reporte">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Agencia</th>
            <th>Cliente</th>
            <th>DUI</th>
            <th>Monto</th>
            <th>Línea</th>
            <th>Frecuencia</th>
            <th>Cuotas</th>
            <th>Cuota</th>
            <th>Tasa %</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
      `;
      creditosData.forEach(doc => {
        totalGeneral += Number(doc.montoAprobado || 0);
        html += `
          <tr>
            <td>${formatFecha(doc._fechaObj)}</td>
            <td>${doc.agenciaAsignada ?? '-'}</td>
            <td>${(doc.nombre ?? '') + ' ' + (doc.apellido ?? '')}</td>
            <td>${doc.numeroDui ?? '-'}</td>
            <td style="text-align:right;">$${Number(doc.montoAprobado || 0).toFixed(2)}</td>
            <td>${doc.lineaDeCredito ?? '-'}</td>
            <td>${doc.frecuenciaPago ?? '-'}</td>
            <td>${doc.numeroCuotas ?? '-'}</td>
            <td style="text-align:right;">$${Number(doc.cuotaAprobada || 0).toFixed(2)}</td>
            <td>${doc.tasaAnualCredito ?? '-'}</td>
            <td>${doc.estadoCredito ?? '-'}</td>
          </tr>
        `;
      });
      html += `
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4" style="text-align:right"><b>TOTAL</b></td>
            <td style="text-align:right;font-weight:bold;">$${totalGeneral.toFixed(2)}</td>
            <td colspan="6"></td>
          </tr>
        </tfoot>
      </table>
      </div>
      `;
      contenedor.innerHTML = html;
      document.getElementById("btn-imprimir")?.classList.remove("oculto");
      document.getElementById("btn-pdf")?.classList.remove("oculto");
    }

    function imprimirTabla() {
      // Solo imprime la tabla del reporte
      const contenido = document.getElementById('resultados').innerHTML;
      const ventana = window.open('', '', 'width=900,height=600');
      ventana.document.write(`
        <html>
        <head>
          <title>Reporte de Colocación de Créditos</title>
          <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; padding: 24px; }
            table { width: 100%; border-collapse: collapse; margin-top: 12px; }
            th, td { border: 1px solid #bbb; padding: 6px 10px; font-size: 1rem;}
            th { background: #19b3ae; color: #fff;}
            tfoot td { font-size: 1.12rem; background:#eafdfc; font-weight:bold;}
          </style>
        </head>
        <body>
          <h2>Reporte de Colocación de Créditos</h2>
          ${contenido}
        </body>
        </html>
      `);
      ventana.document.close();
      ventana.print();
    }

    // ----- NUEVA FUNCIÓN PDF -----
    async function descargarPDF() {
      if (!creditosData.length) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'pt', 'a4'); // 'l' = landscape
      const fecha = new Date();
      const titulo = "Reporte de Colocación de Créditos";
      const empresa = "MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.";
      const usuario = document.getElementById("usuario-nombre").textContent;

      doc.setFontSize(15);
      doc.text(empresa, 40, 40);
      doc.setFontSize(11);
      doc.text(titulo, 40, 60);
      doc.text(`Usuario: ${usuario}`, 40, 78);
      doc.text(`Fecha de generación: ${fecha.toLocaleString('es-SV')}`, 40, 94);

      // Encabezados
      const head = [[
        "Fecha", "Agencia", "Cliente", "DUI", "Monto", "Línea", "Frecuencia", "Cuotas", "Cuota", "Tasa %", "Estado"
      ]];

      // Filas
      const body = creditosData.map(doc => [
        formatFecha(doc._fechaObj),
        doc.agenciaAsignada ?? '-',
        (doc.nombre ?? '') + ' ' + (doc.apellido ?? ''),
        doc.numeroDui ?? '-',
        `$${Number(doc.montoAprobado || 0).toFixed(2)}`,
        doc.lineaDeCredito ?? '-',
        doc.frecuenciaPago ?? '-',
        doc.numeroCuotas ?? '-',
        `$${Number(doc.cuotaAprobada || 0).toFixed(2)}`,
        doc.tasaAnualCredito ?? '-',
        doc.estadoCredito ?? '-'
      ]);

      // Total al final
      let totalGeneral = creditosData.reduce((sum, d) => sum + Number(d.montoAprobado || 0), 0);

      // Tabla con autoTable
      doc.autoTable({
        head: head,
        body: body,
        startY: 110,
        theme: 'striped',
        headStyles: { fillColor: [13, 197, 185], textColor: [255,255,255], fontStyle: 'bold' },
        foot: [[
          "", "", "", "TOTAL",
          `$${totalGeneral.toFixed(2)}`,
          "", "", "", "", "", ""
        ]],
        footStyles: { fillColor: [27, 147, 106], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      doc.save(`reporte_creditos_${fecha.toLocaleDateString('es-SV').replace(/\//g, '-')}.pdf`);
    }

    function onFechaDesdeChange(e) {
      const val = e.target.value;
      fechaDesde = val ? new Date(val) : null;
      obtenerCreditos();
    }
    function onFechaHastaChange(e) {
      const val = e.target.value;
      fechaHasta = val ? new Date(val) : null;
      obtenerCreditos();
    }

    window.addEventListener("DOMContentLoaded", async () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        // Busca el usuario en la colección 'users' para obtener el nombre
        const usersRef = collection(db, "users");
        const q = query(usersRef);
        const snapshot = await getDocs(q);
        let found = false;
        snapshot.forEach(docu => {
          const data = docu.data();
          if ((data.email || '').trim().toLowerCase() === (user.email || '').trim().toLowerCase()) {
            usuarioNombre = (data.nombre || '').trim();
            found = true;
          }
        });
        if (!found) {
          alert("No se encontró el usuario en la base de datos.");
          return;
        }
        document.getElementById("usuario-nombre").textContent = user.email;
        // Primer día del mes actual hasta hoy
        const now = new Date();
        document.getElementById('fecha-desde').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        document.getElementById('fecha-hasta').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        fechaDesde = new Date(now.getFullYear(), now.getMonth(), 1);
        fechaHasta = now;
        obtenerCreditos();
      });
      document.getElementById('fecha-desde').addEventListener('change', onFechaDesdeChange);
      document.getElementById('fecha-hasta').addEventListener('change', onFechaHastaChange);
      document.getElementById('btn-imprimir').addEventListener('click', imprimirTabla);
      document.getElementById('btn-pdf').addEventListener('click', descargarPDF);
    });
  </script>
  <!-- Librerías para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; min-height: 100vh;
    }
    header {
      background:#000; padding:1.07rem 0; text-align:center;
      font-size:1.29rem; letter-spacing:1px; font-weight:700;
      color:#67C8F1;
    }
    .container {
      max-width: 1050px;
      margin: 2.4rem auto 0 auto;
      background: #1c1d1f;
      border-radius: 17px;
      box-shadow: 0 2px 28px #0005;
      padding: 2.1rem 1.2rem 2.7rem 1.2rem;
      display: flex;
      flex-direction: column;
    }
    #usuario-nombre {
      color: #F8AF40;
      font-size: 1.03rem;
      text-align: right;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    h1 {
      font-size: 1.36rem;
      font-weight: bold;
      text-align: center;
      color: #00e6c0;
      margin-bottom: 1.6rem;
      letter-spacing: .8px;
    }
    .filtros-row {
      display: flex;
      gap: 1.1rem;
      justify-content: center;
      margin-bottom: 1.6rem;
      flex-wrap: wrap;
    }
    .filtro-fecha {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #222;
      padding: 0.7rem 1.1rem 0.5rem 1.1rem;
      border-radius: 8px;
    }
    .filtro-fecha label {
      color: #67C8F1;
      font-size: .97rem;
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .filtro-fecha input[type="date"] {
      background: #191a1c;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 0.39rem 0.7rem;
      font-size: 1.01rem;
    }
    .tabla-scroll {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 1.7rem;
      margin-top: 12px;
    }
    .tabla-reporte {
      border-radius: 12px;
      background: #191e1e;
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
      margin: auto;
      font-size: 0.98rem;
    }
    .tabla-reporte th, .tabla-reporte td {
      border: 1px solid #244f4c;
      padding: 7px 7px;
      text-align: left;
    }
    .tabla-reporte th {
      background: #0dc5b9;
      color: #fff;
      font-weight: bold;
      text-align: center;
      font-size: 1.01rem;
    }
    .tabla-reporte tr:nth-child(even) td { background: #191e1e; }
    .tabla-reporte tr:nth-child(odd) td { background: #222627; }
    .tabla-reporte tfoot td {
      background: #1b936a;
      color: #fff;
      font-weight: bold;
      font-size: 1.07rem;
      text-align: right;
    }
    #btn-imprimir, #btn-pdf {
      margin: 0 auto 0.4rem auto;
      background: #19b3ae;
      color: #fff;
      border: none;
      font-size: 1.09rem;
      font-weight: 600;
      border-radius: 7px;
      padding: 10px 30px;
      cursor: pointer;
      box-shadow: 0 2px 6px #00e6c042;
      transition: background .18s;
      display: block;
    }
    #btn-imprimir:hover, #btn-pdf:hover { background: #11a09a; }
    .loader {
      border: 4px solid #232324;
      border-top: 4px solid #13b66b;
      border-radius: 50%;
      width: 46px; height: 46px;
      animation: spin 1.1s linear infinite;
      margin: 1.8rem auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .oculto { display: none !important; }
    @media (max-width: 1100px) {
      .container { max-width: 99vw; }
      .tabla-reporte { min-width: 650px; }
    }
    @media (max-width: 700px) {
      .container { padding: 1.1rem 1vw; }
      .tabla-reporte { font-size: .91rem;}
    }
  </style>
</head>
<body>
  <header>Reporte de Colocación de Créditos</header>
  <div class="container">
    <div id="usuario-nombre"></div>
    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.97rem;color:#fff;font-weight:400">Colocación de Créditos</span>
    </h1>
    <div class="filtros-row">
      <div class="filtro-fecha">
        <label for="fecha-desde">Desde:</label>
        <input type="date" id="fecha-desde" />
      </div>
      <div class="filtro-fecha">
        <label for="fecha-hasta">Hasta:</label>
        <input type="date" id="fecha-hasta" />
      </div>
    </div>
    <div id="resultados"></div>
    <button id="btn-imprimir" class="oculto"><i class="fas fa-print"></i> Imprimir</button>
    <button id="btn-pdf" class="oculto"><i class="fas fa-file-pdf"></i> Descargar PDF</button>
  </div>
</body>
</html>
