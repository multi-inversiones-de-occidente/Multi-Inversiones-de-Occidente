<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte Colocacion Gerencial</title>

  <!-- Firebase SDK (modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // ====== Estado de la página ======
    let usuarioEmail = "";
    let usuarioNombre = "";
    let usuarioAgencia = ""; // users/{uid}.department
    let docsAgencia = [];    // Créditos de la agencia (todos los usuarios) filtrados por fechas + estados

    let fechaDesde = null;
    let fechaHasta = null;

    // ====== Configuración de estados permitidos (gerencial) ======
    const ESTADOS_PERMITIDOS = new Set([
      "activo",
      "mora temprana",
      "mora moderada",
      "mora severa",
      "riesgo alto",
      "cobro judicial"
    ]);

    // ====== Utils ======
    const normaliza = (s) => (s ?? "").toString().trim().toLowerCase();
    function toNum(v) {
      if (typeof v === "number") return Number.isFinite(v) ? v : 0;
      if (v === null || v === undefined) return 0;
      const s = String(v).replace(/,/g, ".").replace(/[^\d.-]/g, "");
      const n = parseFloat(s);
      if (!Number.isFinite(n)) return 0;
      // Evita micro-residuos tipo 2.664535e-15
      return Math.abs(n) < 1e-9 ? 0 : n;
    }
    function asMoney(n) {
      return toNum(n).toLocaleString("es-SV", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
    }
    function formatFecha(fecha) {
      const d = new Date(fecha);
      if (isNaN(d)) return "—";
      return d.toLocaleDateString("es-SV", { day: "2-digit", month: "2-digit", year: "numeric" });
    }
    function endOfDay(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);
    }

    function keyCliente(d) {
      return (d.clienteID || d.numeroDui || ((d.nombre||"") + " " + (d.apellido||"")) || d.telefono || d.direccion || "s/clave").toString();
    }

    // ====== Carga de créditos (AGENCIA + FECHAS + ESTADOS) ======
    async function cargarCreditosGerencial() {
      if (!usuarioAgencia) {
        document.getElementById("detalle").innerHTML = `<div class="msg-warn">No se pudo determinar la agencia del usuario.</div>`;
        return;
      }

      // Loaders
      setLoading(true);

      const creditosRef = collection(db, "creditos");
      // No cruzar agencias: filtra por agenciaAsignada (como tu patrón)
      const qAgencia = query(creditosRef, where("agenciaAsignada", "==", usuarioAgencia), orderBy("fechaInicio", "desc"));
      const snap = await getDocs(qAgencia);

      const arr = [];
      snap.forEach(docu => {
        const d = docu.data();
        d.id = docu.id;

        // Normalizar fechaInicio
        let f = d.fechaInicio;
        if (f && typeof f === "object" && f.seconds) f = new Date(f.seconds * 1000);
        else if (typeof f === "string") f = new Date(f);
        else f = new Date(f);
        d._fechaObj = f;

        arr.push(d);
      });

      // Filtrar por rango de fechas + estados permitidos
      const filtrados = arr.filter(d => {
        if (fechaDesde && d._fechaObj < fechaDesde) return false;
        if (fechaHasta && d._fechaObj > endOfDay(fechaHasta)) return false;
        return ESTADOS_PERMITIDOS.has(normaliza(d.estadoCredito));
      });

      docsAgencia = filtrados;

      // Render
      renderHeaderInfo();
      renderKPIs();
      renderResumenEstados();
      renderResumenUsuarios();
      renderResumenLineas();
      renderTablaDetalle();

      setLoading(false);
    }

    function setLoading(isLoading) {
      document.getElementById("loader").style.display = isLoading ? "block" : "none";
      const blocks = ["kpis","res-estado","res-usuario","res-linea","detalle"];
      blocks.forEach(id => document.getElementById(id).style.opacity = isLoading ? "0.4" : "1");
    }

    // ====== Renders ======
    function renderHeaderInfo() {
      document.getElementById("usuario-email").textContent = usuarioEmail;
      document.getElementById("agencia-usuario").textContent = `Agencia: ${usuarioAgencia || "—"}`;
    }

    function renderKPIs() {
      const kpis = document.getElementById("kpis");
      if (!docsAgencia.length) {
        kpis.innerHTML = `<div class="msg-void">No hay datos en el rango seleccionado.</div>`;
        return;
      }

      const peso = docsAgencia.reduce((s,d)=> s + toNum(d.saldoActual), 0);
      const clientes = new Set(docsAgencia.map(keyCliente)).size;
      const totalCreditos = docsAgencia.length;

      kpis.innerHTML = `
        <div class="cards-row">
          <div class="card kpi">
            <div class="kpi-title">Peso de la Cartera (Agencia)</div>
            <div class="kpi-value">${asMoney(peso)}</div>
            <div class="kpi-sub">Estados: Activo, Mora T., Mora Mod., Mora Sev., Riesgo Alto, Cobro Judicial</div>
          </div>
          <div class="card kpi">
            <div class="kpi-title">Clientes (Agencia)</div>
            <div class="kpi-value">${clientes}</div>
            <div class="kpi-sub">Únicos en período</div>
          </div>
          <div class="card kpi">
            <div class="kpi-title">Créditos</div>
            <div class="kpi-value">${totalCreditos}</div>
            <div class="kpi-sub">En el período</div>
          </div>
        </div>
      `;
    }

    function renderResumenEstados() {
      const cont = document.getElementById("res-estado");
      if (!docsAgencia.length) { cont.innerHTML = ""; return; }

      const mapa = new Map(); // estado -> { count, pesoSaldo }
      docsAgencia.forEach(d => {
        const e = (d.estadoCredito || "—").toString();
        if (!mapa.has(e)) mapa.set(e, { count: 0, peso: 0 });
        const o = mapa.get(e);
        o.count += 1;
        o.peso += toNum(d.saldoActual);
      });

      const filas = Array.from(mapa.entries())
        .map(([estado, obj]) => ({ estado, count: obj.count, peso: obj.peso }))
        .sort((a,b)=> b.peso - a.peso);

      let html = `
        <h2 class="subtitulo">Resumen por Estado</h2>
        <div class="tabla-scroll">
          <table class="tabla-resumen">
            <thead>
              <tr><th>Estado</th><th class="num"># Créditos</th><th class="num">Peso (Saldo Actual)</th></tr>
            </thead>
            <tbody>
      `;
      filas.forEach(f => {
        html += `<tr>
          <td>${f.estado}</td>
          <td class="num">${f.count}</td>
          <td class="num">${asMoney(f.peso)}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      cont.innerHTML = html;
    }

    function renderResumenUsuarios() {
      const cont = document.getElementById("res-usuario");
      if (!docsAgencia.length) { cont.innerHTML = ""; return; }

      const mapa = new Map(); // asignadoA -> { pesoSaldo, clientes:Set, creditos }
      docsAgencia.forEach(d => {
        const u = (d.asignadoA || "—").toString().trim();
        if (!mapa.has(u)) mapa.set(u, { peso: 0, clientes: new Set(), creditos: 0 });
        const o = mapa.get(u);
        o.peso += toNum(d.saldoActual);
        o.clientes.add(keyCliente(d));
        o.creditos += 1;
      });

      const filas = Array.from(mapa.entries())
        .map(([user, obj]) => ({ user, peso: obj.peso, clientes: obj.clientes.size, creditos: obj.creditos }))
        .sort((a,b)=> b.peso - a.peso);

      let html = `
        <h2 class="subtitulo">Resumen por Ejecutivo (asignadoA)</h2>
        <div class="tabla-scroll">
          <table class="tabla-resumen">
            <thead>
              <tr><th>Usuario</th><th class="num"># Clientes</th><th class="num"># Créditos</th><th class="num">Peso Cartera</th></tr>
            </thead>
            <tbody>
      `;
      filas.forEach(f => {
        html += `<tr>
          <td>${f.user}</td>
          <td class="num">${f.clientes}</td>
          <td class="num">${f.creditos}</td>
          <td class="num">${asMoney(f.peso)}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      cont.innerHTML = html;
    }

    function renderResumenLineas() {
      const cont = document.getElementById("res-linea");
      if (!docsAgencia.length) { cont.innerHTML = ""; return; }

      const totalMonto = docsAgencia.reduce((s,d)=> s + toNum(d.montoAprobado), 0);
      const mapa = new Map(); // linea -> { count, monto }
      docsAgencia.forEach(d => {
        const lin = (d.lineaDeCredito || "—").toString().trim();
        if (!mapa.has(lin)) mapa.set(lin, { count: 0, monto: 0 });
        const o = mapa.get(lin);
        o.count += 1;
        o.monto += toNum(d.montoAprobado);
      });

      const filas = Array.from(mapa.entries())
        .map(([lin, obj]) => ({ lin, count: obj.count, monto: obj.monto, pct: totalMonto>0 ? (obj.monto/totalMonto*100) : 0 }))
        .sort((a,b)=> b.monto - a.monto);

      let html = `
        <h2 class="subtitulo">Resumen por Tipo de Crédito</h2>
        <div class="tabla-scroll">
          <table class="tabla-resumen">
            <thead>
              <tr><th>Tipo</th><th class="num">Cantidad</th><th class="num">Monto Total</th><th class="num">% del Total</th></tr>
            </thead>
            <tbody>
      `;
      filas.forEach(f => {
        html += `<tr>
          <td>${f.lin}</td>
          <td class="num">${f.count}</td>
          <td class="num">${asMoney(f.monto)}</td>
          <td class="num">${f.pct.toFixed(1)}%</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
      cont.innerHTML = html;
    }

    function renderTablaDetalle() {
      const cont = document.getElementById("detalle");
      if (!docsAgencia.length) {
        cont.innerHTML = `<div class="msg-void">No hay créditos para mostrar.</div>`;
        toggleActions(false);
        return;
      }

      // Orden por fecha desc
      const filas = [...docsAgencia].sort((a,b)=> b._fechaObj - a._fechaObj);

      let totalMonto = 0;
      let totalSaldo = 0;

      let html = `
        <h2 class="subtitulo">Detalle de Créditos (Todos los usuarios de ${usuarioAgencia})</h2>
        <div class="tabla-scroll">
          <table class="tabla-reporte" id="tabla-detalle">
            <thead>
              <tr>
                <th>Inicio</th>
                <th>Agencia</th>
                <th>Asignado A</th>
                <th>Cliente</th>
                <th>DUI</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Línea</th>
                <th>Frecuencia</th>
                <th class="num">Monto Aprob.</th>
                <th class="num">Cuota</th>
                <th class="num"># Cuotas</th>
                <th class="num">Tasa %</th>
                <th class="num">Saldo Inicial</th>
                <th class="num">Saldo Actual</th>
                <th class="num">Cap. Atrasado</th>
                <th class="num">Para al Día</th>
                <th class="num">Multas Acum.</th>
                <th># Cuotas Atr.</th>
                <th>Estado</th>
                <th>Últ. Cálculo</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
      `;

      filas.forEach(d => {
        totalMonto += toNum(d.montoAprobado);
        totalSaldo += toNum(d.saldoActual);

        const cliente = `${d.nombre ?? ""} ${d.apellido ?? ""}`.trim() || (d.nombreCompleto ?? "—");
        const ultCalc = d.fechaUltimoCalculoIntereses
          ? (d.fechaUltimoCalculoIntereses.seconds ? formatFecha(new Date(d.fechaUltimoCalculoIntereses.seconds * 1000)) : (typeof d.fechaUltimoCalculoIntereses === "string" ? d.fechaUltimoCalculoIntereses : "—"))
          : (d.ultimaActualizacion && d.ultimaActualizacion.seconds ? formatFecha(new Date(d.ultimaActualizacion.seconds*1000)) : (d.ultimaActualizacion || "—"));

        html += `
          <tr>
            <td>${formatFecha(d._fechaObj)}</td>
            <td>${d.agenciaAsignada ?? "—"}</td>
            <td>${d.asignadoA ?? "—"}</td>
            <td>${cliente || "—"}</td>
            <td>${d.numeroDui ?? "—"}</td>
            <td>${d.telefono ?? "—"}</td>
            <td class="td-dir">${d.direccion ?? "—"}</td>
            <td>${d.lineaDeCredito ?? "—"}</td>
            <td>${d.frecuenciaPago ?? "—"}</td>
            <td class="num">${asMoney(d.montoAprobado)}</td>
            <td class="num">${asMoney(d.cuotaAprobada)}</td>
            <td class="num">${d.numeroCuotas ?? "—"}</td>
            <td class="num">${toNum(d.tasaAnualCredito) || d.tasaAnualCredito === 0 ? toNum(d.tasaAnualCredito).toFixed(0) : "—"}</td>
            <td class="num">${asMoney(d.saldoInicial)}</td>
            <td class="num">${asMoney(d.saldoActual)}</td>
            <td class="num">${asMoney(d.capitalAtrasado)}</td>
            <td class="num">${asMoney(d.paraPonerseAlDia)}</td>
            <td class="num">${asMoney(d.multasAcumuladas)}</td>
            <td class="num">${d.cuotasAtrasadas ?? 0}</td>
            <td>${d.estadoCredito ?? "—"}</td>
            <td>${ultCalc}</td>
            <td>
              <button class="btn-mini" data-id="${d.id}" onclick="verDetalleCredito('${d.id}')">Ver detalle</button>
            </td>
          </tr>
        `;
      });

      html += `
            </tbody>
            <tfoot>
              <tr>
                <td colspan="9" class="num"><b>TOTALES</b></td>
                <td class="num"><b>${asMoney(totalMonto)}</b></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="num"><b>${asMoney(docsAgencia.reduce((s,d)=> s + toNum(d.saldoInicial),0))}</b></td>
                <td class="num"><b>${asMoney(totalSaldo)}</b></td>
                <td colspan="6"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      `;

      cont.innerHTML = html;
      toggleActions(true);
      // Guarda dataset para exportar a Excel
      const tbl = document.getElementById("tabla-detalle");
      tbl.dataset.json = JSON.stringify(filas);
    }

    function toggleActions(show) {
      document.getElementById("btn-imprimir").classList.toggle("oculto", !show);
      document.getElementById("btn-pdf").classList.toggle("oculto", !show);
      document.getElementById("btn-excel").classList.toggle("oculto", !show);
    }

    // ====== Modal de detalle (amortización y multas) ======
    window.verDetalleCredito = function(id) {
      const d = docsAgencia.find(x => x.id === id);
      if (!d) return;

      const cliente = `${d.nombre ?? ""} ${d.apellido ?? ""}`.trim() || (d.nombreCompleto ?? "—");

      // Amortización
      let amortRows = "";
      if (Array.isArray(d.amortizacion) && d.amortizacion.length) {
        amortRows = d.amortizacion.map((q, idx) => `
          <tr>
            <td class="num">${q.numeroCuota ?? (idx+1)}</td>
            <td>${q.fecha ?? "—"}</td>
            <td>${q.estado ?? "—"}</td>
            <td class="num">${asMoney(q.cuota)}</td>
            <td class="num">${asMoney(q.capital)}</td>
            <td class="num">${asMoney(q.interes)}</td>
            <td class="num">${asMoney(q.montoPagado)}</td>
            <td class="num">${asMoney(q.montoPagadoInteres)}</td>
            <td class="num">${asMoney(q.saldo)}</td>
            <td>${q.fechaPagoReal ?? "—"}</td>
          </tr>
        `).join("");
      } else {
        amortRows = `<tr><td colspan="10" class="num">Sin amortización</td></tr>`;
      }

      // Multas
      let multaRows = "";
      if (Array.isArray(d.historialMultas) && d.historialMultas.length) {
        multaRows = d.historialMultas.map((m, idx) => `
          <tr>
            <td class="num">${idx+1}</td>
            <td>${m.fecha ?? "—"}</td>
            <td class="num">${m.cuotaNumero ?? "—"}</td>
            <td>${m.tipo ?? "—"}</td>
            <td>${m.estadoCuota ?? "—"}</td>
            <td class="num">${asMoney(m.monto)}</td>
          </tr>
        `).join("");
      } else {
        multaRows = `<tr><td colspan="6" class="num">Sin multas</td></tr>`;
      }

      document.getElementById("modal-body").innerHTML = `
        <div class="modal-head">
          <div>
            <div class="modal-title">Crédito: ${d.id}</div>
            <div class="modal-sub">Cliente: <b>${cliente}</b> · Ejecutivo: <b>${d.asignadoA || "—"}</b> · Estado: <b>${d.estadoCredito || "—"}</b></div>
          </div>
          <button class="btn-mini secondary" onclick="cerrarModal()">Cerrar</button>
        </div>
        <div class="modal-grid">
          <div class="modal-box">
            <div class="modal-box-title">Datos del Crédito</div>
            <div class="kv">
              <div><span>Inicio:</span><b>${formatFecha(d._fechaObj)}</b></div>
              <div><span>Línea:</span><b>${d.lineaDeCredito ?? "—"}</b></div>
              <div><span>Frecuencia:</span><b>${d.frecuenciaPago ?? "—"}</b></div>
              <div><span>Monto Aprobado:</span><b>${asMoney(d.montoAprobado)}</b></div>
              <div><span>Cuota Aprobada:</span><b>${asMoney(d.cuotaAprobada)}</b></div>
              <div><span># Cuotas:</span><b>${d.numeroCuotas ?? "—"}</b></div>
              <div><span>Tasa Anual:</span><b>${toNum(d.tasaAnualCredito) ? toNum(d.tasaAnualCredito).toFixed(0) + "%" : "—"}</b></div>
            </div>
            <div class="kv">
              <div><span>Saldo Inicial:</span><b>${asMoney(d.saldoInicial)}</b></div>
              <div><span>Saldo Actual:</span><b>${asMoney(d.saldoActual)}</b></div>
              <div><span>Capital Atrasado:</span><b>${asMoney(d.capitalAtrasado)}</b></div>
              <div><span>Para Ponerse al Día:</span><b>${asMoney(d.paraPonerseAlDia)}</b></div>
              <div><span>Cuotas Atrasadas:</span><b>${d.cuotasAtrasadas ?? 0}</b></div>
              <div><span>Últ. Cálculo:</span><b>${d.fechaUltimoCalculoIntereses ? (d.fechaUltimoCalculoIntereses.seconds ? formatFecha(new Date(d.fechaUltimoCalculoIntereses.seconds * 1000)) : (typeof d.fechaUltimoCalculoIntereses === "string" ? d.fechaUltimoCalculoIntereses : "—")) : (d.ultimaActualizacion || "—")}</b></div>
            </div>
            <div class="kv">
              <div><span>DUI:</span><b>${d.numeroDui ?? "—"}</b></div>
              <div><span>Teléfono:</span><b>${d.telefono ?? "—"}</b></div>
              <div class="kv-wide"><span>Dirección:</span><b>${d.direccion ?? "—"}</b></div>
            </div>
          </div>

          <div class="modal-box">
            <div class="modal-box-title">Amortización</div>
            <div class="tabla-scroll">
              <table class="tabla-resumen">
                <thead>
                  <tr>
                    <th class="num">#</th><th>Fecha</th><th>Estado</th>
                    <th class="num">Cuota</th><th class="num">Capital</th><th class="num">Interés</th>
                    <th class="num">Pagado Cap.</th><th class="num">Pagado Interés</th><th class="num">Saldo</th><th>Pago Real</th>
                  </tr>
                </thead>
                <tbody>${amortRows}</tbody>
              </table>
            </div>
          </div>

          <div class="modal-box">
            <div class="modal-box-title">Historial de Multas</div>
            <div class="tabla-scroll">
              <table class="tabla-resumen">
                <thead>
                  <tr>
                    <th class="num">#</th><th>Fecha</th><th class="num">Cuota</th><th>Tipo</th><th>Estado Cuota</th><th class="num">Monto</th>
                  </tr>
                </thead>
                <tbody>${multaRows}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      document.getElementById("modal").classList.add("show");
    };

    window.cerrarModal = function() {
      document.getElementById("modal").classList.remove("show");
    };

    // ====== Export / Print / PDF ======
    window.exportarExcel = function() {
      const tbl = document.getElementById("tabla-detalle");
      const raw = tbl?.dataset?.json ? JSON.parse(tbl.dataset.json) : [];
      if (!raw.length) return;

      const wsData = [
        ["Inicio","Agencia","AsignadoA","Cliente","DUI","Telefono","Direccion","Linea","Frecuencia","MontoAprobado","CuotaAprobada","#Cuotas","TasaAnual","SaldoInicial","SaldoActual","CapitalAtrasado","ParaPonerseAlDia","MultasAcumuladas","CuotasAtrasadas","Estado","UltCalculo","ID"],
        ...raw.map(d => [
          formatFecha(d._fechaObj),
          d.agenciaAsignada ?? "",
          (d.asignadoA ?? "").trim(),
          `${(d.nombre ?? "")} ${(d.apellido ?? "")}`.trim() || (d.nombreCompleto ?? ""),
          d.numeroDui ?? "",
          d.telefono ?? "",
          d.direccion ?? "",
          d.lineaDeCredito ?? "",
          d.frecuenciaPago ?? "",
          toNum(d.montoAprobado),
          toNum(d.cuotaAprobada),
          d.numeroCuotas ?? "",
          toNum(d.tasaAnualCredito),
          toNum(d.saldoInicial),
          toNum(d.saldoActual),
          toNum(d.capitalAtrasado),
          toNum(d.paraPonerseAlDia),
          toNum(d.multasAcumuladas),
          d.cuotasAtrasadas ?? 0,
          d.estadoCredito ?? "",
          (d.fechaUltimoCalculoIntereses?.seconds ? new Date(d.fechaUltimoCalculoIntereses.seconds*1000).toISOString().slice(0,10) : (typeof d.fechaUltimoCalculoIntereses === "string" ? d.fechaUltimoCalculoIntereses : "")),
          d.id
        ])
      ];

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      ws['!cols'] = [
        {wch:10},{wch:12},{wch:20},{wch:24},{wch:13},{wch:12},{wch:28},{wch:14},{wch:12},
        {wch:12},{wch:12},{wch:8},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:10},{wch:16},{wch:12},{wch:20}
      ];
      XLSX.utils.book_append_sheet(wb, ws, "Detalle");
      XLSX.writeFile(wb, `reporte_colocacion_gerencial_${usuarioAgencia}.xlsx`);
    };

    window.imprimir = function() {
      const contenido = `
        <h2>Reporte Colocacion Gerencial — ${usuarioAgencia}</h2>
        ${document.getElementById("kpis").innerHTML}
        ${document.getElementById("res-estado").innerHTML}
        ${document.getElementById("res-usuario").innerHTML}
        ${document.getElementById("res-linea").innerHTML}
        ${document.getElementById("detalle").innerHTML}
      `;
      const w = window.open("", "", "width=1200,height=800");
      w.document.write(`
        <html>
        <head>
          <title>Reporte Colocacion Gerencial</title>
          <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; }
            h2 { margin: 6px 0 12px 0; }
            .cards-row { display:flex; gap:12px; flex-wrap:wrap; }
            .card { border:1px solid #bbb; border-radius:10px; padding:12px 16px; }
            table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
            th, td { border: 1px solid #bbb; padding: 6px 8px; }
            th { background: #19b3ae; color:#fff; }
          </style>
        </head>
        <body>${contenido}</body>
        </html>
      `);
      w.document.close();
      w.focus();
      w.print();
    };

    window.exportarPDF = function() {
      if (!docsAgencia.length) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l','pt','a4');
      const fecha = new Date();

      doc.setFontSize(15);
      doc.text("MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.", 40, 40);
      doc.setFontSize(11);
      doc.text(`Reporte Colocacion Gerencial — ${usuarioAgencia}`, 40, 60);
      doc.text(`Usuario: ${usuarioEmail}`, 40, 78);
      doc.text(`Fecha de generación: ${fecha.toLocaleString('es-SV')}`, 40, 94);

      // KPIs
      const peso = docsAgencia.reduce((s,d)=> s + toNum(d.saldoActual), 0);
      const clientes = new Set(docsAgencia.map(keyCliente)).size;
      const totalCreditos = docsAgencia.length;

      doc.autoTable({
        head: [["Métrica","Valor"]],
        body: [
          ["Peso de la Cartera (Agencia)", asMoney(peso)],
          ["Clientes (Agencia)", String(clientes)],
          ["Créditos", String(totalCreditos)],
          ["Estados incluidos", "Activo, Mora Temprana, Mora Moderada, Mora Severa, Riesgo Alto, Cobro Judicial"]
        ],
        startY: 110,
        theme: 'striped',
        headStyles: { fillColor: [13,197,185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      // Resumen por estado
      const mapaEstado = new Map();
      docsAgencia.forEach(d => {
        const e = d.estadoCredito || "—";
        if (!mapaEstado.has(e)) mapaEstado.set(e, { count:0, peso:0 });
        const o = mapaEstado.get(e);
        o.count += 1;
        o.peso += toNum(d.saldoActual);
      });
      const filasEstado = Array.from(mapaEstado.entries()).map(([e,o])=>[e, String(o.count), asMoney(o.peso)])
        .sort((a,b)=> parseFloat(b[2].replace(/[^\d.]/g,'')) - parseFloat(a[2].replace(/[^\d.]/g,'')));

      doc.autoTable({
        head: [["Estado","# Créditos","Peso"]],
        body: filasEstado,
        startY: doc.lastAutoTable.finalY + 12,
        theme: 'striped',
        headStyles: { fillColor: [13,197,185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      // Resumen por usuario
      const mapaUser = new Map();
      docsAgencia.forEach(d => {
        const u = (d.asignadoA || "—").toString().trim();
        if (!mapaUser.has(u)) mapaUser.set(u, { peso:0, clientes:new Set(), creditos:0 });
        const o = mapaUser.get(u);
        o.peso += toNum(d.saldoActual);
        o.clientes.add(keyCliente(d));
        o.creditos += 1;
      });
      const filasUser = Array.from(mapaUser.entries())
        .map(([u,o])=>[u, String(o.clientes.size), String(o.creditos), asMoney(o.peso)])
        .sort((a,b)=> parseFloat(b[3].replace(/[^\d.]/g,'')) - parseFloat(a[3].replace(/[^\d.]/g,'')));

      doc.autoTable({
        head: [["Usuario","# Clientes","# Créditos","Peso"]],
        body: filasUser,
        startY: doc.lastAutoTable.finalY + 12,
        theme: 'striped',
        headStyles: { fillColor: [13,197,185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      // Detalle (recortado a columnas clave para PDF)
      const head = [[
        "Inicio","Agencia","AsignadoA","Cliente","DUI","Linea","Frecuencia","Monto","Cuota","#Cuotas","Tasa%","SaldoAct","Estado"
      ]];
      const body = docsAgencia.map(d => [
        formatFecha(d._fechaObj),
        d.agenciaAsignada ?? "—",
        (d.asignadoA ?? "—").toString().trim(),
        `${(d.nombre ?? "")} ${(d.apellido ?? "")}`.trim() || (d.nombreCompleto ?? "—"),
        d.numeroDui ?? "—",
        d.lineaDeCredito ?? "—",
        d.frecuenciaPago ?? "—",
        asMoney(d.montoAprobado),
        asMoney(d.cuotaAprobada),
        d.numeroCuotas ?? "—",
        toNum(d.tasaAnualCredito) ? toNum(d.tasaAnualCredito).toFixed(0) : "—",
        asMoney(d.saldoActual),
        d.estadoCredito ?? "—"
      ]);

      doc.autoTable({
        head,
        body,
        startY: doc.lastAutoTable.finalY + 12,
        theme: 'striped',
        headStyles: { fillColor: [13,197,185], textColor: [255,255,255], fontStyle: 'bold' },
        styles: { fontSize: 8.5, cellPadding: 2 }
      });

      const mm = String(fecha.getMonth()+1).padStart(2,'0');
      const dd = String(fecha.getDate()).padStart(2,'0');
      doc.save(`reporte_colocacion_gerencial_${usuarioAgencia}_${fecha.getFullYear()}-${mm}-${dd}.pdf`);
    };

    // ====== Fechas ======
    function onFechaDesdeChange(e) {
      fechaDesde = e.target.value ? new Date(e.target.value) : null;
      cargarCreditosGerencial();
    }
    function onFechaHastaChange(e) {
      fechaHasta = e.target.value ? new Date(e.target.value) : null;
      cargarCreditosGerencial();
    }

    // ====== Inicio ======
    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async (user) => {
        if (!user) return location.href = "login.html";
        usuarioEmail = user.email || "";

        // Leemos users/{uid}.department (patrón de no cruzar agencias)
        const usersRef = collection(db, "users");
        const qUser = query(usersRef, where("__name__", "==", user.uid));
        const snap = await getDocs(qUser);
        if (snap.empty) {
          alert("No se encontró el usuario en la base de datos.");
          return;
        }
        const data = snap.docs[0].data();
        usuarioNombre  = (data.nombre || "").toString().trim();
        usuarioAgencia = (data.department || "").toString().trim();

        // Fechas: 1º del mes a hoy (YYYY-MM-DD correctos)
        const now = new Date();
        const mm = String(now.getMonth()+1).padStart(2,'0');
        const dd = String(now.getDate()).padStart(2,'0');
        document.getElementById("fecha-desde").value = `${now.getFullYear()}-${mm}-01`;
        document.getElementById("fecha-hasta").value = `${now.getFullYear()}-${mm}-${dd}`;
        fechaDesde = new Date(now.getFullYear(), now.getMonth(), 1);
        fechaHasta = now;

        renderHeaderInfo();
        cargarCreditosGerencial();
      });

      document.getElementById("fecha-desde").addEventListener("change", onFechaDesdeChange);
      document.getElementById("fecha-hasta").addEventListener("change", onFechaHastaChange);
      document.getElementById("btn-excel").addEventListener("click", exportarExcel);
      document.getElementById("btn-imprimir").addEventListener("click", imprimir);
      document.getElementById("btn-pdf").addEventListener("click", exportarPDF);
      document.getElementById("modal-overlay").addEventListener("click", cerrarModal);
    });
  </script>

  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- SheetJS (Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg:#101212; --card:#1c1d1f; --muted:#9ad7d2; --brand:#0dc5b9; --ink:#fff; --grid:#244f4c;
    }
    *{ box-sizing: border-box }
    body { background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Arial, sans-serif; margin:0; min-height:100vh; }
    header { background:#000; padding:1rem 0; text-align:center; font-size:1.2rem; letter-spacing:.8px; font-weight:700; color:#67C8F1; }
    .container { max-width: 1200px; margin: 1.6rem auto; background: var(--card); border-radius: 18px; box-shadow: 0 2px 28px #0005; padding: 1.4rem; }
    #usuario-email { color: #F8AF40; font-size:.95rem; text-align:right; font-weight:600; }
    #agencia-usuario { color: var(--muted); font-size:.95rem; text-align:right; margin-bottom:.4rem; font-weight:600; }
    h1 { text-align:center; color:#00e6c0; font-size:1.35rem; margin: .2rem 0 1rem; }
    .filtros { display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-bottom:.8rem; }
    .filtro { background:#222; padding:.6rem .9rem; border-radius:8px; display:flex; flex-direction:column; }
    .filtro label { color:#67C8F1; font-weight:600; font-size:.92rem; margin-bottom:3px; }
    .filtro input[type="date"]{ background:#191a1c; color:#fff; border:none; border-radius:5px; padding:.35rem .6rem; font-size:.98rem; }

    .actions { display:flex; gap:.6rem; justify-content:center; margin: .6rem 0 1rem; }
    .btn {
      display:inline-flex; align-items:center; gap:.5rem;
      background:#19b3ae; border:none; color:#fff; font-weight:700; border-radius:8px;
      padding:.55rem 1rem; cursor:pointer; box-shadow: 0 2px 10px #0006;
    }
    .btn:hover { background:#11a09a; }
    .btn.secondary { background:#2b2e2f; }
    .btn-mini { padding:.3rem .6rem; border-radius:8px; border:none; cursor:pointer; background:#19b3ae; color:#fff; font-weight:600; }
    .btn-mini.secondary { background:#2b2e2f; }

    .cards-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:8px 0 10px; }
    .card.kpi { background:#141717; border:1px solid var(--grid); border-radius:12px; padding:12px 14px; min-width:220px; box-shadow: 0 2px 10px #0006; }
    .kpi-title { color:var(--muted); font-weight:600; font-size:.95rem; }
    .kpi-value { font-size:1.4rem; font-weight:800; margin-top:6px; }
    .kpi-sub { font-size:.85rem; color:#8fb4b2; margin-top:2px; }

    .subtitulo { font-size:1.05rem; color:var(--muted); margin:12px 4px 6px; font-weight:700; text-align:center; }
    .tabla-scroll { width:100%; overflow-x:auto; margin:.5rem 0 1rem; }
    table { width:100%; border-collapse:collapse; min-width:900px; background:#191e1e; border-radius:12px; overflow:hidden; }
    th, td { border:1px solid var(--grid); padding:7px 7px; text-align:left; }
    th { background: var(--brand); color:#fff; text-align:center; }
    .tabla-reporte tfoot td { background:#1b936a; color:#fff; font-weight:bold; }
    .num { text-align:right; font-variant-numeric: tabular-nums; }
    .td-dir { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .msg-void, .msg-warn { text-align:center; padding:1rem; color:#fff9; }
    #loader { display:none; text-align:center; margin:.6rem 0; }
    .oculto { display:none !important; }

    /* Modal */
    .modal { position: fixed; inset: 0; display:none; align-items:center; justify-content:center; z-index:1000; }
    .modal.show { display:flex; }
    .overlay { position:absolute; inset:0; background:#0008; }
    .modal-content { position:relative; width:min(1100px, 96vw); max-height:90vh; overflow:auto; background:#1b1d1f; border:1px solid var(--grid); border-radius:14px; padding:14px; box-shadow: 0 10px 30px #000a; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; gap:.8rem; margin-bottom:.6rem; }
    .modal-title { font-size:1.05rem; font-weight:800; color:#fff; }
    .modal-sub { color:#b2dcd8; font-size:.92rem; }
    .modal-grid { display:grid; grid-template-columns: 1fr; gap:10px; }
    @media(min-width: 980px){ .modal-grid { grid-template-columns: 1fr; } }
    .modal-box { background:#141717; border:1px solid var(--grid); border-radius:12px; padding:10px; }
    .modal-box-title { font-weight:700; color:#9ad7d2; margin-bottom:.4rem; }
    .kv { display:grid; grid-template-columns: repeat(3, 1fr); gap:.4rem .8rem; margin:.3rem 0; }
    .kv-wide { grid-column: 1 / -1; }
    .kv span { color:#8fb4b2; margin-right:.3rem; }

  </style>
</head>
<body>
  <header>Reporte Colocacion Gerencial</header>
  <div class="container">
    <div id="usuario-email"></div>
    <div id="agencia-usuario"></div>

    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.96rem;color:#fff;font-weight:400">Colocación de Créditos — Gerencial</span>
    </h1>

    <div class="filtros">
      <div class="filtro">
        <label for="fecha-desde">Desde:</label>
        <input type="date" id="fecha-desde"/>
      </div>
      <div class="filtro">
        <label for="fecha-hasta">Hasta:</label>
        <input type="date" id="fecha-hasta"/>
      </div>
    </div>

    <div class="actions">
      <button id="btn-excel" class="btn oculto"><i class="fa-solid fa-file-excel"></i> Exportar Excel</button>
      <button id="btn-pdf" class="btn oculto"><i class="fa-solid fa-file-pdf"></i> Descargar PDF</button>
      <button id="btn-imprimir" class="btn oculto"><i class="fa-solid fa-print"></i> Imprimir</button>
    </div>

    <div id="loader"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</div>

    <section id="kpis"></section>
    <section id="res-estado"></section>
    <section id="res-usuario"></section>
    <section id="res-linea"></section>
    <section id="detalle"></section>
  </div>

  <!-- Modal detalle -->
  <div id="modal" class="modal">
    <div id="modal-overlay" class="overlay"></div>
    <div class="modal-content">
      <div id="modal-body"></div>
    </div>
  </div>
</body>
</html>
