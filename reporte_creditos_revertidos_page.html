<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte de Créditos Revertidos – Multi Inversiones</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let agenciaUsuario = null;
    let creditosData = [];
    let fechaDesde = null;
    let fechaHasta = null;

    // ---- FORMATEADORES ----
    function formatFecha(fecha) {
      if (!fecha) return "";
      try {
        const d = typeof fecha === "string" ? new Date(fecha) :
                  fecha && fecha.seconds ? new Date(fecha.seconds * 1000) : new Date(fecha);
        return d.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' });
      } catch { return ""; }
    }
    function formatFechaGroup(fecha) {
      try {
        const d = typeof fecha === "string" ? new Date(fecha) :
                  fecha && fecha.seconds ? new Date(fecha.seconds * 1000) : new Date(fecha);
        return d.toISOString().slice(0, 10); // yyyy-MM-dd
      } catch { return ""; }
    }

    // ---- DESCARGA Y FILTRADO ----
    async function obtenerCreditos() {
      if (!agenciaUsuario) return;
      document.getElementById('resultados').innerHTML = '<div class="loader"></div>';

      try {
        // Busca todos los créditos revertidos de la agencia
        const creditosRef = collection(db, "creditos");
        const q = query(
          creditosRef,
          where("agenciaAsignada", "==", agenciaUsuario),
          where("estadoCredito", "==", "Revertido"),
          orderBy("fechaReversion", "desc")
        );
        const snapshot = await getDocs(q);
        let docs = [];
        snapshot.forEach(docSnap => {
          let d = docSnap.data();
          d.id = docSnap.id;
          docs.push(d);
        });

        // Filtro por fechas de reversión (campo: fechaReversion)
        docs = docs.filter(doc => {
          let fecha = doc.fechaReversion;
          if (!fecha) return false;
          let d = typeof fecha === "string" ? new Date(fecha)
                  : fecha.seconds ? new Date(fecha.seconds * 1000)
                  : new Date(fecha);
          if (fechaDesde && d < fechaDesde) return false;
          if (fechaHasta && d > new Date(fechaHasta.getFullYear(), fechaHasta.getMonth(), fechaHasta.getDate(), 23,59,59)) return false;
          doc._fechaObj = d;
          return true;
        });

        creditosData = docs;
        renderCreditos();
      } catch (err) {
        document.getElementById('resultados').innerHTML =
          `<div style="color:#f44; text-align:center">Error al cargar datos<br>${err.message}</div>`;
      }
    }

    // ---- RENDER ----
    function renderCreditos() {
      const resultados = document.getElementById('resultados');
      if (!creditosData.length) {
        resultados.innerHTML = `<div style="text-align:center;color:#fff7">No hay créditos revertidos en el rango seleccionado.</div>`;
        return;
      }
      // Agrupar por fecha de reversión
      const grouped = {};
      creditosData.forEach(doc => {
        const key = formatFechaGroup(doc._fechaObj);
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(doc);
      });

      let totalGeneral = 0, html = '';
      for (const fecha in grouped) {
        let subtotal = 0;
        html += `
        <div class="group">
          <div class="group-header">
            <i class="fas fa-calendar-alt"></i>
            <span>${formatFecha(fecha)}</span>
          </div>
          <div class="tabla-container">
            <table class="tabla-reportes">
              <thead>
                <tr>
                  <th>Ejecutivo Asignado</th>
                  <th>Revertido Por</th>
                  <th>Cliente</th>
                  <th>Línea de Crédito</th>
                  <th>Apertura</th>
                  <th>Fecha Reversión</th>
                  <th style="text-align:right">Monto</th>
                </tr>
              </thead>
              <tbody>
        `;
        grouped[fecha].forEach(doc => {
          subtotal += Number(doc.montoAprobado || 0);
          html += `
            <tr>
              <td>${doc.asignadoA ?? '-'}</td>
              <td>${doc.usuarioReversion ?? '-'}</td>
              <td>${(doc.nombre ?? '') + ' ' + (doc.apellido ?? '')}</td>
              <td>${doc.lineaDeCredito ?? '-'}</td>
              <td>${formatFecha(doc.fechaInicio)}</td>
              <td>${formatFecha(doc.fechaReversion)}</td>
              <td style="text-align:right;font-weight:700">$${Number(doc.montoAprobado || 0).toFixed(2)}</td>
            </tr>
          `;
        });
        totalGeneral += subtotal;
        html += `
              </tbody>
            </table>
          </div>
          <div class="subtotal">
            <span><b>Subtotal:</b></span>
            <span style="margin-left:auto"><b>$${subtotal.toFixed(2)}</b></span>
          </div>
        </div>
        `;
      }
      html += `
        <div class="total-general">
          <span>TOTAL GENERAL</span>
          <span style="font-size:1.13rem;letter-spacing:.7px;">$${totalGeneral.toFixed(2)}</span>
        </div>
        <div style="text-align:center;margin-top:18px;">
          <button class="btn-imprimir" onclick="window.print()">
            <i class="fas fa-print"></i> Imprimir Reporte
          </button>
        </div>
      `;
      resultados.innerHTML = html;
    }

    // ---- MANEJO DE FECHAS ----
    function onFechaDesdeChange(e) {
      const val = e.target.value;
      fechaDesde = val ? new Date(val) : null;
      obtenerCreditos();
    }
    function onFechaHastaChange(e) {
      const val = e.target.value;
      fechaHasta = val ? new Date(val) : null;
      obtenerCreditos();
    }

    // ---- AUTENTICACIÓN Y CARGA ----
    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        // Toma la agencia del usuario desde users por email
        try {
          const res = await getDocs(query(collection(db, "users"), where("email", "==", user.email)));
          const userDoc = res.docs[0]?.data();
          agenciaUsuario = userDoc?.department ?? null;
          document.getElementById("usuario-nombre").textContent = userDoc?.nombre || user.email || '';
          // Fechas por defecto: mes actual
          const now = new Date();
          document.getElementById('fecha-desde').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
          document.getElementById('fecha-hasta').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
          fechaDesde = new Date(now.getFullYear(), now.getMonth(), 1);
          fechaHasta = now;
          obtenerCreditos();
        } catch (err) {
          document.getElementById('resultados').innerHTML = `<div style="color:#f44">No se pudo determinar agencia.<br>${err.message}</div>`;
        }
      });
      document.getElementById('fecha-desde').addEventListener('change', onFechaDesdeChange);
      document.getElementById('fecha-hasta').addEventListener('change', onFechaHastaChange);
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #101212; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    header {
      background:#000; padding:1.07rem 0; text-align:center;
      font-size:1.29rem; letter-spacing:1px; font-weight:700; color:#67C8F1;
    }
    .container { max-width: 820px; margin: 2.4rem auto 0 auto; background: #1c1d1f; border-radius: 17px; box-shadow: 0 2px 28px #0005; padding: 2.1rem 1.2rem 2rem 1.2rem;}
    #usuario-nombre { color: #F8AF40; font-size: 1.09rem; text-align: right; margin-bottom: 0.4rem; font-weight: 600;}
    h1 { font-size: 1.36rem; font-weight: bold; text-align: center; color: #00e6c0; margin-bottom: 1.6rem; letter-spacing: .8px;}
    .filtros-row { display: flex; gap: 1.1rem; justify-content: center; margin-bottom: 1.6rem; flex-wrap: wrap;}
    .filtro-fecha { display: flex; flex-direction: column; align-items: flex-start; background: #222; padding: 0.7rem 1.1rem 0.5rem 1.1rem; border-radius: 8px;}
    .filtro-fecha label { color: #67C8F1; font-size: .97rem; margin-bottom: 4px; font-weight: 600; letter-spacing: 0.5px;}
    .filtro-fecha input[type="date"] { background: #191a1c; color: #fff; border: none; border-radius: 5px; padding: 0.39rem 0.7rem; font-size: 1.01rem;}
    .loader { border: 4px solid #232324; border-top: 4px solid #13b66b; border-radius: 50%; width: 46px; height: 46px; animation: spin 1.1s linear infinite; margin: 1.8rem auto;}
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .group { margin-bottom: 1.6rem; background: #252c28; border-radius: 14px; box-shadow: 0 1px 8px #0002; padding: 1rem 0.8rem 0.6rem 0.8rem;}
    .group-header { display: flex; align-items: center; font-size: 1.05rem; color: #8affef; margin-bottom: 8px; font-weight: 600; gap: 8px;}
    .tabla-container { overflow-x: auto; }
    .tabla-reportes { border-collapse: collapse; width: 100%; min-width: 700px;}
    .tabla-reportes th, .tabla-reportes td { border-bottom: 1px solid #22e2a21b; padding: 8px 7px; font-size: .98rem;}
    .tabla-reportes th { background: #191f1c; color: #67C8F1; font-weight: 700; }
    .tabla-reportes td { color: #e6e6e6; background: #0002;}
    .subtotal { display: flex; justify-content: flex-end; align-items: center; gap: 0.8rem; margin-top: 7px; color: #00ffd5; font-size: 1.04rem; font-weight: bold; border-top: 1.5px solid #23e2a377; padding-top: 7px;}
    .total-general { margin: 1.7rem 0 0.3rem 0; padding: 1.1rem 1.1rem; background: #1f8260; border-radius: 12px; box-shadow: 0 1px 12px #00e6c03a; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 1.11rem; color: #fff; letter-spacing: 1px;}
    .btn-imprimir { padding: .9rem 2.3rem; font-size: 1.05rem; border-radius: 11px; border:none; background: linear-gradient(90deg,#13b66b,#67C8F1 95%); color: #222; font-weight: bold; cursor:pointer; margin-top: 10px; transition: all .16s;}
    .btn-imprimir:hover { background: linear-gradient(90deg,#67C8F1 30%,#13b66b 100%); color:#000;}
    @media (max-width: 900px) {
      .container { padding: 1.1rem 1vw;}
      .tabla-reportes { min-width: 650px;}
    }
    @media (max-width: 700px) {
      .tabla-reportes { min-width: 550px;}
      .group { padding: .7rem 0.2rem 0.4rem 0.2rem; }
    }
    @media print {
      body { background: #fff !important; color: #111 !important;}
      .container { box-shadow: none; background: #fff; color: #111;}
      .btn-imprimir, #usuario-nombre, .filtros-row { display: none !important;}
      .tabla-reportes th, .tabla-reportes td { color: #222 !important; background: #fff !important;}
      .total-general { background: #eee !important; color: #000 !important;}
    }
  </style>
</head>
<body>
  <header>Reporte de Créditos Revertidos</header>
  <div class="container">
    <div id="usuario-nombre"></div>
    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.97rem;color:#fff;font-weight:400">Créditos Revertidos</span>
    </h1>
    <div class="filtros-row">
      <div class="filtro-fecha">
        <label for="fecha-desde">Desde:</label>
        <input type="date" id="fecha-desde" />
      </div>
      <div class="filtro-fecha">
        <label for="fecha-hasta">Hasta:</label>
        <input type="date" id="fecha-hasta" />
      </div>
    </div>
    <div id="resultados"></div>
  </div>
</body>
</html>
