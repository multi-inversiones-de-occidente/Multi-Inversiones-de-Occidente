<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Cuenta de Cliente – Multi Inversiones</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let currentAgencia = null;
    let clientesAgencia = []; // Para autocompletar

    // --- AUTOCOMPLETAR CLIENTES ---
    async function cargarClientesAgencia() {
      if (!currentAgencia) return;
      const usersRef = collection(db, "users");
      const q = query(usersRef, where("department", "==", currentAgencia));
      const snap = await getDocs(q);
      clientesAgencia = [];
      snap.forEach(doc => {
        const d = doc.data();
        clientesAgencia.push({
          id: doc.id,
          nombre: d.nombre || '',
          apellido: d.apellido || '',
          numeroDui: d.numeroDui || '',
          label: ((d.nombre || '') + ' ' + (d.apellido || '') + ' | DUI: ' + (d.numeroDui || '')).trim()
        });
      });
    }

    function mostrarOpcionesBusqueda(valor) {
      const predictivo = document.getElementById('opciones-busqueda');
      valor = valor.trim().toLowerCase();
      predictivo.innerHTML = '';
      if (!valor || clientesAgencia.length === 0) {
        predictivo.style.display = 'none';
        return;
      }
      const matches = clientesAgencia.filter(c =>
        c.nombre.toLowerCase().includes(valor) ||
        c.apellido.toLowerCase().includes(valor) ||
        c.numeroDui.toLowerCase().includes(valor)
      );
      if (matches.length === 0) {
        predictivo.style.display = 'none';
        return;
      }
      matches.slice(0,10).forEach(c => {
        const opt = document.createElement('div');
        opt.className = "predictivo-opt";
        opt.textContent = c.label;
        opt.addEventListener('click', () => {
          document.getElementById('busqueda').value = c.label;
          predictivo.style.display = 'none';
        });
        predictivo.appendChild(opt);
      });
      predictivo.style.display = 'block';
    }

    async function buscarCliente() {
      let criterio = document.getElementById('busqueda').value.trim().toLowerCase();
      const predictivo = document.getElementById('opciones-busqueda');
      predictivo.style.display = 'none';
      document.getElementById('estado-cuenta').innerHTML = '<div class="loader"></div>';
      document.getElementById('resumen-usuario').innerHTML = '';
      document.getElementById('resumen-credito').innerHTML = '';

      // Soporta buscar por predicción
      let cliente = null;
      if (criterio.includes('dui:')) {
        // Extracción por DUI
        let dui = criterio.split('dui:')[1].split('|')[0].replace(/[^\d-]/g,'').trim();
        cliente = clientesAgencia.find(c => c.numeroDui.replace(/[^\d-]/g,'').toLowerCase() === dui);
      }
      if (!cliente) {
        // Busca por nombre, apellido o DUI de cualquier modo
        cliente = clientesAgencia.find(c =>
          c.label.toLowerCase() === criterio ||
          (c.nombre.toLowerCase() + ' ' + c.apellido.toLowerCase()).trim() === criterio ||
          c.numeroDui.replace(/[^\d-]/g,'').toLowerCase() === criterio.replace(/[^\d-]/g,'')
        );
      }
      if (!cliente) {
        cliente = clientesAgencia.find(c =>
          c.nombre.toLowerCase().includes(criterio) ||
          c.apellido.toLowerCase().includes(criterio) ||
          c.numeroDui.replace(/[^\d-]/g,'').includes(criterio.replace(/[^\d-]/g,''))
        );
      }
      if (!cliente) {
        document.getElementById('estado-cuenta').innerHTML = '<div style="color:#F44;text-align:center;">Cliente no encontrado en tu agencia.</div>';
        return;
      }

      // Mostrar resumen de cliente
      document.getElementById('resumen-usuario').innerHTML = `
        <div class="resumen-box">
          <b>Cliente:</b> ${cliente.nombre || ''} ${cliente.apellido || ''} | 
          <b>DUI:</b> ${cliente.numeroDui || ''}
        </div>
      `;

      // Buscar créditos de ese cliente en la agencia actual
      try {
        let creditosRef = collection(db, "creditos");
        let q2 = query(creditosRef, where("clienteID", "==", cliente.id), where("agenciaAsignada", "==", currentAgencia));
        let creditosSnap = await getDocs(q2);
        let creditos = [];
        creditosSnap.forEach(doc => {
          creditos.push({ id: doc.id, ...doc.data() });
        });

        if (!creditos.length) {
          document.getElementById('estado-cuenta').innerHTML = '<div style="color:#F44;text-align:center;">No tiene créditos activos en esta agencia.</div>';
          document.getElementById('resumen-credito').innerHTML = '';
          return;
        }

        let credito = creditos[0];

        // Resumen de crédito arriba de la tabla
        document.getElementById('resumen-credito').innerHTML = `
          <div class="resumen-box resumen-credito">
            <b>Monto Aprobado:</b> $${parseFloat(credito.montoAprobado || 0).toFixed(2)} |
            <b>Saldo Inicial:</b> $${parseFloat(credito.saldoInicial || 0).toFixed(2)} |
            <b>Saldo Actual:</b> $${parseFloat(credito.saldoActual || 0).toFixed(2)} |
            <b>Estado:</b> ${credito.estadoCredito || '-'} |
            <b>Para Ponerse al Día:</b> $${parseFloat(credito.paraPonerseAlDia || 0).toFixed(2)}
          </div>
        `;

        // Buscar pagos de ese crédito (solo en esta agencia)
        let pagosRef = collection(db, "pagos");
        let pagosQuery = query(pagosRef, where("creditoID", "==", credito.id), where("sucursal", "==", currentAgencia));
        let pagosSnap = await getDocs(pagosQuery);
        let pagos = [];
        pagosSnap.forEach(doc => pagos.push(doc.data()));
        pagos.sort((a, b) => new Date(a.fechaPago) - new Date(b.fechaPago));

        renderEstadoCuenta(credito, pagos);
      } catch (e) {
        document.getElementById('estado-cuenta').innerHTML = `<div style="color:#F44;text-align:center;">Error: ${e.message}</div>`;
        document.getElementById('resumen-credito').innerHTML = '';
      }
    }

    function renderEstadoCuenta(credito, pagos) {
      let amort = credito.amortizacion || [];
      if (!amort.length) {
        document.getElementById('estado-cuenta').innerHTML = '<div style="color:#F44;text-align:center;">El crédito no tiene detalle de cuotas.</div>';
        return;
      }
      let html = `<div class="tabla-scroll"><table class="tabla-estado">
        <thead>
          <tr>
            <th># Cuota</th>
            <th>Fecha</th>
            <th>Capital</th>
            <th>Interés</th>
            <th>Multa</th>
            <th>Cuota Total</th>
            <th>Pagos</th>
            <th>Fecha Pago</th>
            <th>Saldo</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
      `;
      amort.forEach(cuota => {
        let pagosCuota = pagos.filter(p => (p.numeroCuota == cuota.numeroCuota));
        let montoPagado = pagosCuota.reduce((sum, p) => sum + (parseFloat(p.montoPagado) || 0), 0);
        let fechaPagoReal = pagosCuota.length ? new Date(pagosCuota[0].fechaPago).toLocaleDateString('es-SV') : '';
        html += `
          <tr>
            <td>${cuota.numeroCuota || ''}</td>
            <td>${cuota.fecha ? new Date(cuota.fecha).toLocaleDateString('es-SV') : ''}</td>
            <td>$${parseFloat(cuota.capital || 0).toFixed(2)}</td>
            <td>$${parseFloat(cuota.interes || 0).toFixed(2)}</td>
            <td>$${parseFloat(cuota.multas || 0).toFixed(2)}</td>
            <td>$${parseFloat(cuota.cuota || 0).toFixed(2)}</td>
            <td>$${montoPagado.toFixed(2)}</td>
            <td>${fechaPagoReal}</td>
            <td>$${parseFloat(cuota.saldo || 0).toFixed(2)}</td>
            <td>${cuota.estado || ''}</td>
          </tr>
        `;
      });
      html += `
        </tbody>
      </table></div>
      <button class="btn-imprimir" onclick="window.print()">Imprimir reporte</button>
      `;
      document.getElementById('estado-cuenta').innerHTML = html;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        currentUser = user;
        // Obtener agencia del usuario logeado
        const usersRef = collection(db, "users");
        let usuario = null;
        const snap = await getDocs(usersRef);
        snap.forEach(doc => {
          const d = doc.data();
          if (d.email && d.email.toLowerCase() === user.email.toLowerCase()) {
            usuario = d;
          }
        });
        currentAgencia = usuario ? usuario.department : null;
        document.getElementById('usuario-nombre').innerHTML = usuario
          ? `Agencia: <b>${usuario.department}</b> | Usuario: <b>${usuario.nombre || user.email}</b>`
          : `Usuario: <b>${user.email}</b>`;
        await cargarClientesAgencia();
      });

      // Autocompletar
      const busquedaInput = document.getElementById('busqueda');
      busquedaInput.addEventListener('input', (e) => {
        mostrarOpcionesBusqueda(e.target.value);
      });
      document.getElementById('btn-buscar').addEventListener('click', buscarCliente);
      busquedaInput.addEventListener('keydown', function(e) {
        if (e.key === "Enter") buscarCliente();
      });
      document.addEventListener('click', function(event) {
        if (!event.target.closest('.busqueda-wrap')) {
          document.getElementById('opciones-busqueda').style.display = 'none';
        }
      });
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.45rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #67C8F1;
    }
    .container {
      max-width: 900px;
      margin: 2.5rem auto 0 auto;
      background: #191919;
      border-radius: 18px;
      box-shadow: 0 2px 25px #0005;
      padding: 2.4rem 1rem 2.7rem 1rem;
      min-height: 380px;
    }
    #usuario-nombre {
      color: #F8AF40;
      font-size: 1.03rem;
      text-align: right;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: bold;
      text-align: center;
      color: #00e6c0;
      margin-bottom: 1.3rem;
      letter-spacing: .8px;
    }
    .busqueda-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
      position: relative;
    }
    .busqueda-wrap {
      position: relative;
      width: 230px;
    }
    .busqueda-row input[type="text"] {
      background: #181c1f;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 0.75rem 1.1rem;
      font-size: 1.11rem;
      width: 100%;
      outline: none;
      box-shadow: 0 1px 7px #0003;
      transition: border .18s;
    }
    .busqueda-row input[type="text"]:focus {
      border: 1.5px solid #67C8F1;
    }
    .btn-buscar {
      background: linear-gradient(90deg, #13b66b 0%, #67C8F1 100%);
      color: #212121;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1.13rem;
      padding: 0 2.2rem;
      cursor: pointer;
      transition: background .16s, color .16s, transform .15s;
      box-shadow: 0 2px 16px #13b66a25;
      outline: none;
      height: 46px;
      display: flex; align-items: center; gap: 10px;
    }
    .btn-buscar:hover {
      background: linear-gradient(90deg, #67C8F1 0%, #13b66b 100%);
      color: #000;
      transform: scale(1.03);
    }
    .loader {
      border: 4px solid #232324;
      border-top: 4px solid #13b66b;
      border-radius: 50%;
      width: 44px; height: 44px;
      animation: spin 1.1s linear infinite;
      margin: 2.1rem auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .tabla-scroll {
      width: 100%;
      overflow-x: auto;
      margin: 1.1rem 0 0 0;
      background: #191919;
      border-radius: 10px;
      box-shadow: 0 1px 10px #0003;
    }
    .tabla-estado {
      border-collapse: collapse;
      width: 100%;
      min-width: 950px;
      background: #181b20;
      border-radius: 12px;
      overflow: hidden;
      font-size: 0.98rem;
    }
    .tabla-estado th, .tabla-estado td {
      padding: 0.60rem 0.43rem;
      text-align: center;
      border-bottom: 1px solid #292c30;
      white-space: nowrap;
    }
    .tabla-estado th {
      background: #171c20;
      color: #00e6c0;
      font-weight: 700;
      font-size: 1.01rem;
      letter-spacing: .4px;
    }
    .tabla-estado td {
      color: #e6e6e6;
      font-size: 0.98rem;
    }
    .tabla-estado tr:last-child td {
      border-bottom: none;
    }
    .btn-imprimir {
      margin: 1.5rem auto 0 auto;
      display: block;
      background: linear-gradient(90deg, #67C8F1 0%, #13b66b 100%);
      color: #212121;
      font-weight: bold;
      font-size: 1.13rem;
      border: none;
      border-radius: 13px;
      padding: 0.9rem 3.1rem;
      cursor: pointer;
      box-shadow: 0 2px 16px #13b66a25;
      outline: none;
      transition: background .17s, color .17s, transform .13s;
    }
    .btn-imprimir:hover {
      background: linear-gradient(90deg, #13b66b 0%, #67C8F1 100%);
      color: #111;
      transform: scale(1.04);
    }
    .resumen-box {
      background: #1e2828;
      border-left: 5px solid #13b66b;
      padding: 0.9rem 1.2rem;
      border-radius: 7px;
      margin-bottom: 1rem;
      font-size: 1.08rem;
      color: #5de0ba;
      font-weight: 500;
      display: flex; gap: 1.4rem; flex-wrap: wrap;
    }
    .resumen-credito {
      background: #142a22;
      color: #8ee8d8;
      border-left: 6px solid #00e6c0;
    }
    /* AUTOCOMPLETAR */
    #opciones-busqueda {
      position: absolute;
      left: 0; top: 100%; z-index: 99;
      background: #20292d;
      width: 230px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 3px 18px #0006;
      display: none;
      max-height: 220px;
      overflow-y: auto;
    }
    .predictivo-opt {
      padding: 9px 13px;
      color: #fff;
      cursor: pointer;
      border-bottom: 1px solid #182121;
      transition: background 0.14s;
    }
    .predictivo-opt:last-child { border-bottom: none;}
    .predictivo-opt:hover {
      background: #67C8F1;
      color: #191919;
    }
    @media (max-width: 700px) {
      .container { padding: 1.1rem 1vw; }
      .tabla-estado { min-width: 550px; font-size: 0.93rem;}
      .resumen-box { font-size: .95rem;}
    }

    /* ===== SOLO PARA IMPRESIÓN ===== */
    @media print {
      /* Ocultar cuadro de búsqueda, menú predictivo y botón imprimir */
      .busqueda-row,
      #opciones-busqueda,
      .btn-imprimir { 
        display: none !important; 
      }

      /* Opcional: fondo blanco y sin sombras para una impresión limpia */
      body { background: #fff !important; color: #000 !important; }
      .container { background: #fff !important; box-shadow: none !important; }
      .tabla-estado { background: #fff !important; }
      .tabla-estado th { color: #000 !important; background: #eee !important; }
      .tabla-estado td { color: #000 !important; }

      /* Ajustar márgenes de página si lo deseas */
      @page { margin: 12mm; }
    }
  </style>
</head>
<body>
  <header>Estado de Cuenta de Cliente</header>
  <div class="container">
    <div id="usuario-nombre"></div>
    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.97rem;color:#fff;font-weight:400">Estado de Cuenta</span></h1>
    <div class="busqueda-row">
      <div class="busqueda-wrap">
        <input type="text" id="busqueda" placeholder="Buscar por nombre, apellido o DUI..." autocomplete="off">
        <div id="opciones-busqueda"></div>
      </div>
      <button id="btn-buscar" class="btn-buscar"><i class="fas fa-search"></i>Buscar</button>
    </div>
    <div id="resumen-usuario"></div>
    <div id="resumen-credito"></div>
    <div id="estado-cuenta"></div>
  </div>
</body>
</html>
