<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Cuenta de Cliente – Multi Inversiones</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let currentAgencia = null;

    async function buscarCliente() {
      const criterio = document.getElementById('busqueda').value.trim().toLowerCase();
      document.getElementById('estado-cuenta').innerHTML = '<div class="loader"></div>';
      document.getElementById('resumen-usuario').innerHTML = '';
      if (!criterio) {
        document.getElementById('estado-cuenta').innerHTML = '';
        return;
      }
      try {
        // Buscar cliente por nombre/apellido/dui en users que pertenezca a la agencia logeada
        let usersRef = collection(db, "users");
        let q = query(usersRef, where("department", "==", currentAgencia));
        let usersSnap = await getDocs(q);
        let encontrados = [];
        usersSnap.forEach(doc => {
          let d = doc.data();
          if (
            (d.nombre && d.nombre.toLowerCase().includes(criterio)) ||
            (d.apellido && d.apellido.toLowerCase().includes(criterio)) ||
            (d.numeroDui && d.numeroDui.toLowerCase().includes(criterio))
          ) {
            encontrados.push({ id: doc.id, ...d });
          }
        });

        if (!encontrados.length) {
          document.getElementById('estado-cuenta').innerHTML = '<div style="color:#F44;text-align:center;">Cliente no encontrado en tu agencia.</div>';
          return;
        }

        // Si hay más de uno, pedir elegir (puedes mejorar esto con un selector, para ahora solo toma el primero)
        let cliente = encontrados[0];
        let clienteID = cliente.id;

        document.getElementById('resumen-usuario').innerHTML = `
          <div class="resumen-box">
            <b>Cliente:</b> ${cliente.nombre || ''} ${cliente.apellido || ''} | 
            <b>DUI:</b> ${cliente.numeroDui || ''} | 
            <b>Tel:</b> ${cliente.telefono || '-'} | 
            <b>Agencia:</b> ${cliente.department}
          </div>
        `;

        // Buscar créditos del cliente en la agencia actual
        let creditosRef = collection(db, "creditos");
        let q2 = query(creditosRef, where("clienteID", "==", clienteID), where("agenciaAsignada", "==", currentAgencia));
        let creditosSnap = await getDocs(q2);
        let creditos = [];
        creditosSnap.forEach(doc => {
          creditos.push({ id: doc.id, ...doc.data() });
        });

        if (!creditos.length) {
          document.getElementById('estado-cuenta').innerHTML = '<div style="color:#F44;text-align:center;">No tiene créditos activos en esta agencia.</div>';
          return;
        }

        // Solo mostramos el primer crédito para no hacer la tabla demasiado larga, puedes expandir esto si quieres
        let credito = creditos[0];

        // Buscar pagos de ese crédito (filtrando por agencia)
        let pagosRef = collection(db, "pagos");
        let pagosQuery = query(pagosRef, where("creditoID", "==", credito.id), where("sucursal", "==", currentAgencia));
        let pagosSnap = await getDocs(pagosQuery);
        let pagos = [];
        pagosSnap.forEach(doc => pagos.push(doc.data()));

        // Ordenar pagos por fecha
        pagos.sort((a, b) => new Date(a.fechaPago) - new Date(b.fechaPago));

        // Renderizar tabla de estado de cuenta
        renderEstadoCuenta(credito, pagos);
      } catch (e) {
        document.getElementById('estado-cuenta').innerHTML = `<div style="color:#F44;text-align:center;">Error: ${e.message}</div>`;
      }
    }

    function renderEstadoCuenta(credito, pagos) {
      // Armamos una tabla con las cuotas del crédito y pagos realizados
      let amort = credito.amortizacion || [];
      if (!amort.length) {
        document.getElementById('estado-cuenta').innerHTML = '<div style="color:#F44;text-align:center;">El crédito no tiene detalle de cuotas.</div>';
        return;
      }

      let html = `<div class="tabla-scroll"><table class="tabla-estado">
        <thead>
          <tr>
            <th># Cuota</th>
            <th>Fecha</th>
            <th>Capital</th>
            <th>Interés</th>
            <th>Multa</th>
            <th>Cuota Total</th>
            <th>Pagos</th>
            <th>Fecha Pago</th>
            <th>Saldo</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
      `;

      amort.forEach(cuota => {
        // Pagos aplicados a esta cuota
        let pagosCuota = pagos.filter(p => (p.numeroCuota == cuota.numeroCuota));
        let montoPagado = pagosCuota.reduce((sum, p) => sum + (parseFloat(p.montoPagado) || 0), 0);
        let fechaPagoReal = pagosCuota.length ? new Date(pagosCuota[0].fechaPago).toLocaleDateString('es-SV') : '';
        html += `
          <tr>
            <td>${cuota.numeroCuota || ''}</td>
            <td>${cuota.fecha ? new Date(cuota.fecha).toLocaleDateString('es-SV') : ''}</td>
            <td>$${parseFloat(cuota.capital || 0).toFixed(2)}</td>
            <td>$${parseFloat(cuota.interes || 0).toFixed(2)}</td>
            <td>$${parseFloat(cuota.multas || 0).toFixed(2)}</td>
            <td>$${parseFloat(cuota.cuota || 0).toFixed(2)}</td>
            <td>$${montoPagado.toFixed(2)}</td>
            <td>${fechaPagoReal}</td>
            <td>$${parseFloat(cuota.saldo || 0).toFixed(2)}</td>
            <td>${cuota.estado || ''}</td>
          </tr>
        `;
      });

      html += `
        </tbody>
      </table></div>
      <button class="btn-imprimir" onclick="window.print()">Imprimir reporte</button>
      `;
      document.getElementById('estado-cuenta').innerHTML = html;
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, user => {
        if (!user) return location.href = "login.html";
        currentUser = user;
        // Buscar el usuario logeado en users para sacar el agency
        const usersRef = collection(db, "users");
        getDocs(usersRef).then(snapshot => {
          let usuario = null;
          snapshot.forEach(doc => {
            const d = doc.data();
            if (d.email && d.email.toLowerCase() === user.email.toLowerCase()) {
              usuario = d;
            }
          });
          currentAgencia = usuario ? usuario.department : null;
          document.getElementById('usuario-nombre').innerHTML = usuario
            ? `Agencia: <b>${usuario.department}</b> | Usuario: <b>${usuario.nombre || user.email}</b>`
            : `Usuario: <b>${user.email}</b>`;
        });
      });
      document.getElementById('btn-buscar').addEventListener('click', buscarCliente);
      document.getElementById('busqueda').addEventListener('keydown', function(e) {
        if (e.key === "Enter") buscarCliente();
      });
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.45rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #67C8F1;
    }
    .container {
      max-width: 900px;
      margin: 2.5rem auto 0 auto;
      background: #191919;
      border-radius: 18px;
      box-shadow: 0 2px 25px #0005;
      padding: 2.4rem 1rem 2.7rem 1rem;
      min-height: 380px;
    }
    #usuario-nombre {
      color: #F8AF40;
      font-size: 1.03rem;
      text-align: right;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: bold;
      text-align: center;
      color: #00e6c0;
      margin-bottom: 1.3rem;
      letter-spacing: .8px;
    }
    .busqueda-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
    }
    .busqueda-row input[type="text"] {
      background: #181c1f;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 0.75rem 1.1rem;
      font-size: 1.11rem;
      width: 220px;
      outline: none;
      box-shadow: 0 1px 7px #0003;
      transition: border .18s;
    }
    .busqueda-row input[type="text"]:focus {
      border: 1.5px solid #67C8F1;
    }
    .btn-buscar {
      background: linear-gradient(90deg, #13b66b 0%, #67C8F1 100%);
      color: #212121;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1.13rem;
      padding: 0 2.2rem;
      cursor: pointer;
      transition: background .16s, color .16s, transform .15s;
      box-shadow: 0 2px 16px #13b66a25;
      outline: none;
      height: 46px;
      display: flex; align-items: center; gap: 10px;
    }
    .btn-buscar:hover {
      background: linear-gradient(90deg, #67C8F1 0%, #13b66b 100%);
      color: #000;
      transform: scale(1.03);
    }
    .loader {
      border: 4px solid #232324;
      border-top: 4px solid #13b66b;
      border-radius: 50%;
      width: 44px; height: 44px;
      animation: spin 1.1s linear infinite;
      margin: 2.1rem auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .tabla-scroll {
      width: 100%;
      overflow-x: auto;
      margin: 1.1rem 0 0 0;
    }
    .tabla-estado {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
      background: #181b20;
      border-radius: 12px;
      box-shadow: 0 2px 16px #0003;
      overflow: hidden;
    }
    .tabla-estado th, .tabla-estado td {
      padding: 0.68rem 0.6rem;
      text-align: center;
      font-size: 1.01rem;
      border-bottom: 1px solid #292c30;
      white-space: nowrap;
    }
    .tabla-estado th {
      background: #171c20;
      color: #00e6c0;
      font-weight: 700;
      font-size: 1.09rem;
      letter-spacing: .7px;
    }
    .tabla-estado td {
      color: #e6e6e6;
    }
    .tabla-estado tr:last-child td {
      border-bottom: none;
    }
    .btn-imprimir {
      margin: 1.8rem auto 0 auto;
      display: block;
      background: linear-gradient(90deg, #67C8F1 0%, #13b66b 100%);
      color: #212121;
      font-weight: bold;
      font-size: 1.13rem;
      border: none;
      border-radius: 13px;
      padding: 0.9rem 3.1rem;
      cursor: pointer;
      box-shadow: 0 2px 16px #13b66a25;
      outline: none;
      transition: background .17s, color .17s, transform .13s;
    }
    .btn-imprimir:hover {
      background: linear-gradient(90deg, #13b66b 0%, #67C8F1 100%);
      color: #111;
      transform: scale(1.04);
    }
    .resumen-box {
      background: #1e2828;
      border-left: 5px solid #13b66b;
      padding: 0.9rem 1.2rem;
      border-radius: 7px;
      margin-bottom: 1rem;
      font-size: 1.11rem;
      color: #5de0ba;
      font-weight: 500;
      display: flex; gap: 1.8rem; flex-wrap: wrap;
    }
    @media (max-width: 900px) {
      .container { padding: 1.1rem 2vw; }
      .tabla-estado { min-width: 670px;}
      .resumen-box { font-size: .96rem;}
    }
    @media (max-width: 700px) {
      .tabla-estado { min-width: 550px;}
    }
  </style>
</head>
<body>
  <header>Estado de Cuenta de Cliente</header>
  <div class="container">
    <div id="usuario-nombre"></div>
    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.97rem;color:#fff;font-weight:400">Estado de Cuenta</span></h1>
    <div class="busqueda-row">
      <input type="text" id="busqueda" placeholder="Buscar por nombre, apellido o DUI...">
      <button id="btn-buscar" class="btn-buscar"><i class="fas fa-search"></i>Buscar</button>
    </div>
    <div id="resumen-usuario"></div>
    <div id="estado-cuenta"></div>
  </div>
</body>
</html>
