<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reporte de Pagos Revertidos</title>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    // Inicializa Firebase
    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // Parámetros globales
    let agencia = null; // aquí se pondrá la agencia asignada (sucursal)
    let pagosData = [];
    let fechaDesde = null;
    let fechaHasta = null;
    let textoBusqueda = '';

    // Formatear fechas
    function formatFecha(fecha) {
      const d = new Date(fecha);
      return d.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function parseDateAny(fecha) {
      if (!fecha) return null;
      if (typeof fecha === "string") {
        // Intenta formato ISO
        try { return new Date(fecha); } catch { return null; }
      }
      if (typeof fecha === "object" && fecha.seconds) {
        return new Date(fecha.seconds * 1000);
      }
      return null;
    }

    async function obtenerPagos() {
      if (!agencia) return;
      document.getElementById('resultados').innerHTML = '<div class="loader"></div>';

      // Query solo de la agencia actual y pagos anulados (revertidos)
      const pagosRef = collection(db, "pagos");
      const q = query(
        pagosRef,
        where("sucursal", "==", agencia),
        where("anulado", "==", true),
        orderBy("fechaReversion", "desc")
      );
      let docs = [];
      try {
        const snapshot = await getDocs(q);
        snapshot.forEach(doc => {
          let d = doc.data();
          d.id = doc.id;
          docs.push(d);
        });
      } catch (err) {
        document.getElementById('resultados').innerHTML = '<div style="color:#f44;text-align:center">Error al cargar pagos.</div>';
        return;
      }

      // Filtro por fecha
      docs = docs.filter(doc => {
        let fechaDoc = parseDateAny(doc.fechaReversion);
        if (!fechaDoc) return false;
        if (fechaDesde && fechaDoc < fechaDesde) return false;
        if (fechaHasta && fechaDoc > new Date(fechaHasta.getFullYear(), fechaHasta.getMonth(), fechaHasta.getDate(), 23,59,59)) return false;
        return true;
      });

      // Filtro por texto de búsqueda (nombre, dui, correlativo)
      if (textoBusqueda) {
        const b = textoBusqueda.toLowerCase();
        docs = docs.filter(doc => {
          const nombre = (doc.nombres || "").toLowerCase();
          const dui    = (doc.dui || "").toLowerCase();
          const corr   = (doc.correlativo || "").toString().toLowerCase();
          return nombre.includes(b) || dui.includes(b) || corr.includes(b);
        });
      }

      pagosData = docs;
      renderPagos();
    }

    function renderPagos() {
      if (!pagosData.length) {
        document.getElementById('resultados').innerHTML = `<div style="text-align:center;color:#fff7">No hay pagos revertidos en el rango seleccionado.</div>`;
        return;
      }
      let total = 0;
      let html = `
      <div class="tabla-wrapper">
        <table class="tabla-reporte">
          <thead>
            <tr>
              <th>Ticket</th>
              <th>Cliente</th>
              <th>DUI</th>
              <th>Monto</th>
              <th>Línea</th>
              <th>F. Pago</th>
              <th>F. Reversión</th>
              <th>Motivo</th>
              <th>Revertido Por</th>
            </tr>
          </thead>
          <tbody>
      `;
      pagosData.forEach(doc => {
        total += Number(doc.montoPagado || 0);
        html += `
          <tr>
            <td>${doc.correlativo ?? '-'}</td>
            <td>${doc.nombres ?? '-'}</td>
            <td>${doc.dui ?? '-'}</td>
            <td style="text-align:right;font-weight:700">$${Number(doc.montoPagado || 0).toFixed(2)}</td>
            <td>${doc.lineaDeCredito ?? '-'}</td>
            <td>${formatFecha(doc.fechaPago)}</td>
            <td>${formatFecha(doc.fechaReversion)}</td>
            <td>${doc.motivoReversion ?? '-'}</td>
            <td>${doc.usuarioReversion ?? '-'}</td>
          </tr>
        `;
      });
      html += `
          </tbody>
        </table>
      </div>
      <div class="total-general">
        <span>Total pagos revertidos:</span>
        <span style="font-size:1.15rem;letter-spacing:.7px;">$${total.toFixed(2)}</span>
      </div>
      <div style="text-align:right">
        <button onclick="window.print()" class="btn-print"><i class="fas fa-print"></i> Imprimir</button>
      </div>
      `;
      document.getElementById('resultados').innerHTML = html;
    }

    function onFechaDesdeChange(e) {
      const val = e.target.value;
      fechaDesde = val ? new Date(val) : null;
      obtenerPagos();
    }
    function onFechaHastaChange(e) {
      const val = e.target.value;
      fechaHasta = val ? new Date(val) : null;
      obtenerPagos();
    }
    function onBusquedaChange(e) {
      textoBusqueda = e.target.value.trim();
      obtenerPagos();
    }

    // Esperar autenticación para obtener agencia y mostrar usuario
    window.addEventListener("DOMContentLoaded", async () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        document.getElementById("usuario-nombre").textContent = user.displayName || user.email;
        // Carga agencia desde users (por email)
        const usersRef = collection(db, "users");
        let agenciaEncontrada = null;
        const q = query(usersRef, where("email", "==", user.email));
        const snapshot = await getDocs(q);
        snapshot.forEach(doc => {
          agenciaEncontrada = doc.data().department || null;
        });
        agencia = agenciaEncontrada;
        document.getElementById("agencia-nombre").textContent = agencia || "No definida";
        // Filtro inicial de mes actual
        const now = new Date();
        document.getElementById('fecha-desde').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        document.getElementById('fecha-hasta').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        fechaDesde = new Date(now.getFullYear(), now.getMonth(), 1);
        fechaHasta = now;
        obtenerPagos();
      });
      document.getElementById('fecha-desde').addEventListener('change', onFechaDesdeChange);
      document.getElementById('fecha-hasta').addEventListener('change', onFechaHastaChange);
      document.getElementById('busqueda').addEventListener('input', onBusquedaChange);
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; min-height: 100vh;
    }
    header {
      background: #000; padding:1.05rem 0; text-align:center;
      font-size:1.29rem; letter-spacing:1px; font-weight:700;
      color:#67C8F1;
    }
    .container {
      max-width: 900px;
      margin: 2.4rem auto 0 auto;
      background: #1c1d1f;
      border-radius: 17px;
      box-shadow: 0 2px 28px #0005;
      padding: 2.1rem 1.2rem 2rem 1.2rem;
      display: flex; flex-direction: column;
    }
    #usuario-nombre {
      color: #F8AF40; font-size: 1.03rem;
      text-align: right; margin-bottom: 0.3rem;
      font-weight: 600;
    }
    #agencia-nombre {
      color: #38E7A6; font-size: 1.07rem;
      text-align: right; margin-bottom: 0.6rem;
      font-weight: 600;
    }
    h1 {
      font-size: 1.36rem; font-weight: bold; text-align: center;
      color: #00e6c0; margin-bottom: 1.6rem; letter-spacing: .8px;
    }
    .filtros-row {
      display: flex; gap: 1.1rem; justify-content: center;
      margin-bottom: 1.6rem; flex-wrap: wrap;
    }
    .filtro-fecha {
      display: flex; flex-direction: column; align-items: flex-start;
      background: #222; padding: 0.7rem 1.1rem 0.5rem 1.1rem; border-radius: 8px;
    }
    .filtro-fecha label {
      color: #67C8F1; font-size: .97rem; margin-bottom: 4px;
      font-weight: 600; letter-spacing: 0.5px;
    }
    .filtro-fecha input[type="date"] {
      background: #191a1c; color: #fff; border: none; border-radius: 5px;
      padding: 0.39rem 0.7rem; font-size: 1.01rem;
    }
    .loader {
      border: 4px solid #232324;
      border-top: 4px solid #13b66b;
      border-radius: 50%;
      width: 46px; height: 46px;
      animation: spin 1.1s linear infinite;
      margin: 1.8rem auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .search-box {
      display: flex; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap;
      align-items: center; justify-content: center;
    }
    .search-input {
      background: #191a1c; color: #fff; border: none; border-radius: 7px;
      padding: 0.5rem 0.9rem; font-size: 1rem; width: 220px;
    }
    .tabla-wrapper {
      overflow-x: auto; width: 100%;
    }
    .tabla-reporte {
      width: 100%; border-collapse: collapse; min-width: 800px;
    }
    .tabla-reporte th, .tabla-reporte td {
      padding: 8px 6px; border-bottom: 1px solid #222; font-size: 1.01rem;
    }
    .tabla-reporte th {
      background: #27e2a314; color: #67C8F1; font-weight: 700;
      text-align: left;
    }
    .tabla-reporte td {
      color: #fff;
    }
    .total-general {
      margin: 1.5rem 0 0.8rem 0; padding: 1.1rem 1.1rem; background: #1f8260;
      border-radius: 12px; box-shadow: 0 1px 12px #00e6c03a;
      display: flex; align-items: center; justify-content: space-between;
      font-weight: bold; font-size: 1.11rem; color: #fff; letter-spacing: 1px;
    }
    .btn-print {
      padding: 7px 17px; background: #21e6a3; border: none; border-radius: 7px;
      color: #222; font-weight: bold; font-size: 1.03rem;
      cursor: pointer; transition: background .18s;
    }
    .btn-print:hover { background: #12c07c; }
    @media (max-width: 900px) {
      .container { padding: 1.1rem 1vw; }
      .tabla-reporte th, .tabla-reporte td { font-size: .96rem;}
    }
    @media (max-width: 600px) {
      .tabla-reporte { min-width: 550px; }
    }
  </style>
</head>
<body>
  <header>Reporte de Pagos Revertidos</header>
  <div class="container">
    <div id="usuario-nombre"></div>
    <div id="agencia-nombre"></div>
    <h1>MULTI INVERSIONES DE OCCIDENTE S.A. DE C.V.<br>
      <span style="font-size:.97rem;color:#fff;font-weight:400">Pagos Revertidos</span>
    </h1>
    <div class="filtros-row">
      <input class="search-input" id="busqueda" placeholder="Buscar cliente, DUI, ticket..." autocomplete="off"/>
      <div class="filtro-fecha">
        <label for="fecha-desde">Desde:</label>
        <input type="date" id="fecha-desde" />
      </div>
      <div class="filtro-fecha">
        <label for="fecha-hasta">Hasta:</label>
        <input type="date" id="fecha-hasta" />
      </div>
    </div>
    <div id="resultados"></div>
  </div>
</body>
</html>
