<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Revertir Créditos – Multi Inversiones</title>

  <!-- Firebase & App -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let agencia = '';
    let gerenteName = '';
    let gerenteUid = '';
    let listaCreditos = [];

    // UI refs
    const searchInput = () => document.getElementById('search-credito');
    const listaResultados = () => document.getElementById('resultados-creditos');
    const boxDetalle = () => document.getElementById('box-detalle');
    const motivoInput = () => document.getElementById('motivo-reversion');
    const btnRevertir = () => document.getElementById('btn-revertir');
    const loading = () => document.getElementById('loading');
    const alertInfo = (msg) => { alert(msg); };
    const limpiarDetalle = () => { boxDetalle().style.display = 'none'; motivoInput().value = ""; btnRevertir().disabled = true; };

    // Hash SHA-256
    async function sha256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Datos del gerente
    async function cargarDatosGerente(uid) {
      const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", uid)));
      if (snap.empty) {
        alertInfo("Usuario no encontrado");
        return false;
      }
      const data = snap.docs[0].data();
      agencia = data.department || '';
      gerenteName = ((data.nombre || '') + ' ' + (data.apellido || '')).trim();
      gerenteUid = uid;
      document.getElementById("info-agencia").textContent = agencia;
      return true;
    }

    // Buscar créditos por agencia (excepto Revertidos) y filtrar por término
    async function cargarCreditos(needle = "") {
      limpiarDetalle();
      listaResultados().innerHTML = "<div class='info-inline'>Buscando...</div>";

      const snap = await getDocs(query(
        collection(db, "creditos"),
        where("agenciaAsignada", "==", agencia),
        where("estadoCredito", "!=", "Revertido") // mantengo tu filtro
      ));

      listaCreditos = [];
      const term = needle.trim().toLowerCase();
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const text = `${d.nombre||""} ${d.apellido||""} ${d.numeroDui||""} ${docSnap.id}`;
        if (!term || text.toLowerCase().includes(term)) {
          listaCreditos.push({
            id: docSnap.id,
            nombre: d.nombre || "",
            apellido: d.apellido || "",
            dui: d.numeroDui || "",
            monto: d.montoAprobado || 0,
            linea: d.lineaDeCredito || "",
            estado: d.estadoCredito || "",
            ref: docSnap.ref
          });
        }
      });

      if (listaCreditos.length === 0) {
        listaResultados().innerHTML = "<div class='info-inline'>No se encontraron créditos en esta agencia.</div>";
      } else {
        listaResultados().innerHTML = listaCreditos.map((c, idx) => `
          <button class="card-credito" onclick="window.selectCredito(${idx})" title="Seleccionar crédito">
            <div class="card-main">
              <div class="titular">
                <b>${c.nombre} ${c.apellido}</b>
                <span class="estado">${c.estado || '—'}</span>
              </div>
              <div class="meta">
                <span class="dato"><i class="fa-regular fa-id-card"></i> DUI:</span> ${c.dui || '—'}
                <span class="sep">•</span>
                <span class="dato"><i class="fa-solid fa-tags"></i> Línea:</span> ${c.linea || '—'}
                <span class="sep">•</span>
                <span class="dato mono">${c.id}</span>
              </div>
            </div>
            <span class="monto">$${Number(c.monto).toFixed(2)}</span>
          </button>
        `).join("");
      }
    }

    // Mostrar detalle seleccionado
    window.selectCredito = function(idx) {
      const c = listaCreditos[idx];
      boxDetalle().style.display = 'block';
      document.getElementById("nombre-detalle").textContent = `${c.nombre} ${c.apellido}`;
      document.getElementById("dui-detalle").textContent = c.dui || '—';
      document.getElementById("linea-detalle").textContent = c.linea || '—';
      document.getElementById("monto-detalle").textContent = `$${Number(c.monto).toFixed(2)}`;
      document.getElementById("id-credito").value = idx;
      motivoInput().value = "";
      btnRevertir().disabled = false;
      document.getElementById('box-detalle').scrollIntoView({behavior:'smooth', block:'start'});
    };

    // Pedir PIN y validar contra todos los gerentes de la agencia
    async function pedirPin() {
      let pin = prompt("Por seguridad, ingresa tu PIN de gerente:");
      if (!pin) return false;
      const pinHash = await sha256(pin);

      const snap = await getDocs(query(
        collection(db, "users"),
        where("rol", "==", "gerente"),
        where("department", "==", agencia)
      ));
      if (snap.empty) {
        alertInfo("No se encontraron gerentes para esta agencia.");
        return false;
      }
      let match = false;
      snap.forEach(docSnap => {
        if ((docSnap.data().internalPassword || "") === pinHash) match = true;
      });
      if (match) return true;
      alertInfo("PIN incorrecto.");
      return false;
    }

    // Revertir crédito
    window.revertirCredito = async function() {
      const idx = document.getElementById("id-credito").value;
      const motivo = motivoInput().value.trim();
      if (!motivo) {
        alertInfo("Debes ingresar el motivo de reversión.");
        return;
      }
      const credito = listaCreditos[idx];
      if (!credito) return;

      loading().style.display = "block";
      btnRevertir().disabled = true;

      if (!(await pedirPin())) {
        loading().style.display = "none";
        btnRevertir().disabled = false;
        return;
      }

      try {
        await updateDoc(credito.ref, {
          estadoCredito: "Revertido",
          motivoReversion: motivo,
          fechaReversion: new Date().toISOString(),
          usuarioReversion: gerenteName,
        });
        await addDoc(collection(db, "logs_reversiones"), {
          creditoID: credito.id,
          agencia: agencia,
          motivo: motivo,
          fecha: new Date().toISOString(),
          usuario: gerenteName,
        });
        alertInfo("¡Crédito revertido exitosamente!");
        limpiarDetalle();
        cargarCreditos(searchInput().value || "");
      } catch (e) {
        alertInfo("Error al revertir: " + e.message);
      }
      loading().style.display = "none";
      btnRevertir().disabled = false;
    };

    // Init
    window.addEventListener("DOMContentLoaded", async () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        await cargarDatosGerente(user.uid);
        cargarCreditos("");
        searchInput().addEventListener('input', (e) => {
          cargarCreditos(e.target.value || "");
        });
      });
    });
  </script>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ======= Línea gráfica clara / glass ======= */
    :root{
      --bg:#f7f9fc; --bg-2:#eef2f7; --text:#0d1b2a; --muted:#5b6776; --white:#ffffff;
      --brand-blue:#243b86; --brand-cel:#67C8F1; --brand-green:#13b66b; --brand-gold:#F8AF40;
      --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(10,20,40,.08); --glass-shadow:0 20px 60px rgba(12,20,40,.12);
      --radius:18px; --radius-lg:22px;
      --danger-1:#ffeded; --danger-2:#ffb5ae; --danger-3:#e12d1f;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0c0f14; --bg-2:#0f141b; --text:#dfe6ef; --muted:#9aa6b6;
        --glass-bg:rgba(255,255,255,.12); --glass-brd:rgba(255,255,255,.18); --glass-shadow:0 24px 60px rgba(0,0,0,.45);
        --white:#11161d;
      }
    }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(36,59,134,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(248,175,64,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }
    .pattern{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(1px 1px at 25px 25px, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(1px 1px at 75px 75px, rgba(255,255,255,.06), transparent 40%);
      background-size:100px 100px; mix-blend-mode:soft-light; opacity:.5;
    }

    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter:saturate(1.2) blur(10px); -webkit-backdrop-filter:saturate(1.2) blur(10px);
      background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.25));
      border-bottom:1px solid var(--glass-brd);
    }
    .topbar{
      max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:.8rem 16px;
    }
    .logo-plate{
      display:inline-flex; align-items:center; gap:10px; background:var(--glass-bg);
      border:1px solid var(--glass-brd); padding:8px 14px; border-radius:16px;
      box-shadow:var(--glass-shadow); position:relative; overflow:hidden; isolation:isolate;
    }
    .logo-plate img{ height:28px; width:auto; display:block }
    .brand-name{ font-weight:800; letter-spacing:.2px; color:var(--brand-blue); }

    /* Contenedor principal glass */
    .container{
      position:relative; z-index:1;
      max-width: min(96vw, 980px);
      margin: 2rem auto; padding: 1.2rem 1.1rem 1.6rem;
      background:var(--glass-bg); border:1px solid var(--glass-brd);
      border-radius:var(--radius-lg); box-shadow:var(--glass-shadow);
    }
    h1{
      margin: .2rem 0 .3rem; text-align:center;
      font-size:clamp(1.2rem, .8vw + 1.2rem, 1.8rem);
      color:var(--brand-blue); font-weight:800;
    }
    .label-agencia{
      text-align:center; color:var(--muted); font-weight:700; margin-bottom:1.2rem;
    }

    /* Search pill */
    .search-bar{ width:100%; margin: .4rem 0 1rem; }
    .search-bar input{
      width:100%; padding: .9rem 1.1rem; font-size:1.02rem; border-radius:999px;
      background: linear-gradient(180deg, rgba(36,59,134,.08), rgba(103,200,241,.08));
      border:1px solid rgba(36,59,134,.15);
      color:var(--text); outline:none; box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .search-bar input::placeholder{ color:var(--muted); }

    .info-inline{
      text-align:center; color:var(--muted); padding: 12px 0;
      background:var(--white); border:1px dashed var(--glass-brd); border-radius:12px;
    }

    /* Resultado: tarjetas blancas clicables */
    .card-credito{
      width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
      background:var(--white);
      border:1px solid var(--glass-brd); border-radius:14px;
      box-shadow:0 10px 26px rgba(10,20,40,.10), inset 0 1px 0 rgba(255,255,255,.7);
      transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
    }
    .card-credito:hover{ transform:translateY(-2px); box-shadow:0 18px 40px rgba(10,20,40,.16); }
    .card-main{ display:flex; flex-direction:column; gap:6px; min-width:0; }
    .titular{ display:flex; align-items:center; gap:.6rem; }
    .titular b{ color:var(--text); font-size:1.02rem; }
    .estado{
      font-size:.78rem; font-weight:800; color:#5b6776;
      background:linear-gradient(180deg, rgba(36,59,134,.08), rgba(103,200,241,.08));
      border:1px solid rgba(36,59,134,.15); border-radius:999px; padding:.2rem .5rem;
    }
    .meta{ color:var(--muted); font-size:.94rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
    .dato{ color:var(--brand-blue); font-weight:800; }
    .sep{ color:#aab3c2; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .monto{
      margin-left:auto; flex:0 0 auto;
      background:linear-gradient(180deg, #d7ffe9, #c9f9e2);
      border:1px solid rgba(19,182,107,.35);
      color:#0c8a58; font-weight:900; padding:.35rem .6rem; border-radius:10px;
      box-shadow: inset 0 1px 0 #fff;
    }

    /* Detalle seleccionado */
    #box-detalle{
      display:none; margin-top:14px; padding:14px 14px 16px;
      background:var(--white); border:1px solid var(--glass-brd); border-radius:16px;
      box-shadow:0 12px 28px rgba(10,20,40,.12), inset 0 1px 0 rgba(255,255,255,.7);
    }
    #box-detalle label{ font-weight:900; color:var(--brand-blue); font-size:1rem; }
    .detalle-head{ color:var(--brand-blue); font-weight:800; font-size:1.05rem; margin-bottom:4px; }
    .detalle-meta{ color:var(--muted); margin-bottom:8px; }
    .badge{
      display:inline-flex; align-items:center; gap:6px; padding:.25rem .6rem; border-radius:999px;
      background:linear-gradient(180deg, rgba(36,59,134,.08), rgba(103,200,241,.08));
      border:1px solid rgba(36,59,134,.15); color:var(--text); font-weight:800; font-size:.9rem;
    }

    .input, textarea{
      width:100%; background: linear-gradient(180deg, #fff, #f4f7fb);
      border:1px solid var(--glass-brd); color:var(--text); border-radius:12px;
      font-size:1rem; padding:.8rem .9rem; outline:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    textarea{ resize:vertical; min-height:70px; }

    /* Botón Revertir */
    #btn-revertir{
      width:100%; margin-top:.6rem; padding:.9rem 0;
      border:none; border-radius:12px; color:#fff; font-weight:900; font-size:1.05rem; cursor:pointer;
      background:linear-gradient(90deg, #ff6a5f, #e12d1f);
      box-shadow:0 14px 30px rgba(225,45,31,.22);
      transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease;
    }
    #btn-revertir:hover{ transform:translateY(-1px); box-shadow:0 20px 40px rgba(225,45,31,.28); }
    #btn-revertir:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

    #loading{ text-align:center; color:#a86200; font-weight:800; margin-top:10px; }

    @media (max-width:680px){
      .container{ padding: 1rem .8rem 1.2rem; }
      .meta{ font-size:.9rem; }
    }
  </style>
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>

  <header>
    <div class="topbar">
      <div class="logo-plate">
        <img src="assets/logo_mi_bw.png" alt="Logo Multi Inversiones" width="140" height="40" />
        <strong class="brand-name">MULTI INVERSIONES</strong>
      </div>
      <div style="margin-left:auto; font-weight:700; color:var(--muted);">
        Revertir Créditos
      </div>
    </div>
  </header>

  <div class="container">
    <h1><i class="fas fa-undo"></i> Revertir Créditos</h1>
    <div class="label-agencia">
      Solo puedes revertir créditos de la agencia asignada: <span id="info-agencia">Cargando...</span>
    </div>

    <div class="search-bar">
      <input id="search-credito" type="text" placeholder="Buscar por nombre, apellido, DUI o # de crédito…">
    </div>

    <div id="resultados-creditos"></div>

    <div id="box-detalle">
      <input type="hidden" id="id-credito" value="">
      <label>Crédito Seleccionado</label>
      <div class="detalle-head" id="nombre-detalle"></div>
      <div class="detalle-meta">
        <span class="badge"><i class="fa-regular fa-id-card"></i> DUI: <span id="dui-detalle" style="margin-left:6px"></span></span>
        <span class="badge" style="margin-left:8px;"><i class="fa-solid fa-tags"></i> Línea: <span id="linea-detalle" style="margin-left:6px"></span></span>
        <span class="badge" style="margin-left:8px;"><i class="fa-solid fa-dollar-sign"></i> Monto: <span id="monto-detalle" style="margin-left:6px"></span></span>
      </div>

      <textarea id="motivo-reversion" class="input" rows="2" placeholder="Motivo de reversión (obligatorio)"></textarea>
      <button id="btn-revertir" onclick="window.revertirCredito()">Revertir Crédito</button>
    </div>

    <div id="loading" style="display:none;">Procesando reversión...</div>
  </div>
</body>
</html>
