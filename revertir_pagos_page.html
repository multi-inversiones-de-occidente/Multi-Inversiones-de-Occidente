<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reversión – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ====== ESTILO BLANCO / GLASS ====== */
    :root{
      --bg:#f7f9fc; --bg-2:#eef2f7; --text:#0d1b2a; --white:#ffffff; --muted:#5b6776;
      --brand-blue:#243b86; --brand-cel:#67C8F1; --brand-green:#13b66b; --brand-gold:#F8AF40;
      --glass-bg:rgba(255,255,255,.70); --glass-brd:rgba(10,20,40,.08); --glass-shadow:0 20px 60px rgba(12,20,40,.12);
      --radius-2xl:22px;
    }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(36,59,134,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(248,175,64,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:10; backdrop-filter:saturate(1.1) blur(10px); -webkit-backdrop-filter:saturate(1.1) blur(10px);
      background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.45));
      border-bottom:1px solid var(--glass-brd);
    }
    .topbar{ max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:.8rem 16px; }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brand i{ color:var(--brand-gold); font-size:1.25rem }
    .brand b{ color:var(--brand-blue); letter-spacing:.2px }
    .page{ margin-left:auto; color:var(--muted); font-weight:800 }

    .container{ position:relative; z-index:1; max-width:960px; margin:0 auto; padding:2rem 16px 3rem; }
    .panel{ background:var(--glass-bg); border:1px solid var(--glass-brd); border-radius:var(--radius-2xl); box-shadow:var(--glass-shadow); padding:18px 16px; margin-bottom:18px; }
    .title{ display:flex; align-items:center; gap:10px; font-weight:900; color:var(--brand-blue); margin-bottom:6px; }
    .subtitle{ color:var(--muted); margin:0 0 12px 30px; }
    .row{ display:flex; gap:10px; align-items:center; margin-top:8px; }
    .input{ flex:1; background:#fff; border:1px solid #dbe1ea; border-radius:10px; padding:12px 12px; font-size:1.05rem; outline:none; }
    .btn{ background: linear-gradient(90deg, var(--brand-blue) 0%, #16265c 100%); color:#fff; border:none; padding:11px 14px; border-radius:10px; cursor:pointer; font-weight:800; display:inline-flex; gap:8px; align-items:center; }
    .btn:hover{ filter:brightness(1.05) }
    .card{ background:#fff; border:1px solid #e7ebf3; border-radius:14px; padding:16px; margin-top:12px; box-shadow:0 8px 24px rgba(10,20,40,.08); }
    .k{ color:#6b7482 }
    .val b{ color:#0b3b85 }
    .btn-danger{ background: linear-gradient(90deg, #e74c3c 0%, #8e0800 100%); color:#fff; border:none; padding:12px 16px; border-radius:10px; cursor:pointer; font-weight:900; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }
    .btn-danger[disabled]{ opacity:.55; cursor:not-allowed }
    .textarea{ width:100%; min-height:64px; resize:vertical; background:#fafcff; border:1px solid #dbe1ea; border-radius:10px; padding:10px; font-size:1rem; }
    .split{ display:grid; grid-template-columns:1fr; gap:16px; }
    @media (min-width:860px){ .split{ grid-template-columns:1fr 1fr; } }

    .spinner { display:inline-block; width:18px; height:18px; border-radius:50%; border:3px solid #fff6; border-top:3px solid #fff; animation:spin 1s linear infinite;}
    @keyframes spin {100%{transform:rotate(360deg);}}

    /* Modal */
    .modal-bg { position: fixed; inset:0; background: #0b1020bb; z-index: 9998; display:flex; align-items:center; justify-content:center; padding:14px;}
    .modal{ background:#fff; color:#222; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.35); padding:22px 18px; width:100%; max-width:380px; }
    .modal .hd{ font-weight:900; color:#0f2a6a; margin-bottom:10px; display:flex; gap:8px; align-items:center }
    .modal .btns{ display:flex; gap:12px; justify-content:flex-end; margin-top:8px }
    .modal .btn-cancel{ background:#e74c3c; color:#fff; border:none; padding:9px 16px; border-radius:8px; font-weight:800; cursor:pointer }
    .modal .btn-ok{ background:#F8AF40; color:#1a1813; border:none; padding:9px 18px; border-radius:8px; font-weight:800; cursor:pointer }
    .error{ color:#c0392b; font-weight:700; margin-top:6px }

    /* Toast */
    .toast-wrap{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;flex-direction:column;gap:10px}
    .toast{background:#1f2937;color:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 6px 18px #0005;max-width:320px;transition:all .35s ease}
    .toast.warn{background:#b45309}.toast.error{background:#991b1b}.toast.info{background:#374151}
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <i class="fas fa-rotate-left"></i>
        <b>MULTI INVERSIONES DE OCCIDENTE</b>
      </div>
      <div class="page">Reversión</div>
    </div>
  </header>

  <div class="container">
    <div class="split">
      <!-- ===== BLOQUE 1: Reversión de Pagos ===== -->
      <section class="panel">
        <div class="title"><i class="fas fa-receipt"></i> Reversión de Pagos</div>
        <p class="subtitle">Ingresa el número de ticket del pago a reversar. <b>Sólo el gerente puede autorizar.</b></p>
        <div class="row">
          <input id="correlativo" class="input" type="number" placeholder="Correlativo de Ticket" autocomplete="off"/>
          <button id="buscar-btn" class="btn"><i class="fas fa-search"></i> Buscar</button>
        </div>
        <div id="pago-card"></div>
      </section>

      <!-- ===== BLOQUE 2: Reversión de Movimientos de Caja ===== -->
      <section class="panel">
        <div class="title"><i class="fas fa-cash-register"></i> Reversión de Movimiento de Caja</div>
        <p class="subtitle">Reversa un movimiento de caja. <b>Requiere PIN de gerente.</b></p>
        <div class="row">
          <input id="correlativo-mov" class="input" type="number" placeholder="Correlativo de Movimiento" autocomplete="off"/>
          <button id="buscar-btn-mov" class="btn"><i class="fas fa-search"></i> Buscar</button>
        </div>
        <div id="mov-card"></div>
      </section>
    </div>
  </div>

  <div id="modal-root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, doc, getDoc, orderBy, limit, writeBatch
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    /* ===== Firebase ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const auth = getAuth(app);

    /* ===== Estado ===== */
    let userId = null, agenciaActual = "";
    let pagoDoc = null, pagoData = null;
    let movDoc  = null, movData  = null;

    /* ===== Util ===== */
    async function obtenerAgencia(user) {
      const snap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
      if (!snap.empty) {
        const d = snap.docs[0].data();
        agenciaActual = d.department || d.agencia || "";
      }
    }

    function showCard(id, html){ document.getElementById(id).innerHTML = html; }

    function success(msg){
      const root = document.getElementById("modal-root");
      root.innerHTML = `
        <div class="modal-bg">
          <div class="modal">
            <div class="hd" style="color:#1c7c36"><i class="fas fa-check-circle"></i> ¡Reversión exitosa!</div>
            <div style="margin:6px 0 10px;">${msg}</div>
            <div class="btns">
              <button class="btn-ok" id="ok">OK</button>
            </div>
          </div>
        </div>`;
      document.getElementById("ok").onclick = () => {
        root.innerHTML = "";
        showCard("pago-card", "");
        showCard("mov-card", "");
        const c1 = document.getElementById("correlativo");
        const c2 = document.getElementById("correlativo-mov");
        if (c1) c1.value = "";
        if (c2) c2.value = "";
      };
    }

    /* ====== Mensajería propia (reemplazo de alert) ====== */
    function showMessage({ title = "Aviso", html = "", tone = "info" }) {
      const root = document.getElementById("modal-root");
      // Cierra cualquier modal previo para evitar colisiones
      root.innerHTML = "";

      const tones = {
        info:  { color: "#0f2a6a", icon: "fa-circle-info" },
        warn:  { color: "#c27b11", icon: "fa-triangle-exclamation" },
        error: { color: "#b00020", icon: "fa-circle-exclamation" },
      };
      const t = tones[tone] || tones.info;

      root.innerHTML = `
        <div class="modal-bg">
          <div class="modal">
            <div class="hd" style="color:${t.color}">
              <i class="fas ${t.icon}"></i> ${title}
            </div>
            <div style="margin:6px 0 10px;">${html}</div>
            <div class="btns">
              <button class="btn-ok" id="msg-ok">OK</button>
            </div>
          </div>
        </div>`;
      document.getElementById("msg-ok").onclick = () => { root.innerHTML = ""; };
    }
    const warn  = (msg) => showMessage({ title: "Atención", html: msg, tone: "warn"  });
    const error = (msg) => showMessage({ title: "Error",     html: msg, tone: "error" });
    const info  = (msg) => showMessage({ title: "Información",html: msg, tone: "info"  });

    /* ====== Toast no bloqueante (opcional) ====== */
    function toast(msg, tone="info", ms=3800){
      let wrap = document.querySelector(".toast-wrap");
      if(!wrap){ wrap = document.createElement("div"); wrap.className="toast-wrap"; document.body.appendChild(wrap); }
      const el = document.createElement("div");
      el.className = `toast ${tone}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; }, ms-500);
      setTimeout(()=>{ el.remove(); if(!wrap.childElementCount) wrap.remove(); }, ms);
    }

    function toDate(val){
      if (!val) return null;
      if (val instanceof Date) return val;
      if (typeof val === 'string' || typeof val === 'number') return new Date(val);
      if (val && typeof val.toDate === 'function') return val.toDate();
      if (val?.seconds && typeof val.seconds === 'number') return new Date(val.seconds * 1000);
      return new Date(val);
    }
    function startOfDayLocal(val){
      const d = toDate(val) || new Date();
      d.setHours(0,0,0,0);
      return d;
    }
    const toCents  = (v)=> Math.round((parseFloat(v||0)+Number.EPSILON)*100);
    const fromCents= (c)=> (c/100).toFixed(2);

    /* === Medianoche exacta de El Salvador (UTC-6) para una fecha dada === */
    function svStartOfDay(date = new Date()){
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/El_Salvador', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(date);
      const y = parts.find(p=>p.type==='year').value;
      const m = parts.find(p=>p.type==='month').value;
      const d = parts.find(p=>p.type==='day').value;
      return new Date(`${y}-${m}-${d}T06:00:00.000Z`); // 00:00 ES = 06:00Z
    }

    /* ===== Confirmación PIN Gerente ===== */
    function confirmPINGerente() {
      return new Promise((resolve) => {
        const root = document.getElementById("modal-root");
        // Limpia cualquier modal abierto antes de mostrar el de PIN
        root.innerHTML = "";
        let errorMsg = "";

        async function onOk(){
          const pin = document.getElementById("gerente-pin-input").value.trim();
          if (!pin){
            errorMsg = "Debes ingresar el PIN del gerente.";
            render();
            return;
          }
          const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
          const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
          const q = query(collection(db, "users"), where("rol", "==", "gerente"));
          const snap = await getDocs(q);
          if (snap.empty){
            errorMsg = "No hay gerente configurado.";
            render();
            return;
          }
          let ok = false;
          snap.forEach(g => { if (g.data().internalPassword === hashHex) ok = true; });
          if (ok) {
            root.innerHTML="";
            resolve(true);
          } else {
            errorMsg = "PIN incorrecto.";
            render();
          }
        }
        function cancel(){ document.getElementById("modal-root").innerHTML = ""; resolve(false); }

        function render(){
          root.innerHTML = `
            <div class="modal-bg">
              <div class="modal">
                <div class="hd"><i class="fas fa-user-shield"></i> Autorización Gerente</div>
                <label>PIN del gerente</label>
                <input type="password" id="gerente-pin-input" maxlength="10" autocomplete="off" placeholder="PIN"/>
                ${errorMsg ? `<div class="error">${errorMsg}</div>` : ""}
                <div class="btns">
                  <button class="btn-cancel" id="cancel-pin">Cancelar</button>
                  <button class="btn-ok" id="ok-pin">Autorizar</button>
                </div>
              </div>
            </div>`;
          document.getElementById("cancel-pin").onclick = cancel;
          document.getElementById("ok-pin").onclick = onOk;
          document.getElementById("gerente-pin-input").onkeydown = e => { if (e.key === "Enter") onOk(); };
          setTimeout(()=>document.getElementById("gerente-pin-input").focus(), 40);
        }
        render();
      });
    }

    /* ==================== NUEVO HELPER (único agregado) ==================== */
    async function encontrarRespaldoPago(pagoDoc, pagoData) {
      const col = collection(db, "reversionPago");
      const candidatos = [];

      // Si en el futuro guardas pagoID en reversionPago, descomenta estas 3 líneas:
      // const byPagoId = await getDocs(query(col, where("pagoID","==", pagoDoc.id), where("usado","==", false)));
      // if (!byPagoId.empty) return byPagoId.docs[0];

      const suc = pagoData.sucursal || "";
      const cred = pagoData.creditoID;

      const pushAll = s => s.forEach(d => { if (!candidatos.find(x => x.id === d.id)) candidatos.push(d); });

      // correlativo number/string + sucursal
      pushAll(await getDocs(query(col,
        where("correlativo","==", Number(pagoData.correlativo)),
        where("creditoID","==", cred),
        where("usado","==", false),
        where("sucursal","==", suc)
      )));
      pushAll(await getDocs(query(col,
        where("correlativo","==", String(pagoData.correlativo)),
        where("creditoID","==", cred),
        where("usado","==", false),
        where("sucursal","==", suc)
      )));

      // compatibilidad: algunos docs viejos usan 'agencia' o 'agenciaAsignada'
      pushAll(await getDocs(query(col,
        where("correlativo","==", Number(pagoData.correlativo)),
        where("creditoID","==", cred),
        where("usado","==", false),
        where("agencia","==", suc)
      )));
      pushAll(await getDocs(query(col,
        where("correlativo","==", String(pagoData.correlativo)),
        where("creditoID","==", cred),
        where("usado","==", false),
        where("agencia","==", suc)
      )));
      pushAll(await getDocs(query(col,
        where("correlativo","==", Number(pagoData.correlativo)),
        where("creditoID","==", cred),
        where("usado","==", false),
        where("agenciaAsignada","==", suc)
      )));
      pushAll(await getDocs(query(col,
        where("correlativo","==", String(pagoData.correlativo)),
        where("creditoID","==", cred),
        where("usado","==", false),
        where("agenciaAsignada","==", suc)
      )));

      if (!candidatos.length) return null;

      // Elegir el más reciente por timestamp completo (fecha y hora)
      const toMillis = v => {
        if (!v) return 0;
        if (v.seconds !== undefined) return (v.seconds * 1000) + Math.floor((v.nanoseconds || 0)/1e6);
        const d = new Date(v);
        return isNaN(d) ? 0 : d.getTime();
      };
      candidatos.sort((a,b) => {
        const A = a.data(), B = b.data();
        const aT = Math.max(toMillis(A.createdAt), toMillis(A.snapshot?.ultimaActualizacion));
        const bT = Math.max(toMillis(B.createdAt), toMillis(B.snapshot?.ultimaActualizacion));
        return bT - aT;
      });
      return candidatos[0];
    }
    /* ==================== FIN NUEVO HELPER ==================== */

    /* ===== Buscar Pago ===== */
    async function buscarPago(){
      showCard("pago-card", "");
      const raw = document.getElementById("correlativo").value.trim();
      if (!raw) return;

      const btn = document.getElementById("buscar-btn");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Buscando...';

      if (!agenciaActual) await obtenerAgencia({ uid: userId });

      // Buscar por correlativo (número y string) + sucursal
      const qNum = query(collection(db, "pagos"), where("correlativo","==", Number(raw)), where("sucursal","==", agenciaActual));
      const qStr = query(collection(db, "pagos"), where("correlativo","==", raw), where("sucursal","==", agenciaActual));
      const [sNum, sStr] = await Promise.all([getDocs(qNum), getDocs(qStr)]);

      btn.disabled = false; btn.innerHTML = '<i class="fas fa-search"></i> Buscar';

      const todos = [];
      sNum.forEach(d=>todos.push(d));
      sStr.forEach(d=>{ if(!todos.find(x=>x.id===d.id)) todos.push(d); });

      if (todos.length === 0){
        showCard("pago-card", `<div class="card"><b style="color:#c0392b">No se encontró el pago.</b></div>`);
        return;
      }

      // Elegir el MÁS RECIENTE priorizando fechaRegistro, luego fechaPago
      const getMillis = (snap) => {
        const data = snap.data();
        const f1 = data?.fechaRegistro ? new Date(data.fechaRegistro).getTime() : NaN;
        const f2 = data?.fechaPago ? new Date(data.fechaPago).getTime() : NaN;
        if (Number.isFinite(f1) && Number.isFinite(f2)) return Math.max(f1, f2);
        if (Number.isFinite(f1)) return f1;
        if (Number.isFinite(f2)) return f2;
        return 0;
      };
      todos.sort((a,b)=> getMillis(b) - getMillis(a));
      pagoDoc = todos[0];
      pagoData = pagoDoc.data();
      renderPagoCard();
    }

    function renderPagoCard(){
      if (!pagoData) return;
      const detalleMulta = (pagoData.pagoMultas ?? pagoData.pagoMulta ?? 0);

      showCard("pago-card", `
        <div class="card">
          <div class="row" style="justify-content:space-between"><div class="k">Ticket</div><div class="val"><b>${pagoData.correlativo}</b></div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Cliente</div><div class="val">${pagoData.nombres || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Agencia</div><div class="val">${pagoData.sucursal || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Cajero</div><div class="val">${pagoData.cajeroNombre || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Fecha</div><div class="val">${pagoData.fechaPago ? pagoData.fechaPago.replace("T"," ").substring(0,16) : ""}</div></div>
          <hr style="border:none;border-top:1px dashed #dfe5ef;margin:10px 0;">
          <div class="row" style="justify-content:space-between"><div class="k">Capital</div><div class="val">$${(+pagoData.pagoCapital||0).toFixed(2)}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Interés</div><div class="val">$${(+pagoData.pagoInteres||0).toFixed(2)}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Multas</div><div class="val">$${(+detalleMulta||0).toFixed(2)}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Saldo restante</div><div class="val">$${(+pagoData.saldoRestante||0).toFixed(2)}</div></div>

          <label style="display:block;margin:12px 0 6px;font-weight:800;">Motivo de reversión (obligatorio)</label>
          <textarea id="motivo" class="textarea" maxlength="150"></textarea>
          <button id="revertir-btn" class="btn-danger"><i class="fas fa-undo"></i> Revertir Pago</button>
        </div>
      `);
      document.getElementById("revertir-btn").onclick = revertirPago;
    }

    /* ===== Revertir Pago – validar último por max(fechaRegistro, fechaPago) ===== */
    async function revertirPago(){
      try{
        if (!pagoData) return;
        const motivo = document.getElementById("motivo").value.trim();
        if (!motivo){
          document.getElementById("motivo").focus();
          toast("Debes indicar el motivo de la reversión.","warn");
          return;
        }
        const ok = await confirmPINGerente();
        if (!ok) return;

        const btn = document.getElementById("revertir-btn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Revirtiendo...';

        // (1) Traer pagos del crédito SIN orderBy y ordenar localmente por el más reciente entre fechaRegistro y fechaPago
        const ultQ = query(
          collection(db, "pagos"),
          where("creditoID", "==", pagoData.creditoID),
          limit(50)
        );
        const ultSnap = await getDocs(ultQ);

        if (ultSnap.empty){
          btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago';
          warn("No se encontraron pagos para validar el último registro.");
          return;
        }

        // Función para obtener el timestamp más alto entre fechaRegistro y fechaPago
        const getMillisMixed = (data) => {
          const f1 = data?.fechaRegistro ? toDate(data.fechaRegistro).getTime() : NaN;
          const f2 = data?.fechaPago ? toDate(data.fechaPago).getTime() : NaN;
          if (Number.isFinite(f1) && Number.isFinite(f2)) return Math.max(f1, f2);
          if (Number.isFinite(f1)) return f1;
          if (Number.isFinite(f2)) return f2;
          return 0;
        };

        // Ordenar por más reciente y tomar el primero no anulado
        const pagosDocs = ultSnap.docs.slice().sort((a,b)=> getMillisMixed(b.data()) - getMillisMixed(a.data()));
        let ultimoNoAnulado = null;
        for (const d of pagosDocs){
          const data = d.data();
          if (data && data.anulado !== true){ ultimoNoAnulado = d; break; }
        }
        if (!ultimoNoAnulado){
          btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago';
          warn("No hay pagos activos (no anulados) para revertir en este crédito.");
          return;
        }

        if (ultimoNoAnulado.id !== pagoDoc.id){
          const d = ultimoNoAnulado.data();
          const corr = (d?.correlativo ?? "(s/ correlativo)");
          btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago';
          warn(`Solo puedes revertir el último pago registrado de este crédito.<br>Último registrado: <b>correlativo ${corr}</b>.`);
          return;
        }

        /* ==================== BLOQUE CAMBIADO: búsqueda de respaldo ==================== */
        const revDoc = await encontrarRespaldoPago(pagoDoc, pagoData);
        if (!revDoc){
          btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago';
          error('No se encontró un respaldo válido (reversionPago) para este ticket en esta sucursal/credito.');
          return;
        }
        const revData = revDoc.data();

        // Seguridad extra
        if (!revData.creditoID || revData.creditoID !== pagoData.creditoID){
          btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago';
          error("El respaldo encontrado no corresponde a este crédito.");
          return;
        }
        if (!revData.snapshot || typeof revData.snapshot !== "object"){
          btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago';
          error("El snapshot del crédito está incompleto.");
          return;
        }
        /* ==================== FIN BLOQUE CAMBIADO ==================== */

        // (3) Cargar crédito actual para preservar multas nuevas
        const creditoRef = doc(db, "creditos", pagoData.creditoID);
        const creditoNowSnap = await getDoc(creditoRef);
        const creditoNow = creditoNowSnap.exists() ? creditoNowSnap.data() : {};

        // ====== Catch-up de INTERÉS “al día” sobre el snapshot ======
        const todayStart = startOfDayLocal(new Date());
        const bases = [];
        if (pagoData.fechaPago) bases.push(startOfDayLocal(pagoData.fechaPago));
        if (revData.snapshot?.fechaUltimoCalculoIntereses) bases.push(startOfDayLocal(revData.snapshot.fechaUltimoCalculoIntereses));
        if (!bases.length && revData.snapshot?.fechaInicio) bases.push(startOfDayLocal(revData.snapshot.fechaInicio));
        const base = bases.length ? new Date(Math.max(...bases.map(x=>x.getTime()))) : todayStart;

        const MS = 86400000;
        const days = Math.max(0, Math.floor((todayStart.getTime() - base.getTime()) / MS));
        let td = parseFloat(revData.snapshot.tasaDiariaCredito);
        if (!Number.isFinite(td) || td <= 0){
          const an = parseFloat(revData.snapshot.tasaAnualCredito || 0);
          td = an ? (an / 365) / 100 : 0;
        }
        const toCentsSafe = (v)=> Math.round((parseFloat(v||0)+Number.EPSILON)*100);

        const principalCents = Number.isFinite(revData.snapshot?.montoAprobado)
          ? toCentsSafe(revData.snapshot.montoAprobado)
          : (revData.snapshot?.saldoInicial ? toCentsSafe(revData.snapshot.saldoInicial) : 0);

        // Capital ya pagado hasta el snapshot (tope a capital por cuota)
        const amortSnap = Array.isArray(revData.snapshot.amortizacion) ? revData.snapshot.amortizacion : [];
        let capPagadoCents = 0;
        for (const c of amortSnap){
          const capC = toCentsSafe(c.capital || 0);
          const pagC = Math.min(capC, Math.max(0, toCentsSafe(c.montoPagado || 0)));
          capPagadoCents += pagC;
        }
        const saldoSnapCents = Math.max(0, principalCents - capPagadoCents);
        const interesPrevioCents = toCentsSafe(revData.snapshot.interesActual || 0);
        const interesPeriodoCents = Math.max(0, Math.round(saldoSnapCents * td * days));
        const interesNuevoCents = interesPrevioCents + interesPeriodoCents;
        const interesNuevo = (interesNuevoCents/100).toFixed(2);

        // ====== Merge de MULTAS: snapshot + las nuevas que existan ahora (evita duplicados exactos) ======
        const keyMulta = (m) => {
          const tipo  = (m.tipo || "").trim();
          const cuota = (m.cuotaNumero != null) ? String(m.cuotaNumero) : "";
          const fecha = (m.fecha || "").toString().slice(0,10);
          const monto = Number(m.monto || 0).toFixed(2);
          return `${tipo}|${cuota}|${fecha}|${monto}`;
        };
        const snapHM = Array.isArray(revData.snapshot.historialMultas) ? [...revData.snapshot.historialMultas] : [];
        const nowHM  = Array.isArray(creditoNow.historialMultas) ? creditoNow.historialMultas.filter(Boolean) : [];
        const seen = new Set(snapHM.map(keyMulta));
        const mergedHM = [...snapHM];
        for (const m of nowHM) {
          const k = keyMulta(m);
          if (!seen.has(k)) { mergedHM.push(m); seen.add(k); }
        }
        const multasAjustadasCents = mergedHM.reduce((acc, m) => {
          const estado = m.estadoCuota || "No Pagada";
          if (estado === "No Pagada" || !m.estadoCuota) return acc + toCentsSafe(m.monto || 0);
          return acc;
        }, 0);

        // ====== CAPITAL vencido y KPIs con fechas del snapshot ======
        let capAtrNowCents = 0, cuotasAtrasadasNow = 0;
        for (const c of amortSnap){
          const capC = toCentsSafe(c.capital || 0);
          const pagC = Math.min(capC, Math.max(0, toCentsSafe(c.montoPagado || 0)));
          const faltaC = Math.max(0, capC - pagC);
          const fC = startOfDayLocal(toDate(c.fecha));
          if (fC < todayStart && faltaC > 0){
            capAtrNowCents += faltaC;
            cuotasAtrasadasNow++;
          }
        }
        const saldoNow = (saldoSnapCents/100).toFixed(2);
        const capitalAtrasadoNow = (capAtrNowCents/100).toFixed(2);
        const multasAjustadas = (multasAjustadasCents/100).toFixed(2);
        const ppdNuevo = ((interesNuevoCents + capAtrNowCents + multasAjustadasCents)/100).toFixed(2);
        let estadoCreditoNow = (saldoSnapCents === 0) ? "Pagado" : (cuotasAtrasadasNow > 0 ? "Mora Temprana" : "Activo");

        /* ====== Setear fechaUltimoCalculoIntereses EXACTA (medianoche ES) ====== */
        const fechaULCI = svStartOfDay(new Date());

        // ====== Snapshot final a restaurar ======
        const snapshotToRestore = {
          ...revData.snapshot,
          interesActual: parseFloat(interesNuevo),
          historialMultas: mergedHM,
          multasAcumuladas: parseFloat(multasAjustadas),
          saldoActual: parseFloat(saldoNow),
          capitalAtrasado: parseFloat(capitalAtrasadoNow),
          cuotasAtrasadas: cuotasAtrasadasNow,
          paraPonerseAlDia: parseFloat(ppdNuevo),
          estadoCredito: estadoCreditoNow,
          fechaUltimoCalculoIntereses: fechaULCI,
          ultimaActualizacion: new Date().toISOString()
        };

        // (4) Commit en batch: set crédito exacto + catch-ups, borrar pago, marcar backup usado, log
        const batch = writeBatch(db);
        const pagoRef = doc(db, "pagos", pagoDoc.id);
        const revRef  = doc(db, "reversionPago", revDoc.id);
        const logRef  = doc(collection(db, "reversionesPagos"));

        batch.set(doc(db, "creditos", pagoData.creditoID), snapshotToRestore, { merge:false });
        batch.delete(pagoRef);
        batch.set(revRef, { usado:true, usadoAt:new Date().toISOString(), motivo, userId }, { merge:true });
        batch.set(logRef, {
          correlativo: pagoData.correlativo,
          creditoID: pagoData.creditoID,
          clienteID: revData.clienteID || null,
          montoPagado: pagoData.montoPagado,
          detalle: {
            pagoCapital: pagoData.pagoCapital || 0,
            pagoInteres: pagoData.pagoInteres || 0,
            pagoMultas: pagoData.pagoMultas ?? pagoData.pagoMulta ?? 0
          },
          motivo,
          agencia: pagoData.sucursal || "",
          revertidoPor: userId,
          revertidoAt: new Date().toISOString()
        });

        await batch.commit();

        success(`El pago ${pagoData.correlativo} fue revertido; el crédito quedó igual que antes del pago y los agregados (interés, capital vencido, multas) quedaron al día. Se fijó fechaUltimoCalculoIntereses a la medianoche local (UTC-6) para que el cron sume 1 día mañana.`);
      }catch(e){
        console.error("revertirPago:", e);
        error("Error al revertir el pago:<br><small>"+ (e?.message || String(e)) +"</small>");
        const btn = document.getElementById("revertir-btn");
        if (btn){ btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Pago'; }
      }
    }

    /* ===== Buscar / Revertir Movimiento de Caja ===== */
    async function buscarMovimiento(){
      showCard("mov-card", "");
      const raw = document.getElementById("correlativo-mov").value.trim();
      if (!raw) return;

      const btn = document.getElementById("buscar-btn-mov");
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Buscando...';

      if (!agenciaActual) await obtenerAgencia({ uid: userId });

      let q1 = query(collection(db, "movimientosCaja"), where("correlativo","==", Number(raw)), where("agencia","==", agenciaActual));
      let s1 = await getDocs(q1);
      if (s1.empty){
        q1 = query(collection(db, "movimientosCaja"), where("correlativo","==", raw), where("agencia","==", agenciaActual));
        s1 = await getDocs(q1);
      }

      btn.disabled = false; btn.innerHTML = '<i class="fas fa-search"></i> Buscar';

      if (s1.empty){
        showCard("mov-card", `<div class="card"><b style="color:#c0392b">No se encontró el movimiento.</b></div>`);
        return;
      }

      movDoc = s1.docs[0];
      movData = movDoc.data();
      renderMovCard();
    }

    function renderMovCard(){
      if (!movData) return;
      showCard("mov-card", `
        <div class="card">
          <div class="row" style="justify-content:space-between"><div class="k">Correlativo</div><div class="val"><b>${movData.correlativo}</b></div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Tipo</div><div class="val">${movData.tipo || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Descripción</div><div class="val">${movData.descripcion || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Agencia</div><div class="val">${movData.agencia || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Usuario</div><div class="val">${movData.usuario || '-'}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Monto</div><div class="val">$${(+movData.monto||0).toFixed(2)}</div></div>
          <div class="row" style="justify-content:space-between"><div class="k">Fecha</div><div class="val">${movData.fecha ? String(movData.fecha).replace("T"," ").substring(0,16) : ""}</div></div>

          <label style="display:block;margin:12px 0 6px;font-weight:800;">Motivo de reversión (obligatorio)</label>
          <textarea id="motivo-mov" class="textarea" maxlength="150"></textarea>
          <button id="revertir-btn-mov" class="btn-danger"><i class="fas fa-undo"></i> Revertir Movimiento</button>
        </div>
      `);
      document.getElementById("revertir-btn-mov").onclick = revertirMovimiento;
    }

    async function revertirMovimiento(){
      try{
        if (!movData) return;
        const motivo = document.getElementById("motivo-mov").value.trim();
        if (!motivo){
          document.getElementById("motivo-mov").focus();
          toast("Debes indicar el motivo de la reversión.","warn");
          return;
        }
        const ok = await confirmPINGerente();
        if (!ok) return;

        const btn = document.getElementById("revertir-btn-mov");
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Revirtiendo...';

        const batch = writeBatch(db);
        const movRef = doc(db, "movimientosCaja", movDoc.id);

        // Marcar original como anulado
        batch.set(movRef, {
          anulado: true,
          fechaReversion: new Date().toISOString(),
          usuarioReversion: userId,
          motivoReversion: motivo
        }, { merge:true });

        // Asiento compensatorio
        const nuevoTipo = (movData.tipo === "Ingreso") ? "Egreso" : "Ingreso";
        const compRef = doc(collection(db, "movimientosCaja"));
        batch.set(compRef, {
          correlativo: Math.floor(Math.random() * 1000000), // Reemplaza por tu generador secuencial si aplica
          tipo: nuevoTipo,
          descripcion: `Reversión correlativo ${movData.correlativo}`,
          agencia: movData.agencia,
          usuario: userId,
          monto: (movData.monto || 0) * -1,
          fecha: new Date().toISOString(),
          observaciones: motivo,
          anulado: false
        });

        await batch.commit();
        success(`El movimiento ${movData.correlativo} fue reversado correctamente.`);
      }catch(e){
        console.error("revertirMovimiento:", e);
        error("Error al revertir el movimiento:<br><small>"+ (e?.message || String(e)) +"</small>");
        const btn = document.getElementById("revertir-btn-mov");
        if (btn){ btn.disabled=false; btn.innerHTML='<i class="fas fa-undo"></i> Revertir Movimiento'; }
      }
    }

    /* ===== Auth ===== */
    onAuthStateChanged(auth, async user => {
      if (!user) return location.href = "login.html";
      userId = user.uid;
      await obtenerAgencia(user);
    });

    /* ===== Eventos ===== */
    document.getElementById("buscar-btn").onclick = buscarPago;
    document.getElementById("correlativo").onkeydown = e => { if (e.key === "Enter") buscarPago(); };
    document.getElementById("buscar-btn-mov").onclick = buscarMovimiento;
    document.getElementById("correlativo-mov").onkeydown = e => { if (e.key === "Enter") buscarMovimiento(); };
  </script>
</body>
</html>
