<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasa de Mora por Agencia</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // Formatea moneda $#,##0.00
    function formatoDinero(valor) {
      return valor.toLocaleString("es-SV", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
    }

    async function cargarTasaMoraAgencia(uid) {
      document.getElementById('loading').style.display = "block";
      document.getElementById('box-mora').style.display = "none";

      // 1. Busca el departamento del usuario logueado
      const userSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", uid)));
      if (userSnap.empty) {
        alert("No se encontró el usuario");
        return;
      }
      const department = userSnap.docs[0].data().department || "No Asignado";
      document.getElementById('nombre-agencia').textContent = department;

      // 2. Busca los créditos de esa agencia
      const creditosSnap = await getDocs(query(collection(db, "creditos"), where("agenciaAsignada", "==", department)));
      let capAtrasado = 0;
      let carteraTotal = 0;
      creditosSnap.forEach(doc => {
        const d = doc.data();

        // SOLO SUMA SI ALGUNA CUOTA TIENE ESTADO "Atrasado"
        let tieneCuotaAtrasada = false;
        if (Array.isArray(d.amortizacion)) {
          tieneCuotaAtrasada = d.amortizacion.some(q => q.estado === "Atrasado");
        }
        if (tieneCuotaAtrasada) {
          let ca = typeof d.capitalAtrasado === "number" ? d.capitalAtrasado : parseFloat(d.capitalAtrasado || "0");
          let sa = typeof d.saldoActual === "number" ? d.saldoActual : parseFloat(d.saldoActual || "0");
          capAtrasado += ca;
          carteraTotal += sa;
        }
      });
      const moraPct = carteraTotal > 0 ? (capAtrasado / carteraTotal) * 100 : 0;

      // 3. Actualiza en pantalla
      document.getElementById("capital-mora").textContent = formatoDinero(capAtrasado);
      document.getElementById("cartera-total").textContent = formatoDinero(carteraTotal);
      document.getElementById("pct-mora").textContent = moraPct.toFixed(2) + "%";

      document.getElementById('loading').style.display = "none";
      document.getElementById('box-mora').style.display = "block";
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, user => {
        if (!user) return location.href = "login.html";
        cargarTasaMoraAgencia(user.uid);
      });
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle,#000,#111);
      min-height: 100vh;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .container {
      max-width: 430px;
      margin: 0 auto;
      padding: 2.5rem 1rem 2rem 1rem;
    }
    h1 {
      font-size: 2rem;
      text-align: center;
      margin-bottom: .7rem;
      margin-top: 1.2rem;
      letter-spacing: .8px;
    }
    .agencia-label {
      text-align: center;
      font-size: 1.12rem;
      color: #67C8F1;
      margin-bottom: 1.8rem;
      font-weight: 600;
    }
    .box {
      background: #1a1a1a;
      border-radius: 18px;
      box-shadow: 0 4px 22px #13b66a2b;
      padding: 1.7rem 1.2rem 1.7rem 1.2rem;
      margin-bottom: 2rem;
    }
    .dato-mora {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #23232c;
      border-radius: 13px;
      padding: 1rem 1.2rem;
      margin-bottom: 14px;
    }
    .dato-mora:last-child { margin-bottom: 0; }
    .dato-mora-label {
      font-size: 1rem;
      color: #fff9;
    }
    .dato-mora-valor {
      font-weight: bold;
      font-size: 1.18rem;
    }
    .valor-mora { color: #FFD600; }
    .valor-cartera { color: #13b66b; }
    .valor-pct { color: #F94A4A; }
    #loading {
      display: none;
      margin: 2rem 0;
      text-align: center;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-city"></i> Tasa de Mora por Agencia</h1>
    <div class="agencia-label">
      Agencia asignada: <span id="nombre-agencia">Cargando...</span>
    </div>
    <div id="loading">Cargando datos...</div>
    <div class="box" id="box-mora" style="display:none;">
      <div class="dato-mora">
        <span class="dato-mora-label">Capital en Mora</span>
        <span class="dato-mora-valor valor-mora" id="capital-mora">$0.00</span>
      </div>
      <div class="dato-mora">
        <span class="dato-mora-label">Cartera Total</span>
        <span class="dato-mora-valor valor-cartera" id="cartera-total">$0.00</span>
      </div>
      <div class="dato-mora">
        <span class="dato-mora-label">% Mora</span>
        <span class="dato-mora-valor valor-pct" id="pct-mora">0.00%</span>
      </div>
    </div>
  </div>
</body>
</html>
