<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasa de Mora por Usuario – Multi Inversiones</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { 
      getFirestore, collection, query, where, getDocs, doc, getDoc 
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    // ===== Estado en memoria =====
    let department = null;            // Agencia del logueado
    let nombreLogueado = null;        // Nombre "humano" del logueado
    let morososDeAgencia = [];        // Créditos de la agencia que tienen al menos una cuota "Atrasado"

    // ===== Utilidades =====
    function formatoDinero(valor) {
      const n = (typeof valor === "number") ? valor : parseFloat(valor || "0");
      return n.toLocaleString("es-SV", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
    }
    function asNumber(v, def = 0) {
      if (typeof v === "number") return v;
      const p = parseFloat(v);
      return Number.isFinite(p) ? p : def;
    }
    function contarCuotasAtrasadas(amortizacion) {
      if (!Array.isArray(amortizacion)) return 0;
      return amortizacion.reduce((acc, q) => acc + (q && q.estado === "Atrasado" ? 1 : 0), 0);
    }
    function resolverNombreUsuario(d) {
      const full = `${d?.nombre ?? ""} ${d?.apellido ?? ""}`.trim();
      return full || d?.displayName || "Sin nombre";
    }
    async function resolverNombreCliente(d) {
      const candidatos = [
        d.nombreCliente && d.apellidoCliente ? `${d.nombreCliente} ${d.apellidoCliente}` : null,
        d.clienteNombre && d.clienteApellidos ? `${d.clienteNombre} ${d.clienteApellidos}` : null,
        d.titularNombre && d.titularApellido ? `${d.titularNombre} ${d.titularApellido}` : null,
        d.nombreCompleto ? d.nombreCompleto : null,
        d.nombre ? d.nombre : null
      ].filter(Boolean);
      if (candidatos.length > 0) return candidatos[0];

      const cid = d.clienteID || d.idCliente || d.clienteUid || d.userId || null;
      if (!cid) return "Sin nombre";
      try {
        const cliRef = doc(db, "clientes", cid);
        const cliSnap = await getDoc(cliRef);
        if (cliSnap.exists()) {
          const c = cliSnap.data();
          const alias = [
            c.nombre && c.apellido ? `${c.nombre} ${c.apellido}` : null,
            c.nombres && c.apellidos ? `${c.nombres} ${c.apellidos}` : null,
            c.nombreCompleto ? c.nombreCompleto : null
          ].filter(Boolean);
          return alias[0] || "Sin nombre";
        }
      } catch {}
      return "Sin nombre";
    }

    // ===== Carga base: morosos por agencia y ejecutivos reales de esos créditos =====
    async function cargarBase() {
      // 1) Traemos todos los créditos de la agencia
      const qCreds = query(collection(db, "creditos"), where("agenciaAsignada", "==", department));
      const snap = await getDocs(qCreds);

      morososDeAgencia = [];
      for (const ddoc of snap.docs) {
        const d = ddoc.data();
        const estado = d.estadoCredito || "";
        const cuotasAtrasadas = contarCuotasAtrasadas(d.amortizacion);
        if (cuotasAtrasadas > 0) {
          morososDeAgencia.push({
            idCredito: ddoc.id,
            asignadoA: (d.asignadoA || "").trim(),
            estadoCredito: estado || "—",
            saldoActual: asNumber(d.saldoActual),
            capitalAtrasado: asNumber(d.capitalAtrasado),
            paraPonerseAlDia: asNumber(d.paraPonerseAlDia),
            cuotasAtrasadas,
            raw: d
          });
        }
      }

      // 2) Poblar el select con valores REALES de asignadoA (únicos)
      const select = document.getElementById("user-select");
      const set = new Set(
        morososDeAgencia
          .map(x => x.asignadoA)
          .filter(n => n && n.length > 0)
      );
      const opciones = [];
      // “Yo” si aparece en créditos
      if (nombreLogueado && set.has(nombreLogueado)) {
        opciones.push(`<option value="${nombreLogueado}">Yo (${nombreLogueado})</option>`);
        set.delete(nombreLogueado);
      }
      // Resto
      [...set].sort().forEach(n => opciones.push(`<option value="${n}">${n}</option>`));

      select.innerHTML = `
        <option value="">Selecciona un usuario</option>
        <option value="__todos__">Todos (con mora)</option>
        ${opciones.join("")}
      `;
    }

    // ===== Cálculo / render =====
    async function calcular(nombreSeleccionado) {
      const resBox = document.getElementById('resultado');
      const detBox = document.getElementById('detalle-box');
      const tbody  = document.getElementById('detalle-body');
      tbody.innerHTML = "";
      detBox.style.display = "none";

      if (!nombreSeleccionado) { resBox.innerHTML = ""; return; }
      resBox.innerHTML = `<div class="cargando">Calculando...</div>`;

      // Fuente: morososDeAgencia (ya filtrados por agencia y con mora)
      let items = [];
      if (nombreSeleccionado === "__todos__") {
        items = morososDeAgencia.map(x => ({...x}));
      } else {
        // Match EXACTO con lo que hay en creditos.asignadoA
        items = morososDeAgencia.filter(x => x.asignadoA === nombreSeleccionado);
      }

      // Cartera total: suma de saldoActual de créditos NO "Revertido" (igual que tu otra página)
      // OJO: cartera total debería considerar TODOS los créditos del usuario, pero aquí usamos
      // la misma lógica que tu panel por agencia (sobre los datos que mostramos).
      let capitalAtrasado = 0;
      let carteraTotal    = 0;
      for (const it of items) {
        if (it.estadoCredito !== "Revertido") carteraTotal += it.saldoActual;
        capitalAtrasado += it.capitalAtrasado;
      }
      const moraPct = carteraTotal > 0 ? (capitalAtrasado / carteraTotal) * 100 : 0;

      // Resumen
      const tituloUsuario = (nombreSeleccionado === "__todos__") ? "Todos (con mora)" : nombreSeleccionado;
      resBox.innerHTML = `
        <div class="card-res">
          <div><span>Usuario:</span> <b>${tituloUsuario}</b></div>
          <div><span>Capital en Mora:</span> <b class="num">${formatoDinero(capitalAtrasado)}</b></div>
          <div><span>Cartera Total:</span> <b class="num verde">${formatoDinero(carteraTotal)}</b></div>
          <div><span>% Mora:</span> <b class="num rojo">${moraPct.toFixed(2)}%</b></div>
        </div>
      `;

      // Detalle (con nombre de cliente resuelto)
      // Orden por capitalAtrasado desc
      items.sort((a, b) => b.capitalAtrasado - a.capitalAtrasado);

      for (const it of items) {
        const nombreCliente = await resolverNombreCliente(it.raw);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="td-corto">${it.idCredito}</td>
          <td>${nombreCliente}</td>
          <td>${it.estadoCredito}</td>
          <td class="num">${formatoDinero(it.saldoActual)}</td>
          <td class="num imp">${formatoDinero(it.capitalAtrasado)}</td>
          <td class="num">${formatoDinero(it.paraPonerseAlDia)}</td>
          <td class="num">${it.cuotasAtrasadas}</td>
        `;
        tbody.appendChild(tr);
      }

      document.getElementById("total-registros").textContent = String(items.length);
      document.getElementById("tabla-detalle").dataset.json = JSON.stringify(items);
      document.getElementById("btn-exportar").style.display = items.length ? "inline-flex" : "none";
      detBox.style.display = "block";
    }

    // ===== Exportar Excel =====
    function exportarExcel() {
      const tabla = document.getElementById("tabla-detalle");
      const raw = tabla.dataset.json ? JSON.parse(tabla.dataset.json) : [];
      if (!raw || raw.length === 0) return;

      const ws_data = [
        ["ID Credito","Asignado A","Cliente","Estado","Saldo Actual","Capital Atrasado","Para Ponerse Al Dia","Cuotas Atrasadas"],
      ];

      const rows = raw.map(r => ([
        r.idCredito,
        r.asignadoA,
        "", // lo dejamos vacío para no resolver nombres otra vez aquí
        r.estadoCredito,
        r.saldoActual,
        r.capitalAtrasado,
        r.paraPonerseAlDia,
        r.cuotasAtrasadas
      ]));

      ws_data.push(...rows);

      const ws = XLSX.utils.aoa_to_sheet(ws_data);
      ws['!cols'] = [
        { wch: 22 }, { wch: 28 }, { wch: 28 }, { wch: 14 },
        { wch: 16 }, { wch: 18 }, { wch: 20 }, { wch: 16 }
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Mora por Usuario");
      XLSX.writeFile(wb, "creditos_en_mora_por_usuario.xlsx");
    }

    // ===== Init =====
    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";

        const udoc = await getDoc(doc(db, "users", user.uid));
        const udata = udoc.data() || {};
        department = udata.department || null;
        nombreLogueado = resolverNombreUsuario(udata);

        // Cargar base desde CREDITOS (evita mismatch de nombres)
        await cargarBase();

        // Listeners
        const select = document.getElementById('user-select');
        select.addEventListener('change', e => calcular(e.target.value));

        document.getElementById("btn-exportar").addEventListener("click", exportarExcel);
      });
    });
  </script>

  <!-- SheetJS para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #101212; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    header { background: #000; padding: 1rem 0; text-align: center; font-size: 1.45rem; font-weight: 700; color: #67C8F1;}
    .container { max-width: 520px; margin: 2.2rem auto 0 auto; background: #181b1f; border-radius: 16px; box-shadow: 0 4px 24px #0009; padding: 2.2rem 1.3rem 1.6rem 1.3rem;}
    .section-title { color: #F8AF40; font-weight: 700; font-size: 1.17rem; margin-bottom: 18px; text-align:center;}
    .input-main, select { width: 100%; background: #23272c; color: #fff; border: 1.7px solid #3c3f43; border-radius: 10px; font-size: 1.13rem; padding: 12px 14px; margin-bottom: 1.1em; outline: none; box-sizing: border-box;}
    label { color: #67C8F1; font-weight: 600; margin-bottom: 4px; display: block;}
    .card-res { background: #23272c; border-radius: 14px; padding: 22px 15px 18px 15px; margin: 28px 0 0 0; box-shadow: 0 2px 10px #0004; }
    .card-res div { font-size: 1.09rem; margin-bottom: 10px; color: #ffd266;}
    .card-res span { color: #67C8F1; font-weight:600;}
    .num { color: #ffd266; font-weight:700; font-size: 1.18em;}
    .num.verde { color: #13b66b; }
    .num.rojo { color: #ff6262; }
    .cargando { color: #ffd266; text-align: center; font-size: 1.08rem;}

    .detalle-container { margin-top: 22px; display:none; }
    .header-detalle { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: .8rem; }
    .header-detalle h2 { margin: 0; font-size: 1.1rem; letter-spacing: .4px; color: #b8c0ff; }
    .pill { background: #23272c; padding: .35rem .6rem; border-radius: 999px; font-size: .85rem; color: #fff9; }
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem .8rem; border-radius: 10px; background: #0e7a45; color: #fff; font-weight: 600; border: none; cursor: pointer; }
    .btn.secondary { background: #2c2c36; }

    table { width: 100%; border-collapse: collapse; border-spacing: 0; border-radius: 12px; background: #17171f; overflow: hidden; }
    thead th { text-align: left; font-size: .85rem; color: #b8c0ff; padding: .7rem .8rem; background: #1f1f28; position: sticky; top: 0; z-index: 2; }
    tbody td { padding: .7rem .8rem; border-top: 1px solid #2a2a35; font-size: .94rem; color: #e6e6e6; }
    tbody tr:hover { background: #1e1e27; }
    .num { text-align: right; }
    .imp { color: #ffd600; font-weight: 700; }
    .td-corto { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @media (max-width:550px){.container{padding:1.3rem 1vw;}}
  </style>
</head>
<body>
  <header>Tasa de Mora por Usuario</header>
  <div class="container">
    <div class="section-title">Consulta el % de mora y cartera por usuario</div>

    <label for="user-select">Selecciona un usuario:</label>
    <select id="user-select" class="input-main">
      <option value="">Cargando usuarios...</option>
    </select>

    <div id="resultado" style="margin-top:12px;"></div>

    <!-- Detalle créditos en mora -->
    <div id="detalle-box" class="detalle-container">
      <div class="header-detalle">
        <h2><i class="fa-solid fa-list"></i> Créditos en mora (detalle)</h2>
        <div style="display:flex;align-items:center;gap:.6rem;">
          <span class="pill">Registros: <strong id="total-registros">0</strong></span>
          <button class="btn" id="btn-exportar" style="display:none;"><i class="fa-solid fa-file-excel"></i> Exportar Excel</button>
        </div>
      </div>
      <div style="overflow:auto;">
        <table id="tabla-detalle">
          <thead>
            <tr>
              <th>ID Crédito</th>
              <th>Cliente</th>
              <th>Estado</th>
              <th class="num">Saldo Actual</th>
              <th class="num">Capital Atrasado</th>
              <th class="num">Para Ponerse al Día</th>
              <th class="num">Cuotas Atrasadas</th>
            </tr>
          </thead>
          <tbody id="detalle-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- SheetJS para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
