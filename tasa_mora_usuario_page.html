<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasa de Mora por Usuario – Multi Inversiones</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let gerenteDepartment = null;
    let usersList = [];

    async function cargarUsuarios() {
      const select = document.getElementById('user-select');
      select.innerHTML = '<option value="">Cargando usuarios...</option>';
      // Solo usuarios de la misma agencia (department) y rol permitido:
      const q = query(
        collection(db, "users"),
        where("rol", "in", ["caja", "ejecutivo", "gerente"]),
        where("department", "==", gerenteDepartment)
      );
      const snap = await getDocs(q);
      usersList = [];
      select.innerHTML = '<option value="">Selecciona un usuario</option>';
      snap.forEach(docu => {
        const d = docu.data();
        usersList.push({ uid: docu.id, nombre: `${d.nombre ?? ""} ${d.apellido ?? ""}`.trim() });
        select.innerHTML += `<option value="${docu.id}">${d.nombre ?? ""} ${d.apellido ?? ""}</option>`;
      });
    }

    async function calcularMoraPorUsuario(uid) {
      if (!uid) return;
      document.getElementById('resultado').innerHTML = `<div class="cargando">Calculando...</div>`;
      let capitalAtrasado = 0, carteraTotal = 0, moraPct = 0;
      // Trae créditos asignados al usuario y que NO estén "Revertido"
      const creds = await getDocs(
        query(collection(db, "creditos"), 
              where("asignadoAUid", "==", uid),
              where("estadoCredito", "!=", "Revertido"))
      );
      creds.forEach(docu => {
        const d = docu.data();
        // Para cartera total: suma todos menos "Revertido" (ya filtrado arriba)
        const sa = typeof d.saldoActual === 'number'
          ? d.saldoActual : parseFloat(d.saldoActual || 0);
        carteraTotal += sa;

        // Para mora: suma el capitalAtrasado solo si tiene alguna cuota "Atrasado"
        let tieneAtrasado = false;
        if (Array.isArray(d.amortizacion)) {
          tieneAtrasado = d.amortizacion.some(q => q.estado === "Atrasado");
        }
        if (tieneAtrasado) {
          const ca = typeof d.capitalAtrasado === 'number'
            ? d.capitalAtrasado : parseFloat(d.capitalAtrasado || 0);
          capitalAtrasado += ca;
        }
      });
      moraPct = carteraTotal > 0 ? (capitalAtrasado / carteraTotal) * 100 : 0;
      document.getElementById('resultado').innerHTML = `
        <div class="card-res">
          <div><span>Capital en Mora:</span> <b class="num">${capitalAtrasado.toLocaleString('es-SV', {style:'currency',currency:'USD'})}</b></div>
          <div><span>Cartera Total:</span> <b class="num verde">${carteraTotal.toLocaleString('es-SV', {style:'currency',currency:'USD'})}</b></div>
          <div><span>% Mora:</span> <b class="num rojo">${moraPct.toFixed(2)}%</b></div>
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, async user => {
        if (!user) return location.href = "login.html";
        // Lee departamento del gerente logueado
        const userDoc = await getDoc(doc(db, "users", user.uid));
        gerenteDepartment = userDoc.data().department;
        await cargarUsuarios();
        document.getElementById('user-select').addEventListener('change', e => {
          calcularMoraPorUsuario(e.target.value);
        });
      });
    });
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #101212; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    header { background: #000; padding: 1rem 0; text-align: center; font-size: 1.45rem; font-weight: 700; color: #67C8F1;}
    .container { max-width: 480px; margin: 2.2rem auto 0 auto; background: #181b1f; border-radius: 16px; box-shadow: 0 4px 24px #0009; padding: 2.2rem 1.3rem 1.6rem 1.3rem;}
    .section-title { color: #F8AF40; font-weight: 700; font-size: 1.17rem; margin-bottom: 18px; text-align:center;}
    .input-main, select { width: 100%; background: #23272c; color: #fff; border: 1.7px solid #3c3f43; border-radius: 10px; font-size: 1.13rem; padding: 12px 14px; margin-bottom: 1.1em; outline: none; box-sizing: border-box;}
    label { color: #67C8F1; font-weight: 600; margin-bottom: 4px; display: block;}
    .card-res { background: #23272c; border-radius: 14px; padding: 22px 15px 18px 15px; margin: 28px 0 0 0; box-shadow: 0 2px 10px #0004; }
    .card-res div { font-size: 1.09rem; margin-bottom: 10px; color: #ffd266;}
    .card-res span { color: #67C8F1; font-weight:600;}
    .num { color: #ffd266; font-weight:700; font-size: 1.18em;}
    .num.verde { color: #13b66b; }
    .num.rojo { color: #ff6262; }
    .cargando { color: #ffd266; text-align: center; font-size: 1.08rem;}
    @media (max-width:550px){.container{padding:1.3rem 1vw;}}
  </style>
</head>
<body>
  <header>Tasa de Mora por Usuario</header>
  <div class="container">
    <div class="section-title">Consulta el % de mora y cartera de tus usuarios</div>
    <label for="user-select">Selecciona un usuario:</label>
    <select id="user-select" class="input-main">
      <option value="">Cargando usuarios...</option>
    </select>
    <div id="resultado" style="margin-top:12px;"></div>
  </div>
</body>
</html>
