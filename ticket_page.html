<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticket de Pago – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #101212;
      color: #222;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      font-size: 1.45rem;
      letter-spacing: 1px;
      font-weight: 700;
      color: #67C8F1;
    }
    .container {
      max-width: 430px;
      margin: 2.5rem auto 0 auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 25px #0005;
      padding: 2.2rem 1.7rem 2rem 1.7rem;
      min-height: 340px;
    }
    .ticket-title {
      font-size: 1.55rem;
      color: #13b66b;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 1px;
    }
    .ticket-header {
      text-align: center;
      margin-bottom: 12px;
    }
    .ticket-logo {
      height: 58px;
      margin-bottom: 10px;
      margin-top: 5px;
    }
    .ticket-details {
      font-size: 1rem;
      margin-bottom: 11px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.02rem;
      margin-bottom: 3px;
      font-weight: 500;
    }
    .detail-row strong {
      color: #222;
      min-width: 110px;
      font-weight: 700;
    }
    .divider {
      border: none;
      border-top: 1.5px solid #eee;
      margin: 10px 0 12px 0;
    }
    .final-msg {
      color: #13b66b;
      font-weight: 700;
      text-align: center;
      font-size: 1.14rem;
      margin-top: 14px;
    }
    .volver-btn {
      display: block;
      margin: 27px auto 0 auto;
      padding: 13px 28px;
      background: #13b66b;
      color: #fff;
      font-size: 1.13rem;
      font-weight: bold;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      box-shadow: 0 1px 12px #0b854c27;
      transition: background .19s;
      letter-spacing: 0.7px;
      text-decoration: none;
      text-align: center;
    }
    .volver-btn:hover {
      background: #0b854c;
      color: #fff;
      text-decoration: none;
    }
    @media (max-width: 540px) {
      .container { max-width: 98vw; padding: 1.2rem 2vw; }
      .ticket-title { font-size: 1.1rem;}
    }
  </style>
</head>
<body>
  <header>Ticket de Pago</header>
  <div class="container">
    <div class="ticket-header">
      <img src="assets/logo_mi_bw.png" class="ticket-logo" alt="Multi Inversiones"/>
      <div style="font-size:1rem;color:#13b66b;font-weight:600;">
        Multi Inversiones de Occidente
      </div>
      <div style="color:#444;font-size:0.93rem;">
        Llama al 6991-9989 – Credicash, aprobado en 20 minutos
      </div>
    </div>
    <div class="ticket-title">
      <i class="fas fa-receipt"></i> Comprobante de Pago
    </div>
    <div class="ticket-details">
      <div class="detail-row"><strong>Ticket No.:</strong> <span id="correlativo"></span></div>
      <div class="detail-row"><strong>Agencia:</strong> <span id="agencia"></span></div>
      <div class="detail-row"><strong>Fecha y Hora:</strong> <span id="fecha"></span></div>
      <div class="detail-row"><strong>Cliente:</strong> <span id="cliente"></span></div>
      <div class="detail-row"><strong>Monto Pagado:</strong> $<span id="monto"></span></div>
      <div class="detail-row"><strong>Pago Capital:</strong> $<span id="pagoCapital"></span></div>
      <div class="detail-row"><strong>Pago Interés:</strong> $<span id="pagoInteres"></span></div>
      <div class="detail-row"><strong>Pago Multas:</strong> $<span id="pagoMultas"></span></div>
      <div class="detail-row"><strong>Saldo Restante:</strong> $<span id="saldoRestante"></span></div>
    </div>
    <hr class="divider"/>
    <div class="final-msg">
      ¡Gracias por su pago!
    </div>
    <a class="volver-btn" href="pagos_page.html"><i class="fas fa-arrow-left"></i> Volver al Panel de Caja</a>
  </div>

  <script>
    // --- Extrae parámetros de la URL y los muestra en el comprobante ---
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name) || '';
    }

    // Formato legible fecha/hora ISO
    function formatoFecha(fechaISO) {
      if (!fechaISO) return '';
      const fecha = new Date(fechaISO);
      if (isNaN(fecha.getTime())) return fechaISO;
      return fecha.toLocaleString('es-SV', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: true
      });
    }

    document.getElementById('correlativo').textContent   = getParam('correlativo');
    document.getElementById('agencia').textContent       = getParam('agencia');
    document.getElementById('fecha').textContent         = formatoFecha(getParam('fecha'));
    document.getElementById('cliente').textContent       = getParam('cliente');
    document.getElementById('monto').textContent         = parseFloat(getParam('monto') || '0').toFixed(2);
    document.getElementById('pagoCapital').textContent   = parseFloat(getParam('pagoCapital') || '0').toFixed(2);
    document.getElementById('pagoInteres').textContent   = parseFloat(getParam('pagoInteres') || '0').toFixed(2);
    document.getElementById('pagoMultas').textContent    = parseFloat(getParam('pagoMultas') || '0').toFixed(2);
    document.getElementById('saldoRestante').textContent = parseFloat(getParam('saldoRestante') || '0').toFixed(2);
  </script>
</body>
</html>
