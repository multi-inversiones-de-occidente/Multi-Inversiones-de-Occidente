<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Movimientos de Caja – Multi Inversiones</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #101212; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh;}
    header { background: #000; padding: 1rem 0; text-align: center; font-size: 1.45rem; letter-spacing: 1px; font-weight: 700; color: #67C8F1;}
    .container { max-width: 700px; margin: 2.5rem auto 0 auto; background: #181a1c; border-radius: 16px; box-shadow: 0 2px 22px #0008; padding: 2.2rem 1.2rem 1.7rem 1.2rem;}
    .row-fecha { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;}
    .fecha-label { font-size: 1.11rem; color: #8ae1fc; font-weight: 600;}
    .fecha-btn { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer;}
    .mov-card { background: #23272c; border-radius: 12px; margin-bottom: 12px; padding: 16px 18px; box-shadow: 0 1px 7px #0002;}
    .mov-ingreso { border-left: 5px solid #13b66b;}
    .mov-egreso { border-left: 5px solid #e74c3c;}
    .mov-pago { border-left: 5px solid #67C8F1;}
    .mov-title { font-weight: bold; font-size: 1.05rem; margin-bottom: 6px;}
    .mov-sub { font-size: .98rem; color: #8ae1fc;}
    .total-caja { margin-top: 14px; background: #101212; border-radius: 10px; text-align: center; padding: 18px; font-size: 1.32rem; font-weight: bold; color: #fff;}
    .empty-msg { text-align:center; color:#ccc; padding: 16px 0;}
    .info-chip { text-align:center; color:#8ae1fc; margin: 6px 0 12px 0; font-size: .95rem; }
    .btn-main {
      width: 100%;
      background: #13b66b; color: #fff; font-size: 1.11rem; font-weight: bold;
      border: none; border-radius: 9px; padding: 13px 0; cursor: pointer; margin-top: 1.4em; transition: background .17s; margin-bottom: 0.7em;
    }
    .btn-main:active, .btn-main:hover { background: #0b854c; }
    @media (max-width:600px){.container{padding:1.2rem .3rem;}}
  </style>
</head>
<body>
  <header>Ver Movimientos de Caja</header>
  <div class="container">
    <div class="row-fecha">
      <span id="fecha-label" class="fecha-label"></span>
      <button id="fecha-btn" class="fecha-btn" title="Cambiar Fecha">
        <i class="fas fa-calendar-day"></i>
      </button>
    </div>
    <div id="movimientos-list"></div>
    <div class="total-caja" id="total-caja"></div>
    <button id="btn-imprimir-corte" class="btn-main">
      <i class="fas fa-print"></i> Imprimir Corte de Caja
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs, orderBy, limit, Timestamp
    } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.20.0/firebase-auth.js";

    // ===== Firebase =====
    const firebaseConfig = {
      apiKey: "AIzaSyBWEXs6RIB_LJUdbPdYRGh2ARZmpHhupMo",
      authDomain: "multinversiones-38e13.firebaseapp.com",
      projectId: "multinversiones-38e13",
      storageBucket: "multinversiones-38e13.appspot.com",
      messagingSenderId: "380001917078",
      appId: "1:380001917078:web:b5eccc64bc77709bd2cab7",
      measurementId: "G-H4E31XHG1Y"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ===== Helpers =====
    function formatFecha(date) {
      return date.toLocaleDateString('es-SV', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    function toDateAny(x) {
      if (!x) return null;
      if (x instanceof Date) return x;
      if (x?.toDate) return x.toDate();            // Firestore Timestamp
      if (typeof x === 'string') {
        const d = new Date(x);
        return isNaN(d.getTime()) ? null : d;
      }
      return null;
    }
    function formatHoraAny(x) {
      const d = toDateAny(x);
      if (!d || isNaN(d.getTime())) return "-";
      return d.toLocaleTimeString('es-SV', { hour: '2-digit', minute: '2-digit', hour12: true });
    }
    function num(x, fallback=0) {
      const n = Number(x);
      return Number.isFinite(n) ? n : fallback;
    }

    let now = new Date();
    let selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    let agenciaActual = "";
    let flagEsCierre = false; // Para imprimir aviso

    function renderFecha() {
      document.getElementById("fecha-label").textContent = "Fecha: " + formatFecha(selectedDate);
    }

    // ===== Saldo anterior (último cierre previo) para modo en vivo
    async function obtenerSaldoAnterior(agencia, fecha) {
      try {
        const cierresRef = collection(db, "cierres_caja");
        const fechaStr = fecha.toISOString().slice(0,10); // YYYY-MM-DD
        const qy = query(
          cierresRef,
          where("agencia", "==", agencia),
          where("fecha", "<", fechaStr),
          orderBy("fecha", "desc"),
          limit(1)
        );
        const snap = await getDocs(qy);
        if (!snap.empty) {
          const d = snap.docs[0].data();
          return num((d.saldo_siguiente ?? d.saldo_caja), 0);
        }
      } catch (e) {}
      return 0;
    }

    // ===== Busca el cierre exacto del día
    async function buscarCierreDelDia(agencia, fechaDate) {
      try {
        const fechaStr = fechaDate.toISOString().slice(0,10);
        const qy = query(
          collection(db, "cierres_caja"),
          where("agencia", "==", agencia),
          where("fecha", "==", fechaStr),
          limit(1)
        );
        const snap = await getDocs(qy);
        if (!snap.empty) return snap.docs[0].data();
      } catch (e) {}
      return null;
    }

    async function cargarMovimientos(user) {
      const listDiv = document.getElementById("movimientos-list");
      const totalDiv = document.getElementById("total-caja");
      listDiv.innerHTML = "Cargando...";
      totalDiv.textContent = "";
      flagEsCierre = false;

      // Agencia del usuario
      if (!agenciaActual) {
        try {
          const usrSnap = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
          if (!usrSnap.empty) agenciaActual = usrSnap.docs[0].data().department || "";
        } catch (e) {}
      }
      if (!agenciaActual) {
        listDiv.innerHTML = `<div class="empty-msg">Tu usuario no tiene agencia asignada.</div>`;
        return;
      }

      // Rango del día
      const y = selectedDate.getFullYear(), m = selectedDate.getMonth(), d = selectedDate.getDate();
      const startOfDay = new Date(y, m, d, 0, 0, 0, 0);
      const endOfDay   = new Date(y, m, d, 23, 59, 59, 999);
      const startIso = startOfDay.toISOString();
      const endIso   = endOfDay.toISOString();
      const startTS  = Timestamp.fromDate(startOfDay);
      const endTS    = Timestamp.fromDate(endOfDay);

      // ===== 1) Intentar leer CIERRE del día
      const cierre = await buscarCierreDelDia(agenciaActual, selectedDate);
      if (cierre) {
        flagEsCierre = true;

        const movimientos = (Array.isArray(cierre.movimientos) ? cierre.movimientos : []).map(m => ({
          tipo: m?.tipo || "",
          descripcion: m?.descripcion || "",
          monto: num(m?.monto, 0),
          observaciones: "",
          usuario: m?.usuario || "",
          fecha: m?.fecha || null,
          clase: (m?.tipo === "Ingreso") ? "mov-ingreso" : "mov-egreso",
          cliente: (m?.origen === "pago") ? "Cliente" : "",
          correlativo: m?.correlativo ?? null,
          origen: "cierres_caja"
        }));

        movimientos.sort((a, b) => {
          const da = toDateAny(a.fecha)?.getTime() || 0;
          const dbb = toDateAny(b.fecha)?.getTime() || 0;
          return dbb - da;
        });

        const infoHtml = `
          <div class="info-chip">
            Datos provenientes del <b>cierre</b>${cierre.fecha_cierre ? ` (realizado a las ${formatHoraAny(cierre.fecha_cierre)})` : ''}.
          </div>
        `;

        if (!movimientos.length) {
          listDiv.innerHTML = infoHtml + `<div class="empty-msg">No hay movimientos registrados en el cierre.</div>`;
        } else {
          listDiv.innerHTML = infoHtml + movimientos.map(mov => `
            <div class="mov-card ${mov.clase}">
              <div class="mov-title">${mov.tipo} - ${mov.descripcion}</div>
              <div class="mov-sub">Monto: $${mov.monto.toFixed(2)}</div>
              <div class="mov-sub">Usuario: ${mov.usuario || '-'}</div>
              ${mov.cliente ? `<div class="mov-sub">Cliente: ${mov.cliente}</div>` : ""}
              ${(mov.correlativo || mov.origen) ? `<div class="mov-sub">Correlativo: ${mov.correlativo ?? '-'} • Origen: ${mov.origen || '-'}</div>` : ""}
              <div class="mov-sub">Hora: ${formatHoraAny(mov.fecha)}</div>
            </div>
          `).join('');
        }

        const saldoAnterior = num(cierre.saldo_inicial, 0);
        const totalIngresos = num(cierre.total_ingresos, 0);
        const totalEgresos  = num(cierre.total_egresos, 0);
        const total = num((cierre.saldo_siguiente ?? cierre.saldo_caja ?? (saldoAnterior + totalIngresos - totalEgresos)), 0);

        totalDiv.innerHTML = `
          <div style="font-size:1.12rem;font-weight:400;margin-bottom:4px;">
            <b style="color:#2ef37a;">Saldo Anterior: $${saldoAnterior.toFixed(2)}</b>
          </div>
          <div class="mov-sub" style="margin-bottom:4px;">Ingresos: $${totalIngresos.toFixed(2)} | Egresos: $${totalEgresos.toFixed(2)}</div>
          <div><b style="color:#fff;">Total de Caja: $${total.toFixed(2)}</b></div>
        `;

        // === Guardar totales en data-* para impresión segura
        totalDiv.dataset.saldoAnterior = saldoAnterior.toFixed(2);
        totalDiv.dataset.ingresos = totalIngresos.toFixed(2);
        totalDiv.dataset.egresos = totalEgresos.toFixed(2);
        totalDiv.dataset.total = total.toFixed(2);
        totalDiv.dataset.esCierre = "1";
        totalDiv.dataset.horaCierre = cierre.fecha_cierre ? formatHoraAny(cierre.fecha_cierre) : "";

        return; // no seguir a modo en vivo
      }

      // ===== 2) SIN CIERRE: reconstruir en vivo (BLINDADO CONTRA DUPLICADOS)
      let movimientos = [];
      // 🔐 Set global por día+agencia para NO repetir correlativos
      const correlativosUsados = new Set();

      // Movimientos manuales en ambas colecciones (Timestamp/ISO)
      for (const collName of ["movimientosCaja", "movimientos_caja"]) {
        const qTS = query(
          collection(db, collName),
          where("agencia", "==", agenciaActual),
          where("fecha", ">=", startTS),
          where("fecha", "<=", endTS)
        );
        const qISO = query(
          collection(db, collName),
          where("agencia", "==", agenciaActual),
          where("fecha", ">=", startIso),
          where("fecha", "<=", endIso)
        );

        const [snapTSRes, snapISORes] = await Promise.allSettled([getDocs(qTS), getDocs(qISO)]);
        const packs = [];
        if (snapTSRes.status === "fulfilled") packs.push(snapTSRes.value);
        if (snapISORes.status === "fulfilled") packs.push(snapISORes.value);

        for (const pack of packs) {
          pack.forEach(doc => {
            const d = doc.data() || {};
            if (d.cierre === true) return;
            if ('anulado' in d && d.anulado === true) return;
            if (typeof d.descripcion === 'string' &&
                (d.descripcion.startsWith('Reversión de pago') || d.descripcion.startsWith('Reversión correlativo'))) return;

            // 🚫 BLINDAJE: evitar doble conteo de pagos de crédito
            const referenciaStr = (d.referencia || d.descripcion || "").toString().toLowerCase().trim();
            const esMovimientoDePago =
              !!d.creditoID || // cualquier movimiento pegado a un crédito
              (
                !!d.clienteID &&
                (
                  referenciaStr.includes("abono retroactivo") ||
                  referenciaStr.includes("pago crédito") ||
                  referenciaStr.includes("pago credito") ||
                  referenciaStr.includes("pago de cliente") ||
                  referenciaStr.includes("pago de cuota") ||
                  referenciaStr.includes("pago cuota")
                )
              );
            if (esMovimientoDePago) return;

            // ❗ Dedupe por correlativo a nivel global
            if (d.correlativo != null && correlativosUsados.has(d.correlativo)) return;
            if (d.correlativo != null) correlativosUsados.add(d.correlativo);

            const tipo = d.tipo === "Egreso" ? "Egreso" : "Ingreso";
            movimientos.push({
              tipo,
              descripcion: d.descripcion || '',
              monto: num(d.monto, 0),
              observaciones: d.observaciones || '',
              usuario: d.usuario || '',
              fecha: d.fecha || d.createdAt || null,
              clase: tipo === "Ingreso" ? "mov-ingreso" : "mov-egreso",
              cliente: "",
              correlativo: d.correlativo ?? null,
              origen: collName
            });
          });
        }
      }

      // Pagos (normales y retroactivos) dual por fechaPago/fechaRegistro
      const pagosQ_TS = query(
        collection(db, "pagos"),
        where("sucursal", "==", agenciaActual),
        where("fechaPago", ">=", startTS),
        where("fechaPago", "<=", endTS)
      );
      const pagosQ_ISO = query(
        collection(db, "pagos"),
        where("sucursal", "==", agenciaActual),
        where("fechaPago", ">=", startIso),
        where("fechaPago", "<=", endIso)
      );
      const pagosR_TS = query(
        collection(db, "pagos"),
        where("sucursal", "==", agenciaActual),
        where("retroactivo", "==", true),
        where("fechaRegistro", ">=", startTS),
        where("fechaRegistro", "<=", endTS)
      );
      const pagosR_ISO = query(
        collection(db, "pagos"),
        where("sucursal", "==", agenciaActual),
        where("retroactivo", "==", true),
        where("fechaRegistro", ">=", startIso),
        where("fechaRegistro", "<=", endIso)
      );

      const results = await Promise.allSettled([
        getDocs(pagosQ_TS), getDocs(pagosQ_ISO), getDocs(pagosR_TS), getDocs(pagosR_ISO)
      ]);

      const pagosVistos = new Set();
      results.forEach(r => {
        if (r.status !== "fulfilled") return;
        r.value.forEach(doc => {
          if (pagosVistos.has(doc.id)) return; pagosVistos.add(doc.id);
          const d = doc.data() || {};
          if (("anulado" in d) && d.anulado) return;

          // ❗ Dedupe por correlativo también para pagos
          const corr = d.correlativo;
          if (corr != null && correlativosUsados.has(corr)) return;
          if (corr != null) correlativosUsados.add(corr);

          movimientos.push({
            tipo: "Ingreso",
            descripcion: d.retroactivo ? "Abono retroactivo" : "Pago",
            monto: num(d.montoPagado, 0),
            observaciones: d.motivo || '',
            usuario: d.cajeroNombre || '',
            fecha: d.fechaRegistro || d.fechaPago || null,
            clase: "mov-pago",
            cliente: d.nombres || "Cliente",
            correlativo: d.correlativo ?? null,
            origen: "pagos"
          });
        });
      });

      movimientos.sort((a, b) => {
        const da = toDateAny(a.fecha)?.getTime() || 0;
        const dbb = toDateAny(b.fecha)?.getTime() || 0;
        return dbb - da;
      });

      const saldoAnterior = await obtenerSaldoAnterior(agenciaActual, selectedDate);
      let totalIngresos = 0, totalEgresos = 0;
      for (const mov of movimientos) {
        if (mov.tipo === "Ingreso") totalIngresos += mov.monto;
        else totalEgresos += mov.monto;
      }
      const total = saldoAnterior + totalIngresos - totalEgresos;

      if (!movimientos.length) {
        listDiv.innerHTML = `<div class="empty-msg">No hay movimientos registrados.</div>`;
      } else {
        listDiv.innerHTML = movimientos.map(mov => `
          <div class="mov-card ${mov.clase}">
            <div class="mov-title">${mov.tipo} - ${mov.descripcion}</div>
            <div class="mov-sub">Monto: $${mov.monto.toFixed(2)}</div>
            ${mov.observaciones ? `<div class="mov-sub">Obs: ${mov.observaciones}</div>` : ""}
            <div class="mov-sub">Usuario: ${mov.usuario || '-'}</div>
            ${mov.cliente ? `<div class="mov-sub">Cliente: ${mov.cliente}</div>` : ""}
            ${(mov.correlativo || mov.origen) ? `<div class="mov-sub">Correlativo: ${mov.correlativo ?? '-'} • Origen: ${mov.origen || '-'}</div>` : ""}
            <div class="mov-sub">Hora: ${formatHoraAny(mov.fecha)}</div>
          </div>
        `).join('');
      }

      totalDiv.innerHTML = `
        <div style="font-size:1.12rem;font-weight:400;margin-bottom:4px;">
          <b style="color:#2ef37a;">Saldo Anterior: $${saldoAnterior.toFixed(2)}</b>
        </div>
        <div class="mov-sub" style="margin-bottom:4px;">Ingresos: $${totalIngresos.toFixed(2)} | Egresos: $${totalEgresos.toFixed(2)}</div>
        <div><b style="color:#fff;">Total de Caja: $${total.toFixed(2)}</b></div>
      `;

      // === Guardar totales en data-* para impresión segura
      totalDiv.dataset.saldoAnterior = saldoAnterior.toFixed(2);
      totalDiv.dataset.ingresos = totalIngresos.toFixed(2);
      totalDiv.dataset.egresos = totalEgresos.toFixed(2);
      totalDiv.dataset.total = total.toFixed(2);
      totalDiv.dataset.esCierre = ""; // vacío => modo en vivo
      totalDiv.dataset.horaCierre = "";
    }

    // ===== Selector de fecha
    document.getElementById("fecha-btn").onclick = async function() {
      const val = prompt("Ingrese la fecha en formato DD/MM/AAAA", formatFecha(selectedDate));
      if (!val) return;
      const [dd, mm, yy] = val.split('/');
      const parsed = new Date(`${yy}-${mm}-${dd}T00:00:00`);
      if (isNaN(parsed.getTime())) {
        alert("Fecha inválida");
        return;
      }
      selectedDate = parsed;
      renderFecha();
      const user = auth.currentUser;
      if (user) cargarMovimientos(user);
    };

    // ===== Inicio
    onAuthStateChanged(auth, user => {
      if (!user) { location.href = "login.html"; return; }
      renderFecha();
      cargarMovimientos(user);
    });
  </script>

  <script>
    // ===== Impresión de Corte (colores corregidos y TOTAL garantizado) =====
    document.getElementById("btn-imprimir-corte").onclick = function() {
      const fecha = document.getElementById("fecha-label").textContent || '';
      const movimientosHtml = document.getElementById("movimientos-list").innerHTML;
      const totalBox = document.getElementById("total-caja");

      // Normaliza colores para fondo blanco (evita texto blanco invisible)
      let totalHtml = (totalBox.innerHTML || "").replace(/color:\s*#fff;?/gi, "color:#222;");

      // Totales desde data-* (garantiza presencia explícita del TOTAL)
      const saldoAnterior = totalBox.dataset.saldoAnterior || "";
      const ingresos = totalBox.dataset.ingresos || "";
      const egresos = totalBox.dataset.egresos || "";
      const totalValue = Number(totalBox.dataset.total || NaN);
      const esCierre = totalBox.dataset.esCierre === "1";
      const horaCierre = totalBox.dataset.horaCierre || "";

      const chipCierre = esCierre
        ? `<div style="text-align:center;color:#00527c;margin:8px 0 0 0;font-weight:600;">
             Datos provenientes del <b>cierre</b>${horaCierre ? ` (realizado a las ${horaCierre})` : ''}.
           </div>`
        : "";

      const totalesHtmlSeguro = `
        <div class="totales-corte">
          ${chipCierre}
          <div style="margin-top:10px;">${totalHtml}</div>
          ${Number.isFinite(totalValue)
            ? `<div style="margin-top:8px;font-size:1.18rem;"><b style="color:#222;">Total de Caja: $${totalValue.toFixed(2)}</b></div>`
            : ``}
        </div>`;

      const printHtml = `
        <html>
        <head>
          <title>Corte de Caja – Multi Inversiones</title>
          <style>
            body { font-family: 'Segoe UI', Arial, sans-serif; color: #222; margin: 0; background: #fff; }
            .header-corte { text-align: center; font-size: 1.55rem; font-weight: bold; margin: 18px 0 4px 0; color: #00527c; }
            .fecha-corte { text-align: center; margin-bottom: 12px; font-size: 1.06rem; }
            .mov-card { border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; padding: 10px 13px; background: #fff;}
            .mov-title { font-weight: bold; font-size: 1.01rem; margin-bottom: 3px;}
            .mov-sub { font-size: .97rem; color: #333;}
            .totales-corte { font-size: 1.13rem; font-weight: bold; margin: 20px 0 18px 0; text-align: center;}
            .totales-corte b { color:#222; }
            .firmas-corte { margin-top:52px; display:flex; justify-content:space-between; }
            .firma { width:47%; border-top:1.5px solid #222; text-align:center; padding-top:5px; font-size:1rem; }
          </style>
        </head>
        <body>
          <div class="header-corte">CORTE DE CAJA</div>
          <div class="fecha-corte">${fecha}</div>
          <div>${movimientosHtml}</div>
          ${totalesHtmlSeguro}
          <div class="firmas-corte">
            <div class="firma">Firma de Caja</div>
            <div class="firma">Firma de Gerente</div>
          </div>
        </body>
        </html>
      `;

      const w = window.open('', '', 'width=900,height=800');
      if (!w) { alert('Bloqueador de ventanas emergentes activo. Permite pop-ups para imprimir.'); return; }
      w.document.write(printHtml);
      w.document.close();
      setTimeout(() => { try { w.focus(); } catch(e){} }, 300);
    };
  </script>
</body>
</html>
